# Installed by host/bootstrap.sh through the k3s auto-deploying manifests
# directory and kept there: k3s re-applies it on every start. The runsc
# handler is registered by host/files/containerd/gvisor.toml on every node.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: gvisor
handler: runsc
