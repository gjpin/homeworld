# kured: Kubernetes API (node lock on its DaemonSet, cordon and drain),
# VictoriaMetrics (ALERTS query gating every reboot) and metrics scraping.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: kured
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns
  namespace: kured
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-kured
  namespace: kured
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: kured
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: victoria-metrics
            k8s:app.kubernetes.io/name: victoria-metrics-single
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-collector
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
