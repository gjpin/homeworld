# https://github.com/jellyfin/jellyfin-helm/tree/master/charts/jellyfin
fullnameOverride: jellyfin

serviceAccount:
  # Token hygiene only: Jellyfin never talks to the Kubernetes API.
  automount: false

# One transcoder on the node's single GPU; the config volume is
# ReadWriteOnce.
deploymentStrategy:
  type: Recreate

# The shared media library is NFS (docs/nas.md), which squashes every access
# to the share's owner, 20004: Jellyfin runs as that ID. kubelet applies the
# fsGroup to the Longhorn config volume only (NFS CSI fsGroupPolicy None).
# The containerd device_ownership_from_security_context setting
# (host/files/containerd) hands the allocated /dev/dri render node to this
# UID/GID, so no host render group is needed.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 20004
  runAsGroup: 20004
  fsGroup: 20004
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 20004
  runAsGroup: 20004
  seccompProfile:
    type: RuntimeDefault

service:
  # The chart's ServiceMonitor targets the port named http.
  portName: http

jellyfin:
  # DLNA would force hostNetwork and UDP 1900; it stays off.
  enableDLNA: false
  env:
    - name: TZ
      value: UTC
    - name: JELLYFIN_PublishedServerUrl
      value: https://jellyfin.base-domain.invalid

# The GPU render node: the device plugin (apps/generic-device-plugin)
# advertises devic.es/dri on homeworld-corebox (Intel UHD 730, QuickSync)
# and homeworld-ryzen (AMD RX 560, VA-API) only, so the request places the
# pod on one of them. The jellyfin-gpu-profile init container below matches
# the transcoding settings to whichever GPU the pod got.
resources:
  requests:
    cpu: 500m
    memory: 1Gi
    ephemeral-storage: 256Mi
    devic.es/dri: "1"
  # The GPU does the heavy lifting; software fallbacks (subtitle burn-in,
  # audio, codecs the GPU cannot decode) may use four cores, all of
  # homeworld-corebox's. The ephemeral-storage limit covers the 32Gi
  # transcode cache emptyDir: emptyDir usage counts against the pod's limit,
  # and exceeding it evicts the pod.
  limits:
    cpu: "4"
    memory: 4Gi
    ephemeral-storage: 34Gi
    devic.es/dri: "1"

# homeworld-corebox's QuickSync encodes better and also decodes VP8, VP9 and
# AV1, which the RX 560 cannot: Jellyfin runs there whenever it can and on
# homeworld-ryzen while homeworld-corebox is down or drained. The preference
# applies only when the pod is scheduled; it does not move back on its own.
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: node.homeworld/profile
              operator: In
              values:
                - homeworld-corebox

persistence:
  config:
    storageClass: longhorn-crypto
    size: 10Gi
  # The library is mounted below at the same /data/media paths Sonarr,
  # Radarr and Lidarr report, so their library refresh requests resolve.
  media:
    enabled: false
  cache:
    enabled: false

volumes:
  - name: library
    persistentVolumeClaim:
      claimName: media

volumeMounts:
  # Read-only: Jellyfin keeps artwork, NFOs and trickplay in its own
  # metadata directory (/metadata below; the library options "Save artwork
  # into media folders",
  # "Save trickplay with media" and "Save subtitles with media" stay off;
  # Bazarr writes the subtitles).
  - name: library
    mountPath: /data/media
    subPath: media
    readOnly: true
  # Artwork, people images, trickplay and chapter images (system.xml
  # MetadataPath, seeded below) on the NAS instead of the Longhorn config
  # volume: they grow with the library, need no backup (Jellyfin rebuilds
  # them from the media and its metadata providers), and the database stays
  # on Longhorn.
  - name: library
    mountPath: /metadata
    subPath: jellyfin/metadata

# Seeds the server, network and encoding settings on the first start of an
# empty config volume. Jellyfin fills every missing element with its default
# and rewrites the files on save, so the seed applies once; later git
# changes must be made in the dashboard or by editing the files under
# /config/config directly. The exception is the GPU-specific part of
# encoding.xml, which jellyfin-gpu-profile sets on every start.
extraInitContainers:
  - name: jellyfin-config-bootstrap
    image: docker.io/jellyfin/jellyfin:12.4
    imagePullPolicy: IfNotPresent
    command:
      - /bin/sh
      - -ec
      - |
        dir=/config/config
        mkdir -p "$dir"
        ns='xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance" xmlns:xsd="http://www.w3.org/2001/XMLSchema"'
        # The /metrics endpoint is read at startup only (Startup.cs).
        # MetadataPath points the internal metadata (artwork, trickplay,
        # chapter images) at the NAS mount.
        [ -e "$dir/system.xml" ] || cat >"$dir/system.xml" <<XML
        <?xml version="1.0" encoding="utf-8"?>
        <ServerConfiguration $ns>
          <EnableMetrics>true</EnableMetrics>
          <MetadataPath>/metadata</MetadataPath>
        </ServerConfiguration>
        XML
        # No client auto-discovery (UDP 7359) or UPnP; X-Forwarded-For is
        # trusted from the pod network (the Envoy pods), so client
        # addresses and the LAN/remote split are real.
        [ -e "$dir/network.xml" ] || cat >"$dir/network.xml" <<XML
        <?xml version="1.0" encoding="utf-8"?>
        <NetworkConfiguration $ns>
          <AutoDiscovery>false</AutoDiscovery>
          <EnableUPnP>false</EnableUPnP>
          <EnableIPv6>false</EnableIPv6>
          <KnownProxies>
            <string>10.42.0.0/16</string>
          </KnownProxies>
        </NetworkConfiguration>
        XML
        # Hardware transcoding on the allocated render node, always
        # /dev/dri/renderD128 in the container (apps/generic-device-plugin):
        # hardware encoding, Intel's low-power H.264/HEVC encoders (Jellyfin
        # applies them only on an Intel GPU), and HDR tone mapping
        # (https://jellyfin.org/docs/general/post-install/transcoding/hardware-acceleration/).
        # The acceleration type and decoder list follow the GPU
        # (jellyfin-gpu-profile below).
        [ -e "$dir/encoding.xml" ] || cat >"$dir/encoding.xml" <<XML
        <?xml version="1.0" encoding="utf-8"?>
        <EncodingOptions $ns>
          <QsvDevice>/dev/dri/renderD128</QsvDevice>
          <VaapiDevice>/dev/dri/renderD128</VaapiDevice>
          <EnableHardwareEncoding>true</EnableHardwareEncoding>
          <EnableIntelLowPowerH264HwEncoder>true</EnableIntelLowPowerH264HwEncoder>
          <EnableIntelLowPowerHevcHwEncoder>true</EnableIntelLowPowerHevcHwEncoder>
          <EnableTonemapping>true</EnableTonemapping>
          <!-- Transcode only a few minutes ahead of the player and delete
               played segments, so concurrent 4K transcodes stay inside the
               cache emptyDir (kustomization.yaml). -->
          <EnableThrottling>true</EnableThrottling>
          <EnableSegmentDeletion>true</EnableSegmentDeletion>
          <EnableDecodingColorDepth10Hevc>true</EnableDecodingColorDepth10Hevc>
          <EnableDecodingColorDepth10Vp9>true</EnableDecodingColorDepth10Vp9>
        </EncodingOptions>
        XML
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 20004
      runAsGroup: 20004
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
        ephemeral-storage: 16Mi
      limits:
        cpu: 200m
        memory: 64Mi
        ephemeral-storage: 64Mi
    volumeMounts:
      - name: config
        mountPath: /config
  # Matches the GPU-specific encoding settings to the GPU this pod was
  # given, on every start, since Jellyfin can run on either GPU node:
  # HardwareAccelerationType and HardwareDecodingCodecs, which fail playback
  # when they name a decoder the GPU lacks. Every other setting stays as the
  # seed or the dashboard left it. It requests the render node itself, which
  # the kubelet then hands on to the jellyfin container.
  - name: jellyfin-gpu-profile
    image: docker.io/jellyfin/jellyfin:12.4
    imagePullPolicy: IfNotPresent
    command:
      - /bin/sh
      - -ec
      - |
        # The render node's PCI vendor, found by its device number: the
        # plugin mounts any render node as renderD128.
        set -- $(stat -c '%t %T' /dev/dri/renderD128)
        vendor=$(cat "/sys/dev/char/$((0x$1)):$((0x$2))/device/vendor")
        case "$vendor" in
          # Intel UHD 730 (Alder Lake): QuickSync decodes all of these
          # (AV1 decode only)
          # (https://jellyfin.org/docs/general/post-install/transcoding/hardware-acceleration/intel/).
          0x8086) accel=qsv codecs="h264 hevc mpeg2video vc1 vp8 vp9 av1" ;;
          # AMD RX 560 (Polaris): VA-API through the image's own Mesa
          # driver; no VP8, VP9 or AV1 decoding
          # (https://jellyfin.org/docs/general/post-install/transcoding/hardware-acceleration/amd/).
          0x1002) accel=vaapi codecs="h264 hevc mpeg2video vc1" ;;
          *) echo "no transcoding profile for GPU vendor $vendor" >&2; exit 1 ;;
        esac
        ACCEL=$accel CODECS=$codecs perl -0777 -pi -e '
          my $type = "<HardwareAccelerationType>$ENV{ACCEL}</HardwareAccelerationType>";
          my $list = "<HardwareDecodingCodecs>\n"
            . join("", map { "    <string>$_</string>\n" } split(" ", $ENV{CODECS}))
            . "  </HardwareDecodingCodecs>";
          s{<HardwareAccelerationType\s*/>|<HardwareAccelerationType>.*?</HardwareAccelerationType>}{$type}s
            or s{</EncodingOptions>}{  $type\n</EncodingOptions>};
          s{<HardwareDecodingCodecs\s*/>|<HardwareDecodingCodecs>.*?</HardwareDecodingCodecs>}{$list}s
            or s{</EncodingOptions>}{  $list\n</EncodingOptions>};
        ' /config/config/encoding.xml
        echo "GPU vendor $vendor: $accel, hardware decoding of $codecs"
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 20004
      runAsGroup: 20004
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
        ephemeral-storage: 16Mi
        devic.es/dri: "1"
      limits:
        cpu: 200m
        memory: 64Mi
        ephemeral-storage: 64Mi
        devic.es/dri: "1"
    volumeMounts:
      - name: config
        mountPath: /config

metrics:
  # Seeded EnableMetrics above; the chart's postStart check then finds it
  # already on.
  enabled: true
  serviceMonitor:
    enabled: true
    interval: 60s
