---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: audiomuse
  namespace: audiomuse-ai
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "audiomuse.base-domain.invalid"
  rules:
    - backendRefs:
        - name: audiomuse-ai-flask-service
          namespace: audiomuse-ai
          kind: Service
          port: 8000
          group: ""
          weight: 1
