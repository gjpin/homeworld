---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: audiomuse-ai
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: /audiomuse-ai/POSTGRES_USERNAME
        decodingStrategy: None
    - secretKey: password
      remoteRef:
        key: /audiomuse-ai/POSTGRES_PASSWORD
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: audiomuse-ai-postgres
  namespace: audiomuse-ai
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: audiomuse-ai-postgres
    template:
      engineVersion: v2
      type: Opaque
      # The chart's postgres.existingSecret: the keys it reads by default.
      data:
        POSTGRES_USER: "{{ .postgresUsername }}"
        POSTGRES_PASSWORD: "{{ .postgresPassword }}"
        POSTGRES_DB: audiomuse
  data:
    - secretKey: postgresUsername
      remoteRef:
        key: /audiomuse-ai/POSTGRES_USERNAME
        decodingStrategy: None
    - secretKey: postgresPassword
      remoteRef:
        key: /audiomuse-ai/POSTGRES_PASSWORD
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: envoy-oidc-client-secret
  namespace: audiomuse-ai
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: envoy-oidc-client-secret
  data:
    # Client secret for the shared Authelia "envoy" OIDC client; consumed by
    # the HTTPRoute-scoped SecurityPolicy (docs/oidc.md). Envoy Gateway
    # requires the "client-secret" key.
    - secretKey: client-secret
      remoteRef:
        key: /authelia/OIDC_CLIENT_SECRET_ENVOY
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: audiomuse-ai-secrets
  namespace: audiomuse-ai
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: audiomuse-ai-secrets
  data:
    # The first admin account, created from these on the first start (the
    # setup wizard is then never offered); later password changes are made
    # in the UI.
    - secretKey: AUDIOMUSE_USER
      remoteRef:
        key: /audiomuse-ai/ADMIN_USERNAME
        decodingStrategy: None
    - secretKey: AUDIOMUSE_PASSWORD
      remoteRef:
        key: /audiomuse-ai/ADMIN_PASSWORD
        decodingStrategy: None
    # The bearer token for machine clients (Navidrome's AudioMuse-AI
    # plugin). Imported into the database on the first start; later
    # changes are made under Administration -> Setup Wizard.
    - secretKey: API_TOKEN
      remoteRef:
        key: /audiomuse-ai/API_TOKEN
        decodingStrategy: None
    # The Navidrome account AudioMuse-AI reads the library with; the
    # playlists it creates belong to it (README).
    - secretKey: NAVIDROME_USER
      remoteRef:
        key: /audiomuse-ai/NAVIDROME_USER
        decodingStrategy: None
    - secretKey: NAVIDROME_PASSWORD
      remoteRef:
        key: /audiomuse-ai/NAVIDROME_PASSWORD
        decodingStrategy: None
