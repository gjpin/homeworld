---
# Gateway OIDC for the AudioMuse-AI UI (platform group, docs/oidc.md), in
# front of AudioMuse-AI's own login: the UI drives the analysis jobs, holds
# the Navidrome credentials and writes playlists into Navidrome. The
# Navidrome plugin calls the in-cluster Service with an API token and never
# passes through this route.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authelia-oidc
  namespace: audiomuse-ai
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: audiomuse
  oidc:
    provider:
      issuer: https://auth.base-domain.invalid
      authorizationEndpoint: https://auth.base-domain.invalid/api/oidc/authorization
      tokenEndpoint: https://auth.base-domain.invalid/api/oidc/token
    clientID: envoy
    clientSecret:
      name: envoy-oidc-client-secret
    scopes:
      - openid
      - offline_access
    redirectURL: https://audiomuse.base-domain.invalid/oauth2/callback
    logoutPath: /logout
    cookieDomain: audiomuse.base-domain.invalid
    forwardAccessToken: false
    refreshToken: true
    passThroughAuthHeader: false
