---
apiVersion: v1
kind: Service
metadata:
  name: homeassistant
  namespace: homeassistant
  labels:
    app.kubernetes.io/name: homeassistant
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8123
      protocol: TCP
      targetPort: 8123
  selector:
    io.kompose.service: homeassistant
---
apiVersion: v1
kind: Service
metadata:
  name: homeassistant-mosquitto
  namespace: homeassistant
  labels:
    app.kubernetes.io/name: mosquitto
spec:
  type: ClusterIP
  ports:
    - name: mqtt
      port: 1883
      protocol: TCP
      targetPort: 1883
  selector:
    io.kompose.service: homeassistant-mosquitto
---
apiVersion: v1
kind: Service
metadata:
  name: homeassistant-zigbee2mqtt
  namespace: homeassistant
  labels:
    app.kubernetes.io/name: zigbee2mqtt
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    io.kompose.service: homeassistant-zigbee2mqtt
