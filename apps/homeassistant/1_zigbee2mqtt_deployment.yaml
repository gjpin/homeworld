apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant-zigbee2mqtt
  namespace: homeassistant
  labels:
    app.kubernetes.io/name: zigbee2mqtt
    io.kompose.service: homeassistant-zigbee2mqtt
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: homeassistant-zigbee2mqtt
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zigbee2mqtt
        io.kompose.service: homeassistant-zigbee2mqtt
    spec:
      hostUsers: false
      nodeSelector:
        node-role.kubernetes.io/homelab: homelab
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: ghcr.io/koenkk/zigbee2mqtt:2.14.1
          imagePullPolicy: IfNotPresent
          name: homeassistant-zigbee2mqtt
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: UTC
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 1Gi
          volumeMounts:
            - mountPath: /app/data
              name: homeassistant-zigbee2mqtt-claim0
      restartPolicy: Always
      volumes:
        - name: homeassistant-zigbee2mqtt-claim0
          persistentVolumeClaim:
            claimName: homeassistant-zigbee2mqtt-claim0
