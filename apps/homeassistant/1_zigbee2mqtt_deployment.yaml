apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant-zigbee2mqtt
  namespace: homeassistant
  labels:
    app.kubernetes.io/name: zigbee2mqtt
    io.kompose.service: homeassistant-zigbee2mqtt
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    security.homeworld/exception-reason: "Zigbee2MQTT requires hostPath access to /dev/serial/by-id and supplemental group 20 to communicate with the physical Zigbee USB coordinator."
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: homeassistant-zigbee2mqtt
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zigbee2mqtt
        io.kompose.service: homeassistant-zigbee2mqtt
    spec:
      serviceAccountName: homeassistant-app
      automountServiceAccountToken: false
      hostUsers: false
      nodeSelector:
        environment: zigbee
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        supplementalGroups:
          - 20
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Seeds Zigbee2MQTT's bootstrap configuration on the first start of
        # an empty PVC (same create-if-missing pattern as the Home Assistant
        # bootstrap): broker and frontend are pre-wired so only the serial
        # port remains hardware-specific. Without a seed z2m generates a
        # default configuration pointing at a localhost broker that does not
        # exist and crashloops. Later git changes to the seed must be
        # applied by editing /app/data/configuration.yaml directly.
        - name: zigbee2mqtt-config-bootstrap
          image: docker.io/library/alpine:3.24.2
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              [ -f /app/data/configuration.yaml ] || cat > /app/data/configuration.yaml <<'YAML'
              version: 5
              homeassistant:
                enabled: false
              mqtt:
                base_topic: zigbee2mqtt
                server: mqtt://homeassistant-mosquitto:1883
              frontend:
                enabled: true
                port: 8080
              # Fill in your Zigbee adapter under the mounted
              # /dev/serial/by-id (see README "Zigbee Coordinator"):
              # z2m cannot start without a serial port.
              serial:
                port: ""
              # Upstream's example configuration: without these the network
              # forms with the well-known default key and PAN IDs, so anyone
              # in radio range can decrypt or join it.
              advanced:
                network_key: GENERATE
                pan_id: GENERATE
                ext_pan_id: GENERATE
              YAML
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - mountPath: /app/data
              name: homeassistant-zigbee2mqtt-claim0
      containers:
        - image: ghcr.io/koenkk/zigbee2mqtt:2.14.1
          imagePullPolicy: IfNotPresent
          name: homeassistant-zigbee2mqtt
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: TZ
              value: UTC
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 1Gi
          volumeMounts:
            - mountPath: /app/data
              name: homeassistant-zigbee2mqtt-claim0
            - mountPath: /dev/serial/by-id
              name: zigbee-adapter
      restartPolicy: Always
      volumes:
        - name: homeassistant-zigbee2mqtt-claim0
          persistentVolumeClaim:
            claimName: homeassistant-zigbee2mqtt-claim0
        - name: zigbee-adapter
          hostPath:
            path: /dev/serial/by-id
            type: DirectoryOrCreate
