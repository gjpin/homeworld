---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homeassistant
  namespace: homeassistant
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "home.base-domain.invalid"
  rules:
    - backendRefs:
        - name: homeassistant
          namespace: homeassistant
          kind: Service
          port: 8123
          group: ""
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zigbee2mqtt
  namespace: homeassistant
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "z2m.base-domain.invalid"
  rules:
    - backendRefs:
        - name: homeassistant-zigbee2mqtt
          namespace: homeassistant
          kind: Service
          port: 8080
          group: ""
          weight: 1
