---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homeassistant
  namespace: homeassistant
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    external-dns.alpha.kubernetes.io/hostname: "home.${BASE_DOMAIN}"
spec:
  parentRefs:
    - name: envoy
      namespace: homeassistant
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "home.${BASE_DOMAIN}"
  rules:
    - backendRefs:
        - name: homeassistant
          namespace: homeassistant
          kind: Service
          port: 8123
          group: ""
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: zigbee2mqtt
  namespace: homeassistant
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    external-dns.alpha.kubernetes.io/hostname: "z2m.${BASE_DOMAIN}"
spec:
  parentRefs:
    - name: envoy
      namespace: homeassistant
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "z2m.${BASE_DOMAIN}"
  rules:
    - backendRefs:
        - name: homeassistant-zigbee2mqtt
          namespace: homeassistant
          kind: Service
          port: 8080
          group: ""
          weight: 1
