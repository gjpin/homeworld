---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: homeassistant-app
  namespace: homeassistant
  labels:
    app.kubernetes.io/name: homeassistant
# Token hygiene only: the Home Assistant, Mosquitto, and Zigbee2MQTT pods
# never talk to the Kubernetes API. The name must not collide with the
# CloudNativePG cluster's ServiceAccount — CNPG derives the
# instance/initdb ServiceAccount name from the cluster name
# (homeassistant) and adopts an existing ServiceAccount with that name
# as-is, so an app-owned homeassistant ServiceAccount without a mounted
# token would leave the cluster's initdb Job unable to reach the API.
automountServiceAccountToken: false
