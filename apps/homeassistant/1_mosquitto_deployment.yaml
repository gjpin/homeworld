apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant-mosquitto
  namespace: homeassistant
  labels:
    app.kubernetes.io/name: mosquitto
    io.kompose.service: homeassistant-mosquitto
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: homeassistant-mosquitto
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosquitto
        io.kompose.service: homeassistant-mosquitto
    spec:
      serviceAccountName: homeassistant-app
      automountServiceAccountToken: false
      runtimeClassName: gvisor
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Hashes the client passwords into Mosquitto's password file on every
        # start, so a rotated secret takes effect when the pod restarts. The
        # file lives in a memory-backed emptyDir and never reaches the PVC.
        - name: mosquitto-passwd
          image: docker.io/library/eclipse-mosquitto:2.1.2
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              umask 077
              mosquitto_passwd -c -b /mosquitto/auth/passwd homeassistant "$HOMEASSISTANT_PASSWORD"
              mosquitto_passwd -b /mosquitto/auth/passwd zigbee2mqtt "$ZIGBEE2MQTT_PASSWORD"
          env:
            - name: HOMEASSISTANT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mosquitto-credentials
                  key: homeassistant
            - name: ZIGBEE2MQTT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mosquitto-credentials
                  key: zigbee2mqtt
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1883
            runAsGroup: 1883
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 500m
              memory: 128Mi
              ephemeral-storage: 64Mi
          volumeMounts:
            - mountPath: /mosquitto/auth
              name: mosquitto-auth
      containers:
        - image: docker.io/library/eclipse-mosquitto:2.1.2
          imagePullPolicy: IfNotPresent
          name: homeassistant-mosquitto
          ports:
            - name: mqtt
              containerPort: 1883
              protocol: TCP
          env:
            - name: TZ
              value: UTC
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1883
            runAsGroup: 1883
          readinessProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: mqtt
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 1Gi
          volumeMounts:
            - mountPath: /mosquitto/config/mosquitto.conf
              name: mosquitto-config
              subPath: mosquitto.conf
            - mountPath: /mosquitto/auth
              name: mosquitto-auth
              readOnly: true
            - mountPath: /mosquitto/data
              name: homeassistant-mosquitto-claim1
      restartPolicy: Always
      volumes:
        - name: mosquitto-config
          configMap:
            name: homeassistant-mosquitto-config
        - name: mosquitto-auth
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: homeassistant-mosquitto-claim1
          persistentVolumeClaim:
            claimName: homeassistant-mosquitto-claim1
