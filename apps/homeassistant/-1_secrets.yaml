---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homeassistant-oidc
  namespace: homeassistant
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: homeassistant-oidc
  data:
    - secretKey: clientSecret
      remoteRef:
        key: /authelia/OIDC_CLIENT_SECRET_HOMEASSISTANT
        decodingStrategy: Auto
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: envoy-oidc-client-secret
  namespace: homeassistant
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: envoy-oidc-client-secret
  data:
    # Client secret for the shared Authelia "envoy" OIDC client; consumed by
    # the Zigbee2MQTT SecurityPolicy (docs/oidc.md). Envoy Gateway requires
    # the "client-secret" key.
    - secretKey: client-secret
      remoteRef:
        key: /authelia/OIDC_CLIENT_SECRET_ENVOY
        decodingStrategy: Auto
