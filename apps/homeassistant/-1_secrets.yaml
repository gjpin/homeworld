---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: homeassistant
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: homeassistant
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: /homeassistant/POSTGRES_PASSWORD
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homeassistant-oidc
  namespace: homeassistant
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: homeassistant-oidc
    template:
      type: Opaque
  data:
    # Authelia client secret for the hass-oidc-auth integration; the plugin
    # reads it through Home Assistant's !env_var tag so it never lands on
    # the /config PVC.
    - secretKey: clientSecret
      remoteRef:
        key: /authelia/OIDC_CLIENT_SECRET_HOMEASSISTANT
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: envoy-oidc-client-secret
  namespace: homeassistant
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: envoy-oidc-client-secret
  data:
    # Client secret for the shared Authelia "envoy" OIDC client; consumed by
    # the z2m HTTPRoute-scoped SecurityPolicy (docs/oidc.md). Envoy Gateway
    # requires the "client-secret" key.
    - secretKey: client-secret
      remoteRef:
        key: /authelia/OIDC_CLIENT_SECRET_ENVOY
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homeassistant-secrets
  namespace: homeassistant
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: homeassistant-secrets
    template:
      engineVersion: v2
      type: Opaque
      data:
        # Home Assistant resolves the recorder db_url through its built-in
        # !env_var tag, so the password never lands on the /config PVC. The
        # password is embedded unescaped in the URL; it must contain only
        # RFC 3986 unreserved characters (see docs/secrets.md).
        RECORDER_DB_URL: "postgresql://homeassistant:{{ .password }}@homeassistant-rw.homeassistant.svc.cluster.local:5432/homeassistant"
  data:
    - secretKey: password
      remoteRef:
        key: /homeassistant/POSTGRES_PASSWORD
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mosquitto-credentials
  namespace: homeassistant
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: mosquitto-credentials
    template:
      type: Opaque
  data:
    # One broker account per client. Mosquitto hashes both into its password
    # file at startup; Zigbee2MQTT reads its password from the environment,
    # and Home Assistant's MQTT integration stores its own copy (entered in
    # the UI).
    - secretKey: homeassistant
      remoteRef:
        key: /homeassistant/MOSQUITTO_PASSWORD_HOMEASSISTANT
        decodingStrategy: None
    - secretKey: zigbee2mqtt
      remoteRef:
        key: /homeassistant/MOSQUITTO_PASSWORD_ZIGBEE2MQTT
        decodingStrategy: None
