---
# Gateway OIDC for the Zigbee2MQTT web UI. Authelia is the only login: Z2M's
# optional frontend auth is not configured, and the route requires the
# platform group (docs/oidc.md). The Home Assistant route above keeps its
# native OIDC login (hass-oidc-auth).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authelia-oidc
  namespace: homeassistant
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: zigbee2mqtt
  oidc:
    provider:
      issuer: https://auth.base-domain.invalid
      authorizationEndpoint: https://auth.base-domain.invalid/api/oidc/authorization
      tokenEndpoint: https://auth.base-domain.invalid/api/oidc/token
    clientID: envoy
    clientSecret:
      name: envoy-oidc-client-secret
    scopes:
      - openid
      - offline_access
    redirectURL: https://z2m.base-domain.invalid/oauth2/callback
    logoutPath: /logout
    cookieDomain: z2m.base-domain.invalid
    forwardAccessToken: false
    refreshToken: true
    passThroughAuthHeader: false
