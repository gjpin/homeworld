---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: crowdsec-ext-auth
  namespace: homeassistant
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy
  extAuth:
    failOpen: false
    # Envoy Gateway only forwards request bodies to the ext-auth service when
    # bodyToExtAuth is set; without it CrowdSec AppSec never sees request
    # bodies (in-band virtual patching) and the gap is silent — path and
    # header bans keep working.
    bodyToExtAuth:
      maxRequestBytes: 65536
    grpc:
      backendRefs:
        - group: ""
          kind: Service
          name: crowdsec-envoy-bouncer
          namespace: envoy-gateway
          port: 8080
          weight: 1
---
# Gateway OIDC for the Zigbee2MQTT web UI. Authelia is the only login:
# Z2M's optional frontend auth is not configured, and the route requires the
# platform group (docs/oidc.md). The Home Assistant route above keeps its
# native OIDC login (hass-oidc-auth). StrategicMerge keeps this policy from
# overriding the Gateway-level CrowdSec extAuth above.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authelia-oidc
  namespace: homeassistant
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: zigbee2mqtt
  oidc:
    provider:
      # Token requests go through the authelia Backend so Envoy validates
      # Authelia's certificate against the homeworld CA
      # (2_authelia_backend.yaml).
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: authelia
          port: 443
          weight: 1
      issuer: https://auth.homeworld.internal
      authorizationEndpoint: https://auth.homeworld.internal/api/oidc/authorization
      tokenEndpoint: https://auth.homeworld.internal/api/oidc/token
    clientID: envoy
    clientSecret:
      name: envoy-oidc-client-secret
    scopes:
      - openid
      - offline_access
    redirectURL: https://z2m.homeworld.internal/oauth2/callback
    logoutPath: /logout
    cookieDomain: z2m.homeworld.internal
    forwardAccessToken: false
    refreshToken: true
    passThroughAuthHeader: false
