# https://cloudnative-pg.github.io/docs/1.28/appendixes/backup_volumesnapshot/
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: homeassistant-daily-volume-snapshot
  namespace: homeassistant
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Six cron fields, seconds first (robfig/cron v1 in CNPG), always UTC:
  # 23:30 UTC is 23:30 Lisbon in winter and 00:30 in summer, after Velero
  # (22:00 Lisbon) and before the 01:00-06:30 upgrade and reboot windows.
  # CNPG prunes nothing: apps/cloudnative-pg's backup-pruner deletes Backup
  # CRs older than 7 days, and their VolumeSnapshots and Longhorn snapshots
  # go with them (snapshotOwnerReference: backup + deletionPolicy: Delete).
  schedule: "0 30 23 * * *"
  backupOwnerReference: self
  cluster:
    name: homeassistant
  method: volumeSnapshot
