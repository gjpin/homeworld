apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant-mosquitto
  namespace: homeassistant
  labels:
    app.kubernetes.io/name: mosquitto
    io.kompose.service: homeassistant-mosquitto
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: homeassistant-mosquitto
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mosquitto
        io.kompose.service: homeassistant-mosquitto
    spec:
      hostUsers: false
      nodeSelector:
        node-role.kubernetes.io/homelab: homelab
      securityContext:
        runAsNonRoot: true
        runAsUser: 1883
        runAsGroup: 1883
        fsGroup: 1883
        seccompProfile:
          type: RuntimeDefault
      containers:
        - image: docker.io/library/eclipse-mosquitto:2.1.2
          imagePullPolicy: IfNotPresent
          name: homeassistant-mosquitto
          ports:
            - name: mqtt
              containerPort: 1883
              protocol: TCP
          env:
            - name: TZ
              value: UTC
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1883
            runAsGroup: 1883
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 512Mi
              ephemeral-storage: 1Gi
          volumeMounts:
            - mountPath: /mosquitto/config/mosquitto.conf
              name: mosquitto-config
              subPath: mosquitto.conf
            - mountPath: /mosquitto/data
              name: homeassistant-mosquitto-claim1
      restartPolicy: Always
      volumes:
        - name: mosquitto-config
          configMap:
            name: homeassistant-mosquitto-config
        - name: homeassistant-mosquitto-claim1
          persistentVolumeClaim:
            claimName: homeassistant-mosquitto-claim1
