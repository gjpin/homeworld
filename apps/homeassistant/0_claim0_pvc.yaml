apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant-claim0
  namespace: homeassistant
  labels:
    app.kubernetes.io/name: homeassistant
    io.kompose.service: homeassistant-claim0
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-crypto
  resources:
    requests:
      storage: 10Gi
