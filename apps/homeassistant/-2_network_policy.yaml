apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-zigbee2mqtt-lan
  namespace: homeassistant
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kompose.service: homeassistant-zigbee2mqtt
  egress:
    # Zigbee2MQTT frontend websockets may reach the home LAN, but never the
    # cluster's pod or service CIDRs, the agents VM subnet, or the cluster
    # infrastructure (see the allow-homeassistant-lan comment).
    - toCIDRSet:
        - cidr: 10.0.0.0/8
          except:
            - 10.42.0.0/16
            - 10.43.0.0/16
            - 10.20.0.0/24
        - cidr: 172.16.0.0/12
        - cidr: 192.168.0.0/16
          except:
            - 192.168.8.1/32
            - 192.168.8.2/32
            - 192.168.8.10/31
            - 192.168.8.12/32
            - 192.168.8.20/32
            - 192.168.8.50/31
      toPorts:
        - ports:
            - port: "1"
              endPort: 65535
              protocol: TCP
---
