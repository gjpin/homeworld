metadata:
  name: allow-homeassistant-postgres-metrics-ingress
  namespace: homeassistant
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # The handwritten PodMonitor scrapes the CloudNativePG instance metrics
  # port through the OpenTelemetry collector.
  endpointSelector:
    matchLabels:
      k8s:cnpg.io/cluster: homeassistant
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
