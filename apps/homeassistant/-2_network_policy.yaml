apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-zigbee2mqtt-lan
  namespace: homeassistant
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kompose.service: homeassistant-zigbee2mqtt
  egress:
    # Zigbee2MQTT frontend websockets may reach the home LAN, but never the
    # cluster's pod or service CIDRs or the agents VM subnet (see the
    # allow-homeassistant-lan comment).
    - toCIDRSet:
        - cidr: 10.0.0.0/8
          except:
            - 10.42.0.0/16
            - 10.43.0.0/16
            - 10.20.0.0/24
        - cidr: 172.16.0.0/12
        - cidr: 192.168.0.0/16
      toPorts:
        - ports:
            - port: "1"
              endPort: 65535
              protocol: TCP
---
