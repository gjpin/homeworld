  name: allow-mosquitto-ingress
  namespace: homeassistant
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kompose.service: homeassistant-mosquitto
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: homeassistant
            k8s:io.kompose.service: homeassistant
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: homeassistant
            k8s:io.kompose.service: homeassistant-zigbee2mqtt
      toPorts:
        - ports:
            - port: "1883"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-homeassistant-mosquitto-egress
  namespace: homeassistant
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kompose.service: homeassistant
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: homeassistant
            k8s:io.kompose.service: homeassistant-mosquitto
      toPorts:
        - ports:
