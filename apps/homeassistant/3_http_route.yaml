---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homeassistant
  namespace: homeassistant
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    external-dns.alpha.kubernetes.io/hostname: "home.${BASE_DOMAIN}"
spec:
  parentRefs:
    - name: envoy
      namespace: homeassistant
  hostnames:
    - "home.${BASE_DOMAIN}"
  rules:
    - backendRefs:
        - name: homeassistant
          namespace: homeassistant
          kind: Service
          port: 8123
