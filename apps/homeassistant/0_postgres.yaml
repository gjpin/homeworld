# https://cloudnative-pg.io/docs/1.28/bootstrap/
# https://www.home-assistant.io/integrations/recorder/
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: homeassistant
  namespace: homeassistant
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    cnpg.io/podPatch: '[{"op":"add","path":"/spec/hostUsers","value":false}]'
spec:
  instances: 1
  affinity:
    nodeSelector:
      node-role.kubernetes.io/homelab: homelab
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 2Gi
  storage:
    storageClass: longhorn-crypto
    size: 5Gi
  bootstrap:
    initdb:
      database: homeassistant
      owner: homeassistant
      secret:
        name: postgres-credentials
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: homeassistant
  namespace: homeassistant
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: homeassistant
  podMetricsEndpoints:
    - port: metrics
      interval: 60s
