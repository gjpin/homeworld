apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: homeassistant-mosquitto-claim1
  namespace: homeassistant
  labels:
    app.kubernetes.io/name: mosquitto
    io.kompose.service: homeassistant-mosquitto-claim1
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-crypto
  resources:
    requests:
      storage: 1Gi
