---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homeassistant-mosquitto-config
  namespace: homeassistant
  labels:
    app.kubernetes.io/name: mosquitto
data:
  mosquitto.conf: |
    listener 1883 0.0.0.0
    allow_anonymous true
    persistence true
    persistence_location /mosquitto/data/
    log_dest stdout
