apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: homeassistant
  labels:
    app.kubernetes.io/name: homeassistant
    io.kompose.service: homeassistant
  annotations:
    ignore-check.kube-linter.io/no-read-only-root-fs: s6-overlay in the upstream Home Assistant image writes its supervision tree under /run, and the image and its alpine init containers are otherwise unverified; its writable paths outside the mounted volumes are not mapped to emptyDir volumes, and readOnlyRootFilesystem is not enabled without that (AGENTS.md).
    ignore-check.kube-linter.io/run-as-non-root: The upstream Home Assistant image runs s6-overlay as UID 0; the pod runs under gVisor, so root is confined to the sandbox kernel (docs/pod-security.md).
    argocd.argoproj.io/sync-wave: "1"
    security.homeworld/exception-reason: "Home Assistant requires container UID 0 under s6-overlay; the gVisor sandbox kernel isolates root execution from the host kernel."
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: homeassistant
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homeassistant
        io.kompose.service: homeassistant
    spec:
      serviceAccountName: homeassistant-app
      automountServiceAccountToken: false
      runtimeClassName: gvisor
      securityContext:
        runAsNonRoot: false
        # Grants rootless init containers write access to the /config PVC:
        # Longhorn supports kubelet-side fsGroup handling (CSIDriver
        # fsGroupPolicy ReadWriteOnceWithFSType), so the volume is chowned
        # to this group on first mount. OnRootMismatch skips the recursive
        # chown on every later mount.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Installs the pinned hass-oidc-auth custom integration for Authelia
        # OIDC (https://github.com/christiaangoossens/hass-oidc-auth). The
        # zip contains the integration files at its root. The loader is
        # rootless and writes only to the emptyDir that overlays
        # /config/custom_components/auth_oidc in the Home Assistant
        # container, so it never touches the root-owned /config PVC and the
        # git-pinned version always wins over any HACS-installed copy.
        - name: hass-oidc-auth-loader
          image: docker.io/library/alpine:3.24.4
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              # Renovate tracks the plugin version below (github-releases) and
              # refreshes the sha256 on bumps via postUpgradeTasks
              # (scripts/refresh-hass-oidc-auth-sha.sh).
              wget -O /tmp/hass-oidc-auth.zip \
                https://github.com/christiaangoossens/hass-oidc-auth/releases/download/v1.2.1/hass-oidc-auth.zip
              echo 'e5badaaacaa63cfd6fe733924a05e76d75058836190398598fb24de57cd47ccd  /tmp/hass-oidc-auth.zip' | sha256sum -c -
              unzip -o /tmp/hass-oidc-auth.zip -d /plugins
              rm -f /tmp/hass-oidc-auth.zip
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: hass-oidc-auth
              mountPath: /plugins
        # Seeds Home Assistant's bootstrap configuration with the OIDC
        # provider on the first start of an empty PVC. Home Assistant
        # leaves an existing configuration.yaml untouched, and with the
        # file present it also never creates the automations.yaml,
        # scripts.yaml, and scenes.yaml files that its own default
        # template includes, so all four are seeded here, together with
        # the HTTP server's reverse-proxy settings (.storage/http). Every
        # write is create-if-missing so the seed happens once and the PVC
        # stays user-owned state afterwards; later git changes to the
        # seeded configuration must be applied by editing the files
        # directly (or, for .storage/http, in the UI).
        - name: homeassistant-config-bootstrap
          image: docker.io/library/alpine:3.24.4
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              [ -f /config/configuration.yaml ] || cat > /config/configuration.yaml <<'YAML'
              # Loads default set of integrations. Do not remove.
              # default_config includes the analytics integration (reporting
              # requires an explicit opt-in via the UI) and the update
              # checker, and Home Assistant always loads the Marketplace
              # integration, which refreshes its GitHub-hosted catalogue
              # every 6 hours. Recorded exception to the AGENTS.md telemetry
              # rule: default_config is load-bearing for core HA
              # functionality, analytics reporting is opt-in and never
              # enabled, and the update checker and Marketplace are kept as
              # features. allow-homeassistant-world (-2_network_policy.yaml)
              # lets them reach the internet.
              default_config:

              # Metrics endpoint for the ServiceMonitor. requires_auth is
              # disabled because the tokenless OTel collector is the only
              # client and its scrape path is Cilium-restricted
              # (-2_network_policy.yaml: allow-homeassistant-metrics).
              prometheus:
                requires_auth: false

              # Recorder history lives on the CloudNativePG cluster
              # (0_postgres.yaml) instead of SQLite on the config PVC, per
              # the repo's datastore convention. Home Assistant resolves
              # the URL through its built-in !env_var tag, so the password
              # (delivered by the homeassistant-secrets ExternalSecret)
              # never lands on the /config PVC.
              recorder:
                db_url: !env_var RECORDER_DB_URL
                purge_keep_days: 10

              # Load frontend themes from the themes folder
              frontend:
                themes: !include_dir_merge_named themes

              automation: !include automations.yaml
              script: !include scripts.yaml
              scene: !include scenes.yaml

              auth_oidc:
                client_id: home-assistant
                client_secret: !env_var OIDC_CLIENT_SECRET
                discovery_url: https://auth.base-domain.invalid/.well-known/openid-configuration
                display_name: Authelia
                roles:
                  admin: homeassistant-admin
              YAML
              [ -f /config/automations.yaml ] || printf '[]\n' > /config/automations.yaml
              [ -f /config/scripts.yaml ] || : > /config/scripts.yaml
              [ -f /config/scenes.yaml ] || : > /config/scenes.yaml
              # Reverse proxy: Envoy terminates TLS, so trust its forwarded
              # headers (Envoy's pod IP lives in the k3s default pod CIDR;
              # the Cilium policies exclude the cluster CIDRs — see
              # -2_network_policy.yaml and docs/k3s.md) and generate https
              # callback URLs for the OIDC flow. Home Assistant keeps its
              # HTTP server settings in .storage/http (Settings > System >
              # Network > HTTP server), not configuration.yaml: an http:
              # YAML block would be imported as a trial that reverts to the
              # proxy-less defaults unless an admin confirms it within five
              # minutes. The seed is the confirmed (stable) config in the
              # store's current format, with the YAML import marked done;
              # Home Assistant migrates the file forward on later releases.
              mkdir -p /config/.storage
              [ -f /config/.storage/http ] || (umask 077; cat > /config/.storage/http <<'JSON'
              {
                "version": 3,
                "minor_version": 1,
                "key": "http",
                "data": {
                  "stable": {
                    "server_port": 8123,
                    "cors_allowed_origins": ["https://cast.home-assistant.io"],
                    "use_x_forwarded_for": true,
                    "trusted_proxies": ["10.42.0.0/16"],
                    "login_attempts_threshold": -1,
                    "ip_ban_enabled": true,
                    "ssl_profile": "intermediate_v6",
                    "use_x_frame_options": true,
                    "created_at": "2026-11-06T00:00:00+00:00",
                    "error": null,
                    "error_message": null
                  },
                  "pending": null,
                  "yaml_migration_done": true
                }
              }
              JSON
              )
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - mountPath: /config
              name: homeassistant-claim0
      containers:
        - image: ghcr.io/home-assistant/home-assistant:2026.11.1
          imagePullPolicy: IfNotPresent
          name: homeassistant
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          env:
            - name: TZ
              value: UTC
            # Authelia OIDC client secret, read by the auth_oidc provider
            # through Home Assistant's !env_var tag so the secret never
            # lands on the /config PVC.
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: homeassistant-oidc
                  key: clientSecret
            # CloudNativePG connection URL consumed by the recorder block in
            # configuration.yaml through Home Assistant's !env_var tag.
            - name: RECORDER_DB_URL
              valueFrom:
                secretKeyRef:
                  name: homeassistant-secrets
                  key: RECORDER_DB_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: false
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - mountPath: /config
              name: homeassistant-claim0
            # Overlay-mounted plugin directory; the rootless init container
            # populates it with the pinned hass-oidc-auth integration.
            - mountPath: /config/custom_components/auth_oidc
              name: hass-oidc-auth
      restartPolicy: Always
      volumes:
        - name: homeassistant-claim0
          persistentVolumeClaim:
            claimName: homeassistant-claim0
        - name: hass-oidc-auth
          emptyDir: {}
