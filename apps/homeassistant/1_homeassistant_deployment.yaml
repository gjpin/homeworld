apiVersion: apps/v1
kind: Deployment
metadata:
  name: homeassistant
  namespace: homeassistant
  labels:
    app.kubernetes.io/name: homeassistant
    io.kompose.service: homeassistant
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    security.homeworld/exception-reason: "Home Assistant requires container UID 0 under s6-overlay; hostUsers: false isolates root execution within an unprivileged user namespace."
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: homeassistant
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: homeassistant
        io.kompose.service: homeassistant
    spec:
      serviceAccountName: homeassistant-app
      automountServiceAccountToken: false
      runtimeClassName: gvisor
      hostUsers: false
      securityContext:
        runAsNonRoot: false
        # Grants rootless init containers write access to the /config PVC:
        # Longhorn supports kubelet-side fsGroup handling (CSIDriver
        # fsGroupPolicy ReadWriteOnceWithFSType), so the volume is chowned
        # to this group on first mount. OnRootMismatch skips the recursive
        # chown on every later mount.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Installs the pinned hass-oidc-auth custom integration for Authelia
        # OIDC (https://github.com/christiaangoossens/hass-oidc-auth). The
        # zip contains the integration files at its root. The loader is
        # rootless and writes only to the emptyDir that overlays
        # /config/custom_components/auth_oidc in the Home Assistant
        # container, so it never touches the root-owned /config PVC and the
        # git-pinned version always wins over any HACS-installed copy.
        - name: hass-oidc-auth-loader
          image: docker.io/library/alpine:3.24.2
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              # Renovate tracks the plugin version below (github-releases) and
              # refreshes the sha256 on bumps via postUpgradeTasks
              # (scripts/refresh-hass-oidc-auth-sha.sh).
              wget -O /tmp/hass-oidc-auth.zip \
                https://github.com/christiaangoossens/hass-oidc-auth/releases/download/v1.2.1/hass-oidc-auth.zip
              echo 'e5badaaacaa63cfd6fe733924a05e76d75058836190398598fb24de57cd47ccd  /tmp/hass-oidc-auth.zip' | sha256sum -c -
              unzip -o /tmp/hass-oidc-auth.zip -d /plugins
              rm -f /tmp/hass-oidc-auth.zip
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: hass-oidc-auth
              mountPath: /plugins
        # Seeds Home Assistant's bootstrap configuration with the OIDC
        # provider on the first start of an empty PVC. Home Assistant
        # leaves an existing configuration.yaml untouched, and with the
        # file present it also never creates the automations.yaml,
        # scripts.yaml, and scenes.yaml files that its own default
        # template includes, so all four are seeded here. Every write is
        # create-if-missing so the seed happens once and the PVC stays
        # user-owned state afterwards; later git changes to the seeded
        # configuration must be applied by editing the files directly.
        - name: homeassistant-config-bootstrap
          image: docker.io/library/alpine:3.24.2
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -ec
            - |
              [ -f /config/configuration.yaml ] || cat > /config/configuration.yaml <<'YAML'
              # Loads default set of integrations. Do not remove.
              # default_config includes the analytics integration (reporting
              # requires an explicit opt-in via the UI) and the update
              # checker. Recorded telemetry exception: both stay enabled
              # because default_config is load-bearing for core HA
              # functionality, reporting is opt-in and never enabled, and
              # the update checker is unreachable — the namespace's egress
              # policy has no internet allowlist for it (AGENTS.md
              # telemetry rule).
              default_config:

              # Reverse proxy: Envoy terminates TLS, so trust its forwarded
              # headers (Envoy's pod IP lives in the Talos default pod CIDR;
              # the Cilium policies exclude the cluster CIDRs — see
              # -2_network_policy.yaml and docs/talos.md) and generate
              # https callback URLs for the OIDC flow.
              http:
                use_x_forwarded_for: true
                trusted_proxies:
                  - 10.244.0.0/16

              # Metrics endpoint for the ServiceMonitor. requires_auth is
              # disabled because the tokenless OTel collector is the only
              # client and its scrape path is Cilium-restricted
              # (-2_network_policy.yaml: allow-homeassistant-metrics).
              prometheus:
                requires_auth: false

              # Recorder history lives on the CloudNativePG cluster
              # (0_postgres.yaml) instead of SQLite on the config PVC, per
              # the repo's datastore convention. Home Assistant resolves
              # the URL through its built-in !env_var tag, so the password
              # (delivered by the homeassistant-secrets ExternalSecret)
              # never lands on the /config PVC.
              recorder:
                db_url: !env_var RECORDER_DB_URL
                purge_keep_days: 10

              # Load frontend themes from the themes folder
              frontend:
                themes: !include_dir_merge_named themes

              automation: !include automations.yaml
              script: !include scripts.yaml
              scene: !include scenes.yaml

              auth_oidc:
                client_id: home-assistant
                client_secret: !env_var OIDC_CLIENT_SECRET
                discovery_url: https://auth.${BASE_DOMAIN}/.well-known/openid-configuration
                display_name: Authelia
                roles:
                  admin: homeassistant-admin
              YAML
              [ -f /config/automations.yaml ] || printf '[]\n' > /config/automations.yaml
              [ -f /config/scripts.yaml ] || : > /config/scripts.yaml
              [ -f /config/scenes.yaml ] || : > /config/scenes.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - mountPath: /config
              name: homeassistant-claim0
      containers:
        - image: ghcr.io/home-assistant/home-assistant:2026.10.1
          imagePullPolicy: IfNotPresent
          name: homeassistant
          ports:
            - name: http
              containerPort: 8123
              protocol: TCP
          env:
            - name: TZ
              value: UTC
            # Authelia OIDC client secret, read by the auth_oidc provider
            # through Home Assistant's !env_var tag so the secret never
            # lands on the /config PVC.
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: homeassistant-oidc
                  key: clientSecret
            # CloudNativePG connection URL consumed by the recorder block in
            # configuration.yaml through Home Assistant's !env_var tag.
            - name: RECORDER_DB_URL
              valueFrom:
                secretKeyRef:
                  name: homeassistant-secrets
                  key: RECORDER_DB_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: false
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "2"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - mountPath: /config
              name: homeassistant-claim0
            # Overlay-mounted plugin directory; the rootless init container
            # populates it with the pinned hass-oidc-auth integration.
            - mountPath: /config/custom_components/auth_oidc
              name: hass-oidc-auth
      restartPolicy: Always
      volumes:
        - name: homeassistant-claim0
          persistentVolumeClaim:
            claimName: homeassistant-claim0
        - name: hass-oidc-auth
          emptyDir: {}
