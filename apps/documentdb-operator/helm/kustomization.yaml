apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  security.homeworld/profile: homelab
helmGlobals:
  chartHome: ./local-charts
helmCharts:
  - name: documentdb-operator
    releaseName: documentdb-operator
    namespace: documentdb-operator
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^documentdb-operator$
      namespace: ^documentdb-operator$
    patch: |-
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^sidecar-injector$
      namespace: ^cloudnative-pg$
    patch: |-
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
