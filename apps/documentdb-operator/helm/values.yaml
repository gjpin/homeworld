certManager:
  preflightCheck: false
# Authoritative engine/gateway version (tag of the operator's documentdb
# extension and gateway images). Pinned here, not inherited from the vendored
# chart's default, so a chart bump never changes the engine on its own.
# https://github.com/documentdb/documentdb/releases (tag vX.Y-0 ↔ X.Y.0)
documentDbVersion: "1.0.1"
# Require ImageVolume instead of the chart's `auto`, whose fallback to the
# combined image is permanent for a cluster and ignores the pinned
# `spec.image.postgres`. An unusable ImageVolume fails at admission instead.
imageMode: imageVolume
# CNPG-I only discovers plugin Services in the CloudNativePG operator's own
# namespace, so the sidecar injector must live in `cloudnative-pg`.
pluginNamespace: cloudnative-pg
operator:
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
      ephemeral-storage: 2Gi
sidecarInjector:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
      ephemeral-storage: 2Gi
