# https://github.com/rancher/system-upgrade-controller/tree/v0.20.2/pkg/crds/yaml/generated
#
# The Plan CRD from the release tag, ahead of the controller (wave 1) and the
# Plans (wave 2). Pruning is disabled like the other CRD-only Applications:
# deleting this Application must never delete the Plans.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: system-upgrade-controller-crds
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: system-upgrade
  syncPolicy:
    automated:
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ServerSideApply=true
  source:
    repoURL: https://github.com/rancher/system-upgrade-controller.git
    targetRevision: v0.21.1
    path: pkg/crds/yaml/generated
