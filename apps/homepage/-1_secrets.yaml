---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-secrets
  namespace: homepage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: homepage-secrets
    template:
      engineVersion: v2
      data:
        HOMEPAGE_VAR_ARGOCD_TOKEN: "{{ .ARGOCD_TOKEN }}"
        HOMEPAGE_VAR_GRAFANA_TOKEN: "{{ .GRAFANA_TOKEN }}"
        HOMEPAGE_VAR_HASS_TOKEN: "{{ .HASS_TOKEN }}"
        HOMEPAGE_VAR_IMMICH_API_KEY: "{{ .IMMICH_API_KEY }}"
        HOMEPAGE_VAR_QBITTORRENT_USERNAME: "{{ .QBITTORRENT_USERNAME }}"
        HOMEPAGE_VAR_QBITTORRENT_PASSWORD: "{{ .QBITTORRENT_PASSWORD }}"
        HOMEPAGE_VAR_PROWLARR_API_KEY: "{{ .PROWLARR_API_KEY }}"
        HOMEPAGE_VAR_SONARR_API_KEY: "{{ .SONARR_API_KEY }}"
        HOMEPAGE_VAR_RADARR_API_KEY: "{{ .RADARR_API_KEY }}"
        HOMEPAGE_VAR_LIDARR_API_KEY: "{{ .LIDARR_API_KEY }}"
        HOMEPAGE_VAR_BAZARR_API_KEY: "{{ .BAZARR_API_KEY }}"
        HOMEPAGE_VAR_SEERR_API_KEY: "{{ .SEERR_API_KEY }}"
        HOMEPAGE_VAR_JELLYFIN_API_KEY: "{{ .JELLYFIN_API_KEY }}"
        HOMEPAGE_VAR_AUDIOBOOKSHELF_API_KEY: "{{ .AUDIOBOOKSHELF_API_KEY }}"
        HOMEPAGE_VAR_NAVIDROME_USER: "{{ .NAVIDROME_USER }}"
        HOMEPAGE_VAR_NAVIDROME_TOKEN: "{{ .NAVIDROME_TOKEN }}"
        HOMEPAGE_VAR_NAVIDROME_SALT: "{{ .NAVIDROME_SALT }}"
  data:
    - secretKey: ARGOCD_TOKEN
      remoteRef:
        key: /homepage/ARGOCD_TOKEN
        decodingStrategy: None
    - secretKey: GRAFANA_TOKEN
      remoteRef:
        key: /homepage/GRAFANA_TOKEN
        decodingStrategy: None
    - secretKey: HASS_TOKEN
      remoteRef:
        key: /homepage/HASS_TOKEN
        decodingStrategy: None
    - secretKey: IMMICH_API_KEY
      remoteRef:
        key: /homepage/IMMICH_API_KEY
        decodingStrategy: None
    # The qBittorrent widget authenticates against the WebUI API with the
    # app's own credential pair (docs/oidc.md: the route keeps app-native
    # auth because of this headless consumer).
    - secretKey: QBITTORRENT_USERNAME
      remoteRef:
        key: /qbittorrent/WEBUI_USERNAME
        decodingStrategy: None
    - secretKey: QBITTORRENT_PASSWORD
      remoteRef:
        key: /qbittorrent/WEBUI_PASSWORD
        decodingStrategy: None
    # The *arr, Bazarr and Seerr keys are the apps' own fixed API keys.
    - secretKey: PROWLARR_API_KEY
      remoteRef:
        key: /prowlarr/API_KEY
        decodingStrategy: None
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: /sonarr/API_KEY
        decodingStrategy: None
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: /radarr/API_KEY
        decodingStrategy: None
    - secretKey: LIDARR_API_KEY
      remoteRef:
        key: /lidarr/API_KEY
        decodingStrategy: None
    - secretKey: BAZARR_API_KEY
      remoteRef:
        key: /bazarr/API_KEY
        decodingStrategy: None
    - secretKey: SEERR_API_KEY
      remoteRef:
        key: /seerr/API_KEY
        decodingStrategy: None
    # Created in the apps after their first start (docs/secrets.md).
    - secretKey: JELLYFIN_API_KEY
      remoteRef:
        key: /homepage/JELLYFIN_API_KEY
        decodingStrategy: None
    - secretKey: AUDIOBOOKSHELF_API_KEY
      remoteRef:
        key: /homepage/AUDIOBOOKSHELF_API_KEY
        decodingStrategy: None
    - secretKey: NAVIDROME_USER
      remoteRef:
        key: /homepage/NAVIDROME_USER
        decodingStrategy: None
    - secretKey: NAVIDROME_TOKEN
      remoteRef:
        key: /homepage/NAVIDROME_TOKEN
        decodingStrategy: None
    - secretKey: NAVIDROME_SALT
      remoteRef:
        key: /homepage/NAVIDROME_SALT
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: envoy-oidc-client-secret
  namespace: homepage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: envoy-oidc-client-secret
  data:
    # Client secret for the shared Authelia "envoy" OIDC client; consumed by
    # the HTTPRoute-scoped SecurityPolicy (docs/oidc.md). Envoy Gateway
    # requires the "client-secret" key.
    - secretKey: client-secret
      remoteRef:
        key: /authelia/OIDC_CLIENT_SECRET_ENVOY
        decodingStrategy: None
