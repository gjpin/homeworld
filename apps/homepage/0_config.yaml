---
# Homepage reads its configuration at startup. After changing this ConfigMap,
# restart the deployment to pick up the new configuration:
#   kubectl -n homepage rollout restart deploy/homepage
#
# Services without a siteMonitor sit behind the Envoy Gateway OIDC
# SecurityPolicy (Longhorn, Envoy control-plane metrics route,
# VictoriaMetrics,
# VictoriaLogs, VictoriaTraces, Zigbee2MQTT, and the media apps Prowlarr,
# Sonarr, Radarr, Lidarr, Bazarr, Maintainerr, Houndarr, AudioMuse-AI): an
# unauthenticated probe is
# redirected to the Authelia portal, so a siteMonitor would measure the
# portal instead of the app. The href links keep working for signed-in
# browsers (docs/oidc.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  settings.yaml: |
    title: Homeworld
    theme: dark
    color: slate
    statusStyle: dot
  services.yaml: |
    - Development:
        - Forgejo:
            icon: forgejo
            href: https://git.homeworld.internal
            description: Git forge
            siteMonitor: https://git.homeworld.internal
        - Woodpecker CI:
            icon: woodpecker-ci
            href: https://ci.homeworld.internal
            description: CI pipelines
            siteMonitor: https://ci.homeworld.internal
        - Coder:
            icon: coder
            href: https://coder.homeworld.internal
            description: Cloud development workspaces
            siteMonitor: https://coder.homeworld.internal
        - OpenChamber:
            icon: /icons/openchamber.svg
            href: https://openchamber.homeworld.internal
            description: AI agent workspace
            siteMonitor: https://openchamber.homeworld.internal
        # No siteMonitor: the route is behind the Gateway's Authelia sign-in.
        - ThinkRail:
            icon: /icons/thinkrail.svg
            href: https://thinkrail.homeworld.internal
            description: Agentic IDE for the Pi agent
    - Media:
        - Immich:
            icon: immich
            href: https://photos.homeworld.internal
            description: Photos and videos
            siteMonitor: https://photos.homeworld.internal
            widget:
              type: immich
              url: https://photos.homeworld.internal
              key: "{{HOMEPAGE_VAR_IMMICH_API_KEY}}"
    # The media stack (the README's *arr Stack table). Widgets call the
    # in-cluster Services with each app's API key; the gateway-OIDC routes
    # (Prowlarr, Sonarr, Radarr, Lidarr, Bazarr, Maintainerr, Houndarr,
    # AudioMuse-AI) carry no siteMonitor.
    - "*arr":
        - Jellyfin:
            icon: jellyfin
            href: https://jellyfin.homeworld.internal
            description: Movies, TV and music streaming
            siteMonitor: https://jellyfin.homeworld.internal
            widget:
              type: jellyfin
              url: http://jellyfin.jellyfin.svc.cluster.local:8096
              key: "{{HOMEPAGE_VAR_JELLYFIN_API_KEY}}"
              version: 2
              enableBlocks: true
              enableNowPlaying: true
        - Seerr:
            icon: seerr
            href: https://seerr.homeworld.internal
            description: Movie and series requests
            siteMonitor: https://seerr.homeworld.internal
            widget:
              type: seerr
              url: http://seerr.seerr.svc.cluster.local:5055
              key: "{{HOMEPAGE_VAR_SEERR_API_KEY}}"
        - Audiobookshelf:
            icon: audiobookshelf
            href: https://audiobookshelf.homeworld.internal
            description: Audiobooks and podcasts
            siteMonitor: https://audiobookshelf.homeworld.internal
            widget:
              type: audiobookshelf
              url: http://audiobookshelf.audiobookshelf.svc.cluster.local:13378
              key: "{{HOMEPAGE_VAR_AUDIOBOOKSHELF_API_KEY}}"
        - Navidrome:
            icon: navidrome
            href: https://navidrome.homeworld.internal
            description: Music streaming
            siteMonitor: https://navidrome.homeworld.internal
            widget:
              type: navidrome
              url: http://navidrome.navidrome.svc.cluster.local:4533
              user: "{{HOMEPAGE_VAR_NAVIDROME_USER}}"
              token: "{{HOMEPAGE_VAR_NAVIDROME_TOKEN}}"
              salt: "{{HOMEPAGE_VAR_NAVIDROME_SALT}}"
        - Feishin:
            icon: feishin
            href: https://feishin.homeworld.internal
            description: Navidrome web player
            siteMonitor: https://feishin.homeworld.internal
        - Streamystats:
            icon: streamystats
            href: https://streamystats.homeworld.internal
            description: Jellyfin statistics
            siteMonitor: https://streamystats.homeworld.internal
        - qBittorrent:
            icon: qbittorrent
            href: https://qbittorrent.homeworld.internal
            description: Torrent downloads over VPN
            siteMonitor: https://qbittorrent.homeworld.internal
            widget:
              type: qbittorrent
              url: https://qbittorrent.homeworld.internal
              username: "{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}"
              password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"
        - Prowlarr:
            icon: prowlarr
            href: https://prowlarr.homeworld.internal
            description: Indexer manager
            widget:
              type: prowlarr
              url: http://prowlarr.prowlarr.svc.cluster.local:9696
              key: "{{HOMEPAGE_VAR_PROWLARR_API_KEY}}"
        - Sonarr:
            icon: sonarr
            href: https://sonarr.homeworld.internal
            description: TV series
            widget:
              type: sonarr
              url: http://sonarr.sonarr.svc.cluster.local:8989
              key: "{{HOMEPAGE_VAR_SONARR_API_KEY}}"
              enableQueue: true
        - Radarr:
            icon: radarr
            href: https://radarr.homeworld.internal
            description: Movies
            widget:
              type: radarr
              url: http://radarr.radarr.svc.cluster.local:7878
              key: "{{HOMEPAGE_VAR_RADARR_API_KEY}}"
              enableQueue: true
        - Lidarr:
            icon: lidarr
            href: https://lidarr.homeworld.internal
            description: Music
            widget:
              type: lidarr
              url: http://lidarr.lidarr.svc.cluster.local:8686
              key: "{{HOMEPAGE_VAR_LIDARR_API_KEY}}"
        - Bindery:
            icon: bindery
            href: https://bindery.homeworld.internal
            description: Books and audiobooks
            siteMonitor: https://bindery.homeworld.internal
        - Bazarr:
            icon: bazarr
            href: https://bazarr.homeworld.internal
            description: Subtitles
            widget:
              type: bazarr
              url: http://bazarr.bazarr.svc.cluster.local:6767
              key: "{{HOMEPAGE_VAR_BAZARR_API_KEY}}"
        - Cleanuparr:
            icon: cleanuparr
            href: https://cleanuparr.homeworld.internal
            description: Download queue cleaning and malware blocking
            siteMonitor: https://cleanuparr.homeworld.internal
        - Houndarr:
            icon: houndarr
            href: https://houndarr.homeworld.internal
            description: Missing-item searches
        - Maintainerr:
            icon: maintainerr
            href: https://maintainerr.homeworld.internal
            description: Library cleanup rules
            widget:
              type: maintainerr
              url: http://maintainerr.maintainerr.svc.cluster.local:6246
        - AudioMuse-AI:
            icon: audiomuse-ai
            href: https://audiomuse.homeworld.internal
            description: Sonic analysis and playlists
    - Home:
        - Home Assistant:
            icon: home-assistant
            href: https://home.homeworld.internal
            description: Home automation
            siteMonitor: https://home.homeworld.internal
            widget:
              type: homeassistant
              url: https://home.homeworld.internal
              key: "{{HOMEPAGE_VAR_HASS_TOKEN}}"
        - Zigbee2MQTT:
            icon: zigbee2mqtt
            href: https://z2m.homeworld.internal
            description: Zigbee bridge
    - Productivity:
        - OpenCloud:
            icon: mdi-cloud-outline
            href: https://cloud.homeworld.internal
            description: Files, sharing, and collaboration
            siteMonitor: https://cloud.homeworld.internal
        - Collabora:
            icon: collabora
            href: https://office.homeworld.internal
            description: Online office editor
            siteMonitor: https://office.homeworld.internal
        - Notesnook:
            icon: notesnook
            href: https://notes.homeworld.internal
            description: Encrypted notes
            siteMonitor: https://notes.homeworld.internal
        - AFFiNE:
            icon: affine
            href: https://affine.homeworld.internal
            description: Docs, whiteboards, and AI workspace
            siteMonitor: https://affine.homeworld.internal
        - Actual Budget:
            icon: actual-budget
            href: https://budget.homeworld.internal
            description: Personal budgeting
            siteMonitor: https://budget.homeworld.internal
        - Vaultwarden:
            icon: vaultwarden
            href: https://vault.homeworld.internal
            description: Password manager
            siteMonitor: https://vault.homeworld.internal
        - Supernote:
            icon: mdi-notebook-edit-outline
            href: https://supernote.homeworld.internal
            description: Supernote private cloud
            siteMonitor: https://supernote.homeworld.internal
    - Monitoring:
        - Grafana:
            icon: grafana
            href: https://grafana.homeworld.internal
            description: Dashboards and observability
            # No siteMonitor: unauthenticated probes hit Grafana's OIDC
            # auto_login redirect and would measure the Authelia portal,
            # not Grafana (same class as the gateway-OIDC hosts above).
            widget:
              type: grafana
              url: https://grafana.homeworld.internal
              # The v2.4.0 grafana widget proxies through the generic
              # handler, which only sets Authorization from username/
              # password and silently ignores `key:`. Send the existing
              # service-account token as a Bearer header instead
              # (HOMEPAGE_VAR_GRAFANA_TOKEN, /homepage/GRAFANA_TOKEN).
              headers:
                Authorization: Bearer {{HOMEPAGE_VAR_GRAFANA_TOKEN}}
        - VictoriaMetrics:
            icon: victoriametrics
            href: https://victoria-metrics.homeworld.internal
            description: Metrics backend
        - VictoriaLogs:
            icon: victorialogs
            href: https://victoria-logs.homeworld.internal
            description: Logs backend
        - VictoriaTraces:
            icon: mdi-chart-timeline-variant
            href: https://victoria-traces.homeworld.internal
            description: Traces backend
    - Platform:
        - Argo CD:
            icon: argo-cd
            href: https://argocd.homeworld.internal
            description: GitOps delivery
            siteMonitor: https://argocd.homeworld.internal
            widget:
              type: argocd
              url: https://argocd.homeworld.internal
              key: "{{HOMEPAGE_VAR_ARGOCD_TOKEN}}"
        - Longhorn:
            icon: longhorn
            href: https://longhorn.homeworld.internal
            description: Distributed block storage
        - RustFS:
            icon: rustfs
            href: https://console.rustfs.homeworld.internal
            description: S3 object storage console
            siteMonitor: https://s3.homeworld.internal
        - RustFS Operator:
            icon: rustfs
            href: https://rustfs.homeworld.internal
            description: Storage operator console
            siteMonitor: https://rustfs.homeworld.internal
        - Velero UI:
            icon: velero
            href: https://velero.homeworld.internal
            description: Backup management
            siteMonitor: https://velero.homeworld.internal
        - Envoy Gateway:
            icon: mdi-lan
            href: https://envoy.homeworld.internal
            description: Gateway API admin console
        - Authelia:
            icon: authelia
            href: https://auth.homeworld.internal
            description: Identity provider
            siteMonitor: https://auth.homeworld.internal
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          hourCycle: h23
    - search:
        provider: custom
        url: https://www.startpage.com/sp/search?prfe=99af23cc8b541deeaa22f4bb9a97bdc8740eea796bf73fabaed37621f9e78cf1ce5e7d9cedfe6ed3a74835f0ba772103f3b687ba1e927805811945f2d0ef35c0cad8a1576b1edb52f05fe97b7ff8763b&query=
        target: _blank
  kubernetes.yaml: |
    mode: cluster
  bookmarks.yaml: ""
  docker.yaml: ""
  custom.css: ""
  custom.js: ""
