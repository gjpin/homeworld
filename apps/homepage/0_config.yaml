---
# Homepage reads its configuration at startup. After changing this ConfigMap,
# restart the deployment to pick up the new configuration:
#   kubectl -n homepage rollout restart deploy/homepage
#
# Services without a siteMonitor sit behind the Envoy Gateway OIDC
# SecurityPolicy (Longhorn, Envoy control-plane metrics route,
# VictoriaMetrics,
# VictoriaLogs, VictoriaTraces, Zigbee2MQTT): an unauthenticated probe is
# redirected to the Authelia portal, so a siteMonitor would measure the
# portal instead of the app. The href links keep working for signed-in
# browsers (docs/oidc.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage
  namespace: homepage
  labels:
    app.kubernetes.io/name: homepage
data:
  settings.yaml: |
    title: Homeworld
    theme: dark
    color: slate
    statusStyle: dot
  services.yaml: |
    - Development:
        - Forgejo:
            icon: forgejo
            href: https://git.homeworld.internal
            description: Git forge
            siteMonitor: https://git.homeworld.internal
        - Woodpecker CI:
            icon: woodpecker-ci
            href: https://ci.homeworld.internal
            description: CI pipelines
            siteMonitor: https://ci.homeworld.internal
        - Coder:
            icon: coder
            href: https://coder.homeworld.internal
            description: Cloud development workspaces
            siteMonitor: https://coder.homeworld.internal
        - OpenChamber:
            icon: /icons/openchamber.svg
            href: https://openchamber.homeworld.internal
            description: AI agent workspace
            siteMonitor: https://openchamber.homeworld.internal
    - Media:
        - Immich:
            icon: immich
            href: https://photos.homeworld.internal
            description: Photos and videos
            siteMonitor: https://photos.homeworld.internal
            widget:
              type: immich
              url: https://photos.homeworld.internal
              key: "{{HOMEPAGE_VAR_IMMICH_API_KEY}}"
        - qBittorrent:
            icon: qbittorrent
            href: https://qbittorrent.homeworld.internal
            description: Torrent downloads over VPN
            siteMonitor: https://qbittorrent.homeworld.internal
            widget:
              type: qbittorrent
              url: https://qbittorrent.homeworld.internal
              username: "{{HOMEPAGE_VAR_QBITTORRENT_USERNAME}}"
              password: "{{HOMEPAGE_VAR_QBITTORRENT_PASSWORD}}"
    - Home:
        - Home Assistant:
            icon: home-assistant
            href: https://home.homeworld.internal
            description: Home automation
            siteMonitor: https://home.homeworld.internal
            widget:
              type: homeassistant
              url: https://home.homeworld.internal
              key: "{{HOMEPAGE_VAR_HASS_TOKEN}}"
        - Zigbee2MQTT:
            icon: zigbee2mqtt
            href: https://z2m.homeworld.internal
            description: Zigbee bridge
    - Productivity:
        - OpenCloud:
            icon: mdi-cloud-outline
            href: https://cloud.homeworld.internal
            description: Files, sharing, and collaboration
            siteMonitor: https://cloud.homeworld.internal
        - Collabora:
            icon: collabora
            href: https://office.homeworld.internal
            description: Online office editor
            siteMonitor: https://office.homeworld.internal
        - Notesnook:
            icon: notesnook
            href: https://notes.homeworld.internal
            description: Encrypted notes
            siteMonitor: https://notes.homeworld.internal
        - Actual Budget:
            icon: actual-budget
            href: https://budget.homeworld.internal
            description: Personal budgeting
            siteMonitor: https://budget.homeworld.internal
        - Vaultwarden:
            icon: vaultwarden
            href: https://vault.homeworld.internal
            description: Password manager
            siteMonitor: https://vault.homeworld.internal
        - Supernote:
            icon: mdi-notebook-edit-outline
            href: https://supernote.homeworld.internal
            description: Supernote private cloud
            siteMonitor: https://supernote.homeworld.internal
    - Monitoring:
        - Grafana:
            icon: grafana
            href: https://grafana.homeworld.internal
            description: Dashboards and observability
            # No siteMonitor: unauthenticated probes hit Grafana's OIDC
            # auto_login redirect and would measure the Authelia portal,
            # not Grafana (same class as the gateway-OIDC hosts above).
            widget:
              type: grafana
              url: https://grafana.homeworld.internal
              # The v2.4.0 grafana widget proxies through the generic
              # handler, which only sets Authorization from username/
              # password and silently ignores `key:`. Send the existing
              # service-account token as a Bearer header instead
              # (HOMEPAGE_VAR_GRAFANA_TOKEN, /homepage/GRAFANA_TOKEN).
              headers:
                Authorization: Bearer {{HOMEPAGE_VAR_GRAFANA_TOKEN}}
        - VictoriaMetrics:
            icon: victoriametrics
            href: https://victoria-metrics.homeworld.internal
            description: Metrics backend
        - VictoriaLogs:
            icon: victorialogs
            href: https://victoria-logs.homeworld.internal
            description: Logs backend
        - VictoriaTraces:
            icon: mdi-chart-timeline-variant
            href: https://victoria-traces.homeworld.internal
            description: Traces backend
    - Platform:
        - Argo CD:
            icon: argo-cd
            href: https://argocd.homeworld.internal
            description: GitOps delivery
            siteMonitor: https://argocd.homeworld.internal
            widget:
              type: argocd
              url: https://argocd.homeworld.internal
              key: "{{HOMEPAGE_VAR_ARGOCD_TOKEN}}"
        - Longhorn:
            icon: longhorn
            href: https://longhorn.homeworld.internal
            description: Distributed block storage
        - RustFS:
            icon: rustfs
            href: https://console.rustfs.homeworld.internal
            description: S3 object storage console
            siteMonitor: https://s3.homeworld.internal
        - RustFS Operator:
            icon: rustfs
            href: https://rustfs.homeworld.internal
            description: Storage operator console
            siteMonitor: https://rustfs.homeworld.internal
        - Velero UI:
            icon: velero
            href: https://velero.homeworld.internal
            description: Backup management
            siteMonitor: https://velero.homeworld.internal
        - Envoy Gateway:
            icon: mdi-lan
            href: https://envoy.homeworld.internal
            description: Gateway API admin console
        - Authelia:
            icon: authelia
            href: https://auth.homeworld.internal
            description: Identity provider
            siteMonitor: https://auth.homeworld.internal
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: cluster
        nodes:
          show: true
          cpu: true
          memory: true
          showLabel: true
    - datetime:
        text_size: xl
        format:
          timeStyle: short
          hourCycle: h23
    - search:
        provider: custom
        url: https://www.startpage.com/sp/search?prfe=99af23cc8b541deeaa22f4bb9a97bdc8740eea796bf73fabaed37621f9e78cf1ce5e7d9cedfe6ed3a74835f0ba772103f3b687ba1e927805811945f2d0ef35c0cad8a1576b1edb52f05fe97b7ff8763b&query=
        target: _blank
  kubernetes.yaml: |
    mode: cluster
  bookmarks.yaml: ""
  docker.yaml: ""
  custom.css: ""
  custom.js: ""
