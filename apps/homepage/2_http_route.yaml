---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: homepage
  namespace: homepage
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: homepage
      sectionName: homepage-https
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "homepage.homeworld.internal"
  rules:
    - backendRefs:
      - name: homepage
        namespace: homepage
        kind: Service
        port: 3000
        group: ""
        weight: 1
