# TODO: each application has a gateway, which are merged into a single one till
# cert-manager supports http routes for automatic certificates
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy
  namespace: authelia
  annotations:
    cert-manager.io/cluster-issuer: homeworld-ca
spec:
  gatewayClassName: envoy-merged
  addresses:
    - type: IPAddress
      value: 192.168.8.50
  listeners:
    - name: authelia-https
      protocol: HTTPS
      port: 443
      hostname: "auth.homeworld.internal"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: authelia-tls-cert
            kind: Secret
            group: ""
