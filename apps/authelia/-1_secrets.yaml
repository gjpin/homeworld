---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: authelia
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: /authelia/POSTGRES_USERNAME
        decodingStrategy: Auto
    - secretKey: password
      remoteRef:
        key: /authelia/POSTGRES_PASSWORD
        decodingStrategy: Auto
---
