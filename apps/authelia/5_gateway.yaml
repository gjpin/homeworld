# TODO: each application has a gateway, which are merged into a single one till
# cert-manager supports http routes for automatic certificates
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy
  namespace: authelia
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/tls-acme: "true"
spec:
  gatewayClassName: envoy-merged
  addresses:
    - type: IPAddress
      value: ${EXTERNAL_IP}
  listeners:
    - name: authelia-https
      protocol: HTTPS
      port: 443
      hostname: "auth.${BASE_DOMAIN}"
      allowedRoutes:
        namespaces:
          from: all
      tls:
        mode: Terminate
        certificateRefs:
          - name: authelia-tls-cert
            kind: Secret
