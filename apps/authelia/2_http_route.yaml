---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia
  namespace: authelia
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    external-dns.alpha.kubernetes.io/hostname: "auth.${BASE_DOMAIN}"
spec:
  parentRefs:
    - name: envoy
      namespace: authelia
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "auth.${BASE_DOMAIN}"
  rules:
    - backendRefs:
        - name: authelia
          namespace: authelia
          kind: Service
          port: 80
          group: ""
          weight: 1
