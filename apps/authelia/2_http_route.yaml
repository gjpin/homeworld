---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authelia
  namespace: authelia
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "auth.base-domain.invalid"
  rules:
    - backendRefs:
        - name: authelia
          namespace: authelia
          kind: Service
          port: 80
          group: ""
          weight: 1
