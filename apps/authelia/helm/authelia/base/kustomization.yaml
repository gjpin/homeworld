apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
configMapGenerator:
  - name: authelia-configuration
    namespace: authelia
    files:
      - configuration.yaml=configuration.yaml.tmpl
helmCharts:
  - name: authelia
    repo: https://charts.authelia.com
    version: 0.11.6
    releaseName: authelia
    namespace: authelia
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^authelia$
      namespace: ^authelia$
    patch: |-
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: ServiceMonitor
      name: ^authelia$
      namespace: ^authelia$
    patch: |-
      - op: add
        path: /spec/endpoints/0/interval
        value: 60s
