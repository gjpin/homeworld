apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: authelia
    repo: https://charts.authelia.com
    version: 0.11.22
    releaseName: authelia
    namespace: authelia
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
configMapGenerator:
  - name: authelia-configuration
    namespace: authelia
    files:
      - configuration.yaml=configuration.yaml.tmpl
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^authelia$
      namespace: ^authelia$
    patch: |-
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: ServiceMonitor
      name: ^authelia$
      namespace: ^authelia$
    patch: |-
      - op: add
        path: /spec/endpoints/0/interval
        value: 60s
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^authelia$
      namespace: ^authelia$
    patch: |-
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: container-security-context-user-group-id,pod-networkpolicy,pod-probes-identical,deployment-replicas,container-image-pull-policy
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: The pinned image requires UID/GID 1000, the chart intentionally shares its health endpoint between probes, Cilium enforces the network policy, one replica is intentional with HPA disabled, and the pinned image is pulled IfNotPresent to reuse the node cache.
