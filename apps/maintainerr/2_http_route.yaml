---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: maintainerr
  namespace: maintainerr
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "maintainerr.base-domain.invalid"
  rules:
    - backendRefs:
        - name: maintainerr
          namespace: maintainerr
          kind: Service
          port: 6246
          group: ""
          weight: 1
