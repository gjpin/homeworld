---
# Gateway OIDC for Maintainerr: it has no built-in login at all, and anyone
# who reaches its API can read every stored credential, so Authelia is the
# only login and the route requires the platform group (docs/oidc.md). The
# Homepage widget calls the in-cluster Service instead. StrategicMerge keeps
# this policy from overriding the Gateway-level CrowdSec extAuth.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authelia-oidc
  namespace: maintainerr
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: maintainerr
  oidc:
    provider:
      issuer: https://auth.base-domain.invalid
      authorizationEndpoint: https://auth.base-domain.invalid/api/oidc/authorization
      tokenEndpoint: https://auth.base-domain.invalid/api/oidc/token
    clientID: envoy
    clientSecret:
      name: envoy-oidc-client-secret
    scopes:
      - openid
      - offline_access
    redirectURL: https://maintainerr.base-domain.invalid/oauth2/callback
    logoutPath: /logout
    cookieDomain: maintainerr.base-domain.invalid
    forwardAccessToken: false
    refreshToken: true
    passThroughAuthHeader: false
