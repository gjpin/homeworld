---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # Request data for rules and request cleanup after a deletion.
  name: allow-maintainerr-seerr
  namespace: maintainerr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: maintainerr
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: seerr
            k8s:app.kubernetes.io/name: seerr
      toPorts:
        - ports:
            - port: "5055"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # TMDb metadata and posters (a bundled key is used unless one is set).
  # The weekly anonymous usage report is disabled (TELEMETRY=off) and
  # telemetry.maintainerr.info is not allowed, nor is the GitHub release
  # check (api.github.com).
  name: allow-maintainerr-metadata
  namespace: maintainerr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: maintainerr
  egress:
    - toFQDNs:
        - matchName: "api.themoviedb.org"
        - matchName: "image.tmdb.org"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
