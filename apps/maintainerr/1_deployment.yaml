---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: maintainerr
  namespace: maintainerr
  labels:
    app.kubernetes.io/name: maintainerr
  annotations:
    ignore-check.kube-linter.io/no-read-only-root-fs: Unverified for the pinned Maintainerr image; its writable paths outside the mounted volumes are not mapped to emptyDir volumes, and readOnlyRootFilesystem is not enabled without that (AGENTS.md).
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: maintainerr
  # SQLite: one writer at a time.
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: maintainerr
    spec:
      serviceAccountName: maintainerr
      automountServiceAccountToken: false
      runtimeClassName: gvisor
      # The image's non-root node user (UID/GID 1000).
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: maintainerr
          # Renovate tracks the image tag below.
          image: ghcr.io/maintainerr/maintainerr:3.32.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 6246
              protocol: TCP
          env:
            - name: TZ
              value: UTC
            # The weekly anonymous usage report (telemetry.maintainerr.info)
            # is on by default; the variable overrides the stored setting.
            - name: TELEMETRY
              value: "off"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          startupProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          # Overlay and poster rendering spikes memory.
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 1Gi
          volumeMounts:
            - name: data
              mountPath: /opt/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: maintainerr
        - name: tmp
          emptyDir: {}
