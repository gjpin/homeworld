# https://coder.com/docs/install/kubernetes
# https://github.com/coder/coder/tree/main/helm/coder
# https://coder.com/docs/admin/setup/configuration-reference
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: coder
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: coder
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - ServerSideApply=true
  source:
    repoURL: https://github.com/gjpin/homeworld.git
    path: apps/coder/helm
    targetRevision: HEAD
