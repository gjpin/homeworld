# The dashboard and API carry the long-lived WebSockets (web terminal,
# workspace agent coordination, the embedded DERP relay); Envoy Gateway
# passes the upgrades through.
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder
  namespace: coder
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "coder.base-domain.invalid"
  rules:
    - backendRefs:
        - name: coder
          namespace: coder
          kind: Service
          port: 80
          group: ""
          weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: coder-apps
  namespace: coder
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "*.coder.base-domain.invalid"
  rules:
    - backendRefs:
        - name: coder
          namespace: coder
          kind: Service
          port: 80
          group: ""
          weight: 1
