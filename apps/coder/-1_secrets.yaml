---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: coder
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: /coder/POSTGRES_USERNAME
        decodingStrategy: None
    - secretKey: password
      remoteRef:
        key: /coder/POSTGRES_PASSWORD
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: coder-secrets
  namespace: coder
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: coder-secrets
    template:
      engineVersion: v2
      data:
        CODER_PG_CONNECTION_URL: "postgres://{{ .postgres_user }}:{{ .postgres_pass }}@coder-rw.coder.svc.cluster.local:5432/coder?sslmode=require"
        CODER_OIDC_CLIENT_SECRET: "{{ .oidc_client_secret }}"
  data:
    - secretKey: postgres_user
      remoteRef:
        key: /coder/POSTGRES_USERNAME
        decodingStrategy: None
    - secretKey: postgres_pass
      remoteRef:
        key: /coder/POSTGRES_PASSWORD
        decodingStrategy: None
    - secretKey: oidc_client_secret
      remoteRef:
        key: /authelia/OIDC_CLIENT_SECRET_CODER
        decodingStrategy: None
