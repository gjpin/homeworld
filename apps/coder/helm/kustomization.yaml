apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: coder
    repo: https://helm.coder.com/v2
    version: 2.38.2
    releaseName: coder
    namespace: coder
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^coder$
    patch: |-
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1no-read-only-root-fs
        value: coderd's built-in provisioners download Terraform providers and modules into the home cache directory of the pinned upstream image; a read-only root filesystem would break workspace builds.
