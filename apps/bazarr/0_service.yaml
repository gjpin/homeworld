---
apiVersion: v1
kind: Service
metadata:
  name: bazarr
  namespace: bazarr
  labels:
    app.kubernetes.io/name: bazarr
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 6767
      protocol: TCP
      targetPort: http
    - name: metrics
      port: 9707
      protocol: TCP
      targetPort: metrics
  selector:
    app.kubernetes.io/name: bazarr
