---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bazarr-app
  namespace: bazarr
  labels:
    app.kubernetes.io/name: bazarr
# Token hygiene only: the app never talks to the Kubernetes API. The name
# must not collide with the CloudNativePG cluster's ServiceAccount — CNPG
# derives the instance/initdb ServiceAccount name from the cluster name
# (bazarr) and adopts an existing ServiceAccount with that name as-is, so
# an app-owned bazarr ServiceAccount without a mounted token would leave
# the cluster's initdb Job unable to reach the API.
automountServiceAccountToken: false
