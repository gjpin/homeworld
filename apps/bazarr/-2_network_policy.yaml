metadata:
  name: allow-bazarr-postgres-ingress
  namespace: bazarr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:cnpg.io/cluster: bazarr
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: bazarr
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-bazarr-postgres-metrics-ingress
  namespace: bazarr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # The handwritten PodMonitor scrapes the CloudNativePG instance metrics
  # port.
  endpointSelector:
    matchLabels:
      k8s:cnpg.io/cluster: bazarr
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-collector
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
---
