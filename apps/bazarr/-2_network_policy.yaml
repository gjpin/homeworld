---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # Subtitle providers. Only these are reachable; enabling another provider
  # in the UI needs its hosts added here:
  #   OpenSubtitles.com: api.opensubtitles.com, downloads from
  #     *.opensubtitles.com
  #   Podnapisi: www.podnapisi.net
  #   SubDL: api.subdl.com, dl.subdl.com
  #   Subsource: api.subsource.net
  #   Addic7ed: www.addic7ed.com
  #   YIFY Subtitles: yifysubtitles.ch
  #   AnimeTosho: feed.animetosho.org (anime)
  # The release check and announcements (api.github.com, cdn.jsdelivr.net,
  # raw.githubusercontent.com) have no switch and are not allowed: the
  # scheduled jobs log an error and nothing else breaks.
  name: allow-bazarr-providers
  namespace: bazarr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: bazarr
  egress:
    - toFQDNs:
        - matchName: "api.opensubtitles.com"
        - matchPattern: "*.opensubtitles.com"
        - matchName: "www.podnapisi.net"
        - matchName: "api.subdl.com"
        - matchName: "dl.subdl.com"
        - matchName: "api.subsource.net"
        - matchName: "www.addic7ed.com"
        - matchName: "yifysubtitles.ch"
        - matchName: "feed.animetosho.org"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
