---
# Gateway OIDC for the Bazarr UI: Bazarr runs without its own login
# (auth.type null in the seeded config.yaml), so Authelia is the only login
# and the route requires the platform group (docs/oidc.md). Bazarr has no
# native OIDC; its API always requires the key, and its clients (Homepage,
# exportarr) call the in-cluster Service, never this route. StrategicMerge
# keeps this policy from overriding the Gateway-level CrowdSec extAuth.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authelia-oidc
  namespace: bazarr
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: bazarr
  oidc:
    provider:
      issuer: https://auth.base-domain.invalid
      authorizationEndpoint: https://auth.base-domain.invalid/api/oidc/authorization
      tokenEndpoint: https://auth.base-domain.invalid/api/oidc/token
    clientID: envoy
    clientSecret:
      name: envoy-oidc-client-secret
    scopes:
      - openid
      - offline_access
    redirectURL: https://bazarr.base-domain.invalid/oauth2/callback
    logoutPath: /logout
    cookieDomain: bazarr.base-domain.invalid
    forwardAccessToken: false
    refreshToken: true
    passThroughAuthHeader: false
