---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bazarr
  namespace: bazarr
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: bazarr
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "bazarr.homeworld.internal"
  rules:
    - backendRefs:
        - name: bazarr
          namespace: bazarr
          kind: Service
          port: 6767
          group: ""
          weight: 1
