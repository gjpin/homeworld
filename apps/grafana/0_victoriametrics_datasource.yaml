---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoriametrics
  namespace: grafana
spec:
  uid: victoriametrics
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    name: VictoriaMetrics
    type: victoriametrics-metrics-datasource
    access: proxy
    url: http://victoria-metrics.victoria-metrics.svc.cluster.local:8428
    isDefault: true
    jsonData:
      httpMethod: POST
      # Minimum query step: every ServiceMonitor/PodMonitor in this repo
      # scrapes at 60s, so sub-60s steps would return empty windows.
      timeInterval: 60s
