---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: grafana
  namespace: grafana
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  endpoints:
    # The grafana-operator names the generated Service port "grafana"
    # (targetPort grafana-http); ServiceMonitors resolve the Service port
    # name, not the container port name.
    - port: grafana
      path: /metrics
      interval: 60s
