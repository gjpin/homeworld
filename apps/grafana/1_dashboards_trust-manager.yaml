---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: trust-manager
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderRef: folder-trust-manager
  configMapRef:
    name: grafana-dashboard-trust-manager
    key: json
