---
# Extracted from the Grafana CR's spec.httpRoute block (unset in
# 0_grafana.yaml) so the public endpoint follows the component's standard
# wave-2 HTTPRoute file. grafana-operator v5 names the Service it creates
# "{Grafana.metadata.name}-service" — grafana-service for the grafana CR —
# and it exposes grafana's HTTP port 3000.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: grafana
      sectionName: grafana-https
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "grafana.homeworld.internal"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana-service
          port: 3000
          group: ""
          kind: Service
          weight: 1
