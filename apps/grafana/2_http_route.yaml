---
# Extracted from the Grafana CR's spec.httpRoute block (unset in
# 0_grafana.yaml) so the public endpoint follows the component's standard
# wave-2 HTTPRoute file. The backend is the operator-created Service named
# after the Grafana resource, exposing grafana's HTTP port 3000.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    external-dns.alpha.kubernetes.io/hostname: "grafana.${BASE_DOMAIN}"
spec:
  parentRefs:
    - name: envoy
      namespace: grafana
      sectionName: grafana-https
  hostnames:
    - "grafana.${BASE_DOMAIN}"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana
          port: 3000
