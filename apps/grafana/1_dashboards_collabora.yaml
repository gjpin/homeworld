---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: collabora-ha-allocation
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderRef: folder-collabora
  configMapRef:
    name: grafana-dashboard-collabora-ha-allocation
    key: json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: collabora-overview
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderRef: folder-collabora
  configMapRef:
    name: grafana-dashboard-collabora-overview
    key: json
