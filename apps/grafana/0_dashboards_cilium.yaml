---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cilium-agent
  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderRef: folder-cilium
  configMapRef:
    name: grafana-dashboard-cilium-agent
    key: json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cilium-operator
  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderRef: folder-cilium
  configMapRef:
    name: grafana-dashboard-cilium-operator
    key: json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: hubble
  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderRef: folder-cilium
  configMapRef:
    name: grafana-dashboard-hubble
    key: json
