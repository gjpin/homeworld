---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: grafana
  labels:
    app.kubernetes.io/name: grafana
    dashboards: grafana
spec:
  version: docker.io/grafana/grafana:13.3.0
  disableDefaultAdminSecret: true
  config:
    server:
      root_url: "https://grafana.homeworld.internal"
    analytics:
      reporting_enabled: "false"
      check_for_updates: "false"
      check_for_plugin_updates: "false"
    plugins:
      # Grafana 13 preinstall tries to upgrade bundled elasticsearch under
      # read-only /usr/share/grafana/data/plugins-bundled.
      plugin_admin_enabled: "false"
      preinstall_disabled: "true"
      # public_key_retrieval_disabled stays at its default (false): plugin
      # signature verification needs the signing keys from grafana.com.
    auth:
      disable_login_form: "true"
    auth.basic:
      # The Grafana Operator provisions datasources/dashboards through the
      # HTTP API with basic auth; disabling it breaks reconciliation
      # (401 on /api/login/ping). The login form stays hidden via
      # disable_login_form + OIDC auto_login above.
      enabled: "true"
    auth.generic_oauth:
      enabled: "true"
      auto_login: "true"
      name: Authelia
      client_id: grafana
      scopes: "openid profile email groups"
      auth_url: "https://auth.homeworld.internal/api/oidc/authorization"
      token_url: "https://auth.homeworld.internal/api/oidc/token"
      api_url: "https://auth.homeworld.internal/api/oidc/userinfo"
      use_pkce: "true"
      auth_style: "InHeader"
      allow_sign_up: "true"
      login_attribute_path: preferred_username
      name_attribute_path: name
      email_attribute_path: email
      groups_attribute_path: groups
      role_attribute_path: "contains(groups[*], 'grafana-admin') && 'GrafanaAdmin' || 'Viewer'"
      allow_assign_grafana_admin: "true"
      skip_org_role_sync: "false"
      # Authelia's certificate is signed by the homeworld CA (ConfigMap
      # published by trust-manager, mounted below).
      tls_client_ca: /etc/homeworld-ca/ca.crt
  # grafana-operator v5.25 creates the claim from this spec but never wires
  # it into the pod (its deployment template hard-codes an emptyDir data
  # volume), so the deployment override below mounts <cr-name>-pvc at
  # /var/lib/grafana explicitly. The CRD's persistentVolumeClaim.metadata
  # subset only declares annotations/labels — a metadata.name here is
  # rejected at admission and takes the whole Grafana CR down with it.
  persistentVolumeClaim:
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn-crypto
      resources:
        requests:
          storage: 1Gi
  service:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          runtimeClassName: gvisor
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: victoria-plugins-loader
              image: docker.io/library/alpine:3.24.3
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -ec
                - |
                  # Renovate tracks both plugin versions below (github-releases).
                  # When bumping a version, refresh the sha256 from the release assets page.
                  wget -O /var/lib/grafana/plugins/vm-metrics.tar.gz \
                    https://github.com/VictoriaMetrics/victoriametrics-datasource/releases/download/v0.26.1/victoriametrics-metrics-datasource-v0.26.1.tar.gz
                  echo '682363839837b6fbed3a9a79a7c84228b43cec46cabacd1380bc695ec25adda4  /var/lib/grafana/plugins/vm-metrics.tar.gz' | sha256sum -c -
                  tar -xzf /var/lib/grafana/plugins/vm-metrics.tar.gz -C /var/lib/grafana/plugins
                  rm /var/lib/grafana/plugins/vm-metrics.tar.gz

                  wget -O /var/lib/grafana/plugins/vm-logs.tar.gz \
                    https://github.com/VictoriaMetrics/victorialogs-datasource/releases/download/v0.33.1/victoriametrics-logs-datasource-v0.33.1.tar.gz
                  echo '849edf4d86a6555bbf3fdbe1c53ed719a6c51c3d69965dcc0384e2c129ad991a  /var/lib/grafana/plugins/vm-logs.tar.gz' | sha256sum -c -
                  tar -xzf /var/lib/grafana/plugins/vm-logs.tar.gz -C /var/lib/grafana/plugins
                  rm /var/lib/grafana/plugins/vm-logs.tar.gz
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsGroup: 1000
                runAsNonRoot: true
                runAsUser: 1000
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                  ephemeral-storage: 64Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
                  ephemeral-storage: 2Gi
              volumeMounts:
                - name: victoria-plugins
                  mountPath: /var/lib/grafana/plugins
          containers:
            - name: grafana
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                  ephemeral-storage: 64Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
                  ephemeral-storage: 2Gi
              volumeMounts:
                # mountPath-keyed merge: replaces the operator's generated
                # grafana-data mount for /var/lib/grafana with the PVC.
                - name: grafana-storage
                  mountPath: /var/lib/grafana
                - name: victoria-plugins
                  mountPath: /var/lib/grafana/plugins
                - name: homeworld-ca
                  mountPath: /etc/homeworld-ca
                  readOnly: true
              env:
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin
                      key: GF_SECURITY_ADMIN_USER
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin
                      key: GF_SECURITY_ADMIN_PASSWORD
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oidc
                      key: clientSecret
          volumes:
            # grafana-operator v5.25 never mounts the claim it creates from
            # spec.persistentVolumeClaim (its generated data volume is an
            # emptyDir), so mount <cr-name>-pvc here: the volumeMounts merge
            # is keyed by mountPath, and this entry replaces the generated
            # grafana-data mount at /var/lib/grafana while the generated
            # grafana-data emptyDir stays defined but unused. The pod-level
            # fsGroup grants the grafana container (supplemental group 1000)
            # write access to the volume.
            - name: grafana-storage
              persistentVolumeClaim:
                claimName: grafana-pvc
            - name: victoria-plugins
              emptyDir: {}
            - name: homeworld-ca
              configMap:
                name: homeworld-ca
  # The public HTTPRoute is hand-written in 2_http_route.yaml (standard
  # wave-2 file); the operator's spec.httpRoute generation stays unset.
