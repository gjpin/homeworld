---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: grafana
  labels:
    app.kubernetes.io/name: grafana
    dashboards: grafana
spec:
  version: docker.io/grafana/grafana:13.2.3
  disableDefaultAdminSecret: true
  config:
    server:
      root_url: "https://grafana.${BASE_DOMAIN}"
    analytics:
      reporting_enabled: "false"
      check_for_updates: "false"
      check_for_plugin_updates: "false"
    plugins:
      # Grafana 13 preinstall tries to upgrade bundled elasticsearch under
      # read-only /usr/share/grafana/data/plugins-bundled.
      plugin_admin_enabled: "false"
      preinstall_disabled: "true"
    auth:
      disable_login_form: "true"
    auth.basic:
      # The Grafana Operator provisions datasources/dashboards through the
      # HTTP API with basic auth; disabling it breaks reconciliation
      # (401 on /api/login/ping). The login form stays hidden via
      # disable_login_form + OIDC auto_login above.
      enabled: "true"
    auth.generic_oauth:
      enabled: "true"
      auto_login: "true"
      name: Authelia
      client_id: grafana
      scopes: "openid profile email groups"
      auth_url: "https://auth.${BASE_DOMAIN}/api/oidc/authorization"
      token_url: "https://auth.${BASE_DOMAIN}/api/oidc/token"
      api_url: "https://auth.${BASE_DOMAIN}/api/oidc/userinfo"
      use_pkce: "true"
      auth_style: "InHeader"
      allow_sign_up: "true"
      login_attribute_path: preferred_username
      name_attribute_path: name
      email_attribute_path: email
      groups_attribute_path: groups
      role_attribute_path: "contains(groups[*], 'grafana-admin') && 'GrafanaAdmin' || 'Viewer'"
      allow_assign_grafana_admin: "true"
      skip_org_role_sync: "false"
  persistentVolumeClaim:
    metadata:
      name: grafana-pvc
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn-crypto
      resources:
        requests:
          storage: 10Gi
  service:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          hostUsers: false
          runtimeClassName: gvisor
          automountServiceAccountToken: false
          nodeSelector:
            node-role.kubernetes.io/homelab: homelab
          securityContext:
            fsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: victoria-plugins-loader
              image: docker.io/library/alpine:3.24.2
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -ec
                - |
                  # Renovate tracks both plugin versions below (github-releases).
                  # When bumping a version, refresh the sha256 from the release assets page.
                  wget -O /var/lib/grafana/plugins/vm-metrics.tar.gz \
                    https://github.com/VictoriaMetrics/victoriametrics-datasource/releases/download/v0.26.1/victoriametrics-metrics-datasource-v0.26.1.tar.gz
                  echo '682363839837b6fbed3a9a79a7c84228b43cec46cabacd1380bc695ec25adda4  /var/lib/grafana/plugins/vm-metrics.tar.gz' | sha256sum -c -
                  tar -xzf /var/lib/grafana/plugins/vm-metrics.tar.gz -C /var/lib/grafana/plugins
                  rm /var/lib/grafana/plugins/vm-metrics.tar.gz

                  wget -O /var/lib/grafana/plugins/vm-logs.tar.gz \
                    https://github.com/VictoriaMetrics/victorialogs-datasource/releases/download/v0.32.0/victoriametrics-logs-datasource-v0.32.0.tar.gz
                  echo 'e100b767f19cd614ac8ac3860458a3fb33f5aa7a876e924d0340010e40d1c0d4  /var/lib/grafana/plugins/vm-logs.tar.gz' | sha256sum -c -
                  tar -xzf /var/lib/grafana/plugins/vm-logs.tar.gz -C /var/lib/grafana/plugins
                  rm /var/lib/grafana/plugins/vm-logs.tar.gz
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsGroup: 1000
                runAsNonRoot: true
                runAsUser: 1000
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                  ephemeral-storage: 64Mi
                limits:
                  cpu: "1"
                  memory: 2Gi
                  ephemeral-storage: 2Gi
              volumeMounts:
                - name: victoria-plugins
                  mountPath: /var/lib/grafana/plugins
          containers:
            - name: grafana
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                  ephemeral-storage: 64Mi
                limits:
                  cpu: "2"
                  memory: 2Gi
                  ephemeral-storage: 2Gi
              volumeMounts:
                - name: victoria-plugins
                  mountPath: /var/lib/grafana/plugins
              env:
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin
                      key: GF_SECURITY_ADMIN_USER
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin
                      key: GF_SECURITY_ADMIN_PASSWORD
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oidc
                      key: clientSecret
          volumes:
            - name: victoria-plugins
              emptyDir: {}
  # The public HTTPRoute is hand-written in 2_http_route.yaml (standard
  # wave-2 file); the operator's spec.httpRoute generation stays unset.
