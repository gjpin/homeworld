---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: affine
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderRef: folder-affine
  configMapRef:
    name: grafana-dashboard-affine
    key: json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: affine-manticore
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderRef: folder-affine
  configMapRef:
    name: grafana-dashboard-affine-manticore
    key: json
