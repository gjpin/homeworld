---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: external-secrets
  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderRef: folder-external-secrets
  configMapRef:
    name: grafana-dashboard-external-secrets
    key: json
