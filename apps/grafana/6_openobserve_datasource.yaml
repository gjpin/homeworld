---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: openobserve
  namespace: grafana
spec:
  uid: openobserve
  valuesFrom:
    - targetPath: basicAuthUser
      valueFrom:
        secretKeyRef:
          name: openobserve
          key: ZO_ROOT_USER_EMAIL
    - targetPath: secureJsonData.basicAuthPassword
      valueFrom:
        secretKeyRef:
          name: openobserve
          key: ZO_ROOT_USER_PASSWORD
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    name: openobserve
    type: openobserve
    access: proxy
    url: http://openobserve.openobserve.svc.cluster.local:5080
    basicAuth: true
    basicAuthUser: ${ZO_ROOT_USER_EMAIL}
    secureJsonData:
      basicAuthPassword: ${ZO_ROOT_USER_PASSWORD}
    isDefault: true
