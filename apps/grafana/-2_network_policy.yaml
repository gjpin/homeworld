---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # One service per rule: Cilium applies toPorts to every toServices entry,
  # so a combined rule would over-permit cross-port access.
  name: allow-grafana-victoria-metrics
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: grafana
  egress:
    - toServices:
        - k8sService:
            serviceName: victoria-metrics
            namespace: victoria-metrics
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # One service per rule: Cilium applies toPorts to every toServices entry,
  # so a combined rule would over-permit cross-port access.
  name: allow-grafana-victoria-logs
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: grafana
  egress:
    - toServices:
        - k8sService:
            serviceName: victoria-logs
            namespace: victoria-metrics
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # One service per rule: Cilium applies toPorts to every toServices entry,
  # so a combined rule would over-permit cross-port access.
  name: allow-grafana-victoria-traces
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: grafana
  egress:
    - toServices:
        - k8sService:
            serviceName: victoria-traces
            namespace: victoria-metrics
      toPorts:
        - ports:
            - port: "10428"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-grafana-plugin-loader
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # The victoria-plugins-loader init container downloads both pinned
  # VictoriaMetrics plugin archives and verifies their checksums before
  # installation.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: grafana
  egress:
    - toFQDNs:
        - matchName: github.com
        - matchName: release-assets.githubusercontent.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-grafana-gateway
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: grafana
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gatewayclass: envoy-merged
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-grafana-authelia
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: grafana
  egress:
    # auth.base-domain.invalid through envoy-node-access (docs/network-policies.md).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gatewayclass: envoy-merged
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-grafana-metrics-ingress
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # The ServiceMonitor scrapes the grafana-http port; the scrape path
  # originates from the OpenTelemetry collector pod.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: grafana
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-collector
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # The grafana-operator reconciles GrafanaDatasource/GrafanaDashboard CRs
  # against the Grafana API over basic auth (kept on deliberately — see
  # docs/oidc.md); without this path no datasource or dashboard ever
  # reconciles.
  name: allow-grafana-operator-ingress
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: grafana
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: grafana-operator
            k8s:app.kubernetes.io/instance: grafana-operator
            k8s:app.kubernetes.io/name: grafana-operator
            k8s:app.kubernetes.io/component: operator
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
