---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: grafana
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: grafana-admin
  data:
    - secretKey: GF_SECURITY_ADMIN_USER
      remoteRef:
        key: /grafana/GF_SECURITY_ADMIN_USER
        decodingStrategy: Auto
    - secretKey: GF_SECURITY_ADMIN_PASSWORD
      remoteRef:
        key: /grafana/GF_SECURITY_ADMIN_PASSWORD
        decodingStrategy: Auto
