---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDatasource
metadata:
  name: victoriatraces-jaeger
  namespace: grafana
spec:
  uid: victoriatraces-jaeger
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasource:
    name: VictoriaTraces-Jaeger
    type: jaeger
    access: proxy
    url: http://victoria-traces.victoria-metrics.svc.cluster.local:10428/select/jaeger
    isDefault: false
