# https://grafana.github.io/grafana-operator/docs/examples/grafana/credential_secret/
# https://grafana.github.io/grafana-operator/docs/examples/grafana/persistent_volume/
# https://grafana.github.io/grafana-operator/docs/examples/grafana/httproute/
---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: grafana
  labels:
    app.kubernetes.io/name: grafana
    dashboards: grafana
spec:
  version: docker.io/grafana/grafana:13.0.1-security-01
  disableDefaultAdminSecret: true
  config:
    server:
      root_url: "https://grafana.${BASE_DOMAIN}"
  persistentVolumeClaim:
    metadata:
      name: grafana-pvc
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn-crypto
      resources:
        requests:
          storage: 10Gi
  service:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          nodeSelector:
            node-role.kubernetes.io/homelab: homelab
          containers:
            - name: grafana
              env:
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin
                      key: GF_SECURITY_ADMIN_USER
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin
                      key: GF_SECURITY_ADMIN_PASSWORD
  httpRoute:
    metadata:
      annotations:
        external-dns.alpha.kubernetes.io/hostname: "grafana.${BASE_DOMAIN}"
    spec:
      parentRefs:
        - name: envoy
          namespace: grafana
          sectionName: grafana-https
      hostnames:
        - "grafana.${BASE_DOMAIN}"
