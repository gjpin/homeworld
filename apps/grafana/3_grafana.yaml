---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: grafana
  labels:
    app.kubernetes.io/name: grafana
    dashboards: grafana
spec:
  version: docker.io/grafana/grafana:13.0.1-security-01
  disableDefaultAdminSecret: true
  config:
    server:
      root_url: "https://grafana.${BASE_DOMAIN}"
    plugins:
      allow_loading_unsigned_plugins: openobserve
  persistentVolumeClaim:
    metadata:
      name: grafana-pvc
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn-crypto
      resources:
        requests:
          storage: 10Gi
  service:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          hostUsers: false
          nodeSelector:
            node-role.kubernetes.io/homelab: homelab
          securityContext:
            fsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: openobserve-plugin-loader
              image: alpine:3.21.3
              command:
                - sh
                - -ec
                - |
                  wget -O /var/lib/grafana/plugins/zo_gp.tar.gz https://zincsearch-releases.s3.us-west-2.amazonaws.com/zo_gp/zo_gp.tar.gz
                  echo '85e7542749e17a437b84547215b63e73286570ad917b0b472de47e5398dee5d1  /var/lib/grafana/plugins/zo_gp.tar.gz' | sha256sum -c -
                  tar -xzf /var/lib/grafana/plugins/zo_gp.tar.gz -C /var/lib/grafana/plugins
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsGroup: 1000
                runAsNonRoot: true
                runAsUser: 1000
              volumeMounts:
                - name: openobserve-plugin
                  mountPath: /var/lib/grafana/plugins
          containers:
            - name: grafana
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
              volumeMounts:
                - name: openobserve-plugin
                  mountPath: /var/lib/grafana/plugins
              env:
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin
                      key: GF_SECURITY_ADMIN_USER
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin
                      key: GF_SECURITY_ADMIN_PASSWORD
          volumes:
            - name: openobserve-plugin
              emptyDir: {}
  httpRoute:
    metadata:
      annotations:
        external-dns.alpha.kubernetes.io/hostname: "grafana.${BASE_DOMAIN}"
    spec:
      parentRefs:
        - name: envoy
          namespace: grafana
          sectionName: grafana-https
      hostnames:
        - "grafana.${BASE_DOMAIN}"
