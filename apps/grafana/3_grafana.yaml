---
apiVersion: grafana.integreatly.org/v1beta1
kind: Grafana
metadata:
  name: grafana
  namespace: grafana
  labels:
    app.kubernetes.io/name: grafana
    dashboards: grafana
spec:
  version: docker.io/grafana/grafana:13.0.1-security-01
  disableDefaultAdminSecret: true
  config:
    server:
      root_url: "https://grafana.${BASE_DOMAIN}"
    plugins:
      allow_loading_unsigned_plugins: openobserve
      # Grafana 13 preinstall tries to upgrade bundled elasticsearch under
      # read-only /usr/share/grafana/data/plugins-bundled.
      plugin_admin_enabled: "false"
      preinstall_disabled: "true"
    auth:
      disable_login_form: "true"
      oauth_auto_login: "true"
    auth.basic:
      enabled: "false"
    auth.generic_oauth:
      enabled: "true"
      name: Authelia
      client_id: grafana
      scopes: "openid profile email groups"
      auth_url: "https://auth.${BASE_DOMAIN}/api/oidc/authorization"
      token_url: "https://auth.${BASE_DOMAIN}/api/oidc/token"
      api_url: "https://auth.${BASE_DOMAIN}/api/oidc/userinfo"
      use_pkce: "true"
      allow_sign_up: "true"
      login_attribute_path: preferred_username
      name_attribute_path: name
      email_attribute_path: email
      groups_attribute_path: groups
      role_attribute_path: "contains(groups[*], 'grafana-admin') && 'GrafanaAdmin' || 'Viewer'"
      allow_assign_grafana_admin: "true"
      skip_org_role_sync: "false"
  persistentVolumeClaim:
    metadata:
      name: grafana-pvc
    spec:
      accessModes:
        - ReadWriteOnce
      storageClassName: longhorn-crypto
      resources:
        requests:
          storage: 10Gi
  service:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
  deployment:
    spec:
      strategy:
        type: Recreate
      template:
        spec:
          hostUsers: false
          nodeSelector:
            node-role.kubernetes.io/homelab: homelab
          securityContext:
            fsGroup: 1000
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: openobserve-plugin-loader
              image: alpine:3.21.3
              imagePullPolicy: IfNotPresent
              command:
                - sh
                - -ec
                - |
                  wget -O /var/lib/grafana/plugins/zo_gp.tar.gz https://zincsearch-releases.s3.us-west-2.amazonaws.com/zo_gp/zo_gp.tar.gz
                  echo '85e7542749e17a437b84547215b63e73286570ad917b0b472de47e5398dee5d1  /var/lib/grafana/plugins/zo_gp.tar.gz' | sha256sum -c -
                  tar -xzf /var/lib/grafana/plugins/zo_gp.tar.gz -C /var/lib/grafana/plugins
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsGroup: 1000
                runAsNonRoot: true
                runAsUser: 1000
              volumeMounts:
                - name: openobserve-plugin
                  mountPath: /var/lib/grafana/plugins
          containers:
            - name: grafana
              imagePullPolicy: IfNotPresent
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                runAsNonRoot: true
              volumeMounts:
                - name: openobserve-plugin
                  mountPath: /var/lib/grafana/plugins
              env:
                - name: GF_SECURITY_ADMIN_USER
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin
                      key: GF_SECURITY_ADMIN_USER
                - name: GF_SECURITY_ADMIN_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: grafana-admin
                      key: GF_SECURITY_ADMIN_PASSWORD
                - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
                  valueFrom:
                    secretKeyRef:
                      name: grafana-oidc
                      key: clientSecret
          volumes:
            - name: openobserve-plugin
              emptyDir: {}
  httpRoute:
    metadata:
      annotations:
        external-dns.alpha.kubernetes.io/hostname: "grafana.${BASE_DOMAIN}"
    spec:
      parentRefs:
        - name: envoy
          namespace: grafana
          sectionName: grafana-https
      hostnames:
        - "grafana.${BASE_DOMAIN}"
