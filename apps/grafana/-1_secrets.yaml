---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: grafana-admin
  data:
    - secretKey: GF_SECURITY_ADMIN_USER
      remoteRef:
        key: /grafana/GF_SECURITY_ADMIN_USER
        decodingStrategy: None
    - secretKey: GF_SECURITY_ADMIN_PASSWORD
      remoteRef:
        key: /grafana/GF_SECURITY_ADMIN_PASSWORD
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: grafana-oidc
  data:
    - secretKey: clientSecret
      remoteRef:
        key: /authelia/OIDC_CLIENT_SECRET_GRAFANA
        decodingStrategy: None
