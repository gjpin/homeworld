---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: crowdsec-overview
  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderRef: folder-crowdsec
  configMapRef:
    name: grafana-dashboard-crowdsec-overview
    key: json
---
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: lapi-metrics
  namespace: grafana
spec:
  instanceSelector:
    matchLabels:
      dashboards: grafana
  folderRef: folder-crowdsec
  configMapRef:
    name: grafana-dashboard-lapi-metrics
    key: json
