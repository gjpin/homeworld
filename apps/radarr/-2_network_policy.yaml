---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-radarr-prowlarr
  namespace: radarr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # Torznab searches through the Prowlarr indexer proxies.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: radarr
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: prowlarr
            k8s:app.kubernetes.io/name: prowlarr
      toPorts:
        - ports:
            - port: "9696"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-radarr-qbittorrent
  namespace: radarr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # Download client.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: radarr
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: qbittorrent
            k8s:app.kubernetes.io/name: qbittorrent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-radarr-jellyfin
  namespace: radarr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # Library refresh (Connect > Emby / Jellyfin).
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: radarr
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: jellyfin
            k8s:app.kubernetes.io/name: jellyfin
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-radarr-metadata
  namespace: radarr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # Metadata and artwork:
  #   api.radarr.video: movie metadata proxy
  #   api.themoviedb.org: TMDb lists and lookups
  #   image.tmdb.org: posters and fan art
  # Indexers are reached through Prowlarr; the Servarr update and Sentry
  # endpoints (*.servarr.com, sentry.*) are not allowed.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: radarr
  egress:
    - toFQDNs:
        - matchName: "api.radarr.video"
        - matchName: "api.themoviedb.org"
        - matchName: "image.tmdb.org"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
