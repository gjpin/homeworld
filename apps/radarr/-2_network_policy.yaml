---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: radarr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  ingress: []
  egress: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns
  namespace: radarr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-radarr-gateway
  namespace: radarr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: radarr
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gatewayclass: envoy-merged
      toPorts:
        - ports:
            - port: "7878"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-radarr-clients
  namespace: radarr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # In-cluster API clients, each with Radarr's API key. With
  # Authentication Method External the web UI hands the API key to anyone
  # who loads it, so ingress stays limited to Envoy (behind the gateway
  # OIDC) and these named clients:
  # prowlarr: indexer sync.
  # seerr: movie requests.
  # bazarr: movie sync.
  # recyclarr: TRaSH quality profile sync.
  # cleanuparr: queue cleaning and malware blocking.
  # houndarr: missing searches.
  # maintainerr: library cleanup.
  # homepage: service widget.
  # media-config: download client, root folder, Jellyfin connection and
  #   delay profile; the quality profile ids for Seerr's servers.
  # unpackerr: queue polling for packed downloads.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: radarr
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: prowlarr
            k8s:app.kubernetes.io/name: prowlarr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: seerr
            k8s:app.kubernetes.io/name: seerr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: bazarr
            k8s:app.kubernetes.io/name: bazarr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: recyclarr
            k8s:app.kubernetes.io/name: recyclarr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cleanuparr
            k8s:app.kubernetes.io/name: cleanuparr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: houndarr
            k8s:app.kubernetes.io/name: houndarr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: maintainerr
            k8s:app.kubernetes.io/name: maintainerr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: homepage
            k8s:app.kubernetes.io/name: homepage
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media-config
            k8s:app.kubernetes.io/name: media-config
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: unpackerr
            k8s:app.kubernetes.io/name: unpackerr
      toPorts:
        - ports:
            - port: "7878"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-radarr-metrics
  namespace: radarr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # The ServiceMonitor scrapes the exportarr sidecar.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: radarr
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-collector
      toPorts:
        - ports:
            - port: "9707"
              protocol: TCP
---
apiVersion: cilium.io/v2
