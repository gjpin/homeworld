  namespace: radarr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: radarr
  egress:
    - toServices:
        - k8sService:
            serviceName: radarr-rw
            namespace: radarr
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
