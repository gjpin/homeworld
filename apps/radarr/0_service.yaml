---
apiVersion: v1
kind: Service
metadata:
  name: radarr
  namespace: radarr
  labels:
    app.kubernetes.io/name: radarr
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 7878
      protocol: TCP
      targetPort: http
    - name: metrics
      port: 9707
      protocol: TCP
      targetPort: metrics
  selector:
    app.kubernetes.io/name: radarr
