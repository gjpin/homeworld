---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: radarr-app
  namespace: radarr
  labels:
    app.kubernetes.io/name: radarr
# Token hygiene only: the app never talks to the Kubernetes API. The name
# must not collide with the CloudNativePG cluster's ServiceAccount — CNPG
# derives the instance/initdb ServiceAccount name from the cluster name
# (radarr) and adopts an existing ServiceAccount with that name as-is, so
# an app-owned radarr ServiceAccount without a mounted token would leave
# the cluster's initdb Job unable to reach the API.
automountServiceAccountToken: false
