---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radarr
  namespace: radarr
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: radarr
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "radarr.homeworld.internal"
  rules:
    - backendRefs:
        - name: radarr
          namespace: radarr
          kind: Service
          port: 7878
          group: ""
          weight: 1
