# exportarr serves Radarr's metrics (https://github.com/onedr0p/exportarr).
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: radarr
  namespace: radarr
  labels:
    app.kubernetes.io/name: radarr
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: radarr
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
