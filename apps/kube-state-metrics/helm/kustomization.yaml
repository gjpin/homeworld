apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: kube-state-metrics
    repo: https://prometheus-community.github.io/helm-charts
    version: 8.6.0
    releaseName: kube-state-metrics
    namespace: kube-state-metrics
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  # The chart exposes no runtimeClassName key (and its hostUsers default is
  # a chart-computed nil), so both fields are pinned with a patch to keep
  # the rendered output deterministic across Argo CD, CI, and local renders.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^kube-state-metrics$
      namespace: ^kube-state-metrics$
    patch: |-
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
