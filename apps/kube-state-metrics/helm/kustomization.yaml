apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: kube-state-metrics
    repo: https://prometheus-community.github.io/helm-charts
    version: 9.0.1
    releaseName: kube-state-metrics
    namespace: kube-state-metrics
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  # The chart exposes no runtimeClassName key, so it is set with a patch.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^kube-state-metrics$
      namespace: ^kube-state-metrics$
    patch: |-
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
