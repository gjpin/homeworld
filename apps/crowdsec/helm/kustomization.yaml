apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: crowdsec
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: crowdsec
    repo: https://crowdsecurity.github.io/helm-charts
    version: 0.24.2
    releaseName: crowdsec
    namespace: crowdsec
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  - target:
      version: v1
      kind: ^(ConfigMap|Secret|Service)$
      name: ^(acquis-configmap|appsec-acquis-config|crowdsec-appsec-configs|crowdsec-config-local|crowdsec-docker-start-script-configmap|crowdsec-lapi-secrets|crowdsec-agent-service|crowdsec-appsec-service|crowdsec-service)$
    patch: |-
      - op: add
        path: /metadata/namespace
        value: crowdsec
  - target:
      group: apps
      version: v1
      kind: ^(Deployment|DaemonSet)$
      name: ^crowdsec-(appsec|lapi|agent)$
    patch: |-
      - op: add
        path: /metadata/namespace
        value: crowdsec
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^crowdsec-lapi$
    patch: |-
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^crowdsec-appsec$
    patch: |-
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: ^crowdsec-agent$
    patch: |-
      - op: add
        path: /spec/template/spec/hostUsers
        value: true
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: ServiceMonitor
      name: ^crowdsec-service$
      namespace: crowdsec
    patch: |-
      - op: add
        path: /spec/endpoints/0/interval
        value: 60s
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: ServiceMonitor
      name: ^crowdsec-agent-service$
      namespace: crowdsec
    patch: |-
      - op: add
        path: /spec/endpoints/0/interval
        value: 60s
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: ServiceMonitor
      name: ^crowdsec-appsec-service$
      namespace: crowdsec
    patch: |-
      - op: add
        path: /spec/endpoints/0/interval
        value: 60s
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^crowdsec-(capi-register|lapi-cscli-register)-job$
    patch: |-
      # The chart ships these as plain one-shot Jobs; under Argo a completed
      # Job breaks every chart bump (spec.template is immutable, so the
      # completed Job from the first sync rejects the new image tag and the
      # sync fails). The registration work is genuinely wanted, so
      # re-annotate them as Argo CD PostSync hooks: they run after every
      # sync, once the LAPI Deployment and RBAC have applied, and both are
      # idempotent by design (they exit 0 when their credential secret
      # already exists). hook-delete-policy removes them on success so
      # they are re-created — never updated — and a failed run stays
      # visible for debugging.
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
      - op: add
        path: /spec/template/spec/securityContext
        value:
          fsGroup: 1000
          seccompProfile:
            type: RuntimeDefault
      - op: add
        path: /spec/template/spec/containers/0/resources
        value:
          requests:
            cpu: 10m
            memory: 64Mi
            ephemeral-storage: 64Mi
          limits:
            cpu: 500m
            memory: 128Mi
            ephemeral-storage: 1Gi
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
      - op: add
        path: /spec/template/spec/initContainers/0/resources
        value:
          requests:
            cpu: 10m
            memory: 16Mi
            ephemeral-storage: 16Mi
          limits:
            cpu: 100m
            memory: 64Mi
            ephemeral-storage: 256Mi
      - op: add
        path: /spec/template/spec/initContainers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
      - op: add
        path: /metadata/annotations
        value: {}
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1job-ttl-seconds-after-finished
        value: One-shot registration hook; the upstream chart leaves ttlSecondsAfterFinished unset.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1no-read-only-root-fs
        value: The pinned CrowdSec image has no non-root USER and the registration hook must write its generated credentials; seccomp, dropped capabilities, and no privilege escalation remain enabled.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1run-as-non-root
        value: The pinned CrowdSec image has no non-root USER and the registration hook runs with the preserved root context to write its generated credentials; seccomp, dropped capabilities, and no privilege escalation remain enabled.
      # Argo CD PostSync hook conversion (see the comment at the top of this
      # patch): these adds must come after the annotations map reset above.
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1hook
        value: PostSync
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1hook-delete-policy
        value: HookSucceeded
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^crowdsec-appsec$
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers/0/resources/requests/ephemeral-storage
        value: 16Mi
      - op: add
        path: /spec/template/spec/initContainers/0/resources/limits/ephemeral-storage
        value: 256Mi
      - op: add
        path: /spec/template/spec/initContainers/0/resources/limits/cpu
        value: 100m
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: ^crowdsec-agent$
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers/0/resources/requests/ephemeral-storage
        value: 16Mi
      - op: add
        path: /spec/template/spec/initContainers/0/resources/limits/ephemeral-storage
        value: 256Mi
      - op: add
        path: /spec/template/spec/initContainers/0/resources/limits/cpu
        value: 100m
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^crowdsec-lapi$
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: crowdsec-lapi
        annotations:
          ignore-check.kube-linter.io/no-read-only-root-fs: The pinned CrowdSec image writes staged configuration during startup; the LAPI keeps seccomp, dropped capabilities, and no privilege escalation in the Baseline namespace.
          ignore-check.kube-linter.io/run-as-non-root: The pinned CrowdSec image has no non-root USER; the LAPI keeps seccomp, dropped capabilities, and no privilege escalation in the Baseline namespace.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^crowdsec-appsec$
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: crowdsec-appsec
        annotations:
          ignore-check.kube-linter.io/no-read-only-root-fs: The pinned CrowdSec image writes staged configuration during startup; AppSec keeps seccomp, dropped capabilities, and no privilege escalation in the Baseline namespace.
          ignore-check.kube-linter.io/run-as-non-root: The pinned CrowdSec image has no non-root USER; AppSec keeps seccomp, dropped capabilities, and no privilege escalation in the Baseline namespace.
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: ^crowdsec-agent$
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: crowdsec-agent
        annotations:
          ignore-check.kube-linter.io/no-read-only-root-fs: The pinned CrowdSec image writes staged configuration during startup and reads container logs through the chart's read-only /var/log hostPath; seccomp, dropped capabilities, and no privilege escalation remain enabled.
          ignore-check.kube-linter.io/run-as-non-root: The pinned CrowdSec image has no non-root USER; the agent keeps seccomp, dropped capabilities, and no privilege escalation in the Baseline namespace.
