---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
commonAnnotations:
  security.homeworld/profile: homelab
patches:
  - target:
      group: apps
      version: v1
      kind: ^(Deployment|StatefulSet)$
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^crowdsec-lapi$
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: crowdsec-lapi
        annotations:
          kube-score/ignore: container-security-context-user-group-id,container-security-context-readonlyrootfilesystem,pod-networkpolicy,pod-probes-identical,deployment-replicas,deployment-strategy
          security.homeworld/exception-reason: The pinned CrowdSec image has no non-root USER and writes staged configuration during startup; the LAPI keeps seccomp, dropped capabilities, and no privilege escalation while running in the Baseline namespace.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^crowdsec-appsec$
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: crowdsec-appsec
        annotations:
          kube-score/ignore: container-security-context-user-group-id,container-security-context-readonlyrootfilesystem,pod-networkpolicy,pod-probes-identical,container-image-pull-policy,deployment-replicas,deployment-strategy
          security.homeworld/exception-reason: The pinned CrowdSec image has no non-root USER and writes staged configuration during startup; AppSec keeps seccomp, dropped capabilities, and no privilege escalation while running in the Baseline namespace.
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: ^crowdsec-agent$
    patch: |-
      apiVersion: apps/v1
      kind: DaemonSet
      metadata:
        name: crowdsec-agent
        annotations:
          kube-score/ignore: container-security-context-user-group-id,container-security-context-readonlyrootfilesystem,pod-networkpolicy,pod-probes-identical,container-image-pull-policy
          security.homeworld/exception-reason: The pinned CrowdSec image has no non-root USER, and the agent additionally requires the chart's read-only /var/log hostPath; seccomp, dropped capabilities, and no privilege escalation remain enabled.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^crowdsec-lapi$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources/requests/ephemeral-storage
        value: 64Mi
      - op: add
        path: /spec/template/spec/containers/0/resources/limits/ephemeral-storage
        value: 2Gi
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^crowdsec-appsec$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources/requests/ephemeral-storage
        value: 64Mi
      - op: add
        path: /spec/template/spec/containers/0/resources/limits/ephemeral-storage
        value: 2Gi
      - op: add
        path: /spec/template/spec/initContainers/0/resources/requests/ephemeral-storage
        value: 16Mi
      - op: add
        path: /spec/template/spec/initContainers/0/resources/limits/ephemeral-storage
        value: 256Mi
      - op: add
        path: /spec/template/spec/initContainers/0/resources/limits/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: Always
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: ^crowdsec-agent$
    patch: |-
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: "The pinned CrowdSec image has no non-root USER, and the agent additionally requires the chart's read-only /var/log hostPath; seccomp, dropped capabilities, and no privilege escalation remain enabled."
      - op: add
        path: /spec/template/spec/containers/0/resources/requests/ephemeral-storage
        value: 64Mi
      - op: add
        path: /spec/template/spec/containers/0/resources/limits/ephemeral-storage
        value: 2Gi
      - op: add
        path: /spec/template/spec/initContainers/0/resources/requests/ephemeral-storage
        value: 16Mi
      - op: add
        path: /spec/template/spec/initContainers/0/resources/limits/ephemeral-storage
        value: 256Mi
      - op: add
        path: /spec/template/spec/initContainers/0/resources/limits/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: Always
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^crowdsec-(capi-register|lapi-cscli-register)-job$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
      - op: replace
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: Always
