---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: crowdsec
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      data:
        username: crowdsec
        password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: /crowdsec/DB_PASSWORD
        decodingStrategy: Auto

---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
