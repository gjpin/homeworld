  namespace: crowdsec
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: crowdsec-enrollment
    creationPolicy: Owner
    template:
      type: Opaque
  data:
