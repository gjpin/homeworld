---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: crowdsec
  namespace: crowdsec
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    cnpg.io/podPatch: '[{"op":"add","path":"/spec/hostUsers","value":false}]'
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  affinity:
    nodeSelector:
      node-role.kubernetes.io/homelab: homelab
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: 1
      memory: 1Gi
      ephemeral-storage: 2Gi
  storage:
    storageClass: longhorn-crypto
    size: 10Gi
  bootstrap:
    initdb:
      database: crowdsec
      owner: crowdsec
      secret:
        name: postgres-credentials
