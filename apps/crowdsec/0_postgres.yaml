---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: crowdsec
  namespace: crowdsec
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    cnpg.io/podPatch: '[{"op":"add","path":"/spec/hostUsers","value":false}]'
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-system-trixie
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  # Memory requests equal limits so the database is the last pod the
  # kernel or kubelet reclaims under node memory pressure (CNPG's resource
  # management guidance).
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: 1
      memory: 512Mi
      ephemeral-storage: 2Gi
  storage:
    storageClass: longhorn-crypto
    size: 10Gi
  backup:
    # Database-native volume-snapshot backups (1_scheduled_backup.yaml); the
    # cnpg-longhorn class is provisioned by apps/cloudnative-pg. Ownership by
    # the Backup CR makes pruning old Backup CRs garbage-collect their
    # snapshots (the class uses deletionPolicy: Delete).
    volumeSnapshot:
      className: cnpg-longhorn
      snapshotOwnerReference: backup
  bootstrap:
    initdb:
      database: crowdsec
      owner: crowdsec
      secret:
        name: postgres-credentials
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: crowdsec
  namespace: crowdsec
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: crowdsec
  podMetricsEndpoints:
    - port: metrics
      interval: 60s
