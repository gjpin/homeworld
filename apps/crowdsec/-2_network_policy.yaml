---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: crowdsec-lapi-ingress
  namespace: crowdsec
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:k8s-app: crowdsec
      k8s:type: lapi
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            k8s:app.kubernetes.io/name: envoy-proxy-bouncer
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:k8s-app: crowdsec
            k8s:type: agent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # The AppSec pods' wait-for-lapi init container registers them with the
    # LAPI (cscli lapi register) before the AppSec listener starts; with the
    # bouncer fail-closed, an unregistered AppSec would turn otherwise
    # allowed gateway requests into denies.
    - fromEndpoints:
        - matchLabels:
            k8s:k8s-app: crowdsec
            k8s:type: appsec
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-collector
      toPorts:
        - ports:
            - port: "6060"
              protocol: TCP
