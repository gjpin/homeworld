---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: audiobookshelf-secrets
  namespace: audiobookshelf
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: audiobookshelf-secrets
  data:
    # Signs the session and API tokens (TokenManager.js); without it the
    # server generates one and stores it in the database.
    - secretKey: JWT_SECRET_KEY
      remoteRef:
        key: /audiobookshelf/JWT_SECRET_KEY
        decodingStrategy: None
