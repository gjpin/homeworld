---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: audiobookshelf
  namespace: audiobookshelf
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "audiobookshelf.base-domain.invalid"
  rules:
    - backendRefs:
        - name: audiobookshelf
          namespace: audiobookshelf
          kind: Service
          port: 13378
          group: ""
          weight: 1
