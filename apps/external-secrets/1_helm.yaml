# https://artifacthub.io/packages/helm/external-secrets-operator/external-secrets
# https://external-secrets.io/latest/provider/infisical/
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - ServerSideApply=true

  source:
    repoURL: https://github.com/gjpin/homeworld.git
    path: apps/external-secrets/helm
    targetRevision: HEAD
    plugin:
      name: homeworld
