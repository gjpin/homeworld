apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: external-secrets
    repo: https://charts.external-secrets.io
    version: 2.4.1
    releaseName: external-secrets
    namespace: external-secrets
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^external-secrets$
      namespace: ^external-secrets$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^external-secrets-cert-controller$
      namespace: ^external-secrets$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^external-secrets-webhook$
      namespace: ^external-secrets$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      group: apps
      version: v1
      kind: ^(Deployment|StatefulSet)$
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^external-secrets$
      namespace: ^external-secrets$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^external-secrets-cert-controller$
      namespace: ^external-secrets$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^external-secrets-webhook$
      namespace: ^external-secrets$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^external-secrets$
      namespace: ^external-secrets$
    patch: |-
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: pod-networkpolicy,container-security-context-user-group-id
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^external-secrets-webhook$
      namespace: ^external-secrets$
    patch: |-
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: pod-probes,pod-networkpolicy,container-security-context-user-group-id,deployment-replicas
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^external-secrets-cert-controller$
      namespace: ^external-secrets$
    patch: |-
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: pod-networkpolicy,container-security-context-user-group-id
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
