nameOverride: "external-secrets"
fullnameOverride: "external-secrets"
serviceAccount:
  name: "external-secrets"

image:
  pullPolicy: IfNotPresent

# Prefer the chart-native key over a kustomize patch (AGENTS.md).
runtimeClassName: gvisor

resources:
  requests:
    cpu: 10m
    memory: 64Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: "1"
    memory: 2Gi
    ephemeral-storage: 2Gi

serviceMonitor:
  enabled: true
  interval: 60s
  renderMode: alwaysRender

webhook:
  runtimeClassName: gvisor
  image:
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 2Gi

certController:
  runtimeClassName: gvisor
  image:
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 2Gi
