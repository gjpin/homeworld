nameOverride: "external-secrets"
fullnameOverride: "external-secrets"
serviceAccount:
  name: "external-secrets"
global:
  nodeSelector:
    node-role.kubernetes.io/homelab: homelab

image:
  pullPolicy: IfNotPresent

hostUsers: false

resources:
  requests:
    cpu: 10m
    memory: 64Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: "1"
    memory: 2Gi
    ephemeral-storage: 2Gi

serviceMonitor:
  enabled: true
  interval: 60s
  renderMode: alwaysRender

webhook:
  hostUsers: false
  image:
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 2Gi

certController:
  hostUsers: false
  image:
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 2Gi
