---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: radicale
  namespace: radicale
  labels:
    app.kubernetes.io/name: radicale
    app.kubernetes.io/component: dav-server
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: radicale
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: radicale
        app.kubernetes.io/component: dav-server
    spec:
      serviceAccountName: radicale
      automountServiceAccountToken: false
      runtimeClassName: gvisor
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: radicale
          image: docker.io/opencloudeu/radicale:v3.8.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 5232
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: radicale-config
              mountPath: /etc/radicale/config
              subPath: config
              readOnly: true
            - name: radicale
              mountPath: /var/lib/radicale
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: radicale-config
          configMap:
            name: radicale-config
        - name: radicale
          persistentVolumeClaim:
            claimName: radicale
        - name: tmp
          emptyDir: {}
