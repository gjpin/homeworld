---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: radicale
  namespace: radicale
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "contacts.${BASE_DOMAIN}"
spec:
  parentRefs:
    - name: envoy
      namespace: radicale
  hostnames:
    - "radicale.${BASE_DOMAIN}"
  rules:
    - backendRefs:
      - name: radicale
        namespace: radicale
        kind: Service
        port: 5232