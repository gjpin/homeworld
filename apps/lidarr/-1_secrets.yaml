---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: lidarr
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: /lidarr/POSTGRES_USERNAME
        decodingStrategy: None
    - secretKey: password
      remoteRef:
        key: /lidarr/POSTGRES_PASSWORD
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lidarr-secrets
  namespace: lidarr
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: lidarr-secrets
  data:
    # Fixed API key (LIDARR__AUTH__APIKEY overrides config.xml), shared
    # with exportarr and the in-cluster clients through their own
    # ExternalSecrets.
    - secretKey: apiKey
      remoteRef:
        key: /lidarr/API_KEY
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: envoy-oidc-client-secret
  namespace: lidarr
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: envoy-oidc-client-secret
  data:
    # Client secret for the shared Authelia "envoy" OIDC client; consumed by
    # the HTTPRoute-scoped SecurityPolicy (docs/oidc.md). Envoy Gateway
    # requires the "client-secret" key.
    - secretKey: client-secret
      remoteRef:
        key: /authelia/OIDC_CLIENT_SECRET_ENVOY
        decodingStrategy: None
