# exportarr serves Lidarr's metrics (https://github.com/onedr0p/exportarr).
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: lidarr
  namespace: lidarr
  labels:
    app.kubernetes.io/name: lidarr
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: lidarr
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
