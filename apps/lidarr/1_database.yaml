# https://cloudnative-pg.io/docs/1.28/declarative_database_management/
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: lidarr-log
  namespace: lidarr
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  name: lidarr-log
  owner: lidarr
  databaseReclaimPolicy: retain
  cluster:
    name: lidarr
