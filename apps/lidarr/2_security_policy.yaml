---
# Gateway OIDC for the Lidarr UI: Lidarr runs with Authentication Method
# External, so Authelia is the only login and the route requires the
# platform group (docs/oidc.md). API clients (the other *arrs, Homepage,
# exportarr) call the in-cluster Service and never pass through this route;
# mobile apps on the public hostname cannot complete the OIDC redirect.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authelia-oidc
  namespace: lidarr
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: lidarr
  oidc:
    provider:
      issuer: https://auth.base-domain.invalid
      authorizationEndpoint: https://auth.base-domain.invalid/api/oidc/authorization
      tokenEndpoint: https://auth.base-domain.invalid/api/oidc/token
    clientID: envoy
    clientSecret:
      name: envoy-oidc-client-secret
    scopes:
      - openid
      - offline_access
    redirectURL: https://lidarr.base-domain.invalid/oauth2/callback
    logoutPath: /logout
    cookieDomain: lidarr.base-domain.invalid
    forwardAccessToken: false
    refreshToken: true
    passThroughAuthHeader: false
