---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lidarr
  namespace: lidarr
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "lidarr.base-domain.invalid"
  rules:
    - backendRefs:
        - name: lidarr
          namespace: lidarr
          kind: Service
          port: 8686
          group: ""
          weight: 1
