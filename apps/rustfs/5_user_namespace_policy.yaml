# RustFS Operator 0.0.5 does not expose a Tenant pod-template field or
# operator-specific Pod patch for hostUsers. Mutate only this Tenant's Pods at
# admission so the operator-owned StatefulSet remains the source of truth.
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: rustfs-user-namespaces
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
  matchConditions:
    - name: rustfs-tenant-pods
      expression: request.namespace == "rustfs"
    - name: user-namespaces-not-already-enabled
      expression: "!has(object.spec.hostUsers) || object.spec.hostUsers"
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{spec: Object.spec{hostUsers: false}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: rustfs-user-namespaces
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  policyName: rustfs-user-namespaces
  matchResources:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
    objectSelector:
      matchLabels:
        rustfs.tenant: rustfs
