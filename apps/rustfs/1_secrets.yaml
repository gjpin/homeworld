---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-admin-credentials
  namespace: rustfs
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: rustfs-admin-credentials
  data:
    - secretKey: accesskey
      remoteRef:
        key: /rustfs/RUSTFS_ACCESS_KEY
        decodingStrategy: Auto
    - secretKey: secretkey
      remoteRef:
        key: /rustfs/RUSTFS_SECRET_KEY
        decodingStrategy: Auto
