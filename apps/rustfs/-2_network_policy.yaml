    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gatewayclass: envoy-merged
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
---
# The RustFS server pushes its metrics via OTLP/HTTP to the cluster
# collector's OTLP receiver (RUSTFS_OBS_ENDPOINT in 0_tenant.yaml; RustFS
# exposes no Prometheus scrape endpoint). The matching ingress rule lives in
# apps/otel-collector/-2_network_policy.yaml.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-rustfs-otlp-metrics
  namespace: rustfs
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:rustfs.tenant: rustfs
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-collector
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
