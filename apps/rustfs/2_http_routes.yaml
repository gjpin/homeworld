---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-s3
  namespace: rustfs
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: rustfs
      sectionName: rustfs-s3-https
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "s3.homeworld.internal"
  rules:
    - backendRefs:
      - name: rustfs-io
        namespace: rustfs
        kind: Service
        port: 9000
        group: ""
        weight: 1
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-console
  namespace: rustfs
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: rustfs
      sectionName: rustfs-console-https
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "console.rustfs.homeworld.internal"
  rules:
    - backendRefs:
      - name: rustfs-console
        namespace: rustfs
        kind: Service
        port: 9001
        group: ""
        weight: 1
