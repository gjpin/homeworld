---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: rustfs-user-namespaces
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  policyName: rustfs-user-namespaces
  matchResources:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
    objectSelector:
      matchLabels:
        rustfs.tenant: rustfs
