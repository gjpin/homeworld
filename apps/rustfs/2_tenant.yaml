# https://github.com/rustfs/operator/tree/0.0.5/examples
---
apiVersion: rustfs.com/v1alpha1
kind: Tenant
metadata:
  name: rustfs
  namespace: rustfs
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    security.homeworld/exception-reason: Pinned RustFS Operator does not emit all Restricted pod and container security fields for Tenant pods.
spec:
  image: rustfs/rustfs:1.0.0-beta.12
  imagePullPolicy: IfNotPresent
  credsSecret:
    name: rustfs-admin-credentials
  # Discovery runs once at process start. Authelia is a later sync wave, so
  # console SSO appears after this pod is restarted once Authelia is up.
  env:
    - name: RUSTFS_IDENTITY_OPENID_ENABLE
      value: "on"
    - name: RUSTFS_IDENTITY_OPENID_CONFIG_URL
      value: https://auth.${BASE_DOMAIN}
    - name: RUSTFS_IDENTITY_OPENID_CLIENT_ID
      value: rustfs
    - name: RUSTFS_IDENTITY_OPENID_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: rustfs-oidc
          key: clientSecret
    - name: RUSTFS_IDENTITY_OPENID_SCOPES
      value: openid,profile,email,groups
    - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI
      value: https://console.rustfs.${BASE_DOMAIN}/rustfs/admin/v3/oidc/callback/default
    - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC
      value: "off"
    - name: RUSTFS_IDENTITY_OPENID_GROUPS_CLAIM
      value: groups
    - name: RUSTFS_IDENTITY_OPENID_USERNAME_CLAIM
      value: preferred_username
    - name: RUSTFS_IDENTITY_OPENID_DISPLAY_NAME
      value: Authelia
    - name: RUSTFS_BROWSER_REDIRECT_URL
      value: https://console.rustfs.${BASE_DOMAIN}
  securityContext:
    fsGroup: 10001
    runAsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
  pools:
    - name: primary
      servers: 1
      persistence:
        volumesPerServer: 1
        volumeClaimTemplate:
          accessModes:
            - ReadWriteOnce
          storageClassName: longhorn-crypto
          resources:
            requests:
              storage: 50Gi
      nodeSelector:
        node-role.kubernetes.io/homelab: homelab
