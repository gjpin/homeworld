---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-s3
  namespace: rustfs
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "s3.${BASE_DOMAIN}"
spec:
  parentRefs:
    - name: envoy
      namespace: rustfs
      sectionName: rustfs-s3-https
  hostnames:
    - "s3.${BASE_DOMAIN}"
  rules:
    - backendRefs:
      - name: rustfs-io
        namespace: rustfs
        kind: Service
        port: 9000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-console
  namespace: rustfs
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "console.rustfs.${BASE_DOMAIN}"
spec:
  parentRefs:
    - name: envoy
      namespace: rustfs
      sectionName: rustfs-console-https
  hostnames:
    - "console.rustfs.${BASE_DOMAIN}"
  rules:
    - backendRefs:
      - name: rustfs-console
        namespace: rustfs
        kind: Service
        port: 9001
