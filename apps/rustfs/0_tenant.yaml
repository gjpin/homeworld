# https://github.com/rustfs/operator/tree/0.0.5/examples
---
apiVersion: rustfs.com/v1alpha1
kind: Tenant
metadata:
  name: rustfs
  namespace: rustfs
  annotations:
    security.homeworld/exception-reason: Pinned RustFS Operator does not emit all Restricted pod and container security fields for Tenant pods.
spec:
  image: docker.io/rustfs/rustfs:1.0.1
  imagePullPolicy: IfNotPresent
  credsSecret:
    name: rustfs-admin-credentials
  # Discovery runs once at process start. Authelia is a later sync wave, so
  # console SSO appears after this pod is restarted once Authelia is up.
  env:
    - name: RUSTFS_IDENTITY_OPENID_ENABLE
      value: "on"
    - name: RUSTFS_IDENTITY_OPENID_CONFIG_URL
      value: https://auth.${BASE_DOMAIN}
    - name: RUSTFS_IDENTITY_OPENID_CLIENT_ID
      value: rustfs
    - name: RUSTFS_IDENTITY_OPENID_CLIENT_SECRET
      valueFrom:
        secretKeyRef:
          name: rustfs-oidc
          key: clientSecret
    - name: RUSTFS_IDENTITY_OPENID_SCOPES
      value: openid,profile,email,groups
    - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI
      value: https://console.rustfs.${BASE_DOMAIN}/rustfs/admin/v3/oidc/callback/default
    - name: RUSTFS_IDENTITY_OPENID_REDIRECT_URI_DYNAMIC
      value: "off"
    # No role policy is set, so each groups-claim value names a RustFS
    # policy: the platform group maps to the platform policy
    # (0_user_policies.yaml), and other groups match nothing.
    - name: RUSTFS_IDENTITY_OPENID_GROUPS_CLAIM
      value: groups
    - name: RUSTFS_IDENTITY_OPENID_USERNAME_CLAIM
      value: preferred_username
    - name: RUSTFS_IDENTITY_OPENID_DISPLAY_NAME
      value: Authelia
    - name: RUSTFS_BROWSER_REDIRECT_URL
      value: https://console.rustfs.${BASE_DOMAIN}
    # RustFS exposes no Prometheus scrape endpoint (upstream ships OTLP push
    # only): push metrics to the cluster collector's OTLP/HTTP receiver, which
    # exports them to VictoriaMetrics. Traces and log export stay disabled —
    # the S3 server is not traced, and its stdout logs already flow through the
    # node collector's filelog receiver (OTLP log export is additive to
    # stdout, see docs.rustfs.com/en/operations/observability). service.name/
    # environment become resource attributes on the pushed series.
    - name: RUSTFS_OBS_ENDPOINT
      value: http://otel-collector-pod-collector.otel-collector.svc.cluster.local:4318
    - name: RUSTFS_OBS_SERVICE_NAME
      value: rustfs
    - name: RUSTFS_OBS_ENVIRONMENT
      value: homeworld
    - name: RUSTFS_OBS_TRACES_EXPORT_ENABLED
      value: "false"
    - name: RUSTFS_OBS_LOGS_EXPORT_ENABLED
      value: "false"
    # Pin the OTLP metrics export explicitly: traces and logs are pinned
    # false above, and an upstream default flip here would silently stop
    # the VictoriaMetrics pipeline for this tenant.
    - name: RUSTFS_OBS_METRICS_EXPORT_ENABLED
      value: "true"
    # The newer-release check defaults to on (upgrade checker).
    - name: RUSTFS_CHECK_UPDATE
      value: "false"
  securityContext:
    fsGroup: 10001
    runAsGroup: 10001
    runAsNonRoot: true
    runAsUser: 10001
  pools:
    - name: primary
      servers: 1
      # Requests+limits for the RustFS server container (the operator CRD
      # supports standard ResourceRequirements per pool).
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
          ephemeral-storage: 128Mi
        limits:
          cpu: "1"
          memory: 2Gi
          ephemeral-storage: 2Gi
      persistence:
        volumesPerServer: 1
        volumeClaimTemplate:
          accessModes:
            - ReadWriteOnce
          storageClassName: longhorn-crypto
          resources:
            requests:
              storage: 50Gi
  # Operator-managed provisioning (runs after the Tenant workload is Ready):
  # buckets from spec.buckets, canned policies from spec.policies, and users
  # from spec.users. Each user's credentials are read from a Secret named
  # after the user (see -1_user_secrets.yaml); policies are scoped to the
  # single bucket the application uses (see 0_user_policies.yaml).
  buckets:
    - name: notesnook-attachments
    - name: opencloud
  policies:
    - name: platform
      document:
        configMapKeyRef:
          name: rustfs-oidc-policy-platform
          key: policy.json
    - name: notesnook-readwrite
      document:
        configMapKeyRef:
          name: rustfs-user-policy-notesnook
          key: policy.json
    - name: opencloud-readwrite
      document:
        configMapKeyRef:
          name: rustfs-user-policy-opencloud
          key: policy.json
  users:
    - name: notesnook
      policies:
        - notesnook-readwrite
    - name: opencloud
      policies:
        - opencloud-readwrite
