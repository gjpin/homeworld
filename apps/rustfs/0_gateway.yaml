# TODO: each application has a gateway, which are merged into a single one till
# cert-manager supports http routes for automatic certificates
# https://gateway.envoyproxy.io/docs/tasks/security/tls-cert-manager/
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy
  namespace: rustfs
  annotations:
    cert-manager.io/cluster-issuer: homeworld-ca
spec:
  gatewayClassName: envoy-merged
  addresses:
    - type: IPAddress
      value: 192.168.8.50
  listeners:
    - name: rustfs-s3-https
      protocol: HTTPS
      port: 443
      hostname: "s3.homeworld.internal"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: rustfs-s3-tls-cert
            kind: Secret
            group: ""
    - name: rustfs-console-https
      protocol: HTTPS
      port: 443
      hostname: "console.rustfs.homeworld.internal"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: rustfs-console-tls-cert
            kind: Secret
            group: ""
