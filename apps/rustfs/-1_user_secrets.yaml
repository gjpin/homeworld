# Operator-provisioned RustFS user credentials. The RustFS Operator resolves
# each spec.users entry in 0_tenant.yaml from a Secret named after the user in
# the tenant namespace, with `accesskey`/`secretkey` keys. The values are the
# same Infisical keys the consuming applications read, so Infisical stays the
# single source of truth for each keypair.
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notesnook
  namespace: rustfs
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: notesnook
    # The rustfs.tenant label makes the operator re-reconcile the Tenant
    # when the generated credential Secret changes (rotation); unlabeled
    # user Secrets are only read at initial provisioning.
    template:
      metadata:
        labels:
          rustfs.tenant: rustfs
  data:
    - secretKey: accesskey
      remoteRef:
        key: /notesnook/RUSTFS_ACCESS_KEY
        decodingStrategy: None
    - secretKey: secretkey
      remoteRef:
        key: /notesnook/RUSTFS_SECRET_KEY
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencloud
  namespace: rustfs
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: opencloud
    # The rustfs.tenant label makes the operator re-reconcile the Tenant
    # when the generated credential Secret changes (rotation); unlabeled
    # user Secrets are only read at initial provisioning.
    template:
      metadata:
        labels:
          rustfs.tenant: rustfs
  data:
    - secretKey: accesskey
      remoteRef:
        key: /opencloud/RUSTFS_ACCESS_KEY
        decodingStrategy: None
    - secretKey: secretkey
      remoteRef:
        key: /opencloud/RUSTFS_SECRET_KEY
        decodingStrategy: None
