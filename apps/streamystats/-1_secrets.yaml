---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: streamystats
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: /streamystats/POSTGRES_USERNAME
        decodingStrategy: None
    - secretKey: password
      remoteRef:
        key: /streamystats/POSTGRES_PASSWORD
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: streamystats-secrets
  namespace: streamystats
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: streamystats-secrets
    template:
      engineVersion: v2
      type: Opaque
      data:
        # The password is embedded unescaped in the connection URL; it must
        # contain only RFC 3986 unreserved characters (see docs/secrets.md).
        DATABASE_URL: "postgresql://{{ .postgresUsername }}:{{ .postgresPassword }}@streamystats-rw.streamystats.svc.cluster.local:5432/streamystats"
        SESSION_SECRET: "{{ .sessionSecret }}"
        INTERNAL_API_KEY: "{{ .internalApiKey }}"
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: "{{ .serverActionsKey }}"
  data:
    - secretKey: postgresUsername
      remoteRef:
        key: /streamystats/POSTGRES_USERNAME
        decodingStrategy: None
    - secretKey: postgresPassword
      remoteRef:
        key: /streamystats/POSTGRES_PASSWORD
        decodingStrategy: None
    # Signs the session JWTs (HS256).
    - secretKey: sessionSecret
      remoteRef:
        key: /streamystats/SESSION_SECRET
        decodingStrategy: None
    # Authenticates the frontend and the job server to each other.
    - secretKey: internalApiKey
      remoteRef:
        key: /streamystats/INTERNAL_API_KEY
        decodingStrategy: None
    # Next.js server-action encryption; stable so sessions survive
    # redeploys.
    - secretKey: serverActionsKey
      remoteRef:
        key: /streamystats/NEXT_SERVER_ACTIONS_ENCRYPTION_KEY
        decodingStrategy: None
