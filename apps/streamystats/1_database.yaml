# https://cloudnative-pg.io/docs/1.28/declarative_database_management/
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: streamystats
  namespace: streamystats
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  name: streamystats
  owner: streamystats
  databaseReclaimPolicy: retain
  cluster:
    name: streamystats
  # The job server's migrations create the same extensions IF NOT EXISTS
  # and only warn when they cannot.
  extensions:
    - name: vector
      ensure: present
    - name: uuid-ossp
      ensure: present
    - name: pg_trgm
      ensure: present
