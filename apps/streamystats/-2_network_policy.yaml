---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: streamystats
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns
  namespace: streamystats
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-streamystats-postgres
  namespace: streamystats
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: streamystats
  egress:
    - toServices:
        - k8sService:
            serviceName: streamystats-rw
            namespace: streamystats
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-streamystats-postgres-ingress
  namespace: streamystats
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:cnpg.io/cluster: streamystats
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: streamystats
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-streamystats-postgres-metrics-ingress
  namespace: streamystats
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # The handwritten PodMonitor scrapes the CloudNativePG instance metrics
  # port.
  endpointSelector:
    matchLabels:
      k8s:cnpg.io/cluster: streamystats
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-collector
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-streamystats-gateway
  namespace: streamystats
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: streamystats
      k8s:app.kubernetes.io/component: frontend
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gatewayclass: envoy-merged
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # The frontend queues jobs on the job server; the job server's API has no
  # authentication, so nothing else may reach it.
  name: allow-streamystats-job-server
  namespace: streamystats
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: streamystats
      k8s:app.kubernetes.io/component: job-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: streamystats
            k8s:app.kubernetes.io/component: frontend
      toPorts:
        - ports:
            - port: "3005"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-streamystats-frontend-job-server-egress
  namespace: streamystats
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: streamystats
      k8s:app.kubernetes.io/component: frontend
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: streamystats
            k8s:app.kubernetes.io/component: job-server
      toPorts:
        - ports:
            - port: "3005"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # The job server notifies the frontend (NEXTJS_URL).
  name: allow-streamystats-job-server-frontend
  namespace: streamystats
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: streamystats
      k8s:app.kubernetes.io/component: frontend
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: streamystats
            k8s:app.kubernetes.io/component: job-server
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-streamystats-job-server-frontend-egress
  namespace: streamystats
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: streamystats
      k8s:app.kubernetes.io/component: job-server
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: streamystats
            k8s:app.kubernetes.io/component: frontend
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # Jellyfin: user logins (frontend) and the activity, session and library
  # syncs (job server). The only external dependency: GeoIP is offline, the
  # AI features stay unconfigured (no provider egress), and the update
  # check (api.github.com) has no switch, is not allowed, and fails closed.
  name: allow-streamystats-jellyfin
  namespace: streamystats
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: streamystats
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: jellyfin
            k8s:app.kubernetes.io/name: jellyfin
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # CloudNativePG's instance manager watches its Cluster through the API server,
  # the operator reads each instance's status port, and instances and their
  # bootstrap Jobs replicate from each other.
  name: allow-streamystats-postgres-instance
  namespace: streamystats
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:cnpg.io/cluster: streamystats
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cloudnative-pg
            k8s:app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: streamystats
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: streamystats
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
