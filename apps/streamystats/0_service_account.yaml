---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: streamystats-app
  namespace: streamystats
  labels:
    app.kubernetes.io/name: streamystats
# Token hygiene only: the app never talks to the Kubernetes API. The name
# must not collide with the CloudNativePG cluster's ServiceAccount — CNPG
# derives the instance/initdb ServiceAccount name from the cluster name
# (streamystats) and adopts an existing ServiceAccount with that name
# as-is, so an app-owned streamystats ServiceAccount without a mounted
# token would leave the cluster's initdb Job unable to reach the API.
automountServiceAccountToken: false
