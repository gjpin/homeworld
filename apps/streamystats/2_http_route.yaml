---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: streamystats
  namespace: streamystats
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: streamystats
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "streamystats.homeworld.internal"
  rules:
    # The frontend only; the job server's API has no authentication and
    # stays internal.
    - backendRefs:
        - name: streamystats
          namespace: streamystats
          kind: Service
          port: 3000
          group: ""
          weight: 1
