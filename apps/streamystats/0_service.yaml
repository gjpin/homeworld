---
apiVersion: v1
kind: Service
metadata:
  name: streamystats
  namespace: streamystats
  labels:
    app.kubernetes.io/name: streamystats
    app.kubernetes.io/component: frontend
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3000
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/name: streamystats
    app.kubernetes.io/component: frontend
---
# The job server's API has no authentication and allows any origin; only
# the frontend may reach it (-2_network_policy.yaml).
apiVersion: v1
kind: Service
metadata:
  name: streamystats-job-server
  namespace: streamystats
  labels:
    app.kubernetes.io/name: streamystats
    app.kubernetes.io/component: job-server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3005
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/name: streamystats
    app.kubernetes.io/component: job-server
