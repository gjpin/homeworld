---
# Gateway OIDC for the Envoy Gateway admin console. The envoy-gateway
# Service's 19000 admin port is published through the gateway itself at
# envoy.base-domain.invalid (3_http_route.yaml); the route requires the
# platform group (docs/oidc.md).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authelia-oidc
  namespace: envoy-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: envoy
  oidc:
    provider:
      issuer: https://auth.base-domain.invalid
      authorizationEndpoint: https://auth.base-domain.invalid/api/oidc/authorization
      tokenEndpoint: https://auth.base-domain.invalid/api/oidc/token
    clientID: envoy
    clientSecret:
      name: envoy-oidc-client-secret
    scopes:
      - openid
      - offline_access
    redirectURL: https://envoy.base-domain.invalid/oauth2/callback
    logoutPath: /logout
    cookieDomain: envoy.base-domain.invalid
    forwardAccessToken: false
    refreshToken: true
    passThroughAuthHeader: false
