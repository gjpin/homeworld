---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: crowdsec-ext-auth
  namespace: envoy-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy
  extAuth:
    failOpen: false
    # Envoy Gateway only forwards request bodies to the ext-auth service when
    # bodyToExtAuth is set; without it CrowdSec AppSec never sees request
    # bodies (in-band virtual patching) and the gap is silent — path and
    # header bans keep working.
    bodyToExtAuth:
      maxRequestBytes: 65536
    grpc:
      backendRefs:
        - group: ""
          kind: Service
          name: crowdsec-envoy-bouncer
          namespace: envoy-gateway
          port: 8080
          weight: 1
---
# Gateway OIDC for the Envoy Gateway control-plane metrics route. The
# envoy-gateway Service's 19001 metrics port is published through the
# gateway itself at envoy.${BASE_DOMAIN} (3_http_route.yaml); the route
# requires the platform group (docs/oidc.md). StrategicMerge keeps this
# policy from overriding the Gateway-level CrowdSec extAuth above.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authelia-oidc
  namespace: envoy-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: envoy
  oidc:
    provider:
      issuer: https://auth.${BASE_DOMAIN}
      authorizationEndpoint: https://auth.${BASE_DOMAIN}/api/oidc/authorization
      tokenEndpoint: https://auth.${BASE_DOMAIN}/api/oidc/token
    clientID: envoy
    clientSecret:
      name: envoy-oidc-client-secret
    scopes:
      - openid
      - offline_access
    redirectURL: https://envoy.${BASE_DOMAIN}/oauth2/callback
    logoutPath: /logout
    cookieDomain: envoy.${BASE_DOMAIN}
    forwardAccessToken: false
    refreshToken: true
    passThroughAuthHeader: false
