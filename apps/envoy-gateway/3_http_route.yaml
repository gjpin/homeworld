---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: envoy
  namespace: envoy-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    external-dns.alpha.kubernetes.io/hostname: "envoy.${BASE_DOMAIN}"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "envoy.${BASE_DOMAIN}"
  rules:
    - backendRefs:
        - name: envoy-gateway
          namespace: envoy-gateway
          kind: Service
          port: 19000
          group: ""
          weight: 1
