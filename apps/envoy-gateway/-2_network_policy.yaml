---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-envoy-authelia-oidc
  namespace: envoy-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: envoy
      k8s:gateway.envoyproxy.io/owning-gatewayclass: envoy-merged
  egress:
    # Envoy's OIDC filter calls the Authelia authorization and token
    # endpoints on auth.homeworld.internal. The name resolves to the gateway's
    # own public address, so the connection hairpins through the merged
    # listener back to the Authelia HTTPRoute (docs/network-policies.md).
    - toFQDNs:
        - matchName: "auth.homeworld.internal"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
