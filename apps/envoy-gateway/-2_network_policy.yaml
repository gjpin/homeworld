---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # Each Envoy data-plane pod is an xDS *client*: it opens the gRPC stream to
  # the controller's xDS service (envoy-gateway.envoy-gateway.svc:18000) on
  # startup and keeps it alive. The dataplane therefore needs egress to the
  # control-plane Service on 18000, and the control-plane needs the matching
  # ingress below (allow-envoy-gateway-xds-ingress).
  name: allow-envoy-xds
  namespace: envoy-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: envoy-gateway
      k8s:app.kubernetes.io/name: envoy
      k8s:gateway.envoyproxy.io/owning-gatewayclass: envoy-merged
  egress:
    - toServices:
        - k8sService:
            serviceName: envoy-gateway
            namespace: envoy-gateway
      toPorts:
        - ports:
            - port: "18000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-envoy-gateway-xds-ingress
  namespace: envoy-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/instance: envoy-gateway
      k8s:app.kubernetes.io/name: gateway-helm
      k8s:control-plane: envoy-gateway
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gatewayclass: envoy-merged
      toPorts:
        - ports:
            - port: "18000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-envoy-data-plane-ingress
  namespace: envoy-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: envoy-gateway
      k8s:app.kubernetes.io/name: envoy
      k8s:gateway.envoyproxy.io/owning-gatewayclass: envoy-merged
  ingress:
    # The merged Gateway's public listener is the only world-facing workload.
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Forgejo git-SSH TCP listener on the merged gateway.
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
    # OIDC hairpin: Envoy's own token calls to auth.homeworld.internal resolve to
    # the gateway's public address and re-enter this listener from the data
    # plane pod itself (allow-envoy-authelia-oidc egress).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gatewayclass: envoy-merged
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-collector
      toPorts:
        - ports:
            - port: "19001"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-envoy-control-plane-metrics
  namespace: envoy-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # The chart's ServiceMonitor scrapes the controller's metrics port; only
  # the OpenTelemetry collector connects to it (the Envoy data plane exposes
  # its own stats on its own 19001, scraped by the envoy-data-plane
  # PodMonitor above).
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/instance: envoy-gateway
      k8s:app.kubernetes.io/name: gateway-helm
      k8s:control-plane: envoy-gateway
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-collector
      toPorts:
        - ports:
            - port: "19001"
              protocol: TCP
---
