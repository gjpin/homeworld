apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-envoy-data-plane-ingress
  namespace: envoy-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:io.kubernetes.pod.namespace: envoy-gateway
      k8s:app.kubernetes.io/name: envoy
      k8s:gateway.envoyproxy.io/owning-gateway-name: envoy
  ingress:
    # The merged Gateway's public listener is the only world-facing workload.
    - fromEntities:
        - world
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            k8s:app.kubernetes.io/instance: envoy-gateway
            k8s:app.kubernetes.io/name: gateway-helm
            k8s:control-plane: envoy-gateway
      toPorts:
        - ports:
            - port: "18000"
              protocol: TCP
---
