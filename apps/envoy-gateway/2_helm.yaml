# https://gateway.envoyproxy.io/docs/api/extension_types/#envoygateway
# https://gateway.envoyproxy.io/latest/tasks/traffic/gateway-address/#external-ips
# https://github.com/envoyproxy/gateway/tree/main/charts/gateway-helm
# https://gateway.envoyproxy.io/docs/install/install-argocd/
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - ServerSideApply=true
  source:
    repoURL: https://github.com/gjpin/homeworld.git
    path: apps/envoy-gateway/helm/envoy-gateway/overlays/homelab
    targetRevision: HEAD
