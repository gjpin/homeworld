# https://gateway-api.sigs.k8s.io/guides/#installing-gateway-api
# https://github.com/kubernetes-sigs/gateway-api
#
# Pruning is deliberately NOT enabled (automated.prune unset), like every
# other CRD-only Application in this repo: garbage-collecting the Gateway API
# definitions would cascade-delete every live Gateway, HTTPRoute, and
# GRPCRoute — the entire ingress plane. The accepted trade-off: when an
# upstream bundle bump drops a CRD, the stale definition stays until it is
# removed by hand (one owner, no ServerSideApply fights in the meantime).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway
  syncPolicy:
    automated:
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ServerSideApply=true
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.6.2
    path: config/crd/experimental