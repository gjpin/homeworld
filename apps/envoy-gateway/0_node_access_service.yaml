# How the nodes reach the Gateway. A node cannot use the Gateway VIP: the one
# announcing it gets no ARP answer for its own announcement, and Cilium's socket
# load balancer skips external IPs that are not local to the host. host/apply.sh
# points the issuer's name at this fixed address (GATEWAY_CLUSTER_IP in
# host/cluster.env) for the API server's OIDC fetches (docs/k3s.md), and
# Headlamp's pod does the same through hostAliases.
---
apiVersion: v1
kind: Service
metadata:
  name: envoy-node-access
  namespace: envoy-gateway
spec:
  type: ClusterIP
  clusterIP: 10.43.0.50
  selector:
    app.kubernetes.io/name: envoy
    gateway.envoyproxy.io/owning-gatewayclass: envoy-merged
  ports:
    - name: https
      port: 443
      targetPort: 10443
      protocol: TCP
