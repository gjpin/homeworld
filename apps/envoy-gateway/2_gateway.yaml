# TODO: each application has a gateway, which are merged into a single one till
# cert-manager supports http routes for automatic certificates
# https://github.com/cert-manager/cert-manager/issues/6051
# https://gateway.envoyproxy.io/docs/tasks/security/tls-cert-manager/
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy
  namespace: envoy-gateway
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    cert-manager.io/cluster-issuer: homeworld-ca
spec:
  gatewayClassName: envoy-merged
  addresses:
    - type: IPAddress
      value: 192.168.8.50
  listeners:
    # No port-80 listener by design: certificates come from the private
    # homeworld-ca issuer, so no HTTP-01 challenge path is needed; adding
    # HTTP would only be a footgun.
    - name: envoy-https
      protocol: HTTPS
      port: 443
      hostname: "envoy.homeworld.internal"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: envoy-tls-cert
            kind: Secret
            group: ""
