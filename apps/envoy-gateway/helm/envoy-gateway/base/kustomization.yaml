apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
- name: gateway-helm
  repo: oci://docker.io/envoyproxy
  version: v1.7.2
  releaseName: envoy-gateway
  namespace: envoy-gateway
  includeCRDs: true
  skipTests: true
  valuesFile: values.yaml
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^envoy-gateway$
    namespace: ^envoy-gateway$
  patch: |-
    - op: add
      path: /spec/template/spec/hostUsers
      value: false
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^envoy-gateway$
    namespace: ^envoy-gateway$
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
- target:
    group: batch
    version: v1
    kind: Job
    name: ^envoy-gateway-gateway-helm-certgen$
    namespace: ^envoy-gateway$
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
- target:
    group: batch
    version: v1
    kind: Job
    name: ^envoy-gateway-gateway-helm-certgen$
    namespace: ^envoy-gateway$
  patch: |-
    - op: add
      path: /spec/template/spec/hostUsers
      value: false
