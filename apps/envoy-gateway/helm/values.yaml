deployment:
  replicas: 1
  envoyGateway:
    image:
      pullPolicy: IfNotPresent
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
        ephemeral-storage: 64Mi
      limits:
        cpu: "1"
        memory: 1024Mi
        ephemeral-storage: 2Gi
  pod:
    nodeSelector:
      node-role.kubernetes.io/homelab: homelab

certgen:
  job:
    pod:
      nodeSelector:
        node-role.kubernetes.io/homelab: homelab
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
        ephemeral-storage: 64Mi
      limits:
        cpu: "1"
        memory: 2Gi
        ephemeral-storage: 2Gi

crds:
  gatewayAPI:
    safeUpgradePolicy:
      enabled: false
