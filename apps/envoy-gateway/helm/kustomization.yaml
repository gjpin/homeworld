apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: gateway-helm
    repo: oci://docker.io/envoyproxy
    version: v1.9.1
    releaseName: envoy-gateway
    namespace: envoy-gateway
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^envoy-gateway$
      namespace: ^envoy-gateway$
    patch: |-
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
  # The controller's metrics are scraped through the handwritten ServiceMonitor
  # (0_service_monitor.yaml); the chart's prometheus.io annotation defaults are
  # removed so no parallel discovery mechanism remains.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^envoy-gateway$
      namespace: ^envoy-gateway$
    patch: |-
      - op: remove
        path: /spec/template/metadata/annotations/prometheus.io~1scrape
      - op: remove
        path: /spec/template/metadata/annotations/prometheus.io~1port
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^envoy-gateway$
      namespace: ^envoy-gateway$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^envoy-gateway-gateway-helm-certgen$
      namespace: ^envoy-gateway$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^envoy-gateway-gateway-helm-certgen$
      namespace: ^envoy-gateway$
    patch: |-
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^envoy-gateway$
      namespace: ^envoy-gateway$
    patch: |-
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: pod-networkpolicy,container-security-context-readonlyrootfilesystem,deployment-replicas,container-image-pull-policy
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: Upstream UID, filesystem, probe, availability, Cilium policy, and cached-image pull constraints are accepted for this exact resource.
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^envoy-gateway-gateway-helm-certgen$
      namespace: ^envoy-gateway$
    patch: |-
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: pod-networkpolicy,container-image-pull-policy
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: Upstream UID, filesystem, probe, availability, Cilium policy, and cached-image pull constraints are accepted for this exact resource.
