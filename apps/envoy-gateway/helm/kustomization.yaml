apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: gateway-helm
    repo: oci://docker.io/envoyproxy
    version: v1.9.1
    releaseName: envoy-gateway
    namespace: envoy-gateway
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  # --- Gateway API CRDs are owned by the dedicated `gateway-api-crd`
  # application (apps/envoy-gateway/0_crds.yaml, experimental v1.6.2, wave 0
  # ahead of every consumer). The chart bundles its own copy (v1.6.1); both
  # Applications run with ServerSideApply and self-heal, so leaving the
  # bundled copies in this render would give every CRD two competing owners
  # fighting over fields. Patch-delete them here and keep only the
  # envoyproxy.io CRDs from the chart.
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: ^backendtlspolicies\.gateway\.networking\.k8s\.io$
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: backendtlspolicies.gateway.networking.k8s.io
      $patch: delete
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: ^gatewayclasses\.gateway\.networking\.k8s\.io$
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: gatewayclasses.gateway.networking.k8s.io
      $patch: delete
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: ^gateways\.gateway\.networking\.k8s\.io$
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: gateways.gateway.networking.k8s.io
      $patch: delete
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: ^grpcroutes\.gateway\.networking\.k8s\.io$
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: grpcroutes.gateway.networking.k8s.io
      $patch: delete
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: ^httproutes\.gateway\.networking\.k8s\.io$
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: httproutes.gateway.networking.k8s.io
      $patch: delete
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: ^listenersets\.gateway\.networking\.k8s\.io$
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: listenersets.gateway.networking.k8s.io
      $patch: delete
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: ^referencegrants\.gateway\.networking\.k8s\.io$
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: referencegrants.gateway.networking.k8s.io
      $patch: delete
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: ^tcproutes\.gateway\.networking\.k8s\.io$
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: tcproutes.gateway.networking.k8s.io
      $patch: delete
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: ^tlsroutes\.gateway\.networking\.k8s\.io$
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: tlsroutes.gateway.networking.k8s.io
      $patch: delete
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: ^udproutes\.gateway\.networking\.k8s\.io$
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: udproutes.gateway.networking.k8s.io
      $patch: delete
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^envoy-gateway$
      namespace: ^envoy-gateway$
    patch: |-
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
  # The controller's metrics are scraped through the handwritten ServiceMonitor
  # (0_service_monitor.yaml); the chart's prometheus.io annotation defaults are
  # removed so no parallel discovery mechanism remains.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^envoy-gateway$
      namespace: ^envoy-gateway$
    patch: |-
      - op: remove
        path: /spec/template/metadata/annotations/prometheus.io~1scrape
      - op: remove
        path: /spec/template/metadata/annotations/prometheus.io~1port
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^envoy-gateway$
      namespace: ^envoy-gateway$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      group: (^$|rbac\.authorization\.k8s\.io|admissionregistration\.k8s\.io)
      version: v1
      kind: ^(ServiceAccount|Role|ClusterRole|RoleBinding|ClusterRoleBinding|MutatingWebhookConfiguration)$
      name: ^(envoy-gateway-gateway-helm-certgen(:envoy-gateway)?|envoy-gateway-topology-injector\.envoy-gateway)$
    patch: |-
      # The chart ships these as Helm pre-install/pre-upgrade hooks; under
      # Argo the annotations are inert and the resources apply with the
      # normal sync instead, which is what the certgen PostSync hook below
      # expects to already exist.
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
      - op: remove
        path: /metadata/annotations/helm.sh~1hook-weight
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^envoy-gateway-gateway-helm-certgen$
      namespace: ^envoy-gateway$
    patch: |-
      # The chart's helm.sh/hook annotations are inert under Argo, and a
      # plain Job breaks every chart bump: spec.template is immutable, so
      # the completed Job from the first sync rejects the new image tag and
      # the sync fails. The certgen work is genuinely wanted (it provisions
      # the webhook's self-signed certificate and patches the
      # MutatingWebhookConfiguration caBundle), so re-annotate it as an
      # Argo CD PostSync hook instead: the ServiceAccount/Role/Binding and
      # webhook configuration above have already applied by then, the job
      # runs after every sync (always with the fresh image), and
      # hook-delete-policy removes it on success so it is re-created —
      # never updated. The controller Deployment briefly waits for the
      # certificate secret on the very first sync and recovers as soon as
      # the hook delivers it.
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1hook
        value: PostSync
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1hook-delete-policy
        value: HookSucceeded
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^envoy-gateway-gateway-helm-certgen$
      namespace: ^envoy-gateway$
    patch: |-
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^envoy-gateway$
      namespace: ^envoy-gateway$
    patch: |-
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1liveness-port
        value: The upstream chart probes the health endpoint on undeclared port 8081 instead of a declared containerPort.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1readiness-port
        value: The upstream chart probes the health endpoint on undeclared port 8081 instead of a declared containerPort.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1startup-port
        value: The upstream chart probes the health endpoint on undeclared port 8081 instead of a declared containerPort.
