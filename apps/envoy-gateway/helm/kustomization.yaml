apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: gateway-helm
    repo: oci://docker.io/envoyproxy
    version: 1.9.2
    releaseName: envoy-gateway
    namespace: envoy-gateway
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  # --- Gateway API CRDs are owned by the dedicated `gateway-api-crd`
  # application (apps/envoy-gateway/0_crds.yaml, experimental v1.6.2, wave 0
  # ahead of every consumer). The chart bundles its own copy (v1.6.1); both
  # Applications run with ServerSideApply and self-heal, so leaving the
  # bundled copies in this render would give every CRD two competing owners
  # fighting over fields. Patch-delete them here and keep only the
  # envoyproxy.io CRDs from the chart.
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: ^backendtlspolicies\.gateway\.networking\.k8s\.io$
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: backendtlspolicies.gateway.networking.k8s.io
      $patch: delete
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: ^gatewayclasses\.gateway\.networking\.k8s\.io$
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: gatewayclasses.gateway.networking.k8s.io
      $patch: delete
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: ^gateways\.gateway\.networking\.k8s\.io$
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: gateways.gateway.networking.k8s.io
      $patch: delete
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: ^grpcroutes\.gateway\.networking\.k8s\.io$
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: grpcroutes.gateway.networking.k8s.io
      $patch: delete
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: ^httproutes\.gateway\.networking\.k8s\.io$
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: httproutes.gateway.networking.k8s.io
      $patch: delete
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: ^listenersets\.gateway\.networking\.k8s\.io$
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: listenersets.gateway.networking.k8s.io
      $patch: delete
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: ^referencegrants\.gateway\.networking\.k8s\.io$
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: referencegrants.gateway.networking.k8s.io
      $patch: delete
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: ^tcproutes\.gateway\.networking\.k8s\.io$
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: tcproutes.gateway.networking.k8s.io
      $patch: delete
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: ^tlsroutes\.gateway\.networking\.k8s\.io$
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: tlsroutes.gateway.networking.k8s.io
      $patch: delete
  - target:
      group: apiextensions.k8s.io
      version: v1
      kind: CustomResourceDefinition
      name: ^udproutes\.gateway\.networking\.k8s\.io$
    patch: |-
      apiVersion: apiextensions.k8s.io/v1
      kind: CustomResourceDefinition
      metadata:
        name: udproutes.gateway.networking.k8s.io
      $patch: delete
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^envoy-gateway$
      namespace: ^envoy-gateway$
    patch: |-
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
  # The controller's metrics are scraped through the handwritten ServiceMonitor
  # (0_service_monitor.yaml); the chart's prometheus.io annotation defaults are
  # removed so no parallel discovery mechanism remains.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^envoy-gateway$
      namespace: ^envoy-gateway$
    patch: |-
      - op: remove
        path: /spec/template/metadata/annotations/prometheus.io~1scrape
      - op: remove
        path: /spec/template/metadata/annotations/prometheus.io~1port
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^envoy-gateway$
      namespace: ^envoy-gateway$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      group: (^$|rbac\.authorization\.k8s\.io|admissionregistration\.k8s\.io)
      version: v1
      kind: ^(ServiceAccount|Role|ClusterRole|RoleBinding|ClusterRoleBinding|MutatingWebhookConfiguration)$
      name: ^(envoy-gateway-gateway-helm-certgen(:envoy-gateway)?|envoy-gateway-topology-injector\.envoy-gateway)$
    patch: |-
      # The chart ships these as Helm pre-install/pre-upgrade hooks. Under
      # Argo the same ordering must be reproduced with Argo's own hook
      # annotations: the certgen Job (PreSync, weight 0 below) patches the
      # MutatingWebhookConfiguration caBundle and needs this RBAC and the
      # webhook configuration to already exist, so they become PreSync
      # hooks at weight -1, ahead of the Job. Argo's default
      # before-hook-creation handling re-applies them (and re-runs the
      # Job) on every sync; the Job tolerates existing secrets
      # (ErrSecretExists is logged, not fatal) and re-patches the freshly
      # re-created webhook configuration.
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1hook
        value: PreSync
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1hook-weight
        value: "-1"
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
      - op: remove
        path: /metadata/annotations/helm.sh~1hook-weight
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^envoy-gateway-gateway-helm-certgen$
      namespace: ^envoy-gateway$
    patch: |-
      # The certgen Job provisions the webhook's self-signed serving
      # certificate (the controller mounts secret "envoy-gateway") and
      # patches the topology-injector webhook caBundle. It must run as a
      # PreSync hook: the controller Deployment mounts the secret at
      # startup, so a plain (or PostSync) job leaves the Deployment
      # un-reconcilable — Argo's sync waits for the Deployment's health
      # and would never reach a PostSync phase. PreSync weight 0 places it
      # after the weight -1 RBAC and webhook configuration above;
      # hook-delete-policy removes the completed Job so it is re-created —
      # never updated — with the fresh image on every sync.
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1hook
        value: PreSync
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1hook-weight
        value: "0"
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1hook-delete-policy
        value: HookSucceeded
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^envoy-gateway-gateway-helm-certgen$
      namespace: ^envoy-gateway$
    patch: |-
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^envoy-gateway$
      namespace: ^envoy-gateway$
    patch: |-
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1liveness-port
        value: The upstream chart probes the health endpoint on undeclared port 8081 instead of a declared containerPort.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1readiness-port
        value: The upstream chart probes the health endpoint on undeclared port 8081 instead of a declared containerPort.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1startup-port
        value: The upstream chart probes the health endpoint on undeclared port 8081 instead of a declared containerPort.
