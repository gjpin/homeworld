---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik
  namespace: authentik
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "auth.${BASE_DOMAIN}"
spec:
  parentRefs:
    - name: envoy
      namespace: authentik
  hostnames:
    - "auth.${BASE_DOMAIN}"
  rules:
    - backendRefs:
        - name: authentik-server
          namespace: authentik
          kind: Service
          port: 80
