# https://artifacthub.io/packages/helm/goauthentik/authentik
# https://github.com/goauthentik/helm
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: authentik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
  source:
    chart: authentik
    repoURL: https://charts.goauthentik.io/
    targetRevision: 2026.2.2
    helm:
      releaseName: authentik
      valuesObject:
        global:
          fullnameOverride: authentik
          namespaceOverride: authentik
          nodeSelector:
            node-role.kubernetes.io/homelab: homelab
            
        authentik:
          existingSecret:
            secretName: authentik

        server:
          ingress:
            enabled: false
        # Ensure dependencies are disabled
        postgresql:
          enabled: false
        redis:
          enabled: false
