---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: /authentik/POSTGRES_USERNAME
        decodingStrategy: Auto
    - secretKey: password
      remoteRef:
        key: /authentik/POSTGRES_PASSWORD
        decodingStrategy: Auto
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik
  namespace: authentik
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: authentik
    template:
      data:
        AUTHENTIK_POSTGRESQL__HOST: authentik-rw.authentik.svc.cluster.local
        AUTHENTIK_POSTGRESQL__NAME: authentik
        AUTHENTIK_POSTGRESQL__PORT: "5432"
        AUTHENTIK_REDIS__HOST: dragonfly.authentik.svc.cluster.local
        AUTHENTIK_ERROR_REPORTING__ENABLED: "false"
  data:
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: /authentik/AUTHENTIK_SECRET_KEY
        decodingStrategy: Auto
    - secretKey: AUTHENTIK_POSTGRESQL__USER
      remoteRef:
        key: /authentik/POSTGRES_USERNAME
        decodingStrategy: Auto
    - secretKey: AUTHENTIK_POSTGRESQL__PASSWORD
      remoteRef:
        key: /authentik/POSTGRES_PASSWORD
        decodingStrategy: Auto
    - secretKey: AUTHENTIK_REDIS__PASSWORD
      remoteRef:
        key: /authentik/DRAGONFLY_PASSWORD
        decodingStrategy: Auto
