---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    external-dns.alpha.kubernetes.io/hostname: "grpc.argocd.${BASE_DOMAIN}"
spec:
  parentRefs:
    - name: envoy
      namespace: argocd
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "grpc.argocd.${BASE_DOMAIN}"
  rules:
    - backendRefs:
      - name: argocd-argocd-server
        namespace: argocd
        kind: Service
        port: 80
        group: ""
        weight: 1
