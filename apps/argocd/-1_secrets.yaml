---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: argocd-oidc
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: clientSecret
      remoteRef:
        key: /authelia/OIDC_CLIENT_SECRET_ARGOCD
        decodingStrategy: None
    # The homeworld root CA, read by oidc.config's rootCA reference: Argo CD
    # syncs in wave 0, before trust-manager publishes the homeworld-ca
    # ConfigMap, and its OIDC config can only read Secret values.
    - secretKey: rootCA
      remoteRef:
        key: /cert-manager/CA_CERT
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonfly-credentials
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: dragonfly-credentials
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
      type: Opaque
      data:
        # Key consumed by the Dragonfly CR's passwordFromSecret.
        password: "{{ .password }}"
        # Key the argo-cd chart's externalRedis block reads
        # (argo-cd.redisPasswordSecretRef); Argo CD authenticates to
        # Dragonfly with the same value.
        redis-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: /argocd/DRAGONFLY_PASSWORD
        decodingStrategy: None
