---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: argocd-oidc
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: argocd-oidc
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
  data:
    - secretKey: clientSecret
      remoteRef:
        key: /authelia/OIDC_CLIENT_SECRET_ARGOCD
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonfly-credentials
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: dragonfly-credentials
    template:
      metadata:
        labels:
          app.kubernetes.io/part-of: argocd
      type: Opaque
      data:
        # Key consumed by the Dragonfly CR's passwordFromSecret.
        password: "{{ .password }}"
        # Key the argo-cd chart's externalRedis block reads
        # (argo-cd.redisPasswordSecretRef); Argo CD authenticates to
        # Dragonfly with the same value.
        redis-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: /argocd/DRAGONFLY_PASSWORD
        decodingStrategy: None
---
# The cluster domain the homeworld Config Management Plugin substitutes for
# the base-domain.invalid placeholder (helm/values.yaml configs.cmp). The
# repo-server cannot render anything without it, External Secrets included,
# so host/bootstrap.sh seeds this Secret from the same Infisical key before
# Argo CD starts; this ExternalSecret then adopts it (creationPolicy Owner
# takes over an existing Secret no other ExternalSecret owns) and keeps it in
# sync with Infisical.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homeworld-domain
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: homeworld-domain
    creationPolicy: Owner
  data:
    - secretKey: BASE_DOMAIN
      remoteRef:
        key: /argocd/BASE_DOMAIN
        decodingStrategy: None
