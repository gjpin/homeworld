# https://github.com/valkey-io/valkey-helm/tree/main/valkey
# Wave 0 with the other datastores: Argo CD connects to Valkey at startup.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd-valkey
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - ServerSideApply=true

  source:
    repoURL: https://github.com/gjpin/homeworld.git
    path: apps/argocd/helm/valkey
    targetRevision: HEAD
    plugin:
      name: homeworld
