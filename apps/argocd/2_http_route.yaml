---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "argocd.base-domain.invalid"
  rules:
    - backendRefs:
      - name: argocd-argocd-server
        namespace: argocd
        kind: Service
        port: 80
        group: ""
        weight: 1
