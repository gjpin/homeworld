---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-argocd-dragonfly-ingress
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # The Dragonfly operator's generated StatefulSet pods (apps/argocd/
  # 0_dragonfly.yaml) cache the controllers' git and manifest data.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: dragonfly
      k8s:app.kubernetes.io/instance: dragonfly
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
            k8s:app.kubernetes.io/component: argocd-server
            k8s:app.kubernetes.io/instance: argocd
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
            k8s:app.kubernetes.io/component: argocd-application-controller
            k8s:app.kubernetes.io/instance: argocd
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
            k8s:app.kubernetes.io/component: argocd-repo-server
            k8s:app.kubernetes.io/instance: argocd
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # Operand admin/metrics endpoint (port 9999) scraped by the PodMonitor.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-collector
      toPorts:
        - ports:
            - port: "9999"
              protocol: TCP
---
apiVersion: cilium.io/v2
