spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/component: argocd-server
      k8s:app.kubernetes.io/instance: argocd
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gatewayclass: envoy-merged
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-argocd-repository-sources
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # Repo-server needs only the declared Git sources, pinned Helm chart
  # repositories, and OCI registries used by this repository, all over HTTPS.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/component: argocd-repo-server
      k8s:app.kubernetes.io/instance: argocd
  egress:
    - toFQDNs:
        - matchName: github.com
        - matchName: argoproj.github.io
        - matchName: charts.authelia.com
        - matchName: charts.jetstack.io
        - matchName: cloudnative-pg.github.io
        - matchName: collaboraonline.github.io
        - matchName: code.forgejo.org
        - matchName: crowdsecurity.github.io
        - matchName: charts.external-secrets.io
        - matchName: charts.longhorn.io
        - matchName: victoriametrics.github.io
        - matchName: open-telemetry.github.io
        - matchName: operator.rustfs.com
        - matchName: helm.otwld.com
        - matchName: vmware-tanzu.github.io
        - matchName: kubernetes-sigs.github.io
        - matchName: helm.cilium.io
        - matchName: woodpecker-ci.org
        - matchName: ghcr.io
        - matchName: docker.io
        - matchName: registry-1.docker.io
        - matchName: auth.docker.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
