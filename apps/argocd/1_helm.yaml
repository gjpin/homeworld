# https://artifacthub.io/packages/helm/argo/argo-cd
# https://argo-cd.readthedocs.io/en/stable/operator-manual/ingress/#option-2-ssl-termination-at-ingress-controller
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
  source:
    chart: argo-cd
    repoURL: https://argoproj.github.io/argo-helm
    targetRevision: 9.5.9
    helm:
      releaseName: argocd
      valuesObject:
        fullnameOverride: argocd
        namespaceOverride: argocd

        # global
        global:
          nodeSelector:
            node-role.kubernetes.io/homelab: homelab

        crds:
          install: true
          keep: true

        # TLS is terminated at Ingress Controller,
        # so we disable TLS in the API server.
        # https://argo-cd.readthedocs.io/en/stable/operator-manual/ingress/#ingressroute-crd
        configs:
          cm:
            kustomize.buildOptions: --enable-helm
          params:
            server.insecure: true

        # server
        server:
          name: argocd-server
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              interval: 60s

        # repo server
        repoServer:
          name: argocd-repo-server
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              interval: 60s

        # controller
        controller:
          name: argocd-application-controller
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              interval: 60s

        # dex
        dex:
          name: argocd-dex-server
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              interval: 60s

        # redis
        redis:
          name: argocd-redis
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              interval: 60s

        # application set
        applicationSet:
          name: argocd-applicationset-controller
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              interval: 60s

        # notifications
        notifications:
          name: argocd-notifications-controller
          metrics:
            enabled: true
            serviceMonitor:
              enabled: true
              interval: 60s
