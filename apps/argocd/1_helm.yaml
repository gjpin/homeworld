# https://artifacthub.io/packages/helm/argo/argo-cd
# https://argo-cd.readthedocs.io/en/stable/operator-manual/ingress/#option-2-ssl-termination-at-ingress-controller
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
  source:
    # The argo-cd chart version is pinned in helm/argocd/base/kustomization.yaml.
    repoURL: https://github.com/gjpin/homeworld.git
    path: apps/argocd/helm/argocd/overlays/homelab
    targetRevision: HEAD
