# Standalone Valkey for Argo CD's cache of repository, manifest and
# application state. The Valkey and exporter images follow the chart's pins.
fullnameOverride: valkey
runtimeClassName: gvisor
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
resources:
  requests:
    cpu: 100m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 2Gi
# Standalone, in-memory only: no PVC to hand over, so a rolling update keeps
# the old pod serving until the new one answers.
deploymentStrategy: RollingUpdate
# Upstream now enables the readiness probe by default; pinned so the Service
# only routes to a server that answers PING.
readinessProbe:
  enabled: true
initResources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi
# Every client authenticates as the default user with the password from the
# valkey ExternalSecret (-1_secrets.yaml).
auth:
  enabled: true
  usersExistingSecret: valkey
  aclUsers:
    default:
      permissions: "~* &* +@all"
      passwordKey: password
# In-memory only, with maxmemory below the container limit. Argo CD rebuilds
# anything it loses from the cache, so the least recently used keys make room
# when it is full.
extraConfig: |
  maxmemory 1536mb
  maxmemory-policy allkeys-lru
  save ""
  appendonly no
metrics:
  enabled: true
  exporter:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
  serviceMonitor:
    enabled: true
    interval: 60s
