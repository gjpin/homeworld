      value: {"requests":{"cpu":"100m","memory":"128Mi","ephemeral-storage":"128Mi"},"limits":{"cpu":"2","memory":"4Gi","ephemeral-storage":"4Gi"}}
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^argocd-argocd-repo-server$
    namespace: ^argocd$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources
      value: {"requests":{"cpu":"100m","memory":"128Mi","ephemeral-storage":"128Mi"},"limits":{"cpu":"2","memory":"4Gi","ephemeral-storage":"4Gi"}}
    - op: add
      path: /spec/template/spec/initContainers/0/resources
      value: {"requests":{"cpu":"100m","memory":"128Mi","ephemeral-storage":"128Mi"},"limits":{"cpu":"2","memory":"4Gi","ephemeral-storage":"4Gi"}}
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^argocd-argocd-server$
    namespace: ^argocd$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources
      value: {"requests":{"cpu":"100m","memory":"128Mi","ephemeral-storage":"128Mi"},"limits":{"cpu":"2","memory":"4Gi","ephemeral-storage":"4Gi"}}
- target:
    group: apps
    version: v1
    kind: StatefulSet
    name: ^argocd-argocd-application-controller$
