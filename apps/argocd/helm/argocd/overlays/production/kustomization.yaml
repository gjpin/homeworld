    namespace: ^argocd$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Always
- target:
    group: apps
    version: v1
    kind: StatefulSet
    name: ^argocd-argocd-application-controller$
    namespace: ^argocd$
