    - op: add
      path: /spec/template/spec/initContainers/0/imagePullPolicy
      value: Always
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^argocd-argocd-notifications-controller$
    namespace: ^argocd$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Always
- target:
    group: apps
