apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
commonAnnotations:
  security.homeworld/profile: production
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^argocd-argocd-(applicationset-controller|dex-server|notifications-controller|redis|repo-server|server)$
    namespace: ^argocd$
  patch: |-
    - op: add
      path: /spec/template/spec/hostUsers
      value: false
- target:
    group: apps
    version: v1
    kind: StatefulSet
    name: ^argocd-argocd-application-controller$
    namespace: ^argocd$
  patch: |-
    - op: add
      path: /spec/template/spec/hostUsers
      value: false
- target:
    group: batch
    version: v1
    kind: Job
    name: ^argocd-redis-secret-init$
    namespace: ^argocd$
  patch: |-
    - op: add
      path: /spec/template/spec/hostUsers
      value: false
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^argocd-argocd-applicationset-controller$
    namespace: ^argocd$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources
      value: {"requests":{"cpu":"100m","memory":"128Mi","ephemeral-storage":"128Mi"},"limits":{"cpu":"2","memory":"4Gi","ephemeral-storage":"4Gi"}}
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^argocd-argocd-dex-server$
    namespace: ^argocd$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources
      value: {"requests":{"cpu":"100m","memory":"128Mi","ephemeral-storage":"128Mi"},"limits":{"cpu":"2","memory":"4Gi","ephemeral-storage":"4Gi"}}
    - op: add
      path: /spec/template/spec/initContainers/0/resources
      value: {"requests":{"cpu":"100m","memory":"128Mi","ephemeral-storage":"128Mi"},"limits":{"cpu":"2","memory":"4Gi","ephemeral-storage":"4Gi"}}
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^argocd-argocd-notifications-controller$
    namespace: ^argocd$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources
      value: {"requests":{"cpu":"100m","memory":"128Mi","ephemeral-storage":"128Mi"},"limits":{"cpu":"2","memory":"4Gi","ephemeral-storage":"4Gi"}}
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^argocd-argocd-redis$
    namespace: ^argocd$
  patch: |-
