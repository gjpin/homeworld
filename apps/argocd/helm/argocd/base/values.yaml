fullnameOverride: argocd
namespaceOverride: argocd
# global
global:
  nodeSelector:
    node-role.kubernetes.io/homelab: homelab
crds:
  install: true
  keep: true
# TLS is terminated at Ingress Controller,
# so we disable TLS in the API server.
# https://argo-cd.readthedocs.io/en/stable/operator-manual/ingress/#ingressroute-crd
configs:
  cm:
    url: https://argocd.${BASE_DOMAIN}
    admin.enabled: false
    kustomize.buildOptions: --enable-helm
    # Argo CD reads $<secret>:<key> from a Secret labeled app.kubernetes.io/part-of: argocd.
    # Keep this dollar reference intact; do not run it through envsubst.
    oidc.config: |
      name: Authelia
      issuer: https://auth.${BASE_DOMAIN}
      clientID: argocd
      clientSecret: $argocd-oidc:clientSecret
      requestedScopes:
        - openid
        - profile
        - email
        - groups
      enablePKCEAuthentication: true
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, argocd-admin, role:admin
    scopes: "[groups]"
  params:
    server.insecure: true
# server
server:
  name: argocd-server
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 60s
# repo server
repoServer:
  name: argocd-repo-server
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 60s
# controller
controller:
  name: argocd-application-controller
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 60s
# dex
dex:
  enabled: false
  name: argocd-dex-server
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 60s
# redis
redis:
  name: argocd-redis
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 60s
# application set
applicationSet:
  name: argocd-applicationset-controller
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 60s
# notifications
notifications:
  name: argocd-notifications-controller
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 60s
