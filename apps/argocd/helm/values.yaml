fullnameOverride: argocd
namespaceOverride: argocd
# global
global:
  # Prefer the chart-native key over a kustomize patch (AGENTS.md): every
  # Argo CD component pod runs under the gVisor runtime.
  runtimeClassName: gvisor
  networkPolicy:
    create: false
crds:
  install: true
  keep: true
# TLS is terminated at Ingress Controller,
# so we disable TLS in the API server.
# https://argo-cd.readthedocs.io/en/stable/operator-manual/ingress/#ingressroute-crd
configs:
  cm:
    url: https://argocd.base-domain.invalid
    admin.enabled: false
    # Local account for the Homepage dashboard's Argo CD widget: API-key-only,
    # read-only through the RBAC role mapping below.
    accounts.homepage: apiKey
    kustomize.buildOptions: --enable-helm
    # Argo CD ships health checks for the MariaDB operator's MariaDB, SqlJob,
    # and Backup kinds but not PhysicalBackup. Supernote's pre-upgrade
    # snapshot is a PreSync hook (apps/supernote/0_pre_sync_backup.yaml) whose
    # sync must wait for the snapshot, so a one-shot PhysicalBackup is
    # Progressing until its Complete condition is True and Degraded on
    # failure. "MariaDB not found"/"not ready" (Complete=False, reason
    # Failed) mean there is nothing to back up yet — the first sync, or an
    # instance a fix is trying to repair — and report Healthy so the sync is
    # not wedged. Scheduled backups stay Healthy between runs.
    resource.customizations.health.k8s.mariadb.com_PhysicalBackup: |
      local hs = {}
      local complete = nil
      if obj.status ~= nil and obj.status.conditions ~= nil then
        for _, c in ipairs(obj.status.conditions) do
          if c.type == "Complete" then
            complete = c
          end
        end
      end
      if complete == nil then
        hs.status = "Progressing"
        hs.message = "Waiting for the operator"
        return hs
      end
      hs.message = complete.message
      if complete.status == "True" then
        hs.status = "Healthy"
        return hs
      end
      if complete.reason == "SnapshotFailed" or complete.reason == "JobFailed" or complete.reason == "CronJobFailed" then
        hs.status = "Degraded"
        return hs
      end
      if complete.reason == "SnapshotSuspended" or complete.reason == "JobSuspended" then
        hs.status = "Suspended"
        return hs
      end
      if complete.reason == "Failed" and (complete.message == "MariaDB not found" or complete.message == "MariaDB not ready") then
        hs.status = "Healthy"
        hs.message = "Skipped: " .. complete.message
        return hs
      end
      if obj.spec ~= nil and obj.spec.schedule ~= nil then
        hs.status = "Healthy"
        return hs
      end
      hs.status = "Progressing"
      return hs
    # Argo CD reads $<secret>:<key> from a Secret labeled app.kubernetes.io/part-of: argocd.
    # Keep this dollar reference intact; do not run it through envsubst.
    oidc.config: |
      name: Authelia
      issuer: https://auth.base-domain.invalid
      clientID: argocd
      clientSecret: $argocd-oidc:clientSecret
      cliClientID: argocd-cli
      requestedScopes:
        - openid
        - profile
        - email
        - groups
      enablePKCEAuthentication: true
  rbac:
    # No access unless granted: Authelia admits any two-factor user to the
    # argocd client, so only argocd-admin and the homepage account are mapped.
    policy.default: ""
    policy.csv: |
      g, argocd-admin, role:admin
      g, homepage, role:readonly
    scopes: "[groups]"
  params:
    server.insecure: true
  # The homeworld Config Management Plugin renders every Application sourced
  # from this repository (docs/argocd.md). Git carries the placeholder
  # base-domain.invalid wherever the cluster domain belongs; the plugin
  # renders the component as Argo CD's built-in tools would (kustomize with
  # Helm for directories holding a kustomization.yaml, the plain YAML files
  # otherwise) and replaces the placeholder with the domain from the
  # argocd/homeworld-domain Secret (Infisical /argocd/BASE_DOMAIN, synced by
  # apps/argocd/-1_secrets.yaml and seeded by host/bootstrap.sh). It fails
  # instead of rendering when the domain is missing or malformed, so the
  # placeholder never reaches the cluster.
  cmp:
    create: true
    plugins:
      homeworld:
        generate:
          command: [sh, -c]
          args:
            - |
              set -eu
              domain=$(cat /etc/homeworld-domain/BASE_DOMAIN)
              case "$domain" in
                *.*) ;;
                *) echo "homeworld plugin: BASE_DOMAIN is not a domain" >&2; exit 1 ;;
              esac
              case "$domain" in
                *[!a-z0-9.-]* | .* | *. | *..* | base-domain\.invalid)
                  echo "homeworld plugin: BASE_DOMAIN is not a domain" >&2; exit 1 ;;
              esac
              # The placeholder is spelled with an escaped dot throughout
              # this script, so rendering Argo CD's own Application leaves
              # it intact.
              out=$(mktemp)
              if [ -f kustomization.yaml ]; then
                # The arguments Argo CD passes to its built-in kustomize
                # when kustomize.buildOptions holds --enable-helm.
                set -- build . --enable-helm
                if [ -n "${KUBE_VERSION:-}" ]; then
                  set -- "$@" --helm-kube-version "$KUBE_VERSION"
                fi
                for v in $(echo "${KUBE_API_VERSIONS:-}" | tr ',' ' '); do
                  set -- "$@" --helm-api-versions "$v"
                done
                kustomize "$@" >"$out"
              else
                for f in *.yaml *.yml *.json; do
                  [ -f "$f" ] || continue
                  printf -- '---\n'
                  cat "./$f"
                  printf '\n'
                done >"$out"
              fi
              sed "s/base-domain\.invalid/$domain/g" "$out"
              rm -f "$out"
# server
server:
  name: argocd-server
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 60s
# repo server
repoServer:
  name: argocd-repo-server
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 60s
  # The homeworld plugin's sidecar (configs.cmp above), on the Argo CD image
  # itself, which ships kustomize, helm, and sed.
  extraContainers:
    - name: homeworld-plugin
      image: "{{ .Values.global.image.repository }}:{{ default .Chart.AppVersion .Values.global.image.tag }}"
      imagePullPolicy: IfNotPresent
      command: [/var/run/argocd/argocd-cmp-server]
      env:
        - name: HELM_CACHE_HOME
          value: /tmp/helm
        - name: HELM_CONFIG_HOME
          value: /tmp/helm
        - name: HELM_DATA_HOME
          value: /tmp/helm
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        readOnlyRootFilesystem: true
        allowPrivilegeEscalation: false
        seccompProfile:
          type: RuntimeDefault
        capabilities:
          drop:
            - ALL
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
          ephemeral-storage: 64Mi
        limits:
          cpu: "1"
          memory: 2Gi
          ephemeral-storage: 2Gi
      volumeMounts:
        - name: var-files
          mountPath: /var/run/argocd
        - name: plugins
          mountPath: /home/argocd/cmp-server/plugins
        - name: argocd-cmp-cm
          mountPath: /home/argocd/cmp-server/config/plugin.yaml
          subPath: homeworld.yaml
        - name: homeworld-plugin-tmp
          mountPath: /tmp
        # Mounted whole (not subPath) so a changed domain reaches the
        # running sidecar.
        - name: homeworld-domain
          mountPath: /etc/homeworld-domain
          readOnly: true
  volumes:
    - name: argocd-cmp-cm
      configMap:
        name: argocd-cmp-cm
    - name: homeworld-plugin-tmp
      emptyDir: {}
    - name: homeworld-domain
      secret:
        secretName: homeworld-domain
# controller
controller:
  name: argocd-application-controller
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 60s
# dex
dex:
  enabled: false
  name: argocd-dex-server
# redis
# The repo provisions every Redis-compatible datastore with the Dragonfly
# operator; the chart's bundled Redis stays disabled and the controllers use
# a Dragonfly instance in this namespace (apps/argocd/0_dragonfly.yaml).
redis:
  enabled: false
# Point every Redis client at the in-namespace Dragonfly instance. The chart
# reads the existingSecret's `redis-password` key (and optional
# `redis-username`); the ExternalSecret apps/argocd/-1_secrets.yaml renders
# both that key and the `password` key the Dragonfly CR's passwordFromSecret
# references, from the same Infisical value.
externalRedis:
  host: dragonfly.argocd.svc.cluster.local
  port: 6379
  existingSecret: dragonfly-credentials
# application set
applicationSet:
  name: argocd-applicationset-controller
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 60s
# notifications
notifications:
  name: argocd-notifications-controller
  # Context URL used in notification templates; nothing is subscribed today —
  # set before enabling any subscription, or templates render with the
  # chart-default https://argocd.example.com.
  argocdUrl: https://argocd.base-domain.invalid
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 60s
