fullnameOverride: argocd
namespaceOverride: argocd
# global
global:
  nodeSelector:
    node-role.kubernetes.io/homelab: homelab
  networkPolicy:
    create: false
crds:
  install: true
  keep: true
# TLS is terminated at Ingress Controller,
# so we disable TLS in the API server.
# https://argo-cd.readthedocs.io/en/stable/operator-manual/ingress/#ingressroute-crd
configs:
  cm:
    url: https://argocd.${BASE_DOMAIN}
    admin.enabled: false
    # Local account for the Homepage dashboard's Argo CD widget: API-key-only,
    # read-only through the RBAC role mapping below.
    accounts.homepage: apiKey
    kustomize.buildOptions: --enable-helm
    # Argo CD reads $<secret>:<key> from a Secret labeled app.kubernetes.io/part-of: argocd.
    # Keep this dollar reference intact; do not run it through envsubst.
    oidc.config: |
      name: Authelia
      issuer: https://auth.${BASE_DOMAIN}
      clientID: argocd
      clientSecret: $argocd-oidc:clientSecret
      requestedScopes:
        - openid
        - profile
        - email
        - groups
      enablePKCEAuthentication: true
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
  rbac:
    policy.default: role:readonly
    policy.csv: |
      g, argocd-admin, role:admin
      g, homepage, role:readonly
    scopes: "[groups]"
  params:
    server.insecure: true
# server
server:
  name: argocd-server
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 60s
# repo server
repoServer:
  name: argocd-repo-server
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 60s
# controller
controller:
  name: argocd-application-controller
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 60s
# dex
dex:
  enabled: false
  name: argocd-dex-server
# redis
redis:
  name: argocd-redis
  metrics:
    enabled: false
    serviceMonitor:
      enabled: false
# application set
applicationSet:
  name: argocd-applicationset-controller
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 60s
# notifications
notifications:
  name: argocd-notifications-controller
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 60s
