# https://github.com/squat/generic-device-plugin/tree/main/charts/generic-device-plugin
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: generic-device-plugin
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: generic-device-plugin
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - ServerSideApply=true
  source:
    repoURL: https://github.com/gjpin/homeworld.git
    path: apps/generic-device-plugin/helm
    targetRevision: HEAD
    plugin:
      name: homeworld
