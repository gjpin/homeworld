# NFS volumes are static PVs (one per NAS share, docs/nas.md); nothing is
# provisioned dynamically, so only the node plugin runs (kustomization.yaml
# deletes the controller). The CSIDriver renders fsGroupPolicy None so
# kubelet never chowns a share.
image:
  # The node plugin's CSI sidecars, pinned here rather than inherited from
  # the chart so Renovate tracks them.
  livenessProbe:
    repository: registry.k8s.io/sig-storage/livenessprobe
    tag: v2.19.0
  nodeDriverRegistrar:
    repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
    tag: v2.17.0
feature:
  enableFSGroupPolicy: true
  fsGroupPolicy: None
node:
  resources:
    livenessProbe:
      requests:
        cpu: 10m
        memory: 20Mi
      limits:
        cpu: 100m
        memory: 100Mi
    nodeDriverRegistrar:
      requests:
        cpu: 10m
        memory: 20Mi
      limits:
        cpu: 100m
        memory: 100Mi
    nfs:
      requests:
        cpu: 10m
        memory: 20Mi
      limits:
        cpu: "1"
        memory: 300Mi
