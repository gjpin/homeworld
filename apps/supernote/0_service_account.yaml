---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: supernote-app
  namespace: supernote
  labels:
    app.kubernetes.io/name: supernote
# Token hygiene only: neither supernote-service nor notelib talks to the
# Kubernetes API. The name must not collide with the ServiceAccounts the
# MariaDB operator derives from its resources (the `mariadb` instance and
# the seed SqlJob each get one named after the CR).
automountServiceAccountToken: false
