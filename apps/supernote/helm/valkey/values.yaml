# Standalone Valkey for Supernote's private cloud service. The Valkey and
# exporter images follow the chart's pins.
fullnameOverride: valkey
runtimeClassName: gvisor
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 500m
    memory: 512Mi
# The chart's readiness probe is opt-in; the Service only routes to a
# server that answers PING.
readinessProbe:
  enabled: true
initResources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi
# Every client authenticates as the default user with the password from the
# valkey ExternalSecret (-1_secrets.yaml).
auth:
  enabled: true
  usersExistingSecret: valkey
  aclUsers:
    default:
      permissions: "~* &* +@all"
      passwordKey: password
# In-memory only, with maxmemory below the container limit. noeviction: a full
# instance returns errors instead of dropping keys the service expects to
# find.
valkeyConfig: |
  maxmemory 384mb
  maxmemory-policy noeviction
  save ""
  appendonly no
metrics:
  enabled: true
  exporter:
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      readOnlyRootFilesystem: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
  serviceMonitor:
    enabled: true
    interval: 60s
