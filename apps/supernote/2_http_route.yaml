---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: supernote
  namespace: supernote
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    external-dns.alpha.kubernetes.io/hostname: "supernote.${BASE_DOMAIN}"
spec:
  parentRefs:
    - name: envoy
      namespace: supernote
      sectionName: supernote-https
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "supernote.${BASE_DOMAIN}"
  rules:
    - filters:
        # The bundled nginx derives the public port it hands the backend
        # (and the URLs the backend returns to devices) from
        # X-Forwarded-Port, falling back to its own listener port (8080).
        # Envoy does not send the header, so pin the public HTTPS port.
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Port
                value: "443"
      backendRefs:
        - name: supernote-service
          namespace: supernote
          kind: Service
          port: 8080
          group: ""
          weight: 1
