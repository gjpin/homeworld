# One container runs three processes (upstream docker-entrypoint.sh): nginx
# on 8080 fronting the Vue web client (9888), the Java backend API (19071),
# and the device auto-sync socket.io endpoint (18072). nginx addresses all
# three through the `supernote-service` hostname, which hostAliases pins to
# loopback.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: supernote-service
  namespace: supernote
  labels:
    app.kubernetes.io/name: supernote
    app.kubernetes.io/component: service
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: supernote
      app.kubernetes.io/component: service
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: supernote
        app.kubernetes.io/component: service
    spec:
      serviceAccountName: supernote-app
      automountServiceAccountToken: false
      runtimeClassName: gvisor
      hostUsers: false
      nodeSelector:
        # Upstream publishes amd64-only images.
        kubernetes.io/arch: amd64
      hostAliases:
        - ip: 127.0.0.1
          hostnames:
            - supernote-service
      securityContext:
        # The image runs as root by default; the Ubuntu base image's
        # `ubuntu` user (1000) owns nothing it needs, as every write path
        # below is a volume.
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The entrypoint rewrites /etc/nginx/nginx.conf in place with sed on
        # every start, so /etc/nginx must be a writable copy of the image's
        # tree. The bundled config also listens on 443 with a self-signed
        # certificate; Envoy terminates TLS, and dropping that listener lets
        # nginx run unprivileged.
        - name: nginx-config
          image: docker.io/supernote/supernote-service:26.10.09
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - cp -a /etc/nginx/. /nginx/ && sed -i '/listen 443 ssl;/d' /nginx/nginx.conf
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
              ephemeral-storage: 64Mi
          volumeMounts:
            - name: nginx-config
              mountPath: /nginx
        # The backend does not wait for its database (upstream compose gates
        # it on the MariaDB healthcheck); hold it until the seed SqlJob has
        # created the schema's last table.
        - name: wait-for-database
          image: docker.io/library/mariadb:12.3.3
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - >-
              until mariadb --host=mariadb --user=supernote
              --password="$MYSQL_PASSWORD" --skip-ssl supernotedb
              --execute='SELECT 1 FROM t_user_mfa LIMIT 1' >/dev/null 2>&1;
              do echo 'waiting for the supernotedb schema'; sleep 5; done
          env:
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
              ephemeral-storage: 16Mi
            limits:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 64Mi
      containers:
        - name: supernote-service
          image: docker.io/supernote/supernote-service:26.10.09
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
          env:
            # nginx server_name, substituted by the entrypoint.
            - name: DOMAIN_NAME
              value: "supernote.${BASE_DOMAIN}"
            - name: DB_HOSTNAME
              value: mariadb
            - name: MYSQL_DATABASE
              value: supernotedb
            - name: MYSQL_USER
              value: supernote
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mariadb
                  key: password
            - name: REDIS_HOST
              value: dragonfly
            - name: REDIS_PORT
              value: "6379"
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dragonfly
                  key: password
            - name: NOTELIB_HOST
              value: notelib
            # The web client is served by `npm run start`; HOME points npm's
            # cache and logs at a writable volume, and npm's update notifier
            # (a registry.npmjs.org phone-home) is disabled.
            - name: HOME
              value: /tmp
            - name: NPM_CONFIG_UPDATE_NOTIFIER
              value: "false"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: backend
              containerPort: 19071
              protocol: TCP
          # The web client compiles at startup (vue-cli-service serve), which
          # takes minutes under gVisor; allow up to 15 minutes before the
          # liveness probe takes over.
          startupProbe:
            tcpSocket:
              port: backend
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 90
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 250m
              memory: 1536Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: "2"
              memory: 3Gi
              ephemeral-storage: 8Gi
          volumeMounts:
            - name: data
              mountPath: /home/supernote/data
            - name: recycle
              mountPath: /home/supernote/recycle
            - name: convert
              mountPath: /home/supernote/convert
            # Chunked-upload staging (local.part.upload.targetDirPath).
            - name: part
              mountPath: /home/supernote/part
            - name: app-logs
              mountPath: /home/supernote/logs
            - name: web-logs
              mountPath: /home/supernote/cloud/logs
            - name: webpack-cache
              mountPath: /home/supernote/cloud/node_modules/.cache
            - name: nginx-config
              mountPath: /etc/nginx
            - name: nginx-logs
              mountPath: /var/log/nginx
            - name: nginx-state
              mountPath: /var/lib/nginx
            - name: run
              mountPath: /run
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: supernote-data
        - name: recycle
          persistentVolumeClaim:
            claimName: supernote-recycle
        - name: convert
          persistentVolumeClaim:
            claimName: supernote-convert
        - name: part
          emptyDir:
            sizeLimit: 3Gi
        - name: app-logs
          emptyDir:
            sizeLimit: 1Gi
        - name: web-logs
          emptyDir:
            sizeLimit: 256Mi
        - name: webpack-cache
          emptyDir:
            sizeLimit: 1Gi
        - name: nginx-config
          emptyDir:
            sizeLimit: 16Mi
        - name: nginx-logs
          emptyDir:
            sizeLimit: 512Mi
        - name: nginx-state
          emptyDir:
            sizeLimit: 1Gi
        - name: run
          emptyDir:
            sizeLimit: 16Mi
        - name: tmp
          emptyDir:
            sizeLimit: 1Gi
