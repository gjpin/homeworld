# https://github.com/mariadb-operator/mariadb-operator/blob/main/docs/physical_backup.md
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: PhysicalBackup
metadata:
  name: mariadb-daily-volume-snapshot
  namespace: supernote
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  mariaDbRef:
    name: mariadb
  # Daily at 01:00 UTC (the operator evaluates the cron on its own clock,
  # UTC in its distroless image), alongside the CloudNativePG volume-snapshot
  # backups and staggered from Velero's 03:00 Europe/Lisbon schedule.
  schedule:
    cron: "0 1 * * *"
    suspend: false
  # The default (Replica) never schedules on a standalone instance; the
  # operator holds FLUSH TABLES WITH READ LOCK on the primary while the
  # snapshot is cut, so it is consistent.
  target: PreferReplica
  # Matches Velero's 30-day retention; the operator prunes older snapshots
  # after each successful one.
  maxRetention: 720h
  timeout: 1h
  storage:
    volumeSnapshot:
      volumeSnapshotClassName: mariadb-longhorn
