# https://github.com/mariadb-operator/mariadb-operator/blob/main/docs/physical_backup.md
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: PhysicalBackup
metadata:
  name: mariadb-daily-volume-snapshot
  namespace: supernote
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  mariaDbRef:
    name: mariadb
  # Midnight Lisbon time (the operator's robfig/cron v3 parser honors
  # CRON_TZ), between Velero (22:00) and the 01:00-06:30 upgrade and reboot
  # windows, next to the CloudNativePG snapshots (23:30 UTC).
  schedule:
    cron: "CRON_TZ=Europe/Lisbon 0 0 * * *"
    suspend: false
  # The default (Replica) never schedules on a standalone instance; the
  # operator holds FLUSH TABLES WITH READ LOCK on the primary while the
  # snapshot is cut, so it is consistent.
  target: PreferReplica
  # A week of in-volume snapshots, like the CloudNativePG backups; Velero
  # keeps 30 days off-site. The operator prunes older snapshots after each
  # successful one.
  maxRetention: 168h
  timeout: 1h
  storage:
    volumeSnapshot:
      volumeSnapshotClassName: mariadb-longhorn
