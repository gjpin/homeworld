---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mariadb
  namespace: supernote
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: mariadb
    template:
      metadata:
        labels:
          # Lets the MariaDB operator watch the Secret and reconcile password
          # changes into the instance's users.
          k8s.mariadb.com/watch: ""
  data:
    - secretKey: root-password
      remoteRef:
        key: /supernote/MARIADB_ROOT_PASSWORD
        decodingStrategy: None
    - secretKey: password
      remoteRef:
        key: /supernote/MARIADB_PASSWORD
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: valkey
  namespace: supernote
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: valkey
  data:
    - secretKey: password
      remoteRef:
        key: /supernote/VALKEY_PASSWORD
        decodingStrategy: None
