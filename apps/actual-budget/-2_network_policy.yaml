---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: actual-budget
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns
  namespace: actual-budget
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-actual-budget-gateway
  namespace: actual-budget
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: actual-budget
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gatewayclass: envoy-merged
      toPorts:
        - ports:
            - port: "5006"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # OIDC discovery at startup and the server-side token and UserInfo
  # exchange on every sign-in.
  name: allow-actual-budget-authelia
  namespace: actual-budget
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: actual-budget
  egress:
    # auth.base-domain.invalid through envoy-node-access (docs/network-policies.md).
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gatewayclass: envoy-merged
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
          serverNames:
            - auth.base-domain.invalid
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # Enable Banking bank sync: the server calls the API only when a user
  # links or syncs an account (sync-server app-enablebanking). The other
  # bank-sync providers (GoCardless, SimpleFIN, Pluggy.ai, Akahu) are not
  # allowed.
  name: allow-actual-budget-enablebanking
  namespace: actual-budget
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: actual-budget
  egress:
    - toFQDNs:
        - matchName: "api.enablebanking.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
