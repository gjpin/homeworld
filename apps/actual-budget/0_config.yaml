---
apiVersion: v1
kind: ConfigMap
metadata:
  name: actual-budget-config
  namespace: actual-budget
  labels:
    app.kubernetes.io/name: actual-budget
data:
  # https://actualbudget.org/docs/config/
  # Schema: packages/sync-server/src/load-config.js upstream.
  # IPv4 only, like the pod network (the upstream default is `::`).
  ACTUAL_HOSTNAME: "0.0.0.0"
  ACTUAL_PORT: "5006"
  # Envoy runs with use_remote_address=true and appends the real client
  # address to X-Forwarded-For. Trusting only the pod CIDR (the Envoy pods)
  # makes Express's req.ip, which keys the login rate limiter, that
  # address. The upstream default trusts every private range, including
  # the LAN, so a client could spoof addresses further left.
  ACTUAL_TRUSTED_PROXIES: "10.42.0.0/16"
  # Authelia is the only login method. The server bootstraps OpenID from
  # these variables on every start (the Deployment's startup probe holds
  # the pod un-Ready until that succeeds, so the server-password setup is
  # never reachable). The first OpenID user becomes the owner (admin);
  # in manual mode the owner adds every later user in the User Directory
  # with their Authelia username before they can sign in.
  ACTUAL_LOGIN_METHOD: "openid"
  ACTUAL_ALLOWED_LOGIN_METHODS: "openid"
  ACTUAL_OPENID_ENFORCE: "true"
  ACTUAL_USER_CREATION_MODE: "manual"
  # https://www.authelia.com/integration/openid-connect/clients/actual-budget/
  ACTUAL_OPENID_DISCOVERY_URL: "https://auth.base-domain.invalid"
  ACTUAL_OPENID_CLIENT_ID: "actual-budget"
  ACTUAL_OPENID_SERVER_HOSTNAME: "https://budget.base-domain.invalid"
  ACTUAL_OPENID_AUTH_METHOD: "oauth2"
  # Sessions last one week instead of the upstream default (never).
  ACTUAL_TOKEN_EXPIRATION: "604800"
  # The CORS proxy fetches the plugin store and arbitrary URLs for
  # frontend plugins; it is disabled upstream by default and stays off.
  ACTUAL_CORS_PROXY_ENABLED: "false"
