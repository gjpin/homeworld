---
# Actual sets its own Cross-Origin-Opener-Policy/Cross-Origin-Embedder-Policy
# headers (SharedArrayBuffer for its SQLite engine); the route must not add
# them a second time, or the browser fails with SharedArrayBufferMissing
# (https://actualbudget.org/docs/config/reverse-proxies).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: actual-budget
  namespace: actual-budget
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: actual-budget
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "budget.homeworld.internal"
  rules:
    - backendRefs:
        - name: actual-budget
          namespace: actual-budget
          kind: Service
          port: 5006
          group: ""
          weight: 1
