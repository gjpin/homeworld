---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbit-manage-secrets
  namespace: qbit-manage
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: qbit-manage-secrets
  data:
    # The stateless qBittorrent WebAPI key (qBittorrent 5.2+), read by
    # config.yml through !ENV.
    - secretKey: QBT_APIKEY
      remoteRef:
        key: /qbittorrent/WEBUI_API_KEY
        decodingStrategy: None
