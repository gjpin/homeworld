---
# The shared media library on the NAS (docs/nas.md): the homeworld-media
# share, exported with all_squash to its owner 20004. qbit_manage reads the
# torrent data at the paths qBittorrent reports (/data/torrents) to find
# orphans and missing hardlinks, and moves files to the recycle bin and the
# orphaned folder on the same share. Each consuming namespace binds its own
# static PersistentVolume to the same export (a PersistentVolume binds one
# claim); Retain keeps the data if the claim is deleted. Velero skips NFS
# volumes.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: homeworld-media-qbit-manage
  labels:
    app.kubernetes.io/name: qbit-manage
spec:
  capacity:
    storage: 20Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
  csi:
    driver: nfs.csi.k8s.io
    # Unique per PersistentVolume; the node plugin mounts the export named
    # in volumeAttributes.
    volumeHandle: 192.168.8.20#homeworld-media##qbit-manage
    volumeAttributes:
      server: 192.168.8.20
      share: /homeworld-media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
  namespace: qbit-manage
  labels:
    app.kubernetes.io/name: qbit-manage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: homeworld-media-qbit-manage
  resources:
    requests:
      storage: 20Ti
