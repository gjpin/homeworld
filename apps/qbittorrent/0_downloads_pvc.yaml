# Downloads live on the NAS (docs/nas.md): the homeworld-qbittorrent share,
# exported with all_squash to its owner 20003, mounted through the NFS CSI
# node plugin. A static PersistentVolume binds the claim to that one share;
# Retain keeps the data if the claim is ever deleted. Velero skips NFS
# volumes (its volume policy); the share has no snapshots on the NAS.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: homeworld-qbittorrent
  labels:
    app.kubernetes.io/name: qbittorrent
spec:
  capacity:
    storage: 10Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.1
  csi:
    driver: nfs.csi.k8s.io
    volumeHandle: 192.168.8.20#homeworld-qbittorrent##
    volumeAttributes:
      server: 192.168.8.20
      share: /homeworld-qbittorrent
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qbittorrent-downloads
  namespace: qbittorrent
  labels:
    app.kubernetes.io/name: qbittorrent
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: homeworld-qbittorrent
  resources:
    requests:
      storage: 10Ti
