---
# ProtonVPN over WireGuard is the only provider (docs/qbittorrent.md); the
# provider and tunnel type are literal values in 1_deployment.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-vpn
  namespace: qbittorrent
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: qbittorrent-vpn
  data:
    # Preferred ProtonVPN servers (gluetun server names).
    - secretKey: serverNames
      remoteRef:
        key: /qbittorrent/SERVER_NAMES
        decodingStrategy: None
    # ProtonVPN WireGuard credentials.
    - secretKey: wireguardPrivateKey
      remoteRef:
        key: /qbittorrent/WIREGUARD_PRIVATE_KEY
        decodingStrategy: None
    - secretKey: wireguardAddresses
      remoteRef:
        key: /qbittorrent/WIREGUARD_ADDRESSES
        decodingStrategy: None
    # API key for gluetun's HTTP control server, which is authenticated
    # since gluetun v3.39.1; the port-forward sync job parses the key back
    # out of this role JSON.
    - secretKey: controlRole
      remoteRef:
        key: /qbittorrent/GLUETUN_CONTROL_ROLE
        decodingStrategy: None
---
# WebUI credential pair, shared by the seeded qBittorrent.conf (as a PBKDF2
# hash) and the Homepage widget; the metrics exporter and the port-forward
# sync job authenticate with the stateless WebAPI key below instead.
# qBittorrent requires a username of at least 3 characters without a
# colon and a password of at least 6 characters.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-webui
  namespace: qbittorrent
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: qbittorrent-webui
  data:
    - secretKey: username
      remoteRef:
        key: /qbittorrent/WEBUI_USERNAME
        decodingStrategy: None
    - secretKey: password
      remoteRef:
        key: /qbittorrent/WEBUI_PASSWORD
        decodingStrategy: None
    # qBittorrent 5.2+ WebAPI key (Authorization: Bearer), seeded into
    # qBittorrent.conf and used by the metrics exporter and the port-forward
    # sync job, so neither headless consumer handles the WebUI password.
    - secretKey: webuiApiKey
      remoteRef:
        key: /qbittorrent/WEBUI_API_KEY
        decodingStrategy: None
