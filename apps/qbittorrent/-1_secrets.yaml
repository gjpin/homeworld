---
# Provider selection is data, not manifest structure: gluetun reads
# VPN_SERVICE_PROVIDER (protonvpn or private internet access — gluetun's
# literal provider identifiers, spaces included) and VPN_TYPE (wireguard for
# ProtonVPN, openvpn for Private Internet Access: gluetun supports PIA
# natively over OpenVPN only) and consumes only the credential set the
# active type needs; switching providers is a three key Infisical edit
# (VPN_SERVICE_PROVIDER, VPN_TYPE, and VPN_PORT_FORWARDING_PROVIDER
# mirroring the provider) plus a pod restart. The unused credential keys
# must still exist in Infisical (External Secrets fails the sync on a
# missing key) — hold a placeholder value for the inactive provider;
# gluetun validates credentials for the active VPN type only.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-vpn
  namespace: qbittorrent
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: qbittorrent-vpn
  data:
    - secretKey: vpnServiceProvider
      remoteRef:
        key: /qbittorrent/VPN_SERVICE_PROVIDER
        decodingStrategy: Auto
    # Tunnel protocol matching the provider: wireguard (ProtonVPN) or
    # openvpn (Private Internet Access).
    - secretKey: vpnType
      remoteRef:
        key: /qbittorrent/VPN_TYPE
        decodingStrategy: Auto
    - secretKey: vpnPortForwardingProvider
      remoteRef:
        key: /qbittorrent/VPN_PORT_FORWARDING_PROVIDER
        decodingStrategy: Auto
    - secretKey: serverNames
      remoteRef:
        key: /qbittorrent/SERVER_NAMES
        decodingStrategy: Auto
    # ProtonVPN WireGuard credentials (placeholder when using PIA, which
    # tunnels over OpenVPN with the credentials below instead).
    - secretKey: wireguardPrivateKey
      remoteRef:
        key: /qbittorrent/WIREGUARD_PRIVATE_KEY
        decodingStrategy: Auto
    - secretKey: wireguardAddresses
      remoteRef:
        key: /qbittorrent/WIREGUARD_ADDRESSES
        decodingStrategy: Auto
    # Private Internet Access credentials (placeholder when using ProtonVPN).
    - secretKey: openvpnUser
      remoteRef:
        key: /qbittorrent/OPENVPN_USER
        decodingStrategy: Auto
    - secretKey: openvpnPassword
      remoteRef:
        key: /qbittorrent/OPENVPN_PASSWORD
        decodingStrategy: Auto
    # API key for gluetun's HTTP control server, which is authenticated
    # since gluetun v3.39.1; the port-forward sync job parses the key back
    # out of this role JSON.
    - secretKey: controlRole
      remoteRef:
        key: /qbittorrent/GLUETUN_CONTROL_ROLE
        decodingStrategy: Auto
---
# WebUI credential pair, shared by the seeded qBittorrent.conf (as a PBKDF2
# hash) and the Homepage widget; the metrics exporter and the port-forward
# sync job authenticate with the stateless WebAPI key below instead.
# qBittorrent requires a username of at least 3 characters without a
# colon and a password of at least 6 characters.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: qbittorrent-webui
  namespace: qbittorrent
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: qbittorrent-webui
  data:
    - secretKey: username
      remoteRef:
        key: /qbittorrent/WEBUI_USERNAME
        decodingStrategy: Auto
    - secretKey: password
      remoteRef:
        key: /qbittorrent/WEBUI_PASSWORD
        decodingStrategy: Auto
    # qBittorrent 5.2+ WebAPI key (Authorization: Bearer), seeded into
    # qBittorrent.conf and used by the metrics exporter and the port-forward
    # sync job, so neither headless consumer handles the WebUI password.
    - secretKey: webuiApiKey
      remoteRef:
        key: /qbittorrent/WEBUI_API_KEY
        decodingStrategy: Auto
