# Downloads live on the NAS (docs/nas.md): the homeworld-media share,
# exported with all_squash to its owner 20004 and shared with the media
# stack, so the *arr imports hardlink from /data/torrents into /data/media
# instead of copying. Each consuming namespace binds its own static
# PersistentVolume to the same export (a PersistentVolume binds one claim);
# Retain keeps the data if the claim is ever deleted. Velero skips NFS
# volumes (its volume policy); the share has no snapshots on the NAS.
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: homeworld-media-qbittorrent
  labels:
    app.kubernetes.io/name: qbittorrent
spec:
  capacity:
    storage: 20Ti
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - nfsvers=4.2
  csi:
    driver: nfs.csi.k8s.io
    # Unique per PersistentVolume; the node plugin mounts the export named
    # in volumeAttributes.
    volumeHandle: 192.168.8.20#homeworld-media##qbittorrent
    volumeAttributes:
      server: 192.168.8.20
      share: /homeworld-media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: media
  namespace: qbittorrent
  labels:
    app.kubernetes.io/name: qbittorrent
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  volumeName: homeworld-media-qbittorrent
  resources:
    requests:
      storage: 20Ti
