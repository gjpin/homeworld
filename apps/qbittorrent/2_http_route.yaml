---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: qbittorrent
  namespace: qbittorrent
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "qbittorrent.base-domain.invalid"
  rules:
    - backendRefs:
        - name: qbittorrent
          namespace: qbittorrent
          kind: Service
          port: 8080
          group: ""
          weight: 1
