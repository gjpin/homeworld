---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vaultwarden-config
  namespace: vaultwarden
  labels:
    app.kubernetes.io/name: vaultwarden
data:
  # https://github.com/dani-garcia/vaultwarden/blob/main/.env.template
  DOMAIN: "https://vault.homeworld.internal"
  # Unprivileged port so the container can run as non-root.
  ROCKET_PORT: "8080"
  # Envoy Gateway runs with use_remote_address=true, which sets this header
  # to the trusted client address and strips client-supplied values.
  # X-Forwarded-For must not be used: Vaultwarden parses the leftmost
  # comma-separated entry, which clients can spoof.
  IP_HEADER: "X-Envoy-External-Address"
  # Closed registration: accounts are created only through admin-panel
  # invitations, which are emailed via the SMTP relay.
  SIGNUPS_ALLOWED: "false"
  SIGNUPS_VERIFY: "true"
  INVITATIONS_ALLOWED: "true"
  SHOW_PASSWORD_HINT: "false"
  # Wait up to two minutes for the CloudNativePG cluster during startup
  # instead of crash-looping while it becomes ready.
  DB_CONNECTION_RETRIES: "120"
  # Optional Authelia SSO. Master-password login stays enabled (SSO_ONLY
  # defaults to false) because the official Bitwarden Android app has a
  # known WebView rendering issue with Authelia's login page. SSO signups
  # are closed as well: only admin-invited emails can join through SSO.
  SSO_ENABLED: "true"
  SSO_AUTHORITY: "https://auth.homeworld.internal"
  SSO_CLIENT_ID: "vaultwarden"
  # Upstream vaultwarden always requests `openid` implicitly (SSO.md:
  # default "profile email", openid is implicit) and extends sessions with
  # the offline_access scope's refresh tokens. The `vaultwarden` scope with
  # role mapping exists only in the OIDCWarden fork; requesting it from
  # Authelia fails the authorization request with invalid_scope.
  SSO_SCOPES: "email profile offline_access"
  SSO_SIGNUPS_ALLOWED: "false"
  SSO_SIGNUPS_MATCH_EMAIL: "true"
  # Pin PKCE explicitly: SSO_PKCE currently defaults to true upstream, but
  # an upstream default flip would break SSO sign-in against Authelia
  # (which requires PKCE S256 for this client) with no visible config
  # change in this repo.
  SSO_PKCE: "true"
  # ORG_CREATION_USERS is left at its default ("all"): every member can
  # create organizations. Intended for this single-operator instance;
  # restrict to the admin's username here if more members join.
  # No SSO role mapping: the pinned upstream image has no sso_roles_*
  # settings (those env vars are silently ignored), so vaultwarden-admin
  # membership does not grant the admin role. Every SSO user gets the
  # default role; assign admins via the admin panel (ADMIN_TOKEN).
  # SMTP relay: implicit TLS on 465, matching the shared submissions relay.
  SMTP_SECURITY: "force_tls"
  SMTP_PORT: "465"
  SMTP_FROM: "vaultwarden@${BASE_DOMAIN}"
  SMTP_FROM_NAME: "Vaultwarden"
