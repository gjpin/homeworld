---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vaultwarden
  namespace: vaultwarden
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    external-dns.alpha.kubernetes.io/hostname: "vault.${BASE_DOMAIN}"
spec:
  parentRefs:
    - name: envoy
      namespace: vaultwarden
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "vault.${BASE_DOMAIN}"
  rules:
    - backendRefs:
        - name: vaultwarden
          namespace: vaultwarden
          kind: Service
          port: 8080
          group: ""
          weight: 1
