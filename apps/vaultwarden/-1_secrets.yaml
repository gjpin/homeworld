---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: vaultwarden
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: /vaultwarden/POSTGRES_USERNAME
        decodingStrategy: Auto
    - secretKey: password
      remoteRef:
        key: /vaultwarden/POSTGRES_PASSWORD
        decodingStrategy: Auto
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vaultwarden-secrets
  namespace: vaultwarden
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: vaultwarden-secrets
    template:
      engineVersion: v2
      type: Opaque
      data:
        ADMIN_TOKEN: "{{ .adminToken }}"
        # The password is embedded unescaped in the connection URL; it must
        # contain only RFC 3986 unreserved characters (see docs/secrets.md).
        DATABASE_URL: "postgresql://{{ .postgresUsername }}:{{ .postgresPassword }}@vaultwarden-rw.vaultwarden.svc.cluster.local:5432/vaultwarden"
        SMTP_USERNAME: "{{ .smtpUsername }}"
        SMTP_PASSWORD: "{{ .smtpPassword }}"
        SMTP_HOST: "{{ .smtpHost }}"
        SSO_CLIENT_SECRET: "{{ .ssoClientSecret }}"
  data:
    - secretKey: adminToken
      remoteRef:
        key: /vaultwarden/ADMIN_TOKEN
        decodingStrategy: Auto
    - secretKey: postgresUsername
      remoteRef:
        key: /vaultwarden/POSTGRES_USERNAME
        decodingStrategy: Auto
    - secretKey: postgresPassword
      remoteRef:
        key: /vaultwarden/POSTGRES_PASSWORD
        decodingStrategy: Auto
    - secretKey: smtpUsername
      remoteRef:
        key: /vaultwarden/SMTP_USERNAME
        decodingStrategy: Auto
    - secretKey: smtpPassword
      remoteRef:
        key: /vaultwarden/SMTP_PASSWORD
        decodingStrategy: Auto
    - secretKey: smtpHost
      remoteRef:
        key: /vaultwarden/SMTP_HOST
        decodingStrategy: Auto
    - secretKey: ssoClientSecret
      remoteRef:
        key: /authelia/OIDC_CLIENT_SECRET_VAULTWARDEN
        decodingStrategy: Auto
