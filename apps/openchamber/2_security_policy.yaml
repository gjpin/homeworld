---
# Gateway OIDC for ThinkRail. Authelia is the only login: ThinkRail has no
# accounts of its own, and the route requires the platform group
# (docs/oidc.md). The VM host's firewall keeps LAN and WireGuard clients off
# the VM's port, so this route is the only way in. StrategicMerge keeps this
# policy from overriding the Gateway-level CrowdSec extAuth.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authelia-oidc-thinkrail
  namespace: openchamber
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: thinkrail
  oidc:
    provider:
      issuer: https://auth.base-domain.invalid
      authorizationEndpoint: https://auth.base-domain.invalid/api/oidc/authorization
      tokenEndpoint: https://auth.base-domain.invalid/api/oidc/token
    clientID: envoy
    clientSecret:
      name: envoy-oidc-client-secret
    scopes:
      - openid
      - offline_access
    redirectURL: https://thinkrail.base-domain.invalid/oauth2/callback
    logoutPath: /logout
    cookieDomain: thinkrail.base-domain.invalid
    # ThinkRail's /ws upgrade checks no Origin: Lax keeps a browser from
    # sending the session to a WebSocket opened by another site.
    cookieConfig:
      sameSite: Lax
    forwardAccessToken: false
    refreshToken: true
    passThroughAuthHeader: false
