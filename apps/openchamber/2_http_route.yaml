---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openchamber
  namespace: openchamber
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: openchamber
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "openchamber.homeworld.internal"
  rules:
    - backendRefs:
        - name: openchamber
          namespace: openchamber
          kind: Service
          port: 3000
          group: ""
          weight: 1
---
# Paseo's daemon API is a WebSocket on the same port as its web UI; Envoy
# Gateway passes the upgrade through. The daemon checks the Host header
# against PASEO_HOSTNAMES (host/agents-vm/provision.sh).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paseo
  namespace: openchamber
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: openchamber
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "paseo.homeworld.internal"
  rules:
    - backendRefs:
        - name: paseo
          namespace: openchamber
          kind: Service
          port: 6767
          group: ""
          weight: 1
---
# ThinkRail's UI and its WebSocket share the port; Envoy Gateway's Authelia
# sign-in fronts the route (2_security_policy.yaml).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: thinkrail
  namespace: openchamber
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: openchamber
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "thinkrail.homeworld.internal"
  rules:
    - backendRefs:
        - name: thinkrail
          namespace: openchamber
          kind: Service
          port: 24242
          group: ""
          weight: 1
