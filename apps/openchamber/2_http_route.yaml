---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openchamber
  namespace: openchamber
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: openchamber
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "openchamber.homeworld.internal"
  rules:
    - backendRefs:
        - name: openchamber
          namespace: openchamber
          kind: Service
          port: 3000
          group: ""
          weight: 1
