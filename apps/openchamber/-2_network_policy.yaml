# No pod runs in this namespace: it only holds the Gateway listeners, routes
# and selectorless Services for the agents VM (0_services.yaml).
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: openchamber
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  ingress: []
  egress: []
