---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openchamber-credentials
  namespace: openchamber
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: openchamber-credentials
  data:
    - secretKey: OPENCHAMBER_UI_PASSWORD
      remoteRef:
        key: /openchamber/OPENCHAMBER_UI_PASSWORD
        decodingStrategy: None
    - secretKey: OPENAI_API_KEY
      remoteRef:
        key: /openchamber/OPENAI_API_KEY
        decodingStrategy: None
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: /openchamber/GITHUB_TOKEN
        decodingStrategy: None
