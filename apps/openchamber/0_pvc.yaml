---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openchamber-agent-home
  namespace: openchamber
  labels:
    app.kubernetes.io/name: openchamber
    app.kubernetes.io/instance: openchamber
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-crypto
  resources:
    requests:
      storage: 100Gi
