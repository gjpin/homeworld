---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cleanuparr
  namespace: cleanuparr
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "cleanuparr.base-domain.invalid"
  rules:
    - backendRefs:
        - name: cleanuparr
          namespace: cleanuparr
          kind: Service
          port: 11011
          group: ""
          weight: 1
