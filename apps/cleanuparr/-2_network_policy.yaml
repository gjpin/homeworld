              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cleanuparr-lidarr
  namespace: cleanuparr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: cleanuparr
  egress:
    - toEndpoints:
        - matchLabels:
