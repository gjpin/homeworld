---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # OIDC discovery, token and UserInfo calls to Authelia.
  name: allow-cleanuparr-authelia
  namespace: cleanuparr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: cleanuparr
  egress:
    - toFQDNs:
        - matchName: "auth.base-domain.invalid"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # Malware-blocker blocklists: the upstream lists on cleanuparr.pages.dev,
  # with the same files on raw.githubusercontent.com as the fallback. The
  # Status Check (cleanuparr-status.pages.dev) is disabled in the UI and
  # not allowed.
  name: allow-cleanuparr-blocklists
  namespace: cleanuparr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: cleanuparr
  egress:
    - toFQDNs:
        - matchName: "cleanuparr.pages.dev"
        - matchName: "raw.githubusercontent.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
