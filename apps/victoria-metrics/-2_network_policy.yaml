---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: victoria-metrics
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  ingress: []
  egress: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns
  namespace: victoria-metrics
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-victoria-ingress
  namespace: victoria-metrics
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gatewayclass: envoy-merged
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-collector
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/instance: otel-collector-cluster
            k8s:app.kubernetes.io/name: opentelemetry-collector
            k8s:component: standalone-collector
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector-node
            k8s:app.kubernetes.io/instance: otel-collector-node
            k8s:app.kubernetes.io/name: opentelemetry-collector
            k8s:component: agent-collector
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: grafana
            k8s:app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
            - port: "9428"
              protocol: TCP
            - port: "10428"
              protocol: TCP
