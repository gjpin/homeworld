---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: victoria-metrics
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  ingress: []
  egress: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns
  namespace: victoria-metrics
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # VictoriaMetrics (chart pod label victoria-metrics-single) on its API port: Envoy (public UI + OTLP metric ingestion), the three collectors' OTLP pushes, and Grafana's datasource proxy. One port per rule; the previous namespace-wide rule over-permitted cross-pod, cross-port access.
  name: allow-victoria-metrics-ingress
  namespace: victoria-metrics
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: victoria-metrics-single
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gatewayclass: envoy-merged
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-collector
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/instance: otel-collector-cluster
            k8s:app.kubernetes.io/name: opentelemetry-collector
            k8s:component: standalone-collector
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector-node
            k8s:app.kubernetes.io/instance: otel-collector-node
            k8s:app.kubernetes.io/name: opentelemetry-collector
            k8s:component: agent-collector
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: grafana
            k8s:app.kubernetes.io/name: grafana
        # vmalert queries the reboot-gating rules and writes ALERTS back.
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: victoria-metrics
            k8s:app.kubernetes.io/name: victoria-metrics-alert
            k8s:app.kubernetes.io/instance: vmalert
        # kured queries ALERTS before every reboot (apps/kured).
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kured
            k8s:app.kubernetes.io/name: kured
      toPorts:
        - ports:
            - port: "8428"
              protocol: TCP
---
