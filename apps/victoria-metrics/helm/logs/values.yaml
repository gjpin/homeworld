# https://docs.victoriametrics.com/helm/victoria-logs-single/
server:
  fullnameOverride: victoria-logs
  image:
    registry: docker.io
  retentionPeriod: "30d"
  # Delete the oldest data before the 5 GiB volume fills up.
  extraArgs:
    retention.maxDiskSpaceUsageBytes: "4GiB"
  runtimeClassName: gvisor
  podSecurityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 2000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    enabled: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
  persistentVolume:
    storageClassName: longhorn-crypto
    size: 5Gi
  serviceMonitor:
    enabled: true
    namespace: victoria-metrics
    interval: 60s
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 2Gi
