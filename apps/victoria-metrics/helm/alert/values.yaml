# https://docs.victoriametrics.com/helm/victoria-metrics-alert/
#
# vmalert evaluates the reboot-gating rules below against VictoriaMetrics and
# writes the resulting ALERTS series back into it. kured queries `ALERTS`
# through VictoriaMetrics' Prometheus API (apps/kured): any firing alert
# blocks the next node reboot. There is no Alertmanager; notifications go to
# the blackhole notifier.
serviceAccount:
  create: false
serviceMonitor:
  enabled: true
  interval: 60s
server:
  fullnameOverride: vmalert
  image:
    registry: docker.io
  runtimeClassName: gvisor
  datasource:
    url: http://victoria-metrics.victoria-metrics.svc.cluster.local:8428
  remoteWrite:
    url: http://victoria-metrics.victoria-metrics.svc.cluster.local:8428
  extraArgs:
    notifier.blackhole: "true"
    evaluationInterval: 30s
  podSecurityContext:
    enabled: true
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    enabled: true
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    readOnlyRootFilesystem: true
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi
      ephemeral-storage: 512Mi
  config:
    alerts:
      groups:
        - name: reboot-gate
          rules:
            # Longhorn robustness: 0 unknown (detached), 1 healthy,
            # 2 degraded, 3 faulted. A reboot while a replica rebuilds could
            # take the last healthy copy offline.
            - alert: LonghornVolumeNotHealthy
              expr: longhorn_volume_robustness > 1
              for: 2m
              annotations:
                summary: Longhorn volume {{ $labels.volume }} is not healthy.
            - alert: NodeNotReady
              expr: kube_node_status_condition{condition="Ready",status="true"} == 0
              for: 2m
              annotations:
                summary: Node {{ $labels.node }} is not Ready.
            # Also set while kured or system-upgrade-controller works on a
            # node, so the two never overlap.
            - alert: NodeCordoned
              expr: kube_node_spec_unschedulable == 1
              for: 1m
              annotations:
                summary: Node {{ $labels.node }} is cordoned.
            # Set by homeworld-postboot (host/files/libexec) when a node fails
            # its post-boot checks. A taint, because kured uncordons the node
            # it rebooted; it removes nothing it did not add.
            - alert: NodePostbootFailed
              expr: kube_node_spec_taint{key="node.homeworld/postboot-failed"} == 1
              for: 1m
              annotations:
                summary: Node {{ $labels.node }} failed its post-boot checks (journalctl -u homeworld-postboot).
            # Set by homeworld-pull (host/files/libexec) after every hourly
            # host/apply.sh run: False after a failed or timed-out run until
            # one succeeds. 90 minutes rides out one transient failure (a
            # GitHub outage), not two runs in a row.
            - alert: NodeHostApplyFailed
              expr: kube_node_status_condition{condition="HomeworldApply",status="false"} == 1
              for: 90m
              annotations:
                summary: Node {{ $labels.node }} failed to apply the host configuration (journalctl -u homeworld-pull).
            - alert: EtcdNoLeader
              expr: etcd_server_has_leader == 0
              for: 1m
              annotations:
                summary: etcd member {{ $labels.instance }} has no leader.
            - alert: EtcdMemberDown
              expr: count(etcd_server_has_leader == 1) < 3
              for: 2m
              annotations:
                summary: Fewer than three etcd members report a leader.
            # kubeletstats volume metrics arrive over OTLP with dotted names.
            - alert: PersistentVolumeFillingUp
              expr: |-
                1 - {__name__="k8s.volume.available"} / {__name__="k8s.volume.capacity"} > 0.8
              for: 15m
              annotations:
                summary: Volume {{ index $labels "k8s.persistentvolumeclaim.name" }} is over 80% full.
