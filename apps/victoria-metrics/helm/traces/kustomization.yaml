apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: victoria-traces-single
    repo: https://victoriametrics.github.io/helm-charts/
    version: 0.1.11
    releaseName: victoria-traces
    namespace: victoria-metrics
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: ^victoria-traces$
      namespace: ^victoria-metrics$
    patch: |-
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: container-image-pull-policy,pod-networkpolicy,container-security-context-user-group-id
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: The workload intentionally runs as non-root UID/GID 1000 below kube-score's threshold, Cilium enforces the network boundary, and the pinned image is pulled IfNotPresent to reuse the node cache.
