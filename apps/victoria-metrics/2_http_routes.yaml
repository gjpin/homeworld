---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: victoria-metrics
  namespace: victoria-metrics
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    external-dns.alpha.kubernetes.io/hostname: "victoria-metrics.${BASE_DOMAIN}"
spec:
  parentRefs:
    - name: envoy
      namespace: victoria-metrics
      sectionName: victoria-metrics-https
  hostnames:
    - "victoria-metrics.${BASE_DOMAIN}"
  rules:
    - backendRefs:
        - name: victoria-metrics
          namespace: victoria-metrics
          kind: Service
          port: 8428
---
apiVersion: gateway.networking.k8s.io/v1
