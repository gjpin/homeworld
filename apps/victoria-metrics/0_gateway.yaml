# TODO: each application has a gateway, which are merged into a single one till
# cert-manager supports http routes for automatic certificates
# https://github.com/cert-manager/cert-manager/issues/6051
# https://gateway.envoyproxy.io/docs/tasks/security/tls-cert-manager/
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy
  namespace: victoria-metrics
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/tls-acme: "true"
spec:
  gatewayClassName: envoy-merged
  addresses:
    - type: IPAddress
      value: ${EXTERNAL_IP}
  listeners:
    - name: victoria-metrics-https
      protocol: HTTPS
      port: 443
      hostname: "victoria-metrics.${BASE_DOMAIN}"
      allowedRoutes:
        namespaces:
          from: all
      tls:
        mode: Terminate
        certificateRefs:
          - name: victoria-metrics-tls-cert
            kind: Secret
    - name: victoria-logs-https
      protocol: HTTPS
      port: 443
      hostname: "victoria-logs.${BASE_DOMAIN}"
      allowedRoutes:
        namespaces:
          from: all
      tls:
        mode: Terminate
        certificateRefs:
          - name: victoria-logs-tls-cert
            kind: Secret
    - name: victoria-traces-https
      protocol: HTTPS
      port: 443
      hostname: "victoria-traces.${BASE_DOMAIN}"
      allowedRoutes:
        namespaces:
          from: all
      tls:
        mode: Terminate
        certificateRefs:
          - name: victoria-traces-tls-cert
            kind: Secret
