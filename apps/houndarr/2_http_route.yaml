---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: houndarr
  namespace: houndarr
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "houndarr.base-domain.invalid"
  rules:
    - backendRefs:
        - name: houndarr-web
          namespace: houndarr
          kind: Service
          port: 8877
          group: ""
          weight: 1
