---
# Gateway OIDC in front of Houndarr's own login: Houndarr has no OIDC, so
# Authelia gates the route to the platform group (docs/oidc.md) and the
# built-in bcrypt login stays as a second layer. The Homepage widget calls
# the in-cluster Service with Houndarr's widget API key. StrategicMerge
# keeps this policy from overriding the Gateway-level CrowdSec extAuth.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authelia-oidc
  namespace: houndarr
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  mergeType: StrategicMerge
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: houndarr
  oidc:
    provider:
      issuer: https://auth.base-domain.invalid
      authorizationEndpoint: https://auth.base-domain.invalid/api/oidc/authorization
      tokenEndpoint: https://auth.base-domain.invalid/api/oidc/token
    clientID: envoy
    clientSecret:
      name: envoy-oidc-client-secret
    scopes:
      - openid
      - offline_access
    redirectURL: https://houndarr.base-domain.invalid/oauth2/callback
    logoutPath: /logout
    cookieDomain: houndarr.base-domain.invalid
    forwardAccessToken: false
    refreshToken: true
    passThroughAuthHeader: false
