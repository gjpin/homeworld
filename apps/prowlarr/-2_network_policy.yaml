    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: prowlarr
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gatewayclass: envoy-merged
      toPorts:
        - ports:
            - port: "9696"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-prowlarr-clients
  namespace: prowlarr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # In-cluster API clients, each with Prowlarr's API key. With
  # Authentication Method External the web UI hands the API key to anyone
  # who loads it, so ingress stays limited to Envoy (behind the gateway
  # OIDC) and these named clients:
  # sonarr: Torznab searches and grabs (indexers synced as Prowlarr proxies).
  # radarr: Torznab searches and grabs.
  # lidarr: Torznab searches and grabs.
  # bindery: indexer sync and Torznab searches.
  # homepage: service widget.
  # media-config: app sync links and the FlareSolverr proxy.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: prowlarr
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: sonarr
            k8s:app.kubernetes.io/name: sonarr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: radarr
            k8s:app.kubernetes.io/name: radarr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: lidarr
            k8s:app.kubernetes.io/name: lidarr
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: bindery
            k8s:app.kubernetes.io/name: bindery
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: homepage
            k8s:app.kubernetes.io/name: homepage
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media-config
            k8s:app.kubernetes.io/name: media-config
      toPorts:
        - ports:
            - port: "9696"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-prowlarr-metrics
  namespace: prowlarr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
