---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: prowlarr
  namespace: prowlarr
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "prowlarr.base-domain.invalid"
  rules:
    - backendRefs:
        - name: prowlarr
          namespace: prowlarr
          kind: Service
          port: 9696
          group: ""
          weight: 1
