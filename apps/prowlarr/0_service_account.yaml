---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prowlarr-app
  namespace: prowlarr
  labels:
    app.kubernetes.io/name: prowlarr
# Token hygiene only: the app never talks to the Kubernetes API. The name
# must not collide with the CloudNativePG cluster's ServiceAccount — CNPG
# derives the instance/initdb ServiceAccount name from the cluster name
# (prowlarr) and adopts an existing ServiceAccount with that name as-is, so
# an app-owned prowlarr ServiceAccount without a mounted token would leave
# the cluster's initdb Job unable to reach the API.
automountServiceAccountToken: false
