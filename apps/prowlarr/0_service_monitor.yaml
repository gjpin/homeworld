# exportarr serves Prowlarr's metrics (https://github.com/onedr0p/exportarr).
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: prowlarr
  namespace: prowlarr
  labels:
    app.kubernetes.io/name: prowlarr
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: prowlarr
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
