# https://cert-manager.io/docs/trust/trust-manager/installation/
crds:
  enabled: true
  keep: true
# Bundles source only the homeworld CA; consumers add it to their image's
# own public roots, so the bundled Debian CA package (an extra init
# container) is not needed.
defaultPackage:
  enabled: false
resources:
  requests:
    cpu: 10m
    memory: 64Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: "1"
    memory: 512Mi
    ephemeral-storage: 2Gi
podSecurityContext:
  runAsNonRoot: true
  # The ko-built image runs as the distroless nonroot user.
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
app:
  # trust-manager reads Bundle sources only from its trust namespace; keeping
  # it in its own namespace limits its secret access to the CA certificate
  # synced by ../-1_secrets.yaml (no private key).
  trust:
    namespace: trust-manager
  metrics:
    service:
      servicemonitor:
        enabled: true
        interval: 60s
