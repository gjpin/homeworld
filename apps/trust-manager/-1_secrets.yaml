---
# The homeworld root CA certificate only (no private key), the source of the
# homeworld-ca Bundle (2_bundle.yaml). trust-manager reads Bundle sources
# from its trust namespace, which is this one (helm/values.yaml).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homeworld-ca
  namespace: trust-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: homeworld-ca
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: /cert-manager/CA_CERT
        decodingStrategy: None
