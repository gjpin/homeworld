---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: trust-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  ingress: []
  egress: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns
  namespace: trust-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-kubernetes-api
  namespace: trust-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # Bundle, source Secret, and target ConfigMap reconciliation.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: trust-manager
      k8s:app.kubernetes.io/instance: trust-manager
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-webhook-ingress
  namespace: trust-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # kube-apiserver calls the Bundle validating webhook on the pod's 6443
  # (Service port 443).
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: trust-manager
      k8s:app.kubernetes.io/instance: trust-manager
  ingress:
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-metrics-scraping
  namespace: trust-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # The chart's ServiceMonitor scrapes the metrics port, paired with the
  # allow-otel-pod-scrape-trust-manager egress policy in apps/otel-collector.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: trust-manager
      k8s:app.kubernetes.io/instance: trust-manager
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-collector
      toPorts:
        - ports:
            - port: "9402"
              protocol: TCP
