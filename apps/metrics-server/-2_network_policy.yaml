---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: metrics-server
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  ingress: []
  egress: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns
  namespace: metrics-server
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-kubernetes-api
  namespace: metrics-server
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: metrics-server
      k8s:app.kubernetes.io/instance: metrics-server
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-kubelet-scraping
  namespace: metrics-server
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # Kubelet summary scraping uses the node IP over HTTPS 10250; the host
  # exception is limited to the kubelet port, matching the velero node-agent
  # and otel-collector-node kubelet policies.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: metrics-server
      k8s:app.kubernetes.io/instance: metrics-server
  egress:
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-apiserver-ingress
  namespace: metrics-server
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # kube-apiserver proxies the aggregated metrics.k8s.io APIService to the
  # metrics-server Service; the endpoint receives on the https pod port.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: metrics-server
      k8s:app.kubernetes.io/instance: metrics-server
  ingress:
    - fromEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-metrics-scraping
  namespace: metrics-server
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: metrics-server
      k8s:app.kubernetes.io/instance: metrics-server
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-collector
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
