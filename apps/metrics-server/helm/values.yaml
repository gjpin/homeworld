# https://artifacthub.io/packages/helm/metrics-server/metrics-server
#
# k3s's packaged metrics-server is disabled (host/files/k3s/config.yaml.in).
# Kubelet serving certificates rotate (the k3s kubelet-arg
# rotate-server-certificates; the kubelet-serving-cert-approver application
# approves the CSRs), so kubelets are scraped over verified TLS. No
# --kubelet-insecure-tls, and the chart's defaultArgs already prefer
# --kubelet-preferred-address-types=InternalIP, which matches the certificate
# SANs.
fullnameOverride: metrics-server

image:
  pullPolicy: IfNotPresent

# Required for the ServiceMonitor: the chart only emits the ServiceMonitor
# when metrics are enabled, and this adds
# --authorization-always-allow-paths=/metrics for the scrape endpoint.
metrics:
  enabled: true

serviceMonitor:
  enabled: true
  interval: 60s

# apiService.insecureSkipTLSVerify stays at the chart default (true): the
# metrics-server serves a self-signed certificate, and the chart provisions
# the APIService caBundle through helm lookup — which returns nil under
# Argo CD's offline render, so a verified APIService would end up
# unprovisioned and `kubectl top` would break. Accepted residual: the
# apiserver->metrics-server connection is cluster-internal, and the
# kubelet-side scrape itself is verified (see the header comment above —
# no --kubelet-insecure-tls).

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

# Merge with the chart's Restricted defaults (allowPrivilegeEscalation false,
# readOnlyRootFilesystem true, runAsNonRoot true, runAsUser 1000, dropped
# ALL capabilities, RuntimeDefault seccomp); the explicit group completes the
# upstream context.
securityContext:
  runAsGroup: 1000

resources:
  requests:
    cpu: 100m
    memory: 200Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: "1"
    memory: 2Gi
    ephemeral-storage: 2Gi
