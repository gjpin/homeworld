---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: syncthing
  namespace: syncthing
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    external-dns.alpha.kubernetes.io/hostname: "sync.${BASE_DOMAIN}"
spec:
  parentRefs:
    - name: envoy
      namespace: syncthing
  hostnames:
    - "sync.${BASE_DOMAIN}"
  rules:
    - backendRefs:
        - name: syncthing
          namespace: syncthing
          kind: Service
          port: 8384
