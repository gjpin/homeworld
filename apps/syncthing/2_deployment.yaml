# https://hub.docker.com/r/syncthing/syncthing/tags
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: syncthing
  namespace: syncthing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: syncthing
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: syncthing
    spec:
      hostUsers: false
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: disable-nat
          image: docker.io/syncthing/syncthing:2.0.16
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -ec
            - |
              cfg=/var/syncthing/config/config.xml
              mkdir -p /var/syncthing/config
              if [ ! -f "$cfg" ]; then
                syncthing generate --config=/var/syncthing/config --no-port-probing
              fi
              if [ -f "$cfg" ]; then
                sed -i 's|<natEnabled>true</natEnabled>|<natEnabled>false</natEnabled>|' "$cfg"
              fi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - mountPath: /var/syncthing
              name: syncthing
      containers:
        - name: syncthing
          image: docker.io/syncthing/syncthing:2.0.16
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
          env:
            - name: PGID
              value: "1000"
            - name: PUID
              value: "1000"
            - name: STGUIADDRESS
              value: "0.0.0.0:8384"
          ports:
            - containerPort: 8384
              protocol: TCP
            - containerPort: 22000
              protocol: TCP
            - containerPort: 22000
              protocol: UDP
          volumeMounts:
            - mountPath: /var/syncthing
              name: syncthing
      restartPolicy: Always
      volumes:
        - name: syncthing
          persistentVolumeClaim:
            claimName: syncthing
