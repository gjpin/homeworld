---
apiVersion: v1
kind: Service
metadata:
  name: syncthing
  namespace: syncthing
spec:
  type: ClusterIP
  ports:
    - name: gui
      port: 8384
      protocol: TCP
      targetPort: 8384
    - name: syncthing-tcp
      port: 22000
      protocol: TCP
      targetPort: 22000
    - name: syncthing-udp
      port: 22000
      protocol: UDP
      targetPort: 22000
  selector:
    app: syncthing
