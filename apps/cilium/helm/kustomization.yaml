apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: cilium
    repo: https://helm.cilium.io
    version: 1.20.2
    releaseName: cilium
    namespace: cilium
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  # --- gVisor for the pod-network Hubble control-plane components (the
  # chart has no runtimeClassName value). The cilium-agent and cilium-envoy
  # DaemonSets and the cilium-operator Deployment run hostNetwork and keep
  # the standard runtime (see docs/pod-security.md).
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^hubble-relay$
      namespace: ^cilium$
    patch: |-
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^hubble-ui$
      namespace: ^cilium$
    patch: |-
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
  # --- close-to-Restricted hardening for the privileged host-integration
  # components. The agent/envoy/operator run as root with eBPF/datapath
  # capabilities (documented privileged exceptions — see docs/pod-security.md),
  # but the chart templates do not expose allowPrivilegeEscalation or
  # runAsNonRoot for them, so pin both explicitly under securityContext: no
  # privilege escalation even for the root user, and an explicit (not
  # implicit) root declaration. The operator's chart-provided securityContext
  # already forbids privilege escalation; only the root declaration is added.
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: ^cilium$
      namespace: ^cilium$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/securityContext/allowPrivilegeEscalation
        value: false
      - op: add
        path: /spec/template/spec/containers/0/securityContext/runAsNonRoot
        value: false
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: ^cilium-envoy$
      namespace: ^cilium$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/securityContext/allowPrivilegeEscalation
        value: false
      - op: add
        path: /spec/template/spec/containers/0/securityContext/runAsNonRoot
        value: false
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^cilium-operator$
      namespace: ^cilium$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/securityContext/runAsNonRoot
        value: false
  # --- requests/limits for the cilium-agent init containers that ship
  # without them (install-cni-binaries already declares upstream cpu/memory
  # requests; only limits and the ephemeral-storage request are added so the
  # higher upstream values are preserved). Talos pre-mounts bpffs
  # (bpf.autoMount.enabled: false in values.yaml), so no privileged
  # mount-bpf-fs init container renders and the remaining inits are indexed
  # accordingly: config(0), apply-sysctl-overwrites(1), clean-cilium-state(2),
  # install-cni-binaries(3).
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: ^cilium$
      namespace: ^cilium$
    patch: |-
      - op: add
        path: /spec/template/spec/initContainers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
      - op: add
        path: /spec/template/spec/initContainers/1/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
      - op: add
        path: /spec/template/spec/initContainers/2/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
      - op: add
        path: /spec/template/spec/initContainers/3/resources/requests/ephemeral-storage
        value: 64Mi
      - op: add
        path: /spec/template/spec/initContainers/3/resources/limits
        value: {"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}
  # --- resource-scoped scanner exceptions
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: ^cilium$
      namespace: ^cilium$
    patch: |-
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1drop-net-raw-capability
        value: The cilium-agent requires the NET_RAW capability for the kube-proxy replacement datapath's raw packet handling.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1host-network
        value: Kube-proxy replacement requires the host network namespace for service load balancing and the BPF datapath; the host integration is documented in docs/pod-security.md.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1no-read-only-root-fs
        value: The pinned upstream agent image and its init containers write runtime state (generated CNI configuration, staged binaries) to their root filesystems.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1privilege-escalation-container
        value: The cilium-agent and its BPF init containers require SYS_ADMIN for the kube-proxy replacement datapath; they keep the preserved root context and cannot set allowPrivilegeEscalation false without breaking BPF setup.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1run-as-non-root
        value: The upstream agent image and its init containers run with the preserved root context required for BPF and host datapath access.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1sensitive-host-mounts
        value: The apply-sysctl-overwrites init container mounts host /proc to apply the chart's sysctl overwrites for the datapath.
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: ^cilium-envoy$
      namespace: ^cilium$
    patch: |-
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1host-network
        value: The standalone Envoy datapath requires the host network namespace for service load balancing.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1liveness-port
        value: The upstream chart probes the health endpoint on undeclared port 9878; the host-network datapath serves it without a containerPort declaration.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1no-read-only-root-fs
        value: The pinned upstream Envoy image writes to its root filesystem.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1readiness-port
        value: The upstream chart probes the health endpoint on undeclared port 9878; the host-network datapath serves it without a containerPort declaration.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1run-as-non-root
        value: The upstream Envoy datapath image keeps the chart's preserved root context for host-network service load balancing.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1startup-port
        value: The upstream chart probes the health endpoint on undeclared port 9878; the host-network datapath serves it without a containerPort declaration.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^cilium-operator$
      namespace: ^cilium$
    patch: |-
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1host-network
        value: The upstream chart runs the operator with hostNetwork for direct node datapath access.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1no-read-only-root-fs
        value: The pinned upstream operator image writes to its root filesystem.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1run-as-non-root
        value: The upstream operator image's security context is preserved; overriding its UID would break runtime file access.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^hubble-relay$
      namespace: ^cilium$
    patch: |-
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1liveness-port
        value: The upstream chart probes the gRPC health endpoint on undeclared port 4222 instead of a declared containerPort.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1readiness-port
        value: The upstream chart probes the gRPC health endpoint on undeclared port 4222 instead of a declared containerPort.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1startup-port
        value: The upstream chart probes the gRPC health endpoint on undeclared port 4222 instead of a declared containerPort.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^hubble-ui$
      namespace: ^cilium$
    patch: |-
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1no-read-only-root-fs
        value: The pinned upstream frontend and backend images write to their root filesystems.
