# https://artifacthub.io/packages/helm/cilium/cilium
# https://docs.cilium.io/en/stable/installation/k3s/
# https://docs.cilium.io/en/stable/network/kubernetes/kubeproxy-free/
#
# k3s prerequisites (see docs/cilium.md):
#   - k3s runs with flannel-backend: none, disable-network-policy and
#     disable-kube-proxy (host/files/k3s-config.yaml).
#   - Cluster-pool IPAM allocates pod CIDRs from the k3s default 10.42.0.0/16.
#   - systemd pre-mounts cgroup2 and bpffs on Fedora; the agent must not
#     remount them.
#   - SYS_MODULE is dropped from ciliumAgent and cleanCiliumState (SYSLOG is
#     dropped with it); host/apply.sh preloads the kernel modules instead.
#   - Every node is a k3s server: 127.0.0.1:6444 is the local kube-apiserver
#     (and the client load balancer on k3s agents) for the kube-proxy-free
#     API endpoint.

namespaceOverride: cilium

# --- kube-proxy replacement ---
# Cilium replaces kube-proxy; host-network agents reach the API server on
# the node itself. Neither local port fails over on a server, but the agent
# only needs the API while its own node's k3s (and kubelet) is up.
kubeProxyReplacement: "true"
k8sServiceHost: 127.0.0.1
k8sServicePort: "6444"
# Explicit (and deliberate): the hostNetwork agent would otherwise default to
# ClusterFirstWithHostNet, which sends agent DNS through the host resolver
# before the cluster. ClusterFirst keeps the agent's API discovery consistent
# with the Cilium DNS proxy on kube-dns.
dnsPolicy: ClusterFirst

# --- IPAM: cluster pool on the k3s default pod CIDR ---
ipam:
  mode: cluster-pool
  operator:
    clusterPoolIPv4PodCIDRList:
      - 10.42.0.0/16

# --- datapath ---
bpf:
  masquerade: true
  # systemd pre-mounts bpffs at /sys/fs/bpf just like cgroup2 below; the agent
  # must not remount it. Disabling the auto-mount also drops the privileged
  # mount-bpf-fs init container from the agent DaemonSet, and shifts the
  # remaining init containers down by one index (resource patches in
  # kustomization.yaml are indexed accordingly).
  autoMount:
    enabled: false
l7Proxy: true
localRedirectPolicies:
  # Renamed from the deprecated localRedirectPolicy key (still honored by
  # the pinned chart but flagged upstream).
  enabled: true
rollOutCiliumPods: true
# gVisor pods run their own network stack, so the socket-level load balancer
# (cgroup connect/sendmsg hooks) never sees their connections: without this
# they cannot reach any ClusterIP Service. Pods use per-packet service
# translation in the tc datapath instead; host-namespace sockets keep the
# socket-level fast path.
# https://docs.cilium.io/en/stable/network/kubernetes/kubeproxy-free/#socket-loadbalancer-bypass-in-pod-namespace
socketLB:
  hostNamespaceOnly: true

# --- Envoy Gateway virtual IP ---
# Every Gateway publishes the 192.168.8.50 Gateway VIP (reserved on the
# router, see docs/openwrt.md) through spec.addresses, which Envoy Gateway
# renders as the Envoy Service's spec.externalIPs. The kube-proxy replacement always
# load-balances external IPs (the chart has no separate toggle), and one node
# at a time answers ARP for it (../2_l2_announcement_policy.yaml). One
# announced Service stays far below the default client rate limit.
l2announcements:
  enabled: true

# --- agent security context ---
cgroup:
  autoMount:
    enabled: false
  hostRoot: /sys/fs/cgroup
# The Cilium host firewall stays disabled: the host-network agent/envoy/
# operator pods are outside Cilium policy scope either way, so node-level
# policy for them is accepted as absent (recorded in docs/network-policies.md).
securityContext:
  capabilities:
    ciliumAgent:
      - CHOWN
      - KILL
      - NET_ADMIN
      - NET_RAW
      - IPC_LOCK
      - SYS_ADMIN
      - SYS_RESOURCE
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    cleanCiliumState:
      - NET_ADMIN
      - SYS_ADMIN
      - SYS_RESOURCE

# --- operator ---
operator:
  replicas: 1
  rollOutPods: true
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: "1"
      memory: 512Mi
      ephemeral-storage: 2Gi
  prometheus:
    enabled: true
    serviceMonitor:
      enabled: true
      interval: 60s

# --- agent resources ---
resources:
  requests:
    cpu: 100m
    memory: 512Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: "2"
    memory: 1Gi
    ephemeral-storage: 2Gi

# --- observability ---
prometheus:
  enabled: true
  serviceMonitor:
    enabled: true
    # The monitoring.coreos.com CRDs are provided by the
    # prometheus-operator-crd app (docs/argocd.md).
    trustCRDsExist: true
    interval: 60s

hubble:
  enabled: true
  # The relay and UI pods run on gVisor (patched in via kustomization.yaml;
  # the chart has no runtimeClassName value), which cannot join a pod user
  # namespace yet, so they keep the host user namespace (docs/pod-security.md).
  # https://docs.cilium.io/en/stable/observability/metrics/
  # Static flow metrics exporter. The hubble ServiceMonitor scrapes the
  # hubble-metrics service; the cilium-agent ServiceMonitor only covers
  # the agent's own metrics port. OpenMetrics enables the httpV2
  # exemplars that tie metrics to traces (VictoriaTraces).
  metrics:
    enabled:
      - dns:query;ignoreAAAA
      - drop:sourceContext=identity;destinationContext=identity
      - tcp
      - flow
      - port-distribution
      - icmp
      - httpV2:exemplars=true;labelsContext=source_ip,source_namespace,source_workload,destination_ip,destination_namespace,destination_workload,traffic_direction;sourceContext=workload-name|reserved-identity;destinationContext=workload-name|reserved-identity
    enableOpenMetrics: true
    serviceMonitor:
      enabled: true
      interval: 60s
  relay:
    enabled: true
    rollOutPods: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
        ephemeral-storage: 64Mi
      limits:
        cpu: "1"
        memory: 512Mi
        ephemeral-storage: 2Gi
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        interval: 60s
  ui:
    enabled: true
    rollOutPods: true
    frontend:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
          ephemeral-storage: 64Mi
        limits:
          cpu: "1"
          memory: 256Mi
          ephemeral-storage: 2Gi
    backend:
      resources:
        requests:
          cpu: 10m
          memory: 64Mi
          ephemeral-storage: 64Mi
        limits:
          cpu: "1"
          memory: 256Mi
          ephemeral-storage: 2Gi

envoy:
  # Standalone Envoy DaemonSet (the embedded proxy is gone in 1.20).
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: "2"
      memory: 1Gi
      ephemeral-storage: 2Gi
  securityContext:
    capabilities:
      # Modern BPF/PERFMON capabilities instead of SYS_ADMIN; NET_BIND_SERVICE
      # is required for the Envoy process to bind privileged ports. The
      # kernel (>= 5.8) and containerd (>= 1.5) floors for BPF/PERFMON are
      # satisfied by the Fedora kernel and the k3s-bundled containerd.
      keepCapNetBindService: true
      envoy:
        - NET_ADMIN
        - BPF
        - PERFMON
        - NET_BIND_SERVICE
  prometheus:
    serviceMonitor:
      enabled: true
      interval: 60s

# --- pod-to-pod encryption ---
# https://docs.cilium.io/en/stable/security/network/encryption-wireguard/
encryption:
  enabled: true
  type: wireguard

# Envoy Gateway owns Gateway API in this cluster; Cilium's own Gateway API
# implementation stays disabled.
gatewayAPI:
  enabled: false
