# https://github.com/prometheus-operator/prometheus-operator/releases
# https://github.com/prometheus-operator/prometheus-operator/tree/main/example/prometheus-operator-crd
#
# Pruning is deliberately NOT enabled (automated.prune unset), like every
# other CRD-only Application in this repo: garbage-collecting the
# ServiceMonitor/PodMonitor/... definitions would cascade-delete every live
# monitor and blind the telemetry pipeline. The accepted trade-off: when an
# upstream bundle bump drops a CRD, the stale definition stays until it is
# removed by hand (one owner, no ServerSideApply fights in the meantime).
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus-operator-crd
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: prometheus-operator-crd
  syncPolicy:
    automated:
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - ServerSideApply=true
  source:
    repoURL: https://github.com/prometheus-operator/prometheus-operator.git
    targetRevision: v0.95.0
    path: example/prometheus-operator-crd-full
