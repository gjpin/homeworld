---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: notesnook-sync
  namespace: notesnook
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "notes.base-domain.invalid"
  rules:
    - backendRefs:
        - name: notesnook-sync
          namespace: notesnook
          kind: Service
          port: 5264
          group: ""
          weight: 1
