---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: notesnook-sync
  namespace: notesnook
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    external-dns.alpha.kubernetes.io/hostname: "notes.${BASE_DOMAIN}"
spec:
  parentRefs:
    - name: envoy
      namespace: notesnook
      sectionName: notes-https
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "notes.${BASE_DOMAIN}"
  rules:
    - backendRefs:
        - name: notesnook-sync
          namespace: notesnook
          kind: Service
          port: 5264
          group: ""
          weight: 1
