---
apiVersion: v1
kind: Service
metadata:
  name: notesnook-identity
  namespace: notesnook
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: notesnook-identity
    app.kubernetes.io/instance: notesnook
spec:
  type: ClusterIP
  ports:
    - port: 8264
      targetPort: 8264
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: notesnook-identity
    app.kubernetes.io/instance: notesnook
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notesnook-identity
  namespace: notesnook
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: notesnook-identity
    app.kubernetes.io/instance: notesnook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notesnook-identity
      app.kubernetes.io/instance: notesnook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notesnook-identity
        app.kubernetes.io/instance: notesnook
    spec:
      runtimeClassName: gvisor
      hostUsers: false
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/homelab: homelab
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: build-trust-bundle
          image: docker.io/streetwriters/identity:v1.0-beta.38
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - 'cat /etc/ssl/certs/ca-certificates.crt /ca/ca.crt > /trust/bundle.crt && chmod 0644 /trust/bundle.crt'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: documentdb-ca
              mountPath: /ca
              readOnly: true
            - name: trust-bundle
              mountPath: /trust
      containers:
        - name: identity
          image: docker.io/streetwriters/identity:v1.0-beta.38
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8264
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          env:
            - name: SELF_HOSTED
              value: "1"
            - name: INSTANCE_NAME
              value: "homeworld"
            # Closed registration: self-hosted Notesnook has no invite or
            # admin flow, so signups on the public auth/sync/SSE hostnames
            # are disabled; flip back temporarily to create accounts.
            - name: DISABLE_SIGNUPS
              value: "true"
            - name: NOTESNOOK_SERVER_HOST
              value: "notesnook-sync"
            - name: NOTESNOOK_SERVER_PORT
              value: "5264"
            - name: IDENTITY_SERVER_HOST
              value: "notesnook-identity"
            - name: IDENTITY_SERVER_PORT
              value: "8264"
            - name: SSE_SERVER_HOST
              value: "notesnook-sse"
            - name: SSE_SERVER_PORT
              value: "7264"
            - name: IDENTITY_SERVER_URL
              value: "https://auth.notes.${BASE_DOMAIN}"
            - name: NOTESNOOK_APP_HOST
              value: "https://notes.${BASE_DOMAIN}"
            - name: DOCUMENTDB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: notesnook-documentdb-credentials
                  key: username
            - name: DOCUMENTDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: notesnook-documentdb-credentials
                  key: password
            - name: MONGODB_CONNECTION_STRING
              value: "mongodb://$(DOCUMENTDB_USERNAME):$(DOCUMENTDB_PASSWORD)@documentdb-service-notesnook:10260/identity?directConnection=true&authMechanism=SCRAM-SHA-256&tls=true&tlsCAFile=/etc/documentdb-ca/ca.crt&replicaSet=rs0"
            - name: MONGODB_DATABASE_NAME
              value: "identity"
            - name: NOTESNOOK_API_SECRET
              valueFrom:
                secretKeyRef:
                  name: notesnook-secrets
                  key: NOTESNOOK_API_SECRET
            # .NET honors OpenSSL's SSL_CERT_FILE for SslStream trust on Linux.
            # The bundle (system CAs + DocumentDB gateway CA) is built by the
            # build-trust-bundle init container.
            - name: SSL_CERT_FILE
              value: /trust/bundle.crt
          volumeMounts:
            - name: documentdb-ca
              mountPath: /etc/documentdb-ca
              readOnly: true
            - name: trust-bundle
              mountPath: /trust
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: documentdb-ca
          secret:
            # The gateway serves a self-signed cert; its own TLS secret
            # carries the matching CA (notesnook-ca does not sign it).
            secretName: notesnook-gateway-cert-tls
            items:
              - key: ca.crt
                path: ca.crt
        - name: trust-bundle
          emptyDir: {}
