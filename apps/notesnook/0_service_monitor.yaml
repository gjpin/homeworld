# https://github.com/streetwriters/notesnook-sync-server
---
# The sync server exposes its OpenTelemetry Prometheus exporter on the
# dedicated metrics port; the scraping endpoint only answers on that local
# port, so the monitor must target it instead of the API port.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: notesnook-sync
  namespace: notesnook
  labels:
    app.kubernetes.io/name: notesnook-sync
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: notesnook-sync
      app.kubernetes.io/instance: notesnook
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
