---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: notesnook-sync
  namespace: notesnook
  labels:
    app.kubernetes.io/name: notesnook-sync
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: notesnook-sync
      app.kubernetes.io/instance: notesnook
  endpoints:
    - port: http
      path: /health
      interval: 60s
