---
apiVersion: v1
kind: Service
metadata:
  name: notesnook-monograph
  namespace: notesnook
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: notesnook-monograph
    app.kubernetes.io/instance: notesnook
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: notesnook-monograph
    app.kubernetes.io/instance: notesnook
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notesnook-monograph
  namespace: notesnook
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: notesnook-monograph
    app.kubernetes.io/instance: notesnook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notesnook-monograph
      app.kubernetes.io/instance: notesnook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notesnook-monograph
        app.kubernetes.io/instance: notesnook
    spec:
      runtimeClassName: gvisor
      hostUsers: false
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/homelab: homelab
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: monograph
          image: docker.io/streetwriters/monograph:1.3.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: NODE_ENV
              value: "production"
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: API_HOST
              value: "http://notesnook-sync:5264"
            - name: PUBLIC_URL
              value: "https://monograph.notes.${BASE_DOMAIN}"
            - name: SELF_HOSTED
              value: "1"
            - name: NOTESNOOK_SERVER_HOST
              value: "notesnook-sync"
            - name: NOTESNOOK_SERVER_PORT
              value: "5264"
            - name: IDENTITY_SERVER_HOST
              value: "notesnook-identity"
            - name: IDENTITY_SERVER_PORT
              value: "8264"
            - name: SSE_SERVER_HOST
              value: "notesnook-sse"
            - name: SSE_SERVER_PORT
              value: "7264"
            # Link generation only; runtime server-to-server calls use the internal *_HOST/*_PORT vars.
            - name: IDENTITY_SERVER_URL
              value: "https://auth.notes.${BASE_DOMAIN}"
            - name: NOTESNOOK_APP_HOST
              value: "https://notes.${BASE_DOMAIN}"
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
