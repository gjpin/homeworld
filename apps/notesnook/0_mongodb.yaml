---
apiVersion: v1
kind: Service
metadata:
  name: notesnook-mongodb
  namespace: notesnook
  labels:
    app.kubernetes.io/name: notesnook-mongodb
    app.kubernetes.io/instance: notesnook
spec:
  type: ClusterIP
  clusterIP: None
  ports:
    - port: 27017
      targetPort: 27017
      protocol: TCP
      name: mongodb
  selector:
    app.kubernetes.io/name: notesnook-mongodb
    app.kubernetes.io/instance: notesnook
---
apiVersion: v1
kind: Service
metadata:
  name: notesnook-mongodb-0
  namespace: notesnook
  labels:
    app.kubernetes.io/name: notesnook-mongodb
    app.kubernetes.io/instance: notesnook
spec:
  type: ClusterIP
  ports:
    - port: 27017
      targetPort: 27017
      protocol: TCP
      name: mongodb
  selector:
    app.kubernetes.io/name: notesnook-mongodb
    app.kubernetes.io/instance: notesnook
    statefulset.kubernetes.io/pod-name: notesnook-mongodb-0
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: notesnook-mongodb
  namespace: notesnook
  labels:
    app.kubernetes.io/name: notesnook-mongodb
    app.kubernetes.io/instance: notesnook
spec:
  serviceName: notesnook-mongodb
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notesnook-mongodb
      app.kubernetes.io/instance: notesnook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notesnook-mongodb
        app.kubernetes.io/instance: notesnook
    spec:
      runtimeClassName: gvisor
      hostUsers: false
      nodeSelector:
        node-role.kubernetes.io/homelab: homelab
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongodb
          image: mongo:8.3.11
          imagePullPolicy: IfNotPresent
          command:
            - mongod
            - --replSet
            - rs0
            - --bind_ip_all
          ports:
            - name: mongodb
              containerPort: 27017
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data/db
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            exec:
              command:
                - bash
                - -c
                - |
                  mongosh --eval "try { rs.status() } catch (err) { rs.initiate() }; db.adminCommand('ping')" --quiet
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: longhorn-crypto
        resources:
          requests:
            storage: 10Gi
