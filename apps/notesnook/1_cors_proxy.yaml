---
apiVersion: v1
kind: Service
metadata:
  name: notesnook-cors-proxy
  namespace: notesnook
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: notesnook-cors-proxy
    app.kubernetes.io/instance: notesnook
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: notesnook-cors-proxy
    app.kubernetes.io/instance: notesnook
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notesnook-cors-proxy
  namespace: notesnook
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    app.kubernetes.io/name: notesnook-cors-proxy
    app.kubernetes.io/instance: notesnook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notesnook-cors-proxy
      app.kubernetes.io/instance: notesnook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notesnook-cors-proxy
        app.kubernetes.io/instance: notesnook
    spec:
      runtimeClassName: gvisor
      hostUsers: false
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/homelab: homelab
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cors-proxy
          image: docker.io/streetwriters/cors-proxy:v1.0-beta.38
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "3000"
            - name: ALLOWED_ORIGINS
              value: "*"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
