---
apiVersion: v1
kind: Service
metadata:
  name: notesnook-themes
  namespace: notesnook
  labels:
    app.kubernetes.io/name: notesnook-themes
    app.kubernetes.io/instance: notesnook
spec:
  type: ClusterIP
  ports:
    - port: 9000
      targetPort: 9000
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: notesnook-themes
    app.kubernetes.io/instance: notesnook
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notesnook-themes
  namespace: notesnook
  labels:
    app.kubernetes.io/name: notesnook-themes
    app.kubernetes.io/instance: notesnook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notesnook-themes
      app.kubernetes.io/instance: notesnook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notesnook-themes
        app.kubernetes.io/instance: notesnook
    spec:
      runtimeClassName: gvisor
      hostUsers: false
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/homelab: homelab
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init-themes-data
          image: busybox:1.37.0
          command:
            - sh
            - -c
            - 'if [ ! -f /data/installs.json ]; then echo "{}" > /data/installs.json; fi'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          volumeMounts:
            - name: themes-data
              mountPath: /data
        # The server skips its initial `git clone` when the repo dir already
        # exists, but the themes-repo emptyDir always exists (even when empty),
        # so a fresh pod goes straight to `git pull` and crashes. Pre-clone
        # here so the mount always holds a usable checkout.
        - name: clone-themes-repo
          image: streetwriters/themes-server:1.0.4
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - 'if [ ! -d /repo/.git ]; then git clone --depth 1 https://github.com/streetwriters/notesnook-themes.git /repo; fi'
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: themes-repo
              mountPath: /repo
      containers:
        - name: themes
          image: streetwriters/themes-server:1.0.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 9000
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "9000"
            - name: THEMES_REPO_URL
              value: "https://github.com/streetwriters/notesnook-themes.git"
            # The cloned repo lives on the themes-repo emptyDir mount. On
            # restart the server runs `git pull` from the repo's parent dir,
            # and git refuses to cross that mount boundary by default.
            - name: GIT_DISCOVERY_ACROSS_FILESYSTEM
              value: "1"
            # The checkout is created by the clone-themes-repo init container;
            # mark it safe so `git pull` does not fail on dubious ownership.
            - name: GIT_CONFIG_COUNT
              value: "1"
            - name: GIT_CONFIG_KEY_0
              value: safe.directory
            - name: GIT_CONFIG_VALUE_0
              value: /app/notesnook-themes
          volumeMounts:
            - name: themes-data
              mountPath: /installs.json
              subPath: installs.json
            # The server clones the themes repo into <dist>/../notesnook-themes
            # (/app/notesnook-themes, not configurable). /app is root-owned and
            # the pod runs as UID 1000, so git clone fails with EACCES without
            # a writable mount here (fsGroup 1000 chowns the emptyDir).
            - name: themes-repo
              mountPath: /app/notesnook-themes
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
      volumes:
        - name: themes-data
          persistentVolumeClaim:
            claimName: notesnook-themes-data
        - name: themes-repo
          emptyDir: {}
