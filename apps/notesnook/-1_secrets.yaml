---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notesnook-secrets
  namespace: notesnook
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: notesnook-secrets
    template:
      type: Opaque
  data:
    - secretKey: NOTESNOOK_API_SECRET
      remoteRef:
        key: /notesnook/NOTESNOOK_API_SECRET
        decodingStrategy: None
    - secretKey: RUSTFS_ACCESS_KEY
      remoteRef:
        key: /notesnook/RUSTFS_ACCESS_KEY
        decodingStrategy: None
    - secretKey: RUSTFS_SECRET_KEY
      remoteRef:
        key: /notesnook/RUSTFS_SECRET_KEY
        decodingStrategy: None
    - secretKey: SMTP_USERNAME
      remoteRef:
        key: /notesnook/SMTP_USERNAME
        decodingStrategy: None
    - secretKey: SMTP_PASSWORD
      remoteRef:
        key: /notesnook/SMTP_PASSWORD
        decodingStrategy: None
    - secretKey: SMTP_HOST
      remoteRef:
        key: /notesnook/SMTP_HOST
        decodingStrategy: None
    - secretKey: SMTP_PORT
      remoteRef:
        key: /notesnook/SMTP_PORT
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: notesnook-documentdb-credentials
  namespace: notesnook
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: notesnook-documentdb-credentials
    template:
      type: Opaque
  data:
    - secretKey: username
      remoteRef:
        key: /notesnook/DOCUMENTDB_USERNAME
        decodingStrategy: None
    - secretKey: password
      remoteRef:
        key: /notesnook/DOCUMENTDB_PASSWORD
        decodingStrategy: None
