---
apiVersion: v1
kind: Service
metadata:
  name: notesnook-inbox
  namespace: notesnook
  labels:
    app.kubernetes.io/name: notesnook-inbox
    app.kubernetes.io/instance: notesnook
spec:
  type: ClusterIP
  ports:
    - port: 5181
      targetPort: 5181
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: notesnook-inbox
    app.kubernetes.io/instance: notesnook
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notesnook-inbox
  namespace: notesnook
  labels:
    app.kubernetes.io/name: notesnook-inbox
    app.kubernetes.io/instance: notesnook
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: notesnook-inbox
      app.kubernetes.io/instance: notesnook
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notesnook-inbox
        app.kubernetes.io/instance: notesnook
    spec:
      runtimeClassName: gvisor
      hostUsers: false
      automountServiceAccountToken: false
      nodeSelector:
        node-role.kubernetes.io/homelab: homelab
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: inbox-api
          image: docker.io/streetwriters/notesnook-inbox:v1.0-beta.38
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5181
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: HOST
              value: "0.0.0.0"
            - name: PORT
              value: "5181"
            - name: NOTESNOOK_API_SERVER_URL
              value: "http://notesnook-sync:5264"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
