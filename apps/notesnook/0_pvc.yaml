kind: PersistentVolumeClaim
metadata:
  name: notesnook-themes-data
  namespace: notesnook
  labels:
    app.kubernetes.io/name: notesnook-themes
    app.kubernetes.io/instance: notesnook
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn-crypto
  resources:
    requests:
      storage: 1Gi
