---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # AI BYOK providers: the four built-in providers (OpenAI, Anthropic,
  # Gemini, fal) plus the OpenAI-compatible endpoints documented for
  # workspace owners (OpenRouter, Mistral, DeepSeek, OpenCode Zen). Any other
  # custom endpoint a workspace adds needs its host here first. Exa (AI web
  # search) and Unsplash (image search) use the keys in config.json.
  name: allow-affine-ai-providers
  namespace: affine
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: affine
  egress:
    - toFQDNs:
        - matchName: "api.openai.com"
        - matchName: "api.anthropic.com"
        - matchName: "generativelanguage.googleapis.com"
        - matchName: "fal.run"
        - matchName: "queue.fal.run"
        - matchName: "rest.fal.ai"
        - matchName: "fal.media"
        - matchPattern: "*.fal.media"
        - matchName: "openrouter.ai"
        - matchName: "api.mistral.ai"
        - matchName: "api.deepseek.com"
        - matchName: "opencode.ai"
        - matchName: "api.exa.ai"
        - matchName: "api.unsplash.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
