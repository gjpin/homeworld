---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-affine-dragonfly-ingress
  namespace: affine
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: dragonfly
  ingress:
    # The operator's readiness and role checks use the admin port.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: dragonfly-operator
            k8s:app.kubernetes.io/name: dragonfly-operator
      toPorts:
        - ports:
            - port: "9999"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: affine
            k8s:app.kubernetes.io/name: affine
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # Operand admin/metrics endpoint (port 9999) scraped by the PodMonitor.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-collector
      toPorts:
        - ports:
            - port: "9999"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-manticore-ingress
  namespace: affine
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: manticoresearch
      k8s:app.kubernetes.io/component: worker
  ingress:
    # AFFiNE's indexer talks to the HTTP JSON API.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: affine
            k8s:app.kubernetes.io/name: affine
      toPorts:
        - ports:
            - port: "9308"
              protocol: TCP
    # The chart's ServiceMonitor scrapes /metrics on the same HTTP port.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-collector
      toPorts:
        - ports:
            - port: "9308"
              protocol: TCP
    # The worker's replication supervisor reaches searchd through the pod's
    # own DNS name (SQL 9306, binary 9312, replication 9315-9415).
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: affine
            k8s:app.kubernetes.io/name: manticoresearch
            k8s:app.kubernetes.io/component: worker
      toPorts:
        - ports:
            - port: "9306"
              protocol: TCP
            - port: "9312"
              protocol: TCP
            - port: "9315"
              endPort: 9415
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-manticore-egress
  namespace: affine
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: manticoresearch
      k8s:app.kubernetes.io/component: worker
  egress:
    # The worker's replication supervisor (replica.php) discovers its peers
    # through the Kubernetes API.
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: affine
            k8s:app.kubernetes.io/name: manticoresearch
            k8s:app.kubernetes.io/component: worker
      toPorts:
        - ports:
            - port: "9306"
              protocol: TCP
            - port: "9312"
              protocol: TCP
            - port: "9315"
              endPort: 9415
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # CloudNativePG's instance manager watches its Cluster through the API server,
  # the operator reads each instance's status port, and instances and their
  # bootstrap Jobs replicate from each other.
  name: allow-affine-postgres-instance
  namespace: affine
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:cnpg.io/cluster: affine
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cloudnative-pg
            k8s:app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: affine
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: affine
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
