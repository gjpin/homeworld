---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: affine-app
  namespace: affine
  labels:
    app.kubernetes.io/name: affine
# Token hygiene only: the app never talks to the Kubernetes API. The name
# must not collide with the CloudNativePG cluster's ServiceAccount — CNPG
# derives the instance/initdb ServiceAccount name from the cluster name
# (affine) and adopts an existing ServiceAccount with that name as-is, so an
# app-owned affine ServiceAccount without a mounted token would leave the
# cluster's initdb Job unable to reach the API.
automountServiceAccountToken: false
