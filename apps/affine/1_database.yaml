# https://cloudnative-pg.io/docs/1.28/declarative_database_management/
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: affine
  namespace: affine
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  name: affine
  owner: affine
  databaseReclaimPolicy: retain
  cluster:
    name: affine
  extensions:
    - name: vector
      ensure: present
    - name: pgcrypto
      ensure: present
