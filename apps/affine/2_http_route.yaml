---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: affine
  namespace: affine
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: affine
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "affine.homeworld.internal"
  rules:
    - backendRefs:
        - name: affine
          namespace: affine
          kind: Service
          port: 3010
          group: ""
          weight: 1
