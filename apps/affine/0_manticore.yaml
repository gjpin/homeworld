# https://github.com/manticoresoftware/manticoresearch-helm
# Wave 0 with the other datastores: AFFiNE's indexer connects to Manticore
# at startup, so the search worker must be healthy before the wave-1 server.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: affine-manticore
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: affine
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - ServerSideApply=true

  source:
    repoURL: https://github.com/gjpin/homeworld.git
    path: apps/affine/helm
    targetRevision: HEAD
    plugin:
      name: homeworld
