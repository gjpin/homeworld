---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: affine
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: /affine/POSTGRES_USERNAME
        decodingStrategy: None
    - secretKey: password
      remoteRef:
        key: /affine/POSTGRES_PASSWORD
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonfly
  namespace: affine
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: dragonfly
  data:
    - secretKey: password
      remoteRef:
        key: /affine/DRAGONFLY_PASSWORD
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine-secrets
  namespace: affine
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: affine-secrets
    template:
      engineVersion: v2
      type: Opaque
      data:
        # The password is embedded unescaped in the connection URL; it must
        # contain only RFC 3986 unreserved characters (see docs/secrets.md).
        DATABASE_URL: "postgresql://{{ .postgresUsername }}:{{ .postgresPassword }}@affine-rw.affine.svc.cluster.local:5432/affine"
  data:
    - secretKey: postgresUsername
      remoteRef:
        key: /affine/POSTGRES_USERNAME
        decodingStrategy: None
    - secretKey: postgresPassword
      remoteRef:
        key: /affine/POSTGRES_PASSWORD
        decodingStrategy: None
---
# The server's configuration directory ($HOME/.affine/config), mounted
# read-only into the server and migration containers. config.json carries
# credentials that AFFiNE accepts only through the file (the OIDC client
# secret, the RustFS keypair, the Exa and Unsplash keys), so it is rendered
# here instead of a ConfigMap; every secret value is JSON-encoded with toJson.
# private.key is the server's signing and encryption key: shipping it keeps
# the migration script from generating one into the read-only mount, and the
# server reads it from this directory at startup.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: affine-config
  namespace: affine
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: affine-config
    template:
      engineVersion: v2
      type: Opaque
      data:
        private.key: "{{ .privateKey }}"
        # Keys follow the release's config.schema.json (one object per
        # module, with the schema's dotted key names); anything unset keeps
        # its upstream default. The admin panel (/admin/settings) can
        # override these at runtime from the database.
        config.json: |
          {
            "server": {
              "name": "Homeworld AFFiNE",
              "externalUrl": "https://affine.homeworld.internal",
              "host": "affine.homeworld.internal",
              "https": true
            },
            "auth": {
              "allowSignup": false,
              "allowSignupForOauth": true
            },
            "oauth": {
              "providers.oidc": {
                "issuer": "https://auth.homeworld.internal",
                "clientId": "affine",
                "clientSecret": {{ .oidcClientSecret | toJson }},
                "allowPrivateNetwork": true,
                "args": {
                  "scope": "openid profile email"
                }
              }
            },
            "copilot": {
              "enabled": true,
              "byok.enabled": true,
              "byok.allowedProviders": ["openai", "anthropic", "gemini", "fal"],
              "byok.allowCustomEndpoint": true,
              "byok.allowPrivateEndpoint": false,
              "exa": {
                "key": {{ .exaApiKey | toJson }}
              },
              "unsplash": {
                "key": {{ .unsplashApiKey | toJson }}
              },
              "storage": {
                "provider": "aws-s3",
                "bucket": "affine-copilot",
                "config": {
                  "endpoint": "http://rustfs-io.rustfs.svc.cluster.local:9000",
                  "region": "us-east-1",
                  "forcePathStyle": true,
                  "usePresignedURL": {
                    "enabled": false
                  },
                  "credentials": {
                    "accessKeyId": {{ .rustfsAccessKey | toJson }},
                    "secretAccessKey": {{ .rustfsSecretKey | toJson }}
                  }
                }
              }
            },
            "storages": {
              "avatar.storage": {
                "provider": "aws-s3",
                "bucket": "affine-avatars",
                "config": {
                  "endpoint": "http://rustfs-io.rustfs.svc.cluster.local:9000",
                  "region": "us-east-1",
                  "forcePathStyle": true,
                  "usePresignedURL": {
                    "enabled": false
                  },
                  "credentials": {
                    "accessKeyId": {{ .rustfsAccessKey | toJson }},
                    "secretAccessKey": {{ .rustfsSecretKey | toJson }}
                  }
                }
              },
              "blob.storage": {
                "provider": "aws-s3",
                "bucket": "affine-blobs",
                "config": {
                  "endpoint": "http://rustfs-io.rustfs.svc.cluster.local:9000",
                  "region": "us-east-1",
                  "forcePathStyle": true,
                  "usePresignedURL": {
                    "enabled": false
                  },
                  "credentials": {
                    "accessKeyId": {{ .rustfsAccessKey | toJson }},
                    "secretAccessKey": {{ .rustfsSecretKey | toJson }}
                  }
                }
              }
            },
            "indexer": {
              "enabled": true,
              "provider.type": "manticoresearch",
              "provider.endpoint": "http://manticore-worker-svc.affine.svc.cluster.local:9308"
            },
            "calendar": {
              "caldav": {
                "enabled": true,
                "allowCustomProvider": false,
                "providers": [
                  {
                    "id": "opencloud",
                    "label": "OpenCloud",
                    "serverUrl": "https://cloud.homeworld.internal/caldav/",
                    "authType": "basic",
                    "requiresAppPassword": true
                  }
                ],
                "allowInsecureHttp": false,
                "allowedHosts": ["cloud.homeworld.internal"],
                "blockPrivateNetwork": false,
                "requestTimeoutMs": 10000,
                "maxRedirects": 5
              }
            },
            "metrics": {
              "enabled": true
            }
          }
  data:
    - secretKey: privateKey
      remoteRef:
        key: /affine/PRIVATE_KEY
        decodingStrategy: None
    - secretKey: oidcClientSecret
      remoteRef:
        key: /authelia/OIDC_CLIENT_SECRET_AFFINE
        decodingStrategy: None
    - secretKey: rustfsAccessKey
      remoteRef:
        key: /affine/RUSTFS_ACCESS_KEY
        decodingStrategy: None
    - secretKey: rustfsSecretKey
      remoteRef:
        key: /affine/RUSTFS_SECRET_KEY
        decodingStrategy: None
    - secretKey: exaApiKey
      remoteRef:
        key: /affine/EXA_API_KEY
        decodingStrategy: None
    - secretKey: unsplashApiKey
      remoteRef:
        key: /affine/UNSPLASH_API_KEY
        decodingStrategy: None
