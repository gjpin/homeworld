---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: manticore
  namespace: affine
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: manticore
  namespace: affine
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: manticore
subjects:
  - kind: ServiceAccount
    name: manticore
    namespace: affine
