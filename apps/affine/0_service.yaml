---
apiVersion: v1
kind: Service
metadata:
  name: affine
  namespace: affine
  labels:
    app.kubernetes.io/name: affine
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 3010
      protocol: TCP
      targetPort: http
    - name: metrics
      port: 9464
      protocol: TCP
      targetPort: metrics
  selector:
    app.kubernetes.io/name: affine
