---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: velero
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  ingress: []
  egress: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns
  namespace: velero
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-velero-kubernetes-api
  namespace: velero
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/instance: velero
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-velero-upgrade-hook-api
  namespace: velero
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:batch.kubernetes.io/job-name: velero-upgrade-crds
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-velero-backblaze
  namespace: velero
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # Both the server and the node-agent use the configured B2 bucket for
  # backups and CSI data movement; no other Internet destination is allowed.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/instance: velero
  egress:
    - toFQDNs:
        - matchName: "s3.${B2_REGION}.backblazeb2.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-velero-data-upload-egress
  namespace: velero
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # CSI snapshot data-mover pods are created in the velero namespace by the
  # node-agent DataUpload controller (pod name == DataUpload name) and carry
  # a velero.io/data-upload=<name> label instead of the Helm instance label
  # (velerov1api.DataUploadLabel, set as HostingPodLabels in
  # pkg/controller/data_upload_controller.go upstream), so they need their own
  # egress rules for the API server and the B2 backup storage. DNS is already
  # allowed namespace-wide by the allow-dns policy above.
  endpointSelector:
    matchExpressions:
      - key: k8s:velero.io/data-upload
        operator: Exists
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toFQDNs:
        - matchName: "s3.${B2_REGION}.backblazeb2.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-velero-data-download-egress
  namespace: velero
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # Restore-side counterpart of the data-upload policy: data-mover pods for
  # restores carry velero.io/data-download=<name> (velerov1api.DataDownloadLabel,
  # pkg/apis/velero/v1/labels_annotations.go upstream) instead of the Helm
  # instance label. Same egress needs: API server + B2 backup storage.
  endpointSelector:
    matchExpressions:
      - key: k8s:velero.io/data-download
        operator: Exists
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    - toFQDNs:
        - matchName: "s3.${B2_REGION}.backblazeb2.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-velero-metrics-ingress
  namespace: velero
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # The ServiceMonitor scrapes the server Deployment and the PodMonitor
  # scrapes the node-agent DaemonSet; both serve metrics on 8085.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/instance: velero
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-collector
      toPorts:
        - ports:
            - port: "8085"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-velero-node-agent-kubelet
  namespace: velero
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # The node-agent uses kubelet host integration for filesystem backups. Keep
  # the host exception to the kubelet HTTPS port; its hostPath mounts are not
  # a reason to permit arbitrary host egress.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/instance: velero
      k8s:name: node-agent
  egress:
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
