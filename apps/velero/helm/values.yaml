fullnameOverride: velero
initContainers:
  - name: velero-plugin-for-aws
    image: velero/velero-plugin-for-aws:v1.14.3
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: ${B2_BUCKET}
      prefix: velero
      default: true
      credential:
        name: velero-credentials
        key: cloud
      config:
        region: ${B2_REGION}
        s3Url: https://s3.${B2_REGION}.backblazeb2.com
        s3ForcePathStyle: "true"
  defaultSnapshotMoveData: true
  defaultVolumesToFsBackup: false
  features: EnableCSI
credentials:
  existingSecret: velero-credentials
deployNodeAgent: true
nodeSelector:
  node-role.kubernetes.io/homelab: homelab
nodeAgent:
  nodeSelector:
    node-role.kubernetes.io/homelab: homelab
metrics:
  enabled: true
  scrapeInterval: 60s
  serviceMonitor:
    enabled: true
schedules:
  daily:
    schedule: CRON_TZ=Europe/Lisbon 0 3 * * *
    template:
      ttl: 720h
      includedNamespaces:
        - '*'
      excludedNamespaces:
        - velero
      includeClusterResources: true
      snapshotMoveData: true
