fullnameOverride: velero
# Prefer the chart-native keys over kustomize patches (AGENTS.md): the
# Velero deployment runs under the gVisor runtime. The node-agent DaemonSet
# is a documented gVisor exception (kubelet hostPath integration — see
# docs/pod-security.md).
runtimeClassName: gvisor
initContainers:
  - name: velero-plugin-for-aws
    image: docker.io/velero/velero-plugin-for-aws:v1.14.4
    imagePullPolicy: IfNotPresent
    volumeMounts:
      - mountPath: /target
        name: plugins
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - ALL
      runAsNonRoot: true
      seccompProfile:
        type: RuntimeDefault
podSecurityContext:
  # The image's user is named (cnb), which runAsNonRoot cannot verify.
  runAsUser: 1002
  runAsGroup: 1000
  fsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
configuration:
  backupStorageLocation:
    - name: default
      provider: aws
      bucket: homeworld-velero
      prefix: velero
      default: true
      credential:
        name: velero-credentials
        key: cloud
      config:
        region: eu-central-003
        s3Url: https://s3.eu-central-003.backblazeb2.com
        s3ForcePathStyle: "true"
  defaultSnapshotMoveData: true
  defaultVolumesToFsBackup: false
  features: EnableCSI
# CSI snapshot data movement (snapshotMoveData) uploads volume data to the
# BackupStorageLocation object storage and deletes the CSI snapshot
# afterwards, so no provider VolumeSnapshotLocation is required: the upstream
# v1.18 CSI data-movement docs only require node-agent + BSL + the EnableCSI
# feature flag. Leaving this unset renders a dead default VSL with
# provider/credential null for the controller to reconcile, so disable it.
# backupsEnabled stays at its chart default (true) so the BSL still renders.
snapshotsEnabled: false
credentials:
  existingSecret: velero-credentials
# CRDs are applied declaratively through includeCRDs (ServerSideApply); the
# chart's upgrade-crds pre-upgrade hook Job would be an inert Helm hook
# under Argo and block chart bumps with its immutable spec.
upgradeCRDs: false
deployNodeAgent: true
nodeAgent:
  # Data-mover settings (the velero-node-agent-config ConfigMap below).
  extraArgs:
    - --node-agent-configmap=velero-node-agent-config
  # The node-agent reads other pods' volumes under /var/lib/kubelet/pods, each
  # labelled with its own pod's MCS categories, and kubelet's volume
  # metadata (container_var_lib_t); container_t can read neither under
  # SELinux enforcing, so it runs as spc_t (docs/pod-security.md).
  podSecurityContext:
    seLinuxOptions:
      type: spc_t
  # Close-to-Restricted hardening for the node-agent container; the pod stays
  # root (runAsUser 0 upstream default) for the kubelet hostPath mounts.
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    # The node-agent mounts host filesystems and must run as root —
    # documented privileged exception.
    runAsNonRoot: false
    seccompProfile:
      type: RuntimeDefault
metrics:
  enabled: true
  scrapeInterval: 60s
  serviceMonitor:
    # Pin emission instead of capability autodetection so the monitor
    # renders identically in local kustomize builds and live syncs.
    autodetect: false
    enabled: true
    namespace: velero
  # The PodMonitor covers the node-agent DaemonSet; enabling it also stops
  # the chart from annotating the pods with prometheus.io/scrape.
  nodeAgentPodMonitor:
    autodetect: false
    enabled: true
    namespace: velero
configMaps:
  # https://velero.io/docs/v1.18/data-movement-backup-pvc-configuration/
  # Velero's data mover clones each snapshot into a full-size temporary
  # volume; with one replica instead of three its peak disk use stays at the
  # volume's own size.
  node-agent-config:
    data:
      node-agent-config.json: |
        {"backupPVC": {"longhorn-crypto": {"storageClass": "longhorn-scratch"}}}
  # https://velero.io/docs/v1.18/resource-filtering/#resource-policies
  # NFS volumes have no VolumeSnapshotClass (the CSI snapshot would fail the
  # backup) and the NAS snapshots its own shares.
  volume-policy:
    data:
      policies.yaml: |
        version: v1
        volumePolicies:
          - conditions:
              csi:
                driver: nfs.csi.k8s.io
            action:
              type: skip
schedules:
  daily:
    # 22:00 Lisbon: outside the 01:00-06:30 upgrade and reboot windows.
    schedule: CRON_TZ=Europe/Lisbon 0 22 * * *
    template:
      resourcePolicy:
        kind: configmap
        name: velero-volume-policy
      ttl: 720h
      includedNamespaces:
        - '*'
      excludedNamespaces:
        - velero
      includeClusterResources: true
      snapshotMoveData: true
