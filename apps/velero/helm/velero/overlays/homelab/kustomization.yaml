apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
commonAnnotations:
  security.homeworld/profile: homelab
patches:
# Velero 12.1.0 has no hostUsers value. Opt in only compatible workloads;
# node-agent remains host-integrated for filesystem backups.
- target:
    group: apps
    version: v1
    kind: ^(Deployment|StatefulSet)$
  patch: |-
    - op: add
      path: /spec/replicas
      value: 1
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^velero$
    namespace: ^velero$
  patch: |-
    - op: add
      path: /spec/template/spec/hostUsers
      value: false
- target:
    group: batch
    version: v1
    kind: Job
    name: ^velero-upgrade-crds$
    namespace: ^velero$
  patch: |-
    - op: add
      path: /spec/template/spec/hostUsers
      value: false
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^velero$
    namespace: ^velero$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources
      value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
    - op: add
      path: /spec/template/spec/initContainers/0/resources
      value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
- target:
    group: apps
    version: v1
    kind: DaemonSet
    name: ^node-agent$
    namespace: ^velero$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources
      value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
- target:
    group: batch
    version: v1
    kind: Job
    name: ^velero-upgrade-crds$
    namespace: ^velero$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources
      value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^velero$
    namespace: ^velero$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Always
    - op: add
      path: /spec/template/spec/initContainers/0/imagePullPolicy
      value: Always
- target:
    group: apps
    version: v1
    kind: DaemonSet
    name: ^node-agent$
    namespace: ^velero$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Always
- target:
    group: batch
    version: v1
    kind: Job
    name: ^velero-upgrade-crds$
    namespace: ^velero$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Always
- target:
    group: batch
    version: v1
    kind: Job
    name: ^velero-upgrade-crds$
    namespace: ^velero$
  patch: |-
    - op: add
      path: /metadata/annotations/kube-score~1ignore
      value: pod-networkpolicy,container-security-context-user-group-id,container-security-context-readonlyrootfilesystem
    - op: add
      path: /metadata/annotations/security.homeworld~1exception-reason
      value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
- target:
    group: apps
    version: v1
    kind: DaemonSet
    name: ^node-agent$
    namespace: ^velero$
  patch: |-
    - op: add
      path: /metadata/annotations/kube-score~1ignore
      value: pod-networkpolicy,container-security-context-user-group-id,container-security-context-readonlyrootfilesystem
    - op: add
      path: /metadata/annotations/security.homeworld~1exception-reason
      value: User namespaces remain disabled because filesystem backup requires kubelet hostPath volumes and HostToContainer mount propagation; upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^velero$
    namespace: ^velero$
  patch: |-
    - op: add
      path: /metadata/annotations/kube-score~1ignore
      value: pod-probes-identical,pod-networkpolicy,container-security-context-user-group-id,container-security-context-readonlyrootfilesystem,deployment-strategy,deployment-replicas
    - op: add
      path: /metadata/annotations/security.homeworld~1exception-reason
      value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
