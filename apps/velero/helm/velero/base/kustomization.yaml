apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
- name: velero
  repo: https://vmware-tanzu.github.io/helm-charts
  version: 12.2.0
  releaseName: velero
  namespace: velero
  includeCRDs: true
  skipTests: true
  valuesFile: values.yaml
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^velero$
    namespace: ^velero$
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
    - op: replace
      path: /spec/template/spec/initContainers/0/imagePullPolicy
      value: IfNotPresent
- target:
    group: apps
    version: v1
    kind: DaemonSet
    name: ^node-agent$
    namespace: ^velero$
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
- target:
    group: batch
    version: v1
    kind: Job
    name: ^velero-upgrade-crds$
    namespace: ^velero$
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
