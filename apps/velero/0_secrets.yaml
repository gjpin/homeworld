---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-credentials
  namespace: velero
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: velero-credentials
    template:
      engineVersion: v2
      data:
        cloud: |
          [default]
          aws_access_key_id = {{ .B2_APPLICATION_KEY_ID }}
          aws_secret_access_key = {{ .B2_APPLICATION_KEY }}
  data:
    - secretKey: B2_APPLICATION_KEY_ID
      remoteRef:
        key: /velero/B2_APPLICATION_KEY_ID
        decodingStrategy: Auto
    - secretKey: B2_APPLICATION_KEY
      remoteRef:
        key: /velero/B2_APPLICATION_KEY
        decodingStrategy: Auto
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-repo-credentials
  namespace: velero
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: velero-repo-credentials
  data:
    - secretKey: repository-password
      remoteRef:
        key: /velero/KOPIA_REPOSITORY_PASSWORD
        decodingStrategy: Auto
