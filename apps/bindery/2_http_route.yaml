---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: bindery
  namespace: bindery
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: bindery
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "bindery.homeworld.internal"
  rules:
    # /metrics is unauthenticated on the application port; keep it off the
    # public hostname (the collector scrapes the Service directly).
    - matches:
        - path:
            type: PathPrefix
            value: /metrics
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /
            statusCode: 302
    - backendRefs:
        - name: bindery
          namespace: bindery
          kind: Service
          port: 8787
          group: ""
          weight: 1
