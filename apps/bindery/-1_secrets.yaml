---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bindery-secrets
  namespace: bindery
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: bindery-secrets
  data:
    # Fixed API key (BINDERY_API_KEY), shared with the Homepage widget.
    - secretKey: apiKey
      remoteRef:
        key: /bindery/API_KEY
        decodingStrategy: None
