# Talos runs kube-scheduler and kube-controller-manager as host-network
# static pods labelled k8s-app=<component>; these headless Services expose
# their secure ports (bound to 0.0.0.0 by the Talos machine config in
# docs/talos.md) as endpoints for the ServiceMonitors.
---
apiVersion: v1
kind: Service
metadata:
  name: kube-scheduler-metrics
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-scheduler
    app.kubernetes.io/component: control-plane-metrics
spec:
  clusterIP: None
  ports:
    - name: https-metrics
      port: 10259
      protocol: TCP
      targetPort: 10259
  selector:
    k8s-app: kube-scheduler
---
apiVersion: v1
kind: Service
metadata:
  name: kube-controller-manager-metrics
  namespace: kube-system
  labels:
    app.kubernetes.io/name: kube-controller-manager
    app.kubernetes.io/component: control-plane-metrics
spec:
  clusterIP: None
  ports:
    - name: https-metrics
      port: 10257
      protocol: TCP
      targetPort: 10257
  selector:
    k8s-app: kube-controller-manager
