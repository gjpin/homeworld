# https://kubernetes.io/docs/concepts/cluster-administration/system-metrics/
---
# The default/kubernetes Service endpoints are the three API servers
# (node IP:6443). The serving certificate is verified against the cluster CA
# published in every namespace's kube-root-ca.crt ConfigMap.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kube-apiserver
  namespace: kube-system
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      component: apiserver
      provider: kubernetes
  endpoints:
    - port: https
      scheme: https
      path: /metrics
      interval: 60s
      authorization:
        type: Bearer
        credentials:
          name: control-plane-metrics-reader-token
          key: token
      tlsConfig:
        serverName: kubernetes
        ca:
          configMap:
            name: kube-root-ca.crt
            key: ca.crt
---
# kube-scheduler and kube-controller-manager serve /metrics with an
# in-memory self-signed certificate (Talos passes them no serving
# certificate), so there is no CA to verify against; the bearer token still
# authenticates the scrape.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kube-scheduler
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-scheduler
      app.kubernetes.io/component: control-plane-metrics
  endpoints:
    - port: https-metrics
      scheme: https
      path: /metrics
      interval: 60s
      authorization:
        type: Bearer
        credentials:
          name: control-plane-metrics-reader-token
          key: token
      tlsConfig:
        insecureSkipVerify: true
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kube-controller-manager
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: kube-controller-manager
      app.kubernetes.io/component: control-plane-metrics
  endpoints:
    - port: https-metrics
      scheme: https
      path: /metrics
      interval: 60s
      authorization:
        type: Bearer
        credentials:
          name: control-plane-metrics-reader-token
          key: token
      tlsConfig:
        insecureSkipVerify: true
