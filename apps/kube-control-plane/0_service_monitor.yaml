# https://kubernetes.io/docs/concepts/cluster-administration/system-metrics/
---
# The default/kubernetes Service endpoints are the three API servers
# (node IP:6443). The serving certificate is verified against the cluster CA
# published in every namespace's kube-root-ca.crt ConfigMap.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kube-apiserver
  namespace: kube-system
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      component: apiserver
      provider: kubernetes
  endpoints:
    - port: https
      scheme: https
      path: /metrics
      interval: 60s
      authorization:
        type: Bearer
        credentials:
          name: control-plane-metrics-reader-token
          key: token
      tlsConfig:
        serverName: kubernetes
        ca:
          configMap:
            name: kube-root-ca.crt
            key: ca.crt
      # k3s runs every control-plane component in one process, and each of
      # their endpoints serves that process's whole metrics registry. Keep
      # only the API server's own families here; the scheduler and
      # controller-manager ScrapeConfigs keep theirs.
      metricRelabelings:
        - sourceLabels:
            - __name__
          regex: (apiserver|etcd_request|etcd_db|aggregator|apiextensions|authentication|authorization|watch_cache|go|process)_.*
          action: keep
