# qbittorrent
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: qbittorrent-app
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homeworld
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://github.com/gjpin/homeworld.git
    path: "apps/qbittorrent"
    targetRevision: HEAD
    plugin:
      name: homeworld
  destination:
    server: https://kubernetes.default.svc
    namespace: qbittorrent
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        # The gluetun VPN sidecar requires NET_ADMIN/NET_RAW capabilities
        # for the kernel WireGuard tunnel; PSS baseline forbids added
        # capabilities, so the namespace follows the Home Assistant
        # exception profile.
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/enforce-version: v1.37
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/audit-version: v1.37
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/warn-version: v1.37
      annotations:
        security.homeworld/exception-reason: The gluetun VPN sidecar requires the NET_ADMIN and NET_RAW capabilities to tunnel all qBittorrent traffic through WireGuard; PSS baseline forbids added capabilities. SELinux confines the pod as container_t, and Cilium default-deny egress allows only the VPN endpoints.
