# cilium
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cilium-app
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homeworld
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/gjpin/homeworld.git
    path: "apps/cilium"
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: cilium
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        # Cilium kube-proxy replacement agents (cilium, cilium-envoy,
        # cilium-operator) require privileged host, BPF, and hostPath
        # integration; PSS baseline forbids these host integrations.
        # This also covers the cilium connectivity test PodSecurity
        # workaround. The CNI is bootstrapped by the manifest apply in
        # docs/talos.md; this application owns its lifecycle and is
        # sequenced after prometheus-operator-crd so the chart's
        # ServiceMonitors validate.
        pod-security.kubernetes.io/enforce: privileged
        pod-security.kubernetes.io/enforce-version: v1.37
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/audit-version: v1.37
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/warn-version: v1.37
      annotations:
        security.homeworld/exception-reason: Cilium kube-proxy replacement requires privileged agents with BPF, bpffs, hostPath, and host network integration; PSS baseline forbids these host integrations.
