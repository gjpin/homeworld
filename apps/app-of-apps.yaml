# admission-policies
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: admission-policies-app
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homeworld
  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/gjpin/homeworld.git
    path: "apps/admission-policies"
    targetRevision: HEAD
    plugin:
      name: homeworld
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - ServerSideApply=true
