  finalizers:
  - resources-finalizer.argocd.argoproj.io
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  project: default
  source:
    repoURL: https://github.com/gjpin/homeworld.git
    path: "apps/affine"
    targetRevision: HEAD
    plugin:
      name: homeworld
  destination:
    server: https://kubernetes.default.svc
    namespace: affine
