---
apiVersion: v1
kind: Service
metadata:
  name: flaresolverr
  namespace: flaresolverr
  labels:
    app.kubernetes.io/name: flaresolverr
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8191
      protocol: TCP
      targetPort: http
    - name: metrics
      port: 8192
      protocol: TCP
      targetPort: metrics
  selector:
    app.kubernetes.io/name: flaresolverr
