---
apiVersion: v1
kind: Service
metadata:
  name: sonarr
  namespace: sonarr
  labels:
    app.kubernetes.io/name: sonarr
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 8989
      protocol: TCP
      targetPort: http
    - name: metrics
      port: 9707
      protocol: TCP
      targetPort: metrics
  selector:
    app.kubernetes.io/name: sonarr
