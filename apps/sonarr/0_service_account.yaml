---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sonarr-app
  namespace: sonarr
  labels:
    app.kubernetes.io/name: sonarr
# Token hygiene only: the app never talks to the Kubernetes API. The name
# must not collide with the CloudNativePG cluster's ServiceAccount — CNPG
# derives the instance/initdb ServiceAccount name from the cluster name
# (sonarr) and adopts an existing ServiceAccount with that name as-is, so
# an app-owned sonarr ServiceAccount without a mounted token would leave
# the cluster's initdb Job unable to reach the API.
automountServiceAccountToken: false
