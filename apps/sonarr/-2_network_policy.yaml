    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:cnpg.io/cluster: sonarr
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: sonarr
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-sonarr-postgres-metrics-ingress
  namespace: sonarr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # The handwritten PodMonitor scrapes the CloudNativePG instance metrics
  # port.
  endpointSelector:
    matchLabels:
      k8s:cnpg.io/cluster: sonarr
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-collector
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-sonarr-prowlarr
  namespace: sonarr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # Torznab searches through the Prowlarr indexer proxies.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: sonarr
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: prowlarr
            k8s:app.kubernetes.io/name: prowlarr
      toPorts:
        - ports:
            - port: "9696"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-sonarr-qbittorrent
  namespace: sonarr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # Download client.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: sonarr
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: qbittorrent
            k8s:app.kubernetes.io/name: qbittorrent
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-sonarr-jellyfin
  namespace: sonarr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # Library refresh (Connect > Emby / Jellyfin).
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: sonarr
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: jellyfin
            k8s:app.kubernetes.io/name: jellyfin
      toPorts:
        - ports:
            - port: "8096"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-sonarr-metadata
  namespace: sonarr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # Metadata and artwork:
  #   skyhook.sonarr.tv: series metadata
  #   services.sonarr.tv: scene mappings (also serves the update check; there is no switch for it)
  #   artworks.thetvdb.com: posters and fan art
  # Indexers are reached through Prowlarr; the Servarr update and Sentry
  # endpoints (*.servarr.com, sentry.*) are not allowed.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: sonarr
  egress:
    - toFQDNs:
        - matchName: "skyhook.sonarr.tv"
        - matchName: "services.sonarr.tv"
        - matchName: "artworks.thetvdb.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # CloudNativePG's instance manager watches its Cluster through the API server,
  # the operator reads each instance's status port, and instances and their
  # bootstrap Jobs replicate from each other.
  name: allow-sonarr-postgres-instance
  namespace: sonarr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:cnpg.io/cluster: sonarr
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cloudnative-pg
            k8s:app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: sonarr
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: sonarr
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
