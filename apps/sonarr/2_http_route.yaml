---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sonarr
  namespace: sonarr
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "sonarr.base-domain.invalid"
  rules:
    - backendRefs:
        - name: sonarr
          namespace: sonarr
          kind: Service
          port: 8989
          group: ""
          weight: 1
