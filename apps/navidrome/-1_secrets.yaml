---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: navidrome-secrets
  namespace: navidrome
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: navidrome-secrets
  data:
    # Encrypts the stored user passwords (Subsonic token auth needs them
    # reversible); without it Navidrome uses a built-in key.
    - secretKey: ND_PASSWORDENCRYPTIONKEY
      remoteRef:
        key: /navidrome/PASSWORD_ENCRYPTION_KEY
        decodingStrategy: None
    # Last.fm artist bios and images and per-user scrobbling; Navidrome
    # ships no default key.
    - secretKey: ND_LASTFM_APIKEY
      remoteRef:
        key: /navidrome/LASTFM_API_KEY
        decodingStrategy: None
    - secretKey: ND_LASTFM_SECRET
      remoteRef:
        key: /navidrome/LASTFM_SECRET
        decodingStrategy: None
