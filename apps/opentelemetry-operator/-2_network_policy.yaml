# https://opentelemetry.io/docs/platforms/kubernetes/operator/
# https://github.com/open-telemetry/opentelemetry-helm-charts/tree/main/charts/opentelemetry-operator
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: opentelemetry-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns
  namespace: opentelemetry-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-opentelemetry-operator-kubernetes-api
  namespace: opentelemetry-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/instance: opentelemetry-operator
      k8s:app.kubernetes.io/name: opentelemetry-operator
      k8s:app.kubernetes.io/component: controller-manager
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-opentelemetry-operator-webhook-ingress
  namespace: opentelemetry-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # The OpenTelemetryCollector admission webhook validates collector CRs;
  # the pod sidecar-injection webhook fail-opens and is never matched here
  # (no workload opts into sidecar injection).
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/instance: opentelemetry-operator
      k8s:app.kubernetes.io/name: opentelemetry-operator
      k8s:app.kubernetes.io/component: controller-manager
  ingress:
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
