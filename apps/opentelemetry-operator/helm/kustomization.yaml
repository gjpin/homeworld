apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: opentelemetry-operator
    repo: https://open-telemetry.github.io/opentelemetry-helm-charts
    version: 0.127.1
    releaseName: opentelemetry-operator
    namespace: opentelemetry-operator
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  # The chart has no runtimeClassName value for the manager Deployment;
  # the runtime class for operator-generated collector and Target Allocator
  # pods is injected by the opentelemetry-gvisor MutatingAdmissionPolicy
  # (apps/admission-policies).
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^opentelemetry-operator$
      namespace: ^opentelemetry-operator$
    patch: |-
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
