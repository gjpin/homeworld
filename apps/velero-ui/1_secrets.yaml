---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-ui-auth
  namespace: velero-ui
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: velero-ui-auth
    template:
      engineVersion: v2
      data:
        AUTH_SECRET_PASSPHRASE: "{{ .AUTH_SECRET_PASSPHRASE }}"
        BASIC_AUTH_USERNAME: "{{ .BASIC_AUTH_USERNAME }}"
        BASIC_AUTH_PASSWORD: "{{ .BASIC_AUTH_PASSWORD }}"
  data:
    - secretKey: AUTH_SECRET_PASSPHRASE
      remoteRef:
        key: /velero-ui/AUTH_SECRET_PASSPHRASE
        decodingStrategy: Auto
    - secretKey: BASIC_AUTH_USERNAME
      remoteRef:
        key: /velero-ui/BASIC_AUTH_USERNAME
        decodingStrategy: Auto
    - secretKey: BASIC_AUTH_PASSWORD
      remoteRef:
        key: /velero-ui/BASIC_AUTH_PASSWORD
        decodingStrategy: Auto
