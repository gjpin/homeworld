# https://velero-ui.docs.otwld.com/getting-started/helm/
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: velero-ui
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: velero-ui
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - ServerSideApply=true

  source:
    repoURL: https://github.com/gjpin/homeworld.git
    path: apps/velero-ui/helm
    targetRevision: HEAD
    plugin:
      name: homeworld
