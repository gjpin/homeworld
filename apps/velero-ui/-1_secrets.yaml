---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: velero-ui-auth
  namespace: velero-ui
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: velero-ui-auth
    template:
      engineVersion: v2
      data:
        AUTH_SECRET_PASSPHRASE: "{{ .AUTH_SECRET_PASSPHRASE }}"
        OAUTH_CLIENT_SECRET: "{{ .OAUTH_CLIENT_SECRET }}"
  data:
    - secretKey: AUTH_SECRET_PASSPHRASE
      remoteRef:
        key: /velero-ui/AUTH_SECRET_PASSPHRASE
        decodingStrategy: None
    - secretKey: OAUTH_CLIENT_SECRET
      remoteRef:
        key: /authelia/OIDC_CLIENT_SECRET_VELERO_UI
        decodingStrategy: None
