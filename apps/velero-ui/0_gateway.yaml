# TODO: each application has a gateway, which are merged into a single one till
# cert-manager supports http routes for automatic certificates
# https://gateway.envoyproxy.io/docs/tasks/security/tls-cert-manager/
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy
  namespace: velero-ui
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    kubernetes.io/tls-acme: "true"
spec:
  gatewayClassName: envoy-merged
  addresses:
    - type: IPAddress
      value: ${EXTERNAL_IP}
  listeners:
    - name: velero-ui-https
      protocol: HTTPS
      port: 443
      hostname: "velero.${BASE_DOMAIN}"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: velero-ui-tls-cert
            kind: Secret
            group: ""
