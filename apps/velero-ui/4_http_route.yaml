---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: velero-ui
  namespace: velero-ui
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    external-dns.alpha.kubernetes.io/hostname: "velero.${BASE_DOMAIN}"
spec:
  parentRefs:
    - name: envoy
      namespace: velero-ui
      sectionName: velero-ui-https
  hostnames:
    - "velero.${BASE_DOMAIN}"
  rules:
    - backendRefs:
      - name: velero-ui
        namespace: velero-ui
        kind: Service
        port: 3000
