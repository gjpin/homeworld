---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: velero-ui
  namespace: velero-ui
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "velero.base-domain.invalid"
  rules:
    - backendRefs:
      - name: velero-ui
        namespace: velero-ui
        kind: Service
        port: 3000
        group: ""
        weight: 1
