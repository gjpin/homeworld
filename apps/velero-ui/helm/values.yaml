fullnameOverride: velero-ui
image:
  repository: docker.io/otwld/velero-ui
  # Pin the tag so the image cannot drift with the chart's appVersion
  # (Renovate tracks it via the velero-ui image manager).
  tag: "0.11.0"
# Prefer the chart-native key over a kustomize patch (AGENTS.md).
runtimeClassName: gvisor
rbac:
  create: true
  clusterAdministrator: false
configuration:
  general:
    # The chart injects AUTH_SECRET_PASSPHRASE (JWT signing key, at least
    # 32 bytes) from this existing ExternalSecret-managed Secret.
    secretPassPhrase:
      useSecret: true
      existingSecret: velero-ui-auth
      key: AUTH_SECRET_PASSPHRASE
    veleroNamespace: velero
  # Federated (OIDC) users get no permissions without an explicit policy.
  # Authelia already limits sign-in to the platform group; grant it full
  # access.
  policies:
    enabled: true
    value: |
      g,platform,manage,all
env:
  - name: BASIC_AUTH_ENABLED
    value: "false"
  - name: OAUTH_AUTH_ENABLED
    value: "true"
  - name: OAUTH_NAME
    value: Authelia
  - name: OAUTH_AUTHORIZATION_URL
    value: https://auth.base-domain.invalid/api/oidc/authorization
  - name: OAUTH_TOKEN_URL
    value: https://auth.base-domain.invalid/api/oidc/token
  - name: OAUTH_USER_INFO_URL
    value: https://auth.base-domain.invalid/api/oidc/userinfo
  - name: OAUTH_CLIENT_ID
    value: velero-ui
  - name: OAUTH_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: velero-ui-auth
        key: OAUTH_CLIENT_SECRET
  - name: OAUTH_OAUTH_SCOPE
    value: openid profile email groups
  - name: OAUTH_GROUP_CLAIM
    value: groups
  - name: OAUTH_REDIRECT_URI
    value: https://velero.base-domain.invalid/login
  - name: DEFAULT_TIMEZONE
    value: Europe/Lisbon
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
