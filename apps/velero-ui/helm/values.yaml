fullnameOverride: velero-ui
image:
  repository: docker.io/otwld/velero-ui
  # Pin the tag so the image cannot drift with the chart's appVersion
  # (Renovate tracks it via the velero-ui image manager).
  tag: "0.10.3"
# Prefer the chart-native key over a kustomize patch (AGENTS.md).
runtimeClassName: gvisor
rbac:
  create: true
  clusterAdministrator: false
configuration:
  general:
    secretPassPhrase:
      useSecret: false
    veleroNamespace: velero
env:
  - name: AUTH_SECRET_PASSPHRASE
    valueFrom:
      secretKeyRef:
        name: velero-ui-auth
        key: AUTH_SECRET_PASSPHRASE
  - name: BASIC_AUTH_ENABLED
    value: "false"
  - name: OAUTH_AUTH_ENABLED
    value: "true"
  - name: OAUTH_NAME
    value: Authelia
  - name: OAUTH_AUTHORIZATION_URL
    value: https://auth.${BASE_DOMAIN}/api/oidc/authorization
  - name: OAUTH_TOKEN_URL
    value: https://auth.${BASE_DOMAIN}/api/oidc/token
  - name: OAUTH_USER_INFO_URL
    value: https://auth.${BASE_DOMAIN}/api/oidc/userinfo
  - name: OAUTH_CLIENT_ID
    value: velero-ui
  - name: OAUTH_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: velero-ui-auth
        key: OAUTH_CLIENT_SECRET
  - name: OAUTH_OAUTH_SCOPE
    value: openid profile email groups
  - name: OAUTH_GROUP_CLAIM
    value: groups
  - name: OAUTH_REDIRECT_URI
    value: https://velero.${BASE_DOMAIN}/login
  - name: DEFAULT_TIMEZONE
    value: Europe/Lisbon
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
