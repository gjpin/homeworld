fullnameOverride: velero-ui
configuration:
  general:
    secretPassPhrase:
      useSecret: false
    veleroNamespace: velero
env:
  - name: AUTH_SECRET_PASSPHRASE
    valueFrom:
      secretKeyRef:
        name: velero-ui-auth
        key: AUTH_SECRET_PASSPHRASE
  - name: BASIC_AUTH_ENABLED
    value: "false"
  - name: OAUTH_AUTH_ENABLED
    value: "true"
  - name: OAUTH_NAME
    value: Authelia
  - name: OAUTH_AUTHORIZATION_URL
    value: https://auth.${BASE_DOMAIN}/api/oidc/authorization
  - name: OAUTH_TOKEN_URL
    value: https://auth.${BASE_DOMAIN}/api/oidc/token
  - name: OAUTH_USER_INFO_URL
    value: https://auth.${BASE_DOMAIN}/api/oidc/userinfo
  - name: OAUTH_CLIENT_ID
    value: velero-ui
  - name: OAUTH_CLIENT_SECRET
    valueFrom:
      secretKeyRef:
        name: velero-ui-auth
        key: OAUTH_CLIENT_SECRET
  - name: OAUTH_OAUTH_SCOPE
    value: openid profile email groups
  - name: OAUTH_GROUP_CLAIM
    value: groups
  - name: OAUTH_REDIRECT_URI
    value: https://velero.${BASE_DOMAIN}/login
  - name: DEFAULT_TIMEZONE
    value: Europe/Lisbon
nodeSelector:
  node-role.kubernetes.io/homelab: homelab
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
