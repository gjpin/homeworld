apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: velero-ui
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: velero-ui
    repo: https://helm.otwld.com
    version: 1.2.0
    releaseName: velero-ui
    namespace: velero-ui
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  # --- the chart templates omit metadata.namespace on the Deployment and
  # its service account (they rely on the Helm release namespace at deploy
  # time), so kustomize patches it in; without it the offline render leaves
  # the workload in the default namespace and kubescape fails C-0061 on a
  # render artifact. The chart-hardcoded velero-ui-velero-permissions
  # Role/RoleBinding in the velero namespace are intentional and untouched.
  - target:
      version: v1
      kind: ^(ServiceAccount|Service)$
      name: ^velero-ui$
    patch: |-
      - op: add
        path: /metadata/namespace
        value: velero-ui
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^velero-ui$
    patch: |-
      - op: add
        path: /metadata/namespace
        value: velero-ui
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^velero-ui$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      group: apps
      version: v1
      kind: ^(Deployment|StatefulSet)$
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^velero-ui$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^velero-ui$
    patch: |-
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1no-read-only-root-fs
        value: The pinned upstream velero-ui image writes to its root filesystem; overriding it would break runtime file access.
