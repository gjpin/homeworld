---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rustfs-operator-console-jwt
  namespace: rustfs-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    # The console Deployment reads secretKeyRef name
    # "<fullname>-console-secret" with key "jwt-secret" (see the chart's
    # console-deployment template). The chart's own console-secret template
    # cannot own it: its randAlphaNum fallback regenerates a new random
    # value on every Argo CD render (helm lookup returns nil offline), which
    # rotates the console's session key on each sync; it is patch-deleted
    # from the render in helm/kustomization.yaml so this ExternalSecret is
    # the single owner (docs/secrets.md).
    name: rustfs-operator-console-secret
  data:
    - secretKey: jwt-secret
      remoteRef:
        key: /rustfs-operator/JWT_SECRET
        decodingStrategy: None
