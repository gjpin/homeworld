---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-operator-console
  namespace: rustfs-operator
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "rustfs.${BASE_DOMAIN}"
spec:
  parentRefs:
    - name: envoy
      namespace: rustfs-operator
      sectionName: rustfs-https
  hostnames:
    - "rustfs.${BASE_DOMAIN}"
  rules:
    - backendRefs:
      - name: rustfs-operator-console
        namespace: rustfs-operator
        kind: Service
        port: 9090
