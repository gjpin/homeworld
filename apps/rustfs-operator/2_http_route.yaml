---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rustfs-operator-console
  namespace: rustfs-operator
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: rustfs-operator
      sectionName: rustfs-https
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "rustfs.homeworld.internal"
  rules:
    - backendRefs:
      - name: rustfs-operator-console
        namespace: rustfs-operator
        kind: Service
        port: 9090
        group: ""
        weight: 1
