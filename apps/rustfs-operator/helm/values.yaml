fullnameOverride: rustfs-operator
namespace: rustfs-operator
commonAnnotations:
  kube-score/ignore: pod-networkpolicy,container-security-context-user-group-id,container-security-context-readonlyrootfilesystem,deployment-replicas,container-image-pull-policy
  security.homeworld/exception-reason: Upstream UID, filesystem, availability, Cilium policy, and cached-image pull constraints are accepted for the two chart workloads.
operator:
  image:
    repository: rustfs/operator
    tag: 0.0.5
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 2Gi
  nodeSelector:
    node-role.kubernetes.io/homelab: homelab
  serviceMonitor:
    enabled: true
    interval: 60s
console:
  enabled: true
  image:
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 2Gi
  nodeSelector:
    node-role.kubernetes.io/homelab: homelab
sts:
  enabled: true
