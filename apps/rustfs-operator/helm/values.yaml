fullnameOverride: rustfs-operator
namespace: rustfs-operator
commonAnnotations:
  ignore-check.kube-linter.io/no-read-only-root-fs: The pinned upstream operator and console images write to their root filesystems; overriding them would break runtime file access.
operator:
  image:
    repository: docker.io/rustfs/operator
    tag: 0.0.6
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 2Gi
  nodeSelector:
    node-role.kubernetes.io/homelab: homelab
  serviceMonitor:
    enabled: true
    interval: 60s
console:
  enabled: true
  image:
    repository: docker.io/rustfs/operator
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 2Gi
  nodeSelector:
    node-role.kubernetes.io/homelab: homelab
sts:
  enabled: true
