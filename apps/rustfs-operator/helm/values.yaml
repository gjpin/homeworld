fullnameOverride: rustfs-operator
namespace: rustfs-operator
commonAnnotations:
  ignore-check.kube-linter.io/no-read-only-root-fs: The pinned upstream operator and console images write to their root filesystems; overriding them would break runtime file access.
operator:
  image:
    repository: docker.io/rustfs/operator
    # Renovate tracks this image tag independently of the vendored chart
    # version: upstream publishes no chart 0.0.6 (chart versions jumped
    # 0.0.5 -> 0.07), so the binary runs ahead of the vendored chart. The
    # Tenant CRD the chart ships is the same one the 0.0.6 binary manages
    # (verified by the working kustomize render); the next chart bump
    # re-vendors the whole tree via scripts/vendor-rustfs-operator.sh.
    tag: 0.0.6
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 2Gi
  nodeSelector:
    node-role.kubernetes.io/homelab: homelab
  serviceMonitor:
    enabled: true
    interval: 60s
console:
  enabled: true
  image:
    repository: docker.io/rustfs/operator
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 2Gi
  nodeSelector:
    node-role.kubernetes.io/homelab: homelab
sts:
  enabled: true
