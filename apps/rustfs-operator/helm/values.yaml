fullnameOverride: rustfs-operator
namespace: rustfs-operator
commonAnnotations:
  ignore-check.kube-linter.io/no-read-only-root-fs: The pinned upstream operator and console images write to their root filesystems; overriding them would break runtime file access.
operator:
  image:
    repository: docker.io/rustfs/operator
    # Renovate tracks this image tag independently of the vendored chart
    # version: upstream publishes no chart 0.0.8 (chart versions jumped
    # 0.0.5 -> 0.07), so the binary runs ahead of the vendored chart. The
    # 0.0.5 chart's Tenant CRD predates the 0.0.8 binary: it lacks the
    # status.provisioning.users[].ownership checkpoint schema, so the
    # apiserver prunes the operator's ownership proof and user
    # provisioning wedges in UserOwnershipCheckpointFailed (the tenant
    # never becomes Ready). crds/tenant-crd.yaml is therefore vendored
    # from the operator's 0.0.8 tag (deploy/rustfs-operator/crds/), which
    # declares exactly the fields the pinned binary writes. The next
    # chart bump re-vendors the whole tree via
    # scripts/vendor-rustfs-operator.sh; chart 0.07's CRD is a superset
    # of the 0.0.8 schema, so that bump supersedes this cleanly.
    tag: 0.0.8
    # The operator records transient provisioning failures (e.g. the server
    # API not answering yet behind its first PVC mount) as status
    # conditions and does not requeue the reconcile, so a Tenant can stay
    # ProvisioningReady=False until a watched object changes. Recovery:
    # annotate the Tenant (any spec/label change) to force a reconcile —
    # see e2e/examples/hooks/kick-rustfs-tenant.sh for the exact nudge.
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 2Gi
  nodeSelector:
    node-role.kubernetes.io/homelab: homelab
  serviceMonitor:
    enabled: true
    interval: 60s
console:
  enabled: true
  image:
    repository: docker.io/rustfs/operator
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 2Gi
  nodeSelector:
    node-role.kubernetes.io/homelab: homelab
sts:
  # Disable the operator's STS service (container port 4223): nothing in
  # this cluster consumes it — no CiliumNetworkPolicy admits it and no docs
  # row exists — and the tenant's own S3 endpoint (rustfs-io:9000) serves
  # AssumeRole for in-cluster clients. Re-enable with matching CNP rules and
  # a docs/network-policies.md row if an STS consumer ever appears.
  enabled: false
