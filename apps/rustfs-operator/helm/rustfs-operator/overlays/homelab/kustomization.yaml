apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
commonAnnotations:
  security.homeworld/profile: homelab
patches:
- target:
    group: apps
    version: v1
    kind: ^(Deployment|StatefulSet)$
  patch: |-
    - op: add
      path: /spec/replicas
      value: 1
