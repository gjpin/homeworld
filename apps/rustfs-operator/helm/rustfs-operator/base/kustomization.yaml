apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
- name: rustfs-operator
  repo: https://operator.rustfs.com
  version: 0.0.5
  releaseName: rustfs-operator
  namespace: rustfs-operator
  includeCRDs: true
  skipTests: true
  valuesFile: values.yaml
# RustFS Operator 0.0.5 does not expose hostUsers; both enabled Deployments
# are compatible with Kubernetes user namespaces.
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^rustfs-operator(-console)?$
    namespace: ^rustfs-operator$
  patch: |-
    - op: add
      path: /spec/template/spec/hostUsers
      value: false
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^rustfs-operator(-console)?$
    namespace: ^rustfs-operator$
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
