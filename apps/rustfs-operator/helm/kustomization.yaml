apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  security.homeworld/profile: homelab
# The upstream chart ships tenants.rustfs.com twice under crds/, which breaks
# Kustomize's Helm inflation; the chart is vendored and patched under
# helm/local-charts (see scripts/vendor-rustfs-operator.sh).
helmGlobals:
  chartHome: ./local-charts
helmCharts:
  - name: rustfs-operator
    releaseName: rustfs-operator
    namespace: rustfs-operator
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^rustfs-operator(-console)?$
      namespace: ^rustfs-operator$
    patch: |-
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^rustfs-operator(-console)?$
      namespace: ^rustfs-operator$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  # Delete the chart's generated console Secret from the render: its
  # randAlphaNum fallback rotates the console JWT key on every offline
  # render (helm lookup is nil under Argo CD), producing perpetual
  # OutOfSync churn and invalidating console sessions on each sync. The
  # wave--1 ExternalSecret (apps/rustfs-operator/-1_secrets.yaml) owns
  # rustfs-operator-console-secret instead.
  - target:
      version: v1
      kind: Secret
      name: ^rustfs-operator-console-secret$
      namespace: ^rustfs-operator$
    patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: rustfs-operator-console-secret
        namespace: rustfs-operator
      $patch: delete

  - target:
      group: apps
      version: v1
      kind: ^(Deployment|StatefulSet)$
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
