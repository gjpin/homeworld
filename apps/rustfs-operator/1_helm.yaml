# https://github.com/rustfs/operator
# https://github.com/rustfs/operator/tree/main/deploy/rustfs-operator
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rustfs-operator
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: rustfs-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - RespectIgnoreDifferences=true
  ignoreDifferences:
    - kind: Secret
      name: rustfs-operator-console-secret
      namespace: rustfs-operator
      jsonPointers:
        - /data/jwt-secret
    - group: apps
      kind: Deployment
      name: rustfs-operator-console
      namespace: rustfs-operator
      jsonPointers:
        - /spec/template/metadata/annotations/checksum~1secret
  source:
    repoURL: https://github.com/gjpin/homeworld.git
    path: apps/rustfs-operator/helm
    targetRevision: HEAD
