---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: woodpecker
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: /woodpecker/POSTGRES_USERNAME
        decodingStrategy: Auto
    - secretKey: password
      remoteRef:
        key: /woodpecker/POSTGRES_PASSWORD
        decodingStrategy: Auto
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: woodpecker-default-agent-secret
  namespace: woodpecker
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: woodpecker-default-agent-secret
    template:
      engineVersion: v2
      data:
        WOODPECKER_AGENT_SECRET: "{{ .agent_secret }}"
  data:
    - secretKey: agent_secret
      remoteRef:
        key: /woodpecker/AGENT_SECRET
        decodingStrategy: Auto
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: woodpecker-secrets
  namespace: woodpecker
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: woodpecker-secrets
    template:
      engineVersion: v2
      data:
        WOODPECKER_DATABASE_DATASOURCE: "postgres://{{ .postgres_user }}:{{ .postgres_pass }}@woodpecker-rw.woodpecker.svc.cluster.local:5432/woodpecker?sslmode=disable"
        WOODPECKER_FORGEJO_CLIENT: "{{ .forgejo_client }}"
        WOODPECKER_FORGEJO_SECRET: "{{ .forgejo_secret }}"
        WOODPECKER_PROMETHEUS_AUTH_TOKEN: "{{ .prometheus_token }}"
  data:
    - secretKey: postgres_user
      remoteRef:
        key: /woodpecker/POSTGRES_USERNAME
        decodingStrategy: Auto
    - secretKey: postgres_pass
      remoteRef:
        key: /woodpecker/POSTGRES_PASSWORD
        decodingStrategy: Auto
    - secretKey: forgejo_client
      remoteRef:
        key: /woodpecker/FORGEJO_CLIENT
        decodingStrategy: Auto
    - secretKey: forgejo_secret
      remoteRef:
        key: /woodpecker/FORGEJO_SECRET
        decodingStrategy: Auto
    - secretKey: prometheus_token
      remoteRef:
        key: /woodpecker/PROMETHEUS_AUTH_TOKEN
        decodingStrategy: Auto
