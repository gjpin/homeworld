---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: woodpecker
  namespace: woodpecker
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "ci.base-domain.invalid"
  rules:
    - backendRefs:
        - name: woodpecker-server
          namespace: woodpecker
          kind: Service
          port: 80
          group: ""
          weight: 1
