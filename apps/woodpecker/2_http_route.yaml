---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: woodpecker
  namespace: woodpecker
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    external-dns.alpha.kubernetes.io/hostname: "ci.${BASE_DOMAIN}"
spec:
  parentRefs:
    - name: envoy
      namespace: woodpecker
  hostnames:
    - "ci.${BASE_DOMAIN}"
  rules:
    - backendRefs:
        - name: woodpecker-server
          namespace: woodpecker
          kind: Service
          port: 80
