fullnameOverride: woodpecker

server:
  enabled: true
  replicaCount: 1

  image:
    registry: docker.io
    repository: woodpeckerci/woodpecker-server
    tag: v3.18.0
    pullPolicy: IfNotPresent

  env:
    WOODPECKER_HOST: "https://ci.${BASE_DOMAIN}"
    WOODPECKER_SERVER_ADDR: ":8000"
    WOODPECKER_GRPC_ADDR: ":9000"
    WOODPECKER_DATABASE_DRIVER: postgres
    WOODPECKER_FORGEJO: "true"
    WOODPECKER_FORGEJO_URL: "https://git.${BASE_DOMAIN}"

  createAgentSecret: false
  extraSecretNamesForEnvFrom:
    - woodpecker-default-agent-secret
    - woodpecker-secrets

  persistentVolume:
    enabled: false

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 1Gi

  nodeSelector:
    node-role.kubernetes.io/homelab: homelab

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

agent:
  enabled: true
  replicaCount: 1

  image:
    registry: docker.io
    repository: woodpeckerci/woodpecker-agent
    tag: v3.18.0
    pullPolicy: IfNotPresent

  env:
    WOODPECKER_SERVER: "woodpecker-server:9000"
    WOODPECKER_BACKEND: kubernetes
    WOODPECKER_BACKEND_K8S_NAMESPACE: woodpecker
    WOODPECKER_BACKEND_K8S_STORAGE_CLASS: longhorn-crypto
    WOODPECKER_BACKEND_K8S_STORAGE_RWX: false
    WOODPECKER_BACKEND_K8S_VOLUME_SIZE: 10G
    WOODPECKER_CONNECT_RETRY_COUNT: "5"

  extraSecretNamesForEnvFrom:
    - woodpecker-default-agent-secret

  persistence:
    enabled: false

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 1Gi

  nodeSelector:
    node-role.kubernetes.io/homelab: homelab

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
