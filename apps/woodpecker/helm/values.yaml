server:
  enabled: true
  replicaCount: 1

  image:
    registry: docker.io
    repository: woodpeckerci/woodpecker-server
    tag: v3.18.0
    pullPolicy: IfNotPresent

  env:
    WOODPECKER_HOST: "https://ci.${BASE_DOMAIN}"
    WOODPECKER_SERVER_ADDR: ":8000"
    WOODPECKER_GRPC_ADDR: ":9000"
    WOODPECKER_DATABASE_DRIVER: postgres
    WOODPECKER_FORGEJO: "true"
    WOODPECKER_FORGEJO_URL: "https://git.${BASE_DOMAIN}"
    # The chart's default WOODPECKER_ADMIN is the placeholder
    # 'woodpecker,admin', which would silently make any Forgejo user named
    # woodpecker or admin a CI admin. Keep the list empty until a real
    # admin username is decided; set it explicitly when one is.
    WOODPECKER_ADMIN: ""
    # Disable the admin-UI version check against woodpecker-ci.org (AGENTS.md
    # upgrade-checker rule); it runs in the admin's browser, so the server's
    # own egress policy does not stop it.
    WOODPECKER_DISABLE_VERSION_CHECK: "true"

  # Expose the internal metrics endpoint the ServiceMonitor scrapes
  # (bearer token arrives via envFrom woodpecker-secrets,
  # WOODPECKER_PROMETHEUS_AUTH_TOKEN; the chart renders
  # WOODPECKER_METRICS_SERVER_ADDR and the named `metrics` port 9001).
  metrics:
    enabled: true

  createAgentSecret: false
  extraSecretNamesForEnvFrom:
    - woodpecker-default-agent-secret
    - woodpecker-secrets

  persistentVolume:
    enabled: false

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 1Gi

  nodeSelector:
    node-role.kubernetes.io/homelab: homelab

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault

agent:
  enabled: true
  replicaCount: 1

  image:
    registry: docker.io
    repository: woodpeckerci/woodpecker-agent
    tag: v3.19.0
    pullPolicy: IfNotPresent

  env:
    WOODPECKER_SERVER: "woodpecker-server:9000"
    WOODPECKER_BACKEND: kubernetes
    WOODPECKER_BACKEND_K8S_NAMESPACE: woodpecker
    WOODPECKER_BACKEND_K8S_STORAGE_CLASS: longhorn-crypto
    WOODPECKER_BACKEND_K8S_STORAGE_RWX: false
    WOODPECKER_BACKEND_K8S_VOLUME_SIZE: 10G
    WOODPECKER_CONNECT_RETRY_COUNT: "5"
    # v3.18 has no agent-wide runtime-class flag: pipelines opt into gVisor
    # per-step via backend_options.runtimeClassName, which this gate allows.
    WOODPECKER_BACKEND_K8S_RUNTIME_CLASS_ALLOW_FROM_STEP: "true"
    # Label spawned pipeline pods so allow-pipeline-egress
    # (-2_network_policy.yaml) can select them; without it they match no
    # policy and get DNS-only egress under default-deny.
    WOODPECKER_BACKEND_K8S_POD_LABELS: '{"app.kubernetes.io/managed-by": "woodpecker"}'
    # Schedule pipeline pods on homelab nodes like every other workload
    # (YAML mapping string, unmarshaled by the k8s backend).
    WOODPECKER_BACKEND_K8S_POD_NODE_SELECTOR: "node-role.kubernetes.io/homelab: homelab"
    # The backend's workspace permission init container defaults to the
    # floating short-name busybox:stable-musl; pin it fully qualified.
    WOODPECKER_BACKEND_K8S_PERMISSION_INIT_IMAGE: "docker.io/library/busybox:1.38.0-musl"

  extraSecretNamesForEnvFrom:
    - woodpecker-default-agent-secret

  persistence:
    enabled: false

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
      ephemeral-storage: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 1Gi

  nodeSelector:
    node-role.kubernetes.io/homelab: homelab

  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault

  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
