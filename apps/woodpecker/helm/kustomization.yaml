apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: woodpecker
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: woodpecker
    repo: https://woodpecker-ci.org/
    version: 3.7.7
    releaseName: woodpecker
    namespace: woodpecker
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  # --- the chart templates omit metadata.namespace on its workloads and
  # services (they rely on the Helm release namespace at deploy time), so
  # kustomize patches it in; without it the offline render leaves the
  # StatefulSets in the default namespace and kubescape fails C-0061 on a
  # render artifact.
  - target:
      version: v1
      kind: ^(ServiceAccount|Service)$
      name: ^(woodpecker-agent|woodpecker-server(-headless)?)$
    patch: |-
      - op: add
        path: /metadata/namespace
        value: woodpecker
  - target:
      group: apps
      version: v1
      kind: StatefulSet
    patch: |-
      - op: add
        path: /metadata/namespace
        value: woodpecker
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: ^woodpecker-server$
    patch: |-
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1no-read-only-root-fs
        value: The pinned upstream server image writes to its root filesystem; overriding it would break runtime file access.
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: ^woodpecker-agent$
    patch: |-
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1no-read-only-root-fs
        value: The pinned upstream agent image writes to its root filesystem; overriding it would break runtime file access.
