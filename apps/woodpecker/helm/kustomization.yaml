apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: woodpecker
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: woodpecker
    repo: https://woodpecker-ci.org/
    version: 3.7.3
    releaseName: woodpecker
    namespace: woodpecker
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  # --- the chart templates omit metadata.namespace on its workloads and
  # services (they rely on the Helm release namespace at deploy time), so
  # kustomize patches it in; without it the offline render leaves the
  # StatefulSets in the default namespace and kubescape fails C-0061 on a
  # render artifact.
  - target:
      version: v1
      kind: ^(ServiceAccount|Service)$
      name: ^(woodpecker-agent|woodpecker-server(-headless)?)$
    patch: |-
      - op: add
        path: /metadata/namespace
        value: woodpecker
  - target:
      group: apps
      version: v1
      kind: StatefulSet
    patch: |-
      - op: add
        path: /metadata/namespace
        value: woodpecker
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: ^woodpecker-server$
    patch: |-
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: container-image-pull-policy,pod-networkpolicy,container-security-context-user-group-id,container-security-context-readonlyrootfilesystem,pod-probes-identical
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: The upstream chart pins UID/GID 1000 and writes to its root filesystem; the chart intentionally shares its health endpoint between probes, Cilium enforces the network boundary, and the pinned image is pulled IfNotPresent to reuse the node cache.
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: ^woodpecker-agent$
    patch: |-
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: container-image-pull-policy,pod-networkpolicy,container-security-context-user-group-id,container-security-context-readonlyrootfilesystem,statefulset-has-servicename
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: The upstream chart pins UID/GID 1000 and writes to its root filesystem; the upstream chart never creates the headless Service named by the StatefulSet, Cilium enforces the network boundary, and the pinned image is pulled IfNotPresent to reuse the node cache.
