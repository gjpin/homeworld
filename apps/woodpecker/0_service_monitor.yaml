---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: woodpecker-server
  namespace: woodpecker
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: server
      app.kubernetes.io/instance: woodpecker
  endpoints:
    - port: metrics
      path: /metrics
      interval: 60s
      bearerTokenSecret:
        name: woodpecker-secrets
        key: WOODPECKER_PROMETHEUS_AUTH_TOKEN
