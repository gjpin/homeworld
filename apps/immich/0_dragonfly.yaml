# https://www.dragonflydb.io/docs/managing-dragonfly/operator/dragonfly-configuration
# https://www.dragonflydb.io/docs/managing-dragonfly/operator/installation
---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  labels:
    app.kubernetes.io/part-of: dragonfly-operator
    app.kubernetes.io/created-by: dragonfly-operator
  name: dragonfly
  namespace: immich
spec:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 50Mi
    limits:
      cpu: 500m
      memory: 2000Mi
  authentication:
    passwordFromSecret:
      name: dragonfly
      key: password
  nodeSelector:
    node-role.kubernetes.io/homelab: homelab
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
