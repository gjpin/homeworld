# https://github.com/tensorchord/cloudnative-vectorchord/pkgs/container/cloudnative-vectorchord
# https://cloudnative-pg.io/docs/1.28/bootstrap/
# https://cloudnative-pg.io/docs/1.28/declarative_database_management/
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    cnpg.io/podPatch: '[{"op":"add","path":"/spec/hostUsers","value":false}]'
spec:
  instances: 1
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.1-1.0.0
  # VectorChord's _PG_init only registers the index access methods and GUCs
  # during server start; CREATE EXTENSION fails with "must be loaded via
  # shared_preload_libraries" without this (Immich upstream requires
  # vchord.so in shared_preload_libraries).
  postgresql:
    shared_preload_libraries:
      - vchord.so
  # Immich expects superuser permissions on its database by default
  # (https://immich.app/docs/administration/postgres-standalone/).
  managed:
    roles:
      - name: immich
        ensure: present
        login: true
        superuser: true
  affinity:
    nodeSelector:
      node-role.kubernetes.io/homelab: homelab
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  # Memory requests equal limits so the database is the last pod the
  # kernel or kubelet reclaims under node memory pressure (CNPG's resource
  # management guidance). Immich gets more than the other clusters for its
  # VectorChord smart-search and face indexes.
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
      ephemeral-storage: 128Mi
    limits:
      cpu: "1"
      memory: 1Gi
      ephemeral-storage: 2Gi
  storage:
    storageClass: longhorn-crypto
    size: 5Gi
  backup:
    # Database-native volume-snapshot backups (1_scheduled_backup.yaml); the
    # cnpg-longhorn class is provisioned by apps/cloudnative-pg. Ownership by
    # the Backup CR makes pruning old Backup CRs garbage-collect their
    # snapshots (the class uses deletionPolicy: Delete).
    volumeSnapshot:
      className: cnpg-longhorn
      snapshotOwnerReference: backup
  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: postgres-credentials
      # Immich requires vchord (pulls in pgvector via CASCADE) plus
      # cube/earthdistance for geolocation search.
      postInitSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE
        - CREATE EXTENSION IF NOT EXISTS cube CASCADE
        - CREATE EXTENSION IF NOT EXISTS earthdistance CASCADE
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: immich
  namespace: immich
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: immich
  podMetricsEndpoints:
    - port: metrics
      interval: 60s
