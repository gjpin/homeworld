---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-immich-dragonfly-ingress
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: dragonfly
  ingress:
    # The operator's readiness and role checks use the admin port.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: dragonfly-operator
            k8s:app.kubernetes.io/name: dragonfly-operator
      toPorts:
        - ports:
            - port: "9999"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: immich
            k8s:app.kubernetes.io/controller: main
            k8s:app.kubernetes.io/instance: immich
            k8s:app.kubernetes.io/name: server
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # Operand admin/metrics endpoint (port 9999) scraped by the PodMonitor.
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-collector
      toPorts:
        - ports:
            - port: "9999"
              protocol: TCP
---
