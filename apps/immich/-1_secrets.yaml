---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dragonfly
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: dragonfly
  data:
    - secretKey: password
      remoteRef:
        key: /immich/DRAGONFLY_PASSWORD
        decodingStrategy: Auto
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
  data:
    - secretKey: username
      remoteRef:
        key: /immich/POSTGRES_USERNAME
        decodingStrategy: Auto
    - secretKey: password
      remoteRef:
        key: /immich/POSTGRES_PASSWORD
        decodingStrategy: Auto
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: immich-config
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: immich-config
    template:
      engineVersion: v2
      data:
        immich-config.yaml: |
          oauth:
            enabled: true
            autoLaunch: true
            autoRegister: true
            buttonText: Authelia
            clientId: immich
            clientSecret: "{{ .clientSecret }}"
            issuerUrl: https://auth.${BASE_DOMAIN}/.well-known/openid-configuration
            mobileRedirectUri: app.immich:///oauth-callback
            roleClaim: immich_role
            scope: openid profile email groups immich
            signingAlgorithm: RS256
            tokenEndpointAuthMethod: client_secret_basic
          passwordLogin:
            enabled: false
  data:
    - secretKey: clientSecret
      remoteRef:
        key: /authelia/OIDC_CLIENT_SECRET_IMMICH
        decodingStrategy: Auto
