# https://cloudnative-pg.github.io/docs/1.28/appendixes/backup_volumesnapshot/
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-daily-volume-snapshot
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Daily at 01:00 UTC, staggered from Velero's 03:00 Europe/Lisbon schedule
  # (apps/velero/helm/values.yaml). CNPG volume-snapshot backups have no
  # built-in retention: prune old Backup CRs (kubectl -n immich delete backup
  # <name>); their VolumeSnapshots and Longhorn snapshot contents are
  # garbage-collected with them (snapshotOwnerReference: backup +
  # deletionPolicy: Delete on the cnpg-longhorn class).
  schedule: "0 1 * * *"
  backupOwnerReference: self
  cluster:
    name: immich
  method: volumeSnapshot
