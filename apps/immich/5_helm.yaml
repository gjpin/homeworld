# https://artifacthub.io/packages/helm/immich/immich
# https://github.com/immich-app/immich-charts
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: immich
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: immich
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
  source:
    chart: immich
    repoURL: ghcr.io/immich-app/immich-charts
    targetRevision: 0.11.1
    helm:
      releaseName: immich
      valuesObject:
        global:
          fullnameOverride: immich

        immich:
          metrics:
            enabled: true
          persistence:
            library:
              existingClaim: immich
        
        machine-learning:
          persistence:
            cache:
              enabled: true
              size: 10Gi
              type: pvc
              accessMode: ReadWriteMany
              storageClass: longhorn-crypto

        controllers:
          main:
            containers:
              main:
                env:
                  REDIS_HOSTNAME: valkey.immich.svc.cluster.local:6379
                  IMMICH_MACHINE_LEARNING_URL: immich-machine-learning.immich.svc.cluster.local:3003
                  DB_HOSTNAME: immich-rw.immich.svc.cluster.local:5432
          