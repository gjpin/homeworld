defaultPodOptions:
  hostUsers: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
defaultContainerOptions:
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
immich:
  metrics:
    enabled: true
    # Documented telemetry exception: the chart hardcodes IMMICH_TELEMETRY_INCLUDE=all
    # on the server container (not values-configurable). It only enables the local
    # OTel metrics endpoint consumed by the required ServiceMonitor — no phone-home.
  persistence:
    library:
      existingClaim: photos
  # The chart's empty configuration map is truthy and conflicts with an existing Secret.
  configuration: null
  existingConfiguration: immich-config
  configurationKind: Secret
machine-learning:
  persistence:
    cache:
      enabled: true
      size: 10Gi
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      storageClass: longhorn-crypto
server:
  service:
    main:
      ports:
        http:
          port: 80
  # Database and Redis credentials reach only the server; the
  # machine-learning container never talks to either datastore.
  controllers:
    main:
      containers:
        main:
          env:
            REDIS_PORT: "6379"
            REDIS_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: dragonfly
                  key: password
            DB_HOSTNAME: immich-rw.immich.svc.cluster.local
            DB_PORT: "5432"
            DB_DATABASE_NAME: immich
            DB_USERNAME: immich
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
            # Authelia's certificate (OIDC sign-in) is signed by the
            # homeworld CA; Node adds this file to its built-in roots.
            NODE_EXTRA_CA_CERTS: /etc/homeworld-ca/ca.crt
  persistence:
    homeworld-ca:
      enabled: true
      type: configMap
      name: homeworld-ca
      globalMounts:
        - path: /etc/homeworld-ca
          readOnly: true
# Overrides the chart's shared (server + machine-learning) env defaults,
# which point at the bundled Valkey and the release-name ML service.
controllers:
  main:
    containers:
      main:
        env:
          REDIS_HOSTNAME: dragonfly.immich.svc.cluster.local
          IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning.immich.svc.cluster.local:3003
