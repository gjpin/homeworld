# Both pods run on gVisor (kustomization.yaml), which cannot join a pod user
# namespace yet, so they keep the host user namespace (docs/pod-security.md).
defaultPodOptions:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
defaultContainerOptions:
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
immich:
  metrics:
    enabled: true
    # Documented telemetry exception: the chart hardcodes IMMICH_TELEMETRY_INCLUDE=all
    # on the server container (not values-configurable). It only enables the local
    # OTel metrics endpoint consumed by the required ServiceMonitor — no phone-home.
  persistence:
    library:
      existingClaim: photos
  # The chart's empty configuration map is truthy and conflicts with an existing Secret.
  configuration: null
  existingConfiguration: immich-config
  configurationKind: Secret
machine-learning:
  controllers:
    main:
      containers:
        main:
          env:
            # The optimized model exports: faster, less memory, numerically
            # equivalent outputs. Upstream will make this revision the default
            # in a later release.
            MACHINE_LEARNING_MODEL_REVISION: v2
            # The PyPI onnxruntime wheel in this image sends telemetry to
            # Microsoft unless this is set before it initializes. The image
            # only sets it as an overridable default.
            ORT_DISABLE_TELEMETRY: "1"
  # The image declares no USER and writes only to /cache (the PVC below), so
  # it runs as a fixed non-root ID that owns that volume.
  defaultPodOptions:
    securityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
      seccompProfile:
        type: RuntimeDefault
  persistence:
    cache:
      size: 4Gi
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      storageClass: longhorn-crypto
server:
  # The library lives on the NAS (NFS, docs/nas.md), which squashes every
  # access to the share's owner, 20001: the server runs as that ID, and NFS
  # (no idmapped mounts) requires the host user namespace.
  defaultPodOptions:
    hostUsers: true
    securityContext:
      runAsNonRoot: true
      runAsUser: 20001
      runAsGroup: 20001
      fsGroup: 20001
      seccompProfile:
        type: RuntimeDefault
  service:
    main:
      ports:
        http:
          port: 80
  # Database and Redis credentials reach only the server; the
  # machine-learning container never talks to either datastore.
  controllers:
    main:
      containers:
        main:
          env:
            REDIS_PORT: "6379"
            REDIS_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: valkey
                  key: password
            DB_HOSTNAME: immich-rw.immich.svc.cluster.local
            DB_PORT: "5432"
            DB_DATABASE_NAME: immich
            DB_USERNAME: immich
            DB_PASSWORD:
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: password
# Overrides the chart's shared (server + machine-learning) defaults: the env
# points at the bundled Valkey and the release-name ML service, and the chart
# does not follow Immich releases (its README asks to set the tag), so this one
# tag, tracked by Renovate, pins both images.
controllers:
  main:
    containers:
      main:
        image:
          tag: v3.4.1
        env:
          REDIS_HOSTNAME: valkey.immich.svc.cluster.local
          IMMICH_MACHINE_LEARNING_URL: http://immich-machine-learning.immich.svc.cluster.local:3003
