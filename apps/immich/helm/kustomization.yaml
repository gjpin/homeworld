apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: immich
    repo: oci://ghcr.io/immich-app/immich-charts
    version: 0.13.2
    releaseName: immich
    namespace: immich
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: ^(Deployment|StatefulSet)$
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^immich-(server|machine-learning)$
      namespace: ^immich$
    patch: |-
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^immich-machine-learning$
      namespace: ^immich$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"4Gi","ephemeral-storage":"2Gi"}}
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^immich-server$
      namespace: ^immich$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"4Gi","ephemeral-storage":"2Gi"}}
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^immich-machine-learning$
      namespace: ^immich$
    patch: |-
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: pod-probes-identical,pod-networkpolicy,container-security-context-user-group-id,container-security-context-readonlyrootfilesystem,deployment-replicas
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^immich-server$
      namespace: ^immich$
    patch: |-
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: pod-probes-identical,pod-networkpolicy,container-security-context-user-group-id,container-security-context-readonlyrootfilesystem,deployment-replicas
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: ServiceMonitor
      name: ^immich-server$
      namespace: ^immich$
    patch: |-
      - op: add
        path: /spec/endpoints/0/interval
        value: 60s
      - op: add
        path: /spec/endpoints/1/interval
        value: 60s
