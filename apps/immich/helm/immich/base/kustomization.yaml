apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
- name: immich
  repo: oci://ghcr.io/immich-app/immich-charts
  version: 0.11.1
  releaseName: immich
  namespace: immich
  includeCRDs: true
  skipTests: true
  valuesFile: values.yaml
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^immich-machine-learning$
    namespace: ^immich$
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^immich-server$
    namespace: ^immich$
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
