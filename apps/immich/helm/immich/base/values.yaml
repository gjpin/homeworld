defaultPodOptions:
  nodeSelector:
    node-role.kubernetes.io/homelab: homelab
  hostUsers: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
defaultContainerOptions:
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
immich:
  metrics:
    enabled: true
  persistence:
    library:
      existingClaim: immich
machine-learning:
  persistence:
    cache:
      enabled: true
      size: 10Gi
      type: persistentVolumeClaim
      accessMode: ReadWriteMany
      storageClass: longhorn-crypto
  controllers:
    main:
      # Longhorn RWX volumes are NFS-backed and cannot be mounted by user-namespaced Pods.
      pod:
        hostUsers: true
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
server:
  service:
    main:
      ports:
        http:
          port: 80
  controllers:
    main:
      containers:
        main:
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
controllers:
  main:
    containers:
      main:
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        env:
          REDIS_HOSTNAME: dragonfly.immich.svc.cluster.local:6379
          REDIS_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: dragonfly
                key: password
          IMMICH_MACHINE_LEARNING_URL: immich-machine-learning.immich.svc.cluster.local:3003
          DB_HOSTNAME: immich-rw.immich.svc.cluster.local:5432
          DB_DATABASE_NAME: immich
          DB_USERNAME: immich
          DB_PASSWORD:
            valueFrom:
              secretKeyRef:
                name: postgres-credentials
                key: password
