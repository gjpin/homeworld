---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    external-dns.alpha.kubernetes.io/hostname: "photos.${BASE_DOMAIN}"
spec:
  parentRefs:
    - name: envoy
      namespace: immich
      sectionName: immich-https
  hostnames:
    - "photos.${BASE_DOMAIN}"
  rules:
    - backendRefs:
      - name: immich-server
        namespace: immich
        kind: Service
        port: 80
