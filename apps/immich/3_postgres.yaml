# https://github.com/tensorchord/cloudnative-vectorchord/pkgs/container/cloudnative-vectorchord
# https://cloudnative-pg.io/docs/1.28/bootstrap/
# https://cloudnative-pg.io/docs/1.28/declarative_database_management/
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  instances: 1
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:18.1-1.0.0
  affinity:
    nodeSelector:
      node-role.kubernetes.io/homelab: homelab
  storage:
    storageClass: longhorn-crypto
    size: 5Gi
  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: postgres-credentials
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  name: immich
  owner: immich
  databaseReclaimPolicy: retain
  cluster:
    name: immich
  extensions:
    - name: vchord
      ensure: present
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: immich
  namespace: immich
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: immich
  podMetricsEndpoints:
    - port: metrics
      interval: 60s
