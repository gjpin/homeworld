# Intel's GPU device plugin from the pinned release's own kustomize base
# (deployments/gpu_plugin). It advertises the Intel iGPU as the
# gpu.intel.com/i915 resource, which Jellyfin requests for QuickSync
# transcoding: the device nodes are allocated through the CRI, so the
# consumer needs no hostPath and no privileged mode. The DaemonSet runs on
# the one node with an Intel GPU, selected by the profile label k3s sets
# from host/nodes (node.homeworld/profile=corebox), beside the
# base's amd64 selector.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: intel-gpu-plugin
commonAnnotations:
  security.homeworld/profile: homelab
resources:
  - https://github.com/intel/intel-device-plugins-for-kubernetes//deployments/gpu_plugin?ref=v0.37.1
images:
  - name: intel/intel-gpu-plugin
    newName: docker.io/intel/intel-gpu-plugin
    newTag: 0.37.1
patches:
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: ^intel-gpu-plugin$
    patch: |-
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: The device plugin reads /dev/dri and /sys/class/drm and serves its socket in the kubelet's root-owned device-plugins directory through hostPath mounts, as root; SELinux confines it as container_device_plugin_t, and it has no network access.
      - op: add
        path: /spec/template/spec/nodeSelector/node.homeworld~1profile
        value: corebox
      - op: add
        path: /spec/template/metadata/labels/app.kubernetes.io~1name
        value: intel-gpu-plugin
      - op: add
        path: /spec/template/spec/containers/0/resources/requests/ephemeral-storage
        value: 16Mi
      - op: add
        path: /spec/template/spec/containers/0/resources/limits/ephemeral-storage
        value: 64Mi
