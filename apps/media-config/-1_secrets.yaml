---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-config-secrets
  namespace: media-config
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: media-config-secrets
  data:
    # The apps' own API keys, generated up front (docs/secrets.md).
    - secretKey: SONARR_API_KEY
      remoteRef:
        key: /sonarr/API_KEY
        decodingStrategy: None
    - secretKey: RADARR_API_KEY
      remoteRef:
        key: /radarr/API_KEY
        decodingStrategy: None
    - secretKey: LIDARR_API_KEY
      remoteRef:
        key: /lidarr/API_KEY
        decodingStrategy: None
    - secretKey: PROWLARR_API_KEY
      remoteRef:
        key: /prowlarr/API_KEY
        decodingStrategy: None
    - secretKey: SEERR_API_KEY
      remoteRef:
        key: /seerr/API_KEY
        decodingStrategy: None
    - secretKey: BINDERY_API_KEY
      remoteRef:
        key: /bindery/API_KEY
        decodingStrategy: None
    - secretKey: BAZARR_API_KEY
      remoteRef:
        key: /bazarr/API_KEY
        decodingStrategy: None
    # qBittorrent: the WebAPI key for the *arrs, the WebUI login for Bindery
    # (its client signs in with a username and password).
    - secretKey: QBT_API_KEY
      remoteRef:
        key: /qbittorrent/WEBUI_API_KEY
        decodingStrategy: None
    - secretKey: QBT_USERNAME
      remoteRef:
        key: /qbittorrent/WEBUI_USERNAME
        decodingStrategy: None
    - secretKey: QBT_PASSWORD
      remoteRef:
        key: /qbittorrent/WEBUI_PASSWORD
        decodingStrategy: None
    - secretKey: BINDERY_OIDC_CLIENT_SECRET
      remoteRef:
        key: /authelia/OIDC_CLIENT_SECRET_BINDERY
        decodingStrategy: None
---
# Created in Jellyfin during the one-time setup (README); until it exists
# this ExternalSecret stays unready, the job's optional reference resolves
# to nothing, and the Jellyfin steps are skipped.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: media-config-jellyfin
  namespace: media-config
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: media-config-jellyfin
  data:
    - secretKey: JELLYFIN_API_KEY
      remoteRef:
        key: /homepage/JELLYFIN_API_KEY
        decodingStrategy: None
