---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: media-config
  namespace: media-config
  labels:
    app.kubernetes.io/name: media-config
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Hourly, after Recyclarr's run at :17 so the quality profiles Seerr's
  # servers point at exist. Each run converges the wiring; a step whose
  # target is still starting fails and the next run retries it.
  schedule: "47 * * * *"
  timeZone: UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      activeDeadlineSeconds: 900
      template:
        metadata:
          labels:
            app.kubernetes.io/name: media-config
        spec:
          restartPolicy: Never
          serviceAccountName: media-config
          automountServiceAccountToken: false
          runtimeClassName: gvisor
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: media-config
              # Renovate tracks the image tag below.
              image: docker.io/library/python:3.15-alpine3.24
              imagePullPolicy: IfNotPresent
              command:
                - python3
                - /scripts/reconcile.py
              env:
                - name: PYTHONDONTWRITEBYTECODE
                  value: "1"
                - name: PYTHONUNBUFFERED
                  value: "1"
                # Optional: the Jellyfin steps are skipped until the key
                # exists.
                - name: JELLYFIN_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: media-config-jellyfin
                      key: JELLYFIN_API_KEY
                      optional: true
              envFrom:
                - secretRef:
                    name: media-config-secrets
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65534
                runAsGroup: 65534
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                  ephemeral-storage: 16Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
                  ephemeral-storage: 64Mi
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: scripts
              configMap:
                name: media-config-script
