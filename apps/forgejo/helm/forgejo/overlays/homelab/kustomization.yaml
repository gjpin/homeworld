apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
commonAnnotations:
  security.homeworld/profile: homelab
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^forgejo$
    namespace: ^forgejo$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources
      value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
    - op: add
      path: /spec/template/spec/initContainers/0/resources
      value: {"requests":{"cpu":"100m","memory":"128Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
    - op: add
      path: /spec/template/spec/initContainers/1/resources
      value: {"requests":{"cpu":"100m","memory":"128Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
    - op: add
      path: /spec/template/spec/initContainers/2/resources
      value: {"requests":{"cpu":"100m","memory":"128Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^forgejo$
    namespace: ^forgejo$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Always
    - op: add
      path: /spec/template/spec/initContainers/0/imagePullPolicy
      value: Always
    - op: add
      path: /spec/template/spec/initContainers/1/imagePullPolicy
      value: Always
    - op: add
      path: /spec/template/spec/initContainers/2/imagePullPolicy
      value: Always
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^forgejo$
    namespace: ^forgejo$
  patch: |-
    - op: add
      path: /metadata/annotations/kube-score~1ignore
      value: pod-networkpolicy,container-security-context-user-group-id,container-security-context-readonlyrootfilesystem,deployment-strategy,deployment-replicas
    - op: add
      path: /metadata/annotations/security.homeworld~1exception-reason
      value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
