namespace: forgejo
# Disable inbuilt postgres
postgresql-ha:
  enabled: false
postgresql:
  enabled: false
gitea:
  config:
    database:
      DB_TYPE: postgres
      HOST: forgejo-rw.forgejo.svc.cluster.local:5432
      NAME: forgejo
      USER: forgejo
  additionalConfigFromEnvs:
    - name: FORGEJO__DATABASE__PASSWD
      valueFrom:
        secretKeyRef:
          name: postgres-credentials
          key: password
  metrics:
    serviceMonitor:
      enabled: true
      interval: 60s
nodeSelector:
  node-role.kubernetes.io/homelab: homelab
podSecurityContext:
  fsGroup: 1000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  seccompProfile:
    type: RuntimeDefault
test:
  enabled: false
