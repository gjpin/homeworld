apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
- name: forgejo
  repo: oci://code.forgejo.org/forgejo-helm
  version: 17.1.7
  releaseName: forgejo
  namespace: forgejo
  includeCRDs: true
  skipTests: true
  valuesFile: values.yaml
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^forgejo$
    namespace: ^forgejo$
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
    - op: replace
      path: /spec/template/spec/initContainers/0/imagePullPolicy
      value: IfNotPresent
    - op: replace
      path: /spec/template/spec/initContainers/1/imagePullPolicy
      value: IfNotPresent
    - op: replace
      path: /spec/template/spec/initContainers/2/imagePullPolicy
      value: IfNotPresent
