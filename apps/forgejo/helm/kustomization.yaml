apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: forgejo
    repo: oci://code.forgejo.org/forgejo-helm
    version: 17.1.7
    releaseName: forgejo
    namespace: forgejo
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^forgejo$
      namespace: ^forgejo$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: replace
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: IfNotPresent
      - op: replace
        path: /spec/template/spec/initContainers/1/imagePullPolicy
        value: IfNotPresent
      - op: replace
        path: /spec/template/spec/initContainers/2/imagePullPolicy
        value: IfNotPresent
  - target:
      group: apps
      version: v1
      kind: ^(Deployment|StatefulSet)$
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^forgejo$
      namespace: ^forgejo$
    patch: |-
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^forgejo$
      namespace: ^forgejo$
    patch: |-
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: pod-networkpolicy,container-security-context-user-group-id,container-security-context-readonlyrootfilesystem,deployment-strategy,deployment-replicas,container-image-pull-policy
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: Upstream UID, filesystem, probe, availability, Cilium policy, and cached-image pull constraints are accepted for this exact resource.
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: ServiceMonitor
      name: ^forgejo$
      namespace: ^forgejo$
    patch: |-
      - op: add
        path: /spec/endpoints/0/interval
        value: 60s
