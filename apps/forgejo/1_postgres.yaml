# https://github.com/cloudnative-pg/postgres-containers/pkgs/container/postgresql/versions?filters%5Bversion_type%5D=tagged
# https://cloudnative-pg.io/documentation/current/samples/
# https://cloudnative-pg.io/documentation/current/cloudnative-pg.v1/
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: forgejo
  namespace: forgejo
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18.1-system-trixie
  storage:
    storageClass: longhorn-crypto
    size: 5Gi