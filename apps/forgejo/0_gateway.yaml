# TODO: each application has a gateway, which are merged into a single one till
# cert-manager supports http routes for automatic certificates
# https://github.com/cert-manager/cert-manager/issues/6051
# https://gateway.envoyproxy.io/docs/tasks/security/tls-cert-manager/
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy
  namespace: forgejo
  annotations:
    cert-manager.io/cluster-issuer: homeworld-ca
spec:
  gatewayClassName: envoy-merged
  addresses:
    - type: IPAddress
      value: 192.168.8.50
  listeners:
    - name: forgejo-https
      protocol: HTTPS
      port: 443
      hostname: "git.homeworld.internal"
      allowedRoutes:
        namespaces:
          from: All
      tls:
        mode: Terminate
        certificateRefs:
          - name: forgejo-tls-cert
            kind: Secret
            group: ""
    # Plain TCP passthrough for git SSH (git@ clone/push). Raw TCP carries
    # no hostname, so every name resolving to 192.168.8.50 reaches it;
    # clients use git.homeworld.internal (the router's wildcard rewrite).
    - name: forgejo-ssh
      protocol: TCP
      port: 22
      allowedRoutes:
        namespaces:
          from: All