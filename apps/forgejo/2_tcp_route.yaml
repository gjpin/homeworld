---
# Git SSH (git@ clone/push) through the merged Gateway's TCP listener
# (0_gateway.yaml). TCPRoute carries no spec.hostnames of its own; clients
# reach it as git.homeworld.internal through the router's wildcard rewrite.
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: forgejo-ssh
  namespace: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: forgejo
      sectionName: forgejo-ssh
      group: gateway.networking.k8s.io
      kind: Gateway
  rules:
    - backendRefs:
        - name: forgejo-ssh
          port: 22
          group: ""
          kind: Service
          weight: 1
