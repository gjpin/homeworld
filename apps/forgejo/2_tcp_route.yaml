---
# Git SSH (git@ clone/push) through the shared Gateway's forgejo-ssh TCP
# listener (apps/envoy-gateway/2_gateway.yaml). TCPRoute carries no
# spec.hostnames of its own; clients reach it as git.base-domain.invalid
# through the wildcard DNS record.
apiVersion: gateway.networking.k8s.io/v1
kind: TCPRoute
metadata:
  name: forgejo-ssh
  namespace: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      sectionName: forgejo-ssh
      group: gateway.networking.k8s.io
      kind: Gateway
  rules:
    - backendRefs:
        - name: forgejo-ssh
          port: 22
          group: ""
          kind: Service
          weight: 1
