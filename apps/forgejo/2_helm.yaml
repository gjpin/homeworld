# https://artifacthub.io/packages/helm/forgejo-helm/forgejo
# https://code.forgejo.org/forgejo-helm/forgejo-helm
# https://forgejo.org/docs/latest/admin/config-cheat-sheet/
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: forgejo
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
  source:
    chart: forgejo
    repoURL: oci://code.forgejo.org/forgejo-helm/forgejo
    targetRevision: 15.0.3
    helm:
      releaseName: forgejo
      valuesObject:
        namespace: forgejo

        # Disable inbuilt postgres
        postgresql-ha:
          enabled: false
        postgresql:
          enabled: false

        gitea:
          config:
            database:
              DB_TYPE: postgres
              HOST: # TODO: RELEASE-NAME-postgresql.default.svc.cluster.local:5432
              NAME: # TODO: forgejo
              PASSWD: # TODO: forgejo
              USER: # TODO: forgejo
          metrics:
            serviceMonitor:
              enabled: true
              interval: 60s

        nodeSelector:
          node-role.kubernetes.io/homelab: homelab
---