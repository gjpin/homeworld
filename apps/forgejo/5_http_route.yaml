---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forgejo
  namespace: forgejo
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    external-dns.alpha.kubernetes.io/hostname: "git.${BASE_DOMAIN}"
spec:
  parentRefs:
    - name: envoy
      namespace: forgejo
  hostnames:
    - "git.${BASE_DOMAIN}"
  rules:
    - backendRefs:
        - name: forgejo-http
          namespace: forgejo
          kind: Service
          port: 3000
