# https://opentelemetry.io/docs/platforms/kubernetes/operator/target-allocator/
---
# The Target Allocator resolves the bearer token referenced by the
# unpackerr ServiceMonitor over the mTLS channel; access is pinned to the
# exact secret the monitor references.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: otel-targetallocator-monitor-credentials
  namespace: unpackerr
rules:
  - apiGroups:
      - ""
    resources:
      - secrets
    resourceNames:
      - unpackerr-secrets
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: otel-targetallocator-monitor-credentials
  namespace: unpackerr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: otel-targetallocator-monitor-credentials
subjects:
  - kind: ServiceAccount
    name: otel-collector-pod-targetallocator
    namespace: otel-collector
