---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: unpackerr-secrets
  namespace: unpackerr
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: unpackerr-secrets
  data:
    - secretKey: sonarrApiKey
      remoteRef:
        key: /sonarr/API_KEY
        decodingStrategy: None
    - secretKey: radarrApiKey
      remoteRef:
        key: /radarr/API_KEY
        decodingStrategy: None
    - secretKey: lidarrApiKey
      remoteRef:
        key: /lidarr/API_KEY
        decodingStrategy: None
    # The /metrics key (role system:metrics:read), also read by the
    # ServiceMonitor's bearer token through the Target Allocator.
    - secretKey: metricsApiKey
      remoteRef:
        key: /unpackerr/METRICS_API_KEY
        decodingStrategy: None
    # The web UI's local admin password (reached over a port-forward).
    - secretKey: uiPassword
      remoteRef:
        key: /unpackerr/UI_PASSWORD
        decodingStrategy: None
