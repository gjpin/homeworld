---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: collabora-admin
  namespace: collabora
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: collabora-admin
    template:
      type: Opaque
  data:
    - secretKey: username
      remoteRef:
        key: /opencloud/COLLABORA_ADMIN_USER
        decodingStrategy: None
    - secretKey: password
      remoteRef:
        key: /opencloud/COLLABORA_ADMIN_PASSWORD
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: collabora-proof
  namespace: collabora
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: collabora-proof
    template:
      type: Opaque
  data:
    - secretKey: proof_key
      remoteRef:
        key: /opencloud/COLLABORA_PROOF_KEY
        decodingStrategy: None
    - secretKey: proof_key.pub
      remoteRef:
        key: /opencloud/COLLABORA_PROOF_KEY_PUB
        decodingStrategy: None
