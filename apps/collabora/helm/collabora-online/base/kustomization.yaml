apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: collabora
helmCharts:
  - name: collabora-online
    repo: https://collaboraonline.github.io/online/
    version: 1.3.0
    releaseName: collabora
    namespace: collabora
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^collabora$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
