apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: collabora
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: collabora-online
    repo: https://collaboraonline.github.io/online/
    version: 1.3.6
    releaseName: collabora
    namespace: collabora
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  - target:
      version: v1
      kind: ConfigMap
      name: ^collabora$
    patch: |-
      - op: add
        path: /metadata/namespace
        value: collabora
  - target:
      version: v1
      kind: Service
      name: ^collabora$
    patch: |-
      - op: add
        path: /metadata/namespace
        value: collabora
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^collabora$
    patch: |-
      - op: add
        path: /metadata/namespace
        value: collabora
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
  - target:
      group: gateway.networking.k8s.io
      version: v1
      kind: HTTPRoute
      name: ^collabora$
    patch: |-
      - op: add
        path: /metadata/namespace
        value: collabora
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: ServiceMonitor
      name: ^collabora$
    patch: |-
      - op: add
        path: /spec/endpoints/0/interval
        value: 60s
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: ServiceMonitor
      name: ^collabora$
    patch: |-
      - op: add
        path: /metadata/namespace
        value: collabora
