fullnameOverride: collabora
image:
  repository: docker.io/collabora/code
  tag: 26.04.4.2.1
  pullPolicy: IfNotPresent
replicaCount: 1
# Keep one replica until WOPISrc-based routing is added for document affinity.
autoscaling:
  enabled: false
resources:
  requests:
    cpu: 10m
    memory: 64Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: "1"
    memory: 2Gi
    ephemeral-storage: 2Gi
collabora:
  aliasgroups:
    - host: https://cloud.${BASE_DOMAIN}
  server_name: office.${BASE_DOMAIN}:443
  extra_params: >-
    --o:ssl.enable=false
    --o:ssl.termination=true
    --o:welcome.enable=false
    --o:net.frame_ancestors=https://cloud.${BASE_DOMAIN}
    --o:logging.level=warning
  existingSecret:
    enabled: true
    secretName: collabora-admin
    usernameKey: username
    passwordKey: password
  proofKeysSecretRef: collabora-proof
  proofKeyGeneration:
    enabled: false
prometheus:
  servicemonitor:
    enabled: true
# The public route is hand-written in ../2_http_route.yaml (standard wave-2
# HTTPRoute file); the chart's own route generation is disabled.
route:
  enabled: false
nodeSelector:
  node-role.kubernetes.io/homelab: homelab
podLabels:
  app: collabora
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
service:
  port: 9980
deployment:
  containerPort: 9980
  labels:
    app: collabora
  annotations:
    ignore-check.kube-linter.io/no-read-only-root-fs: The pinned Collabora image requires a writable root filesystem for its rendering and font caches; overriding it would break the documented function.

probes:
  liveness:
    initialDelaySeconds: 30
