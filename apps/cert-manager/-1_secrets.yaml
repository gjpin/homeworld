---
# The Cloudflare API token consumed by the ClusterIssuers' dns01 solvers
# (2_cluster_issuer.yaml). Shared with external-dns via
# the /cloudflare/API_TOKEN Infisical key.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-api-token
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: cloudflare-api-token
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    # decodingStrategy None: Cloudflare API tokens are 40 alphanumeric
    # characters (plus - and _), which Auto would mis-detect as valid
    # base64 and corrupt; the token must reach Cloudflare byte-identical.
    - secretKey: api-token
      remoteRef:
        key: /cloudflare/API_TOKEN
        decodingStrategy: None
