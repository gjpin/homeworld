---
# The homeworld root CA (README "Create the Homeworld CA"), consumed by the
# homeworld-ca CA ClusterIssuer (2_cluster_issuer.yaml). cert-manager reads
# CA issuer secrets from its cluster resource namespace (cert-manager).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homeworld-ca
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: homeworld-ca
    creationPolicy: Owner
    template:
      type: kubernetes.io/tls
  data:
    - secretKey: tls.crt
      remoteRef:
        key: /cert-manager/CA_CERT
        decodingStrategy: None
    - secretKey: tls.key
      remoteRef:
        key: /cert-manager/CA_KEY
        decodingStrategy: None
