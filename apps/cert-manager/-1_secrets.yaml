---
# Porkbun API credentials consumed by the cert-manager Porkbun DNS-01 webhook
# solver (2_cluster_issuer.yaml). Shared with external-dns via the
# /porkbun/{API_KEY,SECRET_API_KEY} Infisical keys.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: porkbun-api-credentials
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: porkbun-api-credentials
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: api-key
      remoteRef:
        key: /porkbun/API_KEY
        decodingStrategy: None
    - secretKey: secret-key
      remoteRef:
        key: /porkbun/SECRET_API_KEY
        decodingStrategy: None
