apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: 1.21.2
    releaseName: cert-manager
    namespace: cert-manager
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^cert-manager$
      namespace: ^cert-manager$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^cert-manager-cainjector$
      namespace: ^cert-manager$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^cert-manager-webhook$
      namespace: ^cert-manager$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^cert-manager-startupapicheck$
      namespace: ^cert-manager$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      group: apps
      version: v1
      kind: ^(Deployment|StatefulSet)$
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^cert-manager(-cainjector|-webhook)?$
      namespace: ^cert-manager$
    patch: |-
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^cert-manager$
      namespace: ^cert-manager$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^cert-manager-cainjector$
      namespace: ^cert-manager$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^cert-manager-webhook$
      namespace: ^cert-manager$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^cert-manager-startupapicheck$
      namespace: ^cert-manager$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^cert-manager$
      namespace: ^cert-manager$
    patch: |-
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: pod-networkpolicy,container-security-context-user-group-id,pod-probes,deployment-replicas
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^cert-manager-cainjector$
      namespace: ^cert-manager$
    patch: |-
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: container-security-context-user-group-id,pod-probes,pod-networkpolicy,deployment-replicas
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^cert-manager-webhook$
      namespace: ^cert-manager$
    patch: |-
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: pod-networkpolicy,container-security-context-user-group-id,deployment-replicas
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^cert-manager-startupapicheck$
      namespace: ^cert-manager$
    patch: |-
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: container-security-context-user-group-id,pod-networkpolicy
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
