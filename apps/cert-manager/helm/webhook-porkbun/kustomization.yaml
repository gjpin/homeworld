apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: cert-manager-webhook-porkbun
    repo: oci://ghcr.io/octabits-io/charts
    version: 2.0.10
    releaseName: cert-manager-webhook-porkbun
    namespace: cert-manager
    skipTests: true
    valuesFile: values.yaml
patches:
  # The chart exposes no runtimeClassName key.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^cert-manager-webhook-porkbun$
      namespace: ^cert-manager$
    patch: |-
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
