apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
commonAnnotations:
  security.homeworld/profile: homelab
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^cert-manager$
    namespace: ^cert-manager$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources
      value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^cert-manager-cainjector$
    namespace: ^cert-manager$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources
      value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^cert-manager-webhook$
    namespace: ^cert-manager$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources
      value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
- target:
    group: batch
    version: v1
    kind: Job
    name: ^cert-manager-startupapicheck$
    namespace: ^cert-manager$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources
      value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^cert-manager$
    namespace: ^cert-manager$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Always
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^cert-manager-cainjector$
    namespace: ^cert-manager$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Always
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^cert-manager-webhook$
    namespace: ^cert-manager$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Always
- target:
    group: batch
    version: v1
    kind: Job
    name: ^cert-manager-startupapicheck$
    namespace: ^cert-manager$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Always
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^cert-manager$
    namespace: ^cert-manager$
  patch: |-
    - op: add
      path: /metadata/annotations/kube-score~1ignore
      value: pod-networkpolicy,container-security-context-user-group-id,pod-probes,deployment-replicas
    - op: add
      path: /metadata/annotations/security.homeworld~1exception-reason
      value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^cert-manager-cainjector$
    namespace: ^cert-manager$
  patch: |-
    - op: add
      path: /metadata/annotations/kube-score~1ignore
      value: container-security-context-user-group-id,pod-probes,pod-networkpolicy,deployment-replicas
    - op: add
      path: /metadata/annotations/security.homeworld~1exception-reason
      value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^cert-manager-webhook$
    namespace: ^cert-manager$
  patch: |-
    - op: add
      path: /metadata/annotations/kube-score~1ignore
      value: pod-networkpolicy,container-security-context-user-group-id,deployment-replicas
    - op: add
      path: /metadata/annotations/security.homeworld~1exception-reason
      value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
- target:
    group: batch
    version: v1
    kind: Job
    name: ^cert-manager-startupapicheck$
    namespace: ^cert-manager$
  patch: |-
    - op: add
      path: /metadata/annotations/kube-score~1ignore
      value: container-security-context-user-group-id,pod-networkpolicy
    - op: add
      path: /metadata/annotations/security.homeworld~1exception-reason
      value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
