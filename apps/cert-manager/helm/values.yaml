global:
  hostUsers: false
  # global.nodeSelector reaches the controller, cainjector, webhook, and the
  # startupapicheck Job; the chart's top-level nodeSelector key only feeds
  # the controller Deployment.
  nodeSelector:
    node-role.kubernetes.io/homelab: homelab

fullnameOverride: cert-manager
namespace: cert-manager
crds:
  enabled: true
  keep: true
# https://cert-manager.io/docs/usage/gateway/
config:
  apiVersion: controller.config.cert-manager.io/v1alpha1
  kind: ControllerConfiguration
  gatewayAPI:
    enabled: true
  kubernetesAPIQPS: 10000
  kubernetesAPIBurst: 10000
prometheus:
  servicemonitor:
    enabled: true
    interval: 60s
