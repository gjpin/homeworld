global:
  hostUsers: false

fullnameOverride: cert-manager
namespace: cert-manager
# The post-install startupapicheck Job is an upgrade checker (it phones
# Let's Encrypt/API-version data to verify compatibility); it is inert as a
# Helm hook under Argo and its immutable spec would block chart bumps, so
# it stays disabled.
startupapicheck:
  enabled: false
crds:
  enabled: true
  keep: true
# https://cert-manager.io/docs/usage/gateway/
config:
  apiVersion: controller.config.cert-manager.io/v1alpha1
  kind: ControllerConfiguration
  gatewayAPI:
    enabled: true
  # DNS-01 self-checks must not follow the zone's authoritative nameservers:
  # the controller's egress policy only allows the ACME APIs, Cloudflare, and
  # kube-dns on :53, so direct queries to arbitrary authoritative servers
  # would be dropped and the challenge would never validate. With this flag
  # set (and dns01RecursiveNameservers left empty), the self-check resolves
  # through the pod's resolver — kube-dns — which the policy admits.
  dns01RecursiveNameserversOnly: true
  kubernetesAPIQPS: 10000
  kubernetesAPIBurst: 10000
prometheus:
  servicemonitor:
    # Metrics flow through the paired netpols: the metrics-ingress policy in
    # this component's -2_network_policy.yaml (otel-collector -> 9402/tcp)
    # and the allow-otel-pod-scrape-cert-manager egress policy in
    # apps/otel-collector/-2_network_policy.yaml.
    enabled: true
    interval: 60s
