# https://cert-manager.io/docs/configuration/ca/
#
# Every Gateway (cert-manager.io/cluster-issuer: homeworld-ca) gets its
# listener certificates from the private homeworld root CA. The CA is
# name-constrained to homeworld.internal, so it cannot sign names outside
# the cluster domain; devices and in-cluster clients trust it explicitly
# (README "Trust the Homeworld CA", apps/trust-manager).
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: homeworld-ca
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "2"
spec:
  ca:
    secretName: homeworld-ca
