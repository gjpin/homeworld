---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # The chart's ServiceMonitor scrapes the http-metrics endpoint (port
  # 9402) of the controller, cainjector, and webhook pods through the
  # OpenTelemetry collector, paired with the
  # allow-otel-pod-scrape-cert-manager egress policy in apps/otel-collector.
  name: allow-cert-manager-metrics-ingress
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchExpressions:
      - key: k8s:app.kubernetes.io/name
        operator: In
        values:
          - cainjector
          - cert-manager
          - webhook
      - key: k8s:app.kubernetes.io/instance
        operator: In
        values:
          - cert-manager
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-collector
      toPorts:
        - ports:
            - port: "9402"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-kubernetes-api
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/instance: cert-manager
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cert-manager-webhook
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/component: controller
      k8s:app.kubernetes.io/name: cert-manager
  egress:
    - toServices:
        - k8sService:
            serviceName: cert-manager-webhook
            namespace: cert-manager
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cert-manager-external-issuance
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # ACME HTTP APIs are the controller's only Internet dependencies; DNS-01
  # reconciliation runs through the Porkbun webhook via kube-apiserver.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/component: controller
      k8s:app.kubernetes.io/name: cert-manager
  egress:
    - toFQDNs:
        - matchName: acme-v02.api.letsencrypt.org
        - matchName: acme-staging-v02.api.letsencrypt.org
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-porkbun-webhook-kubernetes-api
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: cert-manager-webhook-porkbun
      k8s:app.kubernetes.io/instance: cert-manager-webhook-porkbun
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-porkbun-webhook-dns-api
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # The Porkbun DNS-01 webhook reconciles ACME challenge TXT records only
  # through the Porkbun JSON API v3 over HTTPS.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: cert-manager-webhook-porkbun
      k8s:app.kubernetes.io/instance: cert-manager-webhook-porkbun
  egress:
    - toFQDNs:
        - matchName: api.porkbun.com
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-porkbun-webhook-ingress
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # Aggregated API server traffic from kube-apiserver (on local or remote nodes)
  # reaches the webhook container on its unprivileged port 8443.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: cert-manager-webhook-porkbun
      k8s:app.kubernetes.io/instance: cert-manager-webhook-porkbun
  ingress:
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cert-manager-webhook-ingress
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/component: webhook
      k8s:app.kubernetes.io/name: webhook
  ingress:
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-cert-manager-controller-webhook-ingress
  namespace: cert-manager
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/component: webhook
      k8s:app.kubernetes.io/name: webhook
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cert-manager
            k8s:app.kubernetes.io/component: controller
            k8s:app.kubernetes.io/name: cert-manager
            k8s:app.kubernetes.io/instance: cert-manager
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
