---
fullnameOverride: crowdsec-envoy-bouncer
replicaCount: 1

image:
  repository: ghcr.io/kdwils/envoy-proxy-bouncer
  tag: v0.8.1
  pullPolicy: IfNotPresent

serviceAccount:
  create: true

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

resources:
  requests:
    cpu: 10m
    memory: 64Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 2Gi

config:
  server:
    grpcPort: 8080
    httpPort: 8081
    logLevel: info
  bouncer:
    enabled: true
    metrics: true
    metricsInterval: 60s
    lapiURL: http://crowdsec-service.crowdsec.svc.cluster.local:8080
    tickerInterval: 10s
    apiKeySecretRef:
      name: crowdsec-envoy-bouncer-secrets
      key: api-key
  waf:
    enabled: true
    appSecURL: http://crowdsec-appsec-service.crowdsec.svc.cluster.local:7422
    apiKeySecretRef:
      name: crowdsec-envoy-bouncer-secrets
      key: api-key
  prometheus:
    enabled: true
    port: 9090
    serviceMonitor:
      enabled: true
      interval: 60s
      scrapeTimeout: 10s

autoscaling:
  enabled: false

referenceGrant:
  create: false
  fromNamespaces: []
