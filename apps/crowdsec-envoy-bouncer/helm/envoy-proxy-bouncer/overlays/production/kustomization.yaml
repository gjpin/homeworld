---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
commonAnnotations:
  security.homeworld/profile: production
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^crowdsec-envoy-bouncer$
    patch: |-
      - op: add
        path: /metadata/annotations
        value: {}
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: container-security-context-user-group-id,pod-networkpolicy,deployment-replicas
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: The pinned community bouncer image documents UID 1000; the bouncer remains non-root with a RuntimeDefault seccomp profile and Cilium supplies the network policy.
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: Always
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: 100m
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: 128Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/ephemeral-storage
        value: 128Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: 256Mi
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/ephemeral-storage
        value: 4Gi
