---
fullnameOverride: crowdsec-envoy-bouncer
replicaCount: 1

image:
  repository: ghcr.io/kdwils/envoy-proxy-bouncer
  tag: v0.8.3
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  automount: false

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532

resources:
  requests:
    cpu: 10m
    memory: 64Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: 100m
    memory: 128Mi
    ephemeral-storage: 2Gi

config:
  server:
    grpcPort: 8080
    httpPort: 8081
    logLevel: info
  trustedProxies: []
  exemptIPs: []
  bouncer:
    enabled: true
    metrics: true
    metricsInterval: 60s
    lapiURL: http://crowdsec-service.crowdsec.svc.cluster.local:8080
    tickerInterval: 10s
    apiKeySecretRef:
      name: crowdsec-envoy-bouncer-secrets
      key: api-key
  waf:
    enabled: true
    appSecURL: http://crowdsec-appsec-service.crowdsec.svc.cluster.local:7422
    apiKeySecretRef:
      name: crowdsec-envoy-bouncer-secrets
      key: api-key
    httpTimeout: 5s
    failOpen: false
    routes: []
  templates:
    showDeniedPage: true
  http:
    maxIdleConns: 1000
    maxIdleConnsPerHost: 100
    idleConnTimeout: 90s
    tlsHandshakeTimeout: 10s
  prometheus:
    enabled: true
    port: 9090
    serviceMonitor:
      enabled: true
      interval: 60s
      scrapeTimeout: 10s

probes:
  liveness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    enabled: true
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 5
    failureThreshold: 3

autoscaling:
  enabled: false

referenceGrant:
  create: false
  fromNamespaces: []
