apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: envoy-gateway
commonAnnotations:
  security.homeworld/profile: homelab
# oci://ghcr.io/kdwils/charts is the official upstream chart repository of the
# envoy-proxy-crowdsec-bouncer project (github.com/kdwils/envoy-proxy-crowdsec-bouncer).
helmCharts:
  - name: envoy-proxy-bouncer
    repo: oci://ghcr.io/kdwils/charts
    version: 0.8.2
    releaseName: crowdsec-envoy-bouncer
    namespace: envoy-gateway
    skipTests: true
    valuesFile: values.yaml
patches:
  - target:
      version: v1
      kind: ^(ConfigMap|Service|ServiceAccount)$
      name: ^crowdsec-envoy-bouncer(-config)?$
    patch: |-
      - op: add
        path: /metadata/namespace
        value: envoy-gateway
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^crowdsec-envoy-bouncer$
    patch: |-
      - op: add
        path: /metadata/namespace
        value: envoy-gateway
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^crowdsec-envoy-bouncer$
    patch: |-
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
