# The Gateway API ReferenceGrant schema caps spec.from at 16 items, and the
# SecurityPolicies in every protected namespace reference the bouncer Service
# in this namespace, so the grants split across two objects: this file carries
# the first sixteen namespaces, and 0_reference_grant_2.yaml the remainder.
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: crowdsec-envoy-bouncer
  namespace: envoy-gateway
spec:
  from:
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: argocd
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: authelia
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: collabora
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: envoy-gateway
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: forgejo
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: grafana
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: homeassistant
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: homepage
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: immich
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: longhorn-system
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: notesnook
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: openchamber
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: opencloud
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: qbittorrent
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: rustfs
    - group: gateway.envoyproxy.io
      kind: SecurityPolicy
      namespace: rustfs-operator
  to:
    - group: ""
      kind: Service
      name: crowdsec-envoy-bouncer
