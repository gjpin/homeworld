---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crowdsec-envoy-bouncer
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/gjpin/homeworld.git
    targetRevision: HEAD
    path: apps/crowdsec-envoy-bouncer/helm
    plugin:
      name: homeworld
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway
  syncPolicy:
    automated:
      allowEmpty: true
      prune: true
      selfHeal: true
    syncOptions:
      # No CreateNamespace: the envoy-gateway namespace (including its PSA
      # labels) is owned by the parent envoy-gateway app; a child app must
      # not race it to namespace creation.
      - PruneLast=true
      - PrunePropagationPolicy=foreground
      - Validate=true
      - ServerSideApply=true
