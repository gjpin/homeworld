# The OpenTelemetry Operator's CRDs do not expose a runtimeClassName
# pod-template field, and the Target Allocator CR it generates from a
# collector CR does not inherit the collector's hostUsers setting. Mutate
# only the operator-generated pods in the otel-collector namespace at
# admission so the operator-owned workloads remain the source of truth.
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: opentelemetry-gvisor
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
  matchConditions:
    - name: opentelemetry-operator-pods
      expression: >-
        request.namespace == "otel-collector" &&
        has(object.metadata.labels) &&
        has(object.metadata.labels['app.kubernetes.io/managed-by']) &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'opentelemetry-operator'
    - name: runtime-class-not-set
      expression: "!has(object.spec.runtimeClassName)"
    - name: user-namespaces-not-already-enabled
      expression: "!has(object.spec.hostUsers) || object.spec.hostUsers"
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{spec: Object.spec{runtimeClassName: 'gvisor', hostUsers: false}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: opentelemetry-gvisor
spec:
  policyName: opentelemetry-gvisor
  matchResources:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: otel-collector
    objectSelector:
      matchLabels:
        app.kubernetes.io/managed-by: opentelemetry-operator
