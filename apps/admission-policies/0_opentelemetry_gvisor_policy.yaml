# The OpenTelemetry Operator's CRDs do not expose a runtimeClassName
# pod-template field, so mutate the operator-generated pods in the
# otel-collector namespace at admission: inject gVisor (and user namespaces
# where the operator leaves them unset — the Target Allocator CR it generates
# from a collector CR does not inherit the collector's hostUsers setting).
# The mutation must also match collector pods that already carry
# hostUsers: false from the CR (apps/otel-collector/1_collector.yaml):
# setting both fields is the desired end state, and an ApplyConfiguration
# mutation of an already-equal field is a no-op. The operator-owned workloads
# remain the source of truth for everything else.
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicy
metadata:
  name: opentelemetry-gvisor
spec:
  failurePolicy: Fail
  reinvocationPolicy: IfNeeded
  matchConstraints:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
  matchConditions:
    - name: opentelemetry-operator-pods
      expression: >-
        request.namespace == "otel-collector" &&
        has(object.metadata.labels) &&
        has(object.metadata.labels['app.kubernetes.io/managed-by']) &&
        object.metadata.labels['app.kubernetes.io/managed-by'] == 'opentelemetry-operator'
    - name: runtime-class-not-set
      expression: "!has(object.spec.runtimeClassName)"
  mutations:
    - patchType: ApplyConfiguration
      applyConfiguration:
        expression: >-
          Object{spec: Object.spec{runtimeClassName: 'gvisor', hostUsers: false}}
---
apiVersion: admissionregistration.k8s.io/v1
kind: MutatingAdmissionPolicyBinding
metadata:
  name: opentelemetry-gvisor
spec:
  policyName: opentelemetry-gvisor
  matchResources:
    resourceRules:
      - apiGroups:
          - ""
        apiVersions:
          - v1
        operations:
          - CREATE
        resources:
          - pods
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: otel-collector
    objectSelector:
      matchLabels:
        app.kubernetes.io/managed-by: opentelemetry-operator
