---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: protect-pod-security-labels
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["UPDATE", "CREATE"]
        resources: ["namespaces"]
  validations:
    - expression: >-
        (request.userInfo.groups.exists(g, g == 'system:masters') ||
         request.userInfo.username == 'system:serviceaccount:argocd:argocd-application-controller' ||
         request.userInfo.username == 'system:serviceaccount:argocd:argocd-argocd-application-controller') ||
        (oldObject == null
          ? (!has(object.metadata.labels) || !object.metadata.labels.exists(k, k.startsWith('pod-security.kubernetes.io/')))
          : (
              (!has(object.metadata.labels) || object.metadata.labels.all(k,
                 !k.startsWith('pod-security.kubernetes.io/') ||
                 (has(oldObject.metadata.labels) &&
                  k in oldObject.metadata.labels &&
                  object.metadata.labels[k] == oldObject.metadata.labels[k])))
              &&
              (!has(oldObject.metadata.labels) || oldObject.metadata.labels.all(k,
                 !k.startsWith('pod-security.kubernetes.io/') ||
                 (has(object.metadata.labels) && k in object.metadata.labels)))
            ))
      message: "Modifying Pod Security Admission labels requires cluster administrator or Argo CD privileges."
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: protect-pod-security-labels
spec:
  policyName: protect-pod-security-labels
  validationActions: [Deny]
