fullnameOverride: openobserve
image:
  oss:
    tag: v0.91.1
auth:
  existingRootUserSecret:
    name: openobserve-root
    emailKey: ZO_ROOT_USER_EMAIL
    passwordKey: ZO_ROOT_USER_PASSWORD
config:
  ZO_WEB_URL: "https://openobserve.${BASE_DOMAIN}"
  ZO_COMPACT_DATA_RETENTION_DAYS: "30"
persistence:
  enabled: true
  size: 20Gi
  storageClass: longhorn-crypto
serviceMonitor:
  enabled: true
  interval: 60s
nodeSelector:
  node-role.kubernetes.io/homelab: homelab
