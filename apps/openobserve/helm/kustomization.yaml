apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: openobserve-standalone
    repo: https://charts.openobserve.ai
    version: 0.92.2
    releaseName: openobserve
    namespace: openobserve
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: ^openobserve$
      namespace: ^openobserve$
    patch: |-
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
  - target:
      group: apps
      version: v1
      kind: StatefulSet
      name: ^openobserve$
      namespace: ^openobserve$
    patch: |-
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: pod-networkpolicy,container-security-context-user-group-id,container-security-context-readonlyrootfilesystem,pod-probes-identical
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
