fullnameOverride: openobserve
image:
  oss:
    tag: v1.0.4
  pullPolicy: IfNotPresent
auth:
  existingRootUserSecret:
    name: openobserve-root
    emailKey: ZO_ROOT_USER_EMAIL
    passwordKey: ZO_ROOT_USER_PASSWORD
config:
  ZO_WEB_URL: "https://openobserve.${BASE_DOMAIN}"
  ZO_COMPACT_DATA_RETENTION_DAYS: "30"
  ZO_TELEMETRY: "false"
resources:
  requests:
    cpu: 10m
    memory: 64Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: "1"
    memory: 2Gi
    ephemeral-storage: 2Gi
persistence:
  enabled: true
  size: 20Gi
  storageClass: longhorn-crypto
serviceMonitor:
  enabled: true
  interval: 60s
nodeSelector:
  node-role.kubernetes.io/homelab: homelab
podSecurityContext:
  fsGroup: 2000
  runAsUser: 10000
  runAsGroup: 3000
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
