---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openobserve
  namespace: openobserve
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "openobserve.${BASE_DOMAIN}"
spec:
  parentRefs:
    - name: envoy
      namespace: openobserve
      sectionName: openobserve-https
  hostnames:
    - "openobserve.${BASE_DOMAIN}"
  rules:
    - backendRefs:
      - name: openobserve
        namespace: openobserve
        kind: Service
        port: 5080
