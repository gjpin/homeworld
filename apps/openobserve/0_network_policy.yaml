---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: openobserve
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  ingress: []
  egress: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns
  namespace: openobserve
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-openobserve-ingress
  namespace: openobserve
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/component: openobserve
      k8s:app.kubernetes.io/instance: openobserve
      k8s:app.kubernetes.io/name: openobserve-standalone
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gateway-name: envoy
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/instance: otel-collector-main
            k8s:app.kubernetes.io/name: opentelemetry-collector
            k8s:component: standalone-collector
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/instance: otel-collector-deployment
            k8s:app.kubernetes.io/name: opentelemetry-collector
            k8s:component: standalone-collector
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector-node
            k8s:app.kubernetes.io/instance: otel-collector-daemonset
            k8s:app.kubernetes.io/name: opentelemetry-collector
            k8s:component: agent-collector
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: grafana
            k8s:app.kubernetes.io/name: grafana
      toPorts:
        - ports:
            - port: "5080"
              protocol: TCP
