# https://github.com/openobserve/openobserve-helm-chart/tree/main/charts/openobserve-standalone
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openobserve
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: openobserve
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true

  source:
    repoURL: https://github.com/gjpin/homeworld.git
    path: apps/openobserve/helm/openobserve/overlays/homelab
    targetRevision: HEAD
