apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: headlamp
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: headlamp
    repo: https://kubernetes-sigs.github.io/headlamp/
    version: 0.46.0
    releaseName: headlamp
    namespace: headlamp
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  # The chart has no runtimeClassName value.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^headlamp$
    patch: |-
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
