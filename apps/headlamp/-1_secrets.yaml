---
# Every key is required: the chart's external-secret mode passes each one to
# the backend as a $(VAR) argument, which stays literal if the key is missing.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: headlamp-oidc
  namespace: headlamp
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: headlamp-oidc
    template:
      engineVersion: v2
      data:
        OIDC_CLIENT_ID: headlamp
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
        OIDC_ISSUER_URL: https://auth.base-domain.invalid
        # openid is always added by Headlamp. offline_access returns the
        # refresh token its backend uses to renew expiring ID tokens.
        OIDC_SCOPES: profile,email,groups,offline_access
        OIDC_USE_PKCE: "true"
  data:
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: /authelia/OIDC_CLIENT_SECRET_HEADLAMP
        decodingStrategy: None
