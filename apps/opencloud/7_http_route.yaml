---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencloud
  namespace: opencloud
  annotations:
    external-dns.alpha.kubernetes.io/hostname: "cloud.${BASE_DOMAIN}"
spec:
  parentRefs:
    - name: envoy
      namespace: opencloud
      sectionName: cloud-https
  hostnames:
    - "cloud.${BASE_DOMAIN}"
  rules:
    - backendRefs:
        - name: opencloud
          port: 9200
