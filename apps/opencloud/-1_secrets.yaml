---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opencloud-credentials
  namespace: opencloud
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: opencloud-credentials
    template:
      type: Opaque
  data:
    - secretKey: IDM_ADMIN_PASSWORD
      remoteRef:
        key: /opencloud/IDM_ADMIN_PASSWORD
        decodingStrategy: None
    - secretKey: RUSTFS_ACCESS_KEY
      remoteRef:
        key: /opencloud/RUSTFS_ACCESS_KEY
        decodingStrategy: None
    - secretKey: RUSTFS_SECRET_KEY
      remoteRef:
        key: /opencloud/RUSTFS_SECRET_KEY
        decodingStrategy: None
