---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opencloud-config-files
  namespace: opencloud
data:
  entrypoint.sh: |
    #!/bin/sh
    set -e

    check_health() {
      if command -v curl >/dev/null 2>&1; then
        curl -sf http://127.0.0.1:9200/health >/dev/null 2>&1
      elif command -v wget >/dev/null 2>&1; then
        wget -q -O - http://127.0.0.1:9200/health >/dev/null 2>&1
      else
        (echo > /dev/tcp/127.0.0.1/9200) >/dev/null 2>&1
      fi
    }

    # --- 1. Configuration Verification & Migration ---
    CONFIG_FILE="/etc/opencloud/opencloud.yaml"
    PATCH_FILE="/etc/opencloud/opencloud.config.patch"

    if [ ! -f "$CONFIG_FILE" ]; then
      echo "[init] No opencloud.yaml found. Generating initial configuration..."
      opencloud init || true
    else
      echo "[init] Existing configuration found. Checking for required upgrade changes..."
      opencloud init --diff || true

      if [ -s "$PATCH_FILE" ]; then
        echo "[init] Configuration differences found. Validating patch dry-run..."
        if patch --dry-run "$CONFIG_FILE" < "$PATCH_FILE"; then
          BACKUP_FILE="${CONFIG_FILE}.$(date +%Y%m%d%H%M%S).bak"
          echo "[init] Backing up configuration to $BACKUP_FILE..."
          cp "$CONFIG_FILE" "$BACKUP_FILE"
          echo "[init] Applying configuration patch..."
          patch "$CONFIG_FILE" < "$PATCH_FILE"
          rm -f "$PATCH_FILE"
          echo "[init] Configuration patch applied successfully."
          CONFIG_PATCHED=true
        else
          echo "[init] WARNING: Patch dry-run failed. Skipping automated patch; manual review required."
        fi
      else
        echo "[init] Configuration is up to date."
      fi
    fi

    # --- 2. Upgrade Detection ---
    VERSION_FILE="/var/lib/opencloud/.installed_version"
    FLAG_FILE="/var/lib/opencloud/.reindex_in_progress"
    CURRENT_VERSION=$(opencloud version 2>/dev/null | head -n1 || opencloud --version 2>/dev/null | head -n1 || sha256sum "$(which opencloud)" | awk '{print $1}')

    NEEDS_REINDEX=false
    if [ -f "$VERSION_FILE" ]; then
      LAST_VERSION=$(cat "$VERSION_FILE")
      if [ "$LAST_VERSION" != "$CURRENT_VERSION" ] || [ "$CONFIG_PATCHED" = "true" ]; then
        echo "[upgrade] Upgrade detected: '$LAST_VERSION' -> '$CURRENT_VERSION'."
        NEEDS_REINDEX=true
      fi
    else
      echo "$CURRENT_VERSION" > "$VERSION_FILE"
    fi

    if [ -f "$FLAG_FILE" ]; then
      echo "[upgrade] Found interrupted re-index marker ($FLAG_FILE). Resuming..."
      NEEDS_REINDEX=true
    fi

    # --- 3. Asynchronous Post-Upgrade Search Indexing ---
    if [ "$NEEDS_REINDEX" = "true" ]; then
      touch "$FLAG_FILE"
      (
        echo "[reindex] Waiting for OpenCloud server to report healthy..."
        until check_health; do
          sleep 5
        done
        echo "[reindex] Server is healthy. Waiting 15s for microservices to settle..."
        sleep 15

        echo "[reindex] Executing search re-index across all spaces..."
        if opencloud search index --all-spaces --force-rescan --insecure; then
          echo "[reindex] Search re-indexing completed successfully."
          echo "$CURRENT_VERSION" > "$VERSION_FILE"
          rm -f "$FLAG_FILE"
        else
          echo "[reindex] ERROR: Search re-indexing exited with an error. Will retry on next startup."
        fi
      ) &
    fi

    # --- 4. Foreground Server Execution ---
    echo "[server] Starting OpenCloud server..."
    exec opencloud server
  proxy.yaml: |
    role_assignment:
      driver: oidc
      oidc_role_mapper:
        role_claim: groups
        role_mapping:
          - role_name: admin
            claim_value: opencloud-admin
          - role_name: spaceadmin
            claim_value: opencloud-spaceadmin
          - role_name: user
            claim_value: opencloud-user
          - role_name: user-light
            claim_value: opencloud-user-light
    additional_policies:
      - name: default
        routes:
          - endpoint: /yjs
            backend: http://127.0.0.1:1234
            unprotected: true
          - endpoint: /caldav/
            backend: http://radicale.radicale.svc.cluster.local:5232
            remote_user_header: X-Remote-User
            skip_x_access_token: true
            additional_headers:
              - X-Script-Name: /caldav
          - endpoint: /.well-known/caldav
            backend: http://radicale.radicale.svc.cluster.local:5232
            remote_user_header: X-Remote-User
            skip_x_access_token: true
            additional_headers:
              - X-Script-Name: /caldav
          - endpoint: /carddav/
            backend: http://radicale.radicale.svc.cluster.local:5232
            remote_user_header: X-Remote-User
            skip_x_access_token: true
            additional_headers:
              - X-Script-Name: /carddav
          - endpoint: /.well-known/carddav
            backend: http://radicale.radicale.svc.cluster.local:5232
            remote_user_header: X-Remote-User
            skip_x_access_token: true
            additional_headers:
              - X-Script-Name: /carddav
  app-registry.yaml: |
    app_registry:
      mimetypes:
        - mime_type: application/vnd.oasis.opendocument.text
          extension: odt
          name: OpenDocument
          description: OpenDocument text document
          icon: ''
          default_app: CollaboraOnline
          allow_creation: true
        - mime_type: application/vnd.oasis.opendocument.spreadsheet
          extension: ods
          name: OpenSpreadsheet
          description: OpenDocument spreadsheet document
          icon: ''
          default_app: CollaboraOnline
          allow_creation: true
        - mime_type: application/vnd.oasis.opendocument.presentation
          extension: odp
          name: OpenPresentation
          description: OpenDocument presentation document
          icon: ''
          default_app: CollaboraOnline
          allow_creation: true
        - mime_type: application/vnd.openxmlformats-officedocument.wordprocessingml.document
          extension: docx
          name: Microsoft Word
          description: Microsoft Word document
          icon: ''
          default_app: CollaboraOnline
          allow_creation: true
        - mime_type: application/vnd.openxmlformats-officedocument.wordprocessingml.form
          extension: docxf
          name: Form Document
          description: Form Document
          icon: ''
          default_app: CollaboraOnline
          allow_creation: true
        - mime_type: application/vnd.openxmlformats-officedocument.spreadsheetml.sheet
          extension: xlsx
          name: Microsoft Excel
          description: Microsoft Excel document
          icon: ''
          default_app: CollaboraOnline
          allow_creation: true
        - mime_type: application/vnd.openxmlformats-officedocument.presentationml.presentation
          extension: pptx
          name: Microsoft PowerPoint
          description: Microsoft PowerPoint document
          icon: ''
          default_app: CollaboraOnline
          allow_creation: true
  apps.yaml: |
    external-sites:
      config:
        sites:
          - name: Documentation
            url: https://docs.opencloud.eu
            target: embedded
            color: "#E2BAFF"
            icon: cloud
            priority: 50
    maps:
      config:
        folderViewEnabled: true
  csp.yaml: |
    directives:
      child-src:
        - '''self'''
        - 'blob:'
      connect-src:
        - '''self'''
        - 'blob:'
        - 'data:'
        - 'https://tile.openstreetmap.org/'
        - 'https://auth.base-domain.invalid/'
        - 'https://office.base-domain.invalid/'
        - 'wss://office.base-domain.invalid/'
        - 'wss://cloud.base-domain.invalid/'
        - 'https://raw.githubusercontent.com/opencloud-eu/awesome-apps/'
      default-src:
        - '''none'''
      font-src:
        - '''self'''
      frame-ancestors:
        - '''self'''
      frame-src:
        - '''self'''
        - 'blob:'
        - 'https://embed.diagrams.net/'
        - 'https://office.base-domain.invalid/'
        - 'https://docs.opencloud.eu'
        - 'https://auth.base-domain.invalid/'
      img-src:
        - '''self'''
        - 'data:'
        - 'blob:'
        - 'https://tile.openstreetmap.org/'
        - 'https://office.base-domain.invalid/'
        - 'https://raw.githubusercontent.com/opencloud-eu/awesome-apps/'
      manifest-src:
        - '''self'''
      media-src:
        - '''self'''
        - 'blob:'
      object-src:
        - '''self'''
        - 'blob:'
      script-src:
        - '''self'''
        - '''unsafe-inline'''
        - '''unsafe-eval'''
        - 'blob:'
        - 'https://www.gstatic.com/'
        - 'https://auth.base-domain.invalid/'
      style-src:
        - '''self'''
        - '''unsafe-inline'''
      worker-src:
        - '''self'''
        - 'blob:'
