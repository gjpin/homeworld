---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud
  namespace: opencloud
  labels:
    app.kubernetes.io/name: opencloud
    app.kubernetes.io/component: server
  annotations:
    ignore-check.kube-linter.io/no-read-only-root-fs: Unverified for the pinned OpenCloud server, yjs and web-extension images; its writable paths outside the mounted volumes are not mapped to emptyDir volumes, and readOnlyRootFilesystem is not enabled without that (AGENTS.md).
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opencloud
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencloud
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: opencloud
      automountServiceAccountToken: false
      runtimeClassName: gvisor
      # The users storage root lives on the NAS (NFS, docs/nas.md), which has
      # no idmapped mounts: the pod keeps the host user namespace (gVisor
      # cannot join a pod user namespace either) and every container runs as
      # the share's owner, 20002, to which the NAS squashes all access.
      hostUsers: true
      securityContext:
        fsGroup: 20002
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: external-sites
          image: docker.io/opencloudeu/web-extensions:external-sites-2.2.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - cp -R /web/apps/external-sites/ /apps 2>/dev/null || cp -R /usr/share/nginx/html/external-sites/ /apps 2>/dev/null || cp -R /usr/share/nginx/html/apps/external-sites/ /apps
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 20002
            runAsNonRoot: true
            runAsUser: 20002
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: opencloud-apps
              mountPath: /apps
        - name: json-viewer
          image: docker.io/opencloudeu/web-extensions:json-viewer-2.1.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - cp -R /web/apps/json-viewer/ /apps 2>/dev/null || cp -R /usr/share/nginx/html/json-viewer/ /apps 2>/dev/null || cp -R /usr/share/nginx/html/apps/json-viewer/ /apps
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 20002
            runAsNonRoot: true
            runAsUser: 20002
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: opencloud-apps
              mountPath: /apps
        - name: progress-bars
          image: docker.io/opencloudeu/web-extensions:progress-bars-2.1.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - cp -R /web/apps/progress-bars/ /apps 2>/dev/null || cp -R /usr/share/nginx/html/progress-bars/ /apps 2>/dev/null || cp -R /usr/share/nginx/html/apps/progress-bars/ /apps
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 20002
            runAsNonRoot: true
            runAsUser: 20002
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: opencloud-apps
              mountPath: /apps
        - name: unzip
          image: docker.io/opencloudeu/web-extensions:unzip-2.2.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - cp -R /web/apps/unzip/ /apps 2>/dev/null || cp -R /usr/share/nginx/html/unzip/ /apps 2>/dev/null || cp -R /usr/share/nginx/html/apps/unzip/ /apps
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 20002
            runAsNonRoot: true
            runAsUser: 20002
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: opencloud-apps
              mountPath: /apps
        - name: draw-io
          image: docker.io/opencloudeu/web-extensions:draw-io-2.2.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - cp -R /web/apps/draw-io/ /apps 2>/dev/null || cp -R /usr/share/nginx/html/draw-io/ /apps 2>/dev/null || cp -R /usr/share/nginx/html/apps/draw-io/ /apps
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 20002
            runAsNonRoot: true
            runAsUser: 20002
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: opencloud-apps
              mountPath: /apps
        - name: calculator
          image: docker.io/opencloudeu/web-extensions:calculator-2.1.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - cp -R /web/apps/calculator/ /apps 2>/dev/null || cp -R /usr/share/nginx/html/calculator/ /apps 2>/dev/null || cp -R /usr/share/nginx/html/apps/calculator/ /apps
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 20002
            runAsNonRoot: true
            runAsUser: 20002
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: opencloud-apps
              mountPath: /apps
        - name: pastebin
          image: docker.io/opencloudeu/web-extensions:pastebin-2.2.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - cp -R /web/apps/pastebin/ /apps 2>/dev/null || cp -R /usr/share/nginx/html/pastebin/ /apps 2>/dev/null || cp -R /usr/share/nginx/html/apps/pastebin/ /apps
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 20002
            runAsNonRoot: true
            runAsUser: 20002
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: opencloud-apps
              mountPath: /apps
        - name: bpmn
          image: docker.io/opencloudeu/web-extensions:bpmn-1.1.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - cp -R /web/apps/bpmn/ /apps 2>/dev/null || cp -R /usr/share/nginx/html/bpmn/ /apps 2>/dev/null || cp -R /usr/share/nginx/html/apps/bpmn/ /apps
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 20002
            runAsNonRoot: true
            runAsUser: 20002
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: opencloud-apps
              mountPath: /apps
        - name: maps
          image: docker.io/opencloudeu/web-extensions:maps-3.1.1
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - cp -R /web/apps/maps/ /apps 2>/dev/null || cp -R /usr/share/nginx/html/maps/ /apps 2>/dev/null || cp -R /usr/share/nginx/html/apps/maps/ /apps
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 20002
            runAsNonRoot: true
            runAsUser: 20002
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: opencloud-apps
              mountPath: /apps
        - name: arcade
          image: docker.io/opencloudeu/web-extensions:arcade-3.0.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - cp -R /web/apps/arcade/ /apps 2>/dev/null || cp -R /usr/share/nginx/html/arcade/ /apps 2>/dev/null || cp -R /usr/share/nginx/html/apps/arcade/ /apps
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 20002
            runAsNonRoot: true
            runAsUser: 20002
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: opencloud-apps
              mountPath: /apps
        - name: cast
          image: docker.io/opencloudeu/web-extensions:cast-1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - cp -R /web/apps/cast/ /apps 2>/dev/null || cp -R /usr/share/nginx/html/cast/ /apps 2>/dev/null || cp -R /usr/share/nginx/html/apps/cast/ /apps
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 20002
            runAsNonRoot: true
            runAsUser: 20002
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: opencloud-apps
              mountPath: /apps
      containers:
        - name: opencloud
          image: docker.io/opencloudeu/opencloud-rolling:9.0.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - /entrypoint.sh
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 20002
            runAsGroup: 20002
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: OC_ADD_RUN_SERVICES
              value: collaboration
            - name: WEB_OPTION_DISABLE_SPONSOR_LINK
              value: "true"
            - name: WEB_OPTION_YJS_SERVER_URL
              value: wss://cloud.base-domain.invalid/yjs
            - name: FRONTEND_APP_HANDLER_SECURE_VIEW_APP_ADDR
              value: eu.opencloud.api.collaboration
            - name: OC_URL
              value: https://cloud.base-domain.invalid
            - name: OC_LOG_LEVEL
              value: info
            - name: OC_LOG_COLOR
              value: "false"
            - name: OC_LOG_PRETTY
              value: "false"
            - name: PROXY_HTTP_ADDR
              value: 0.0.0.0:9200
            - name: PROXY_DEBUG_ADDR
              value: 0.0.0.0:9205
            - name: PROXY_TLS
              value: "false"
            - name: OC_INSECURE
              value: "false"
            - name: OC_EXCLUDE_RUN_SERVICES
              value: idp
            - name: PROXY_ENABLE_BASIC_AUTH
              value: "false"
            - name: IDM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencloud-credentials
                  key: IDM_ADMIN_PASSWORD
            - name: PROXY_CSP_CONFIG_FILE_LOCATION
              value: /etc/opencloud/csp.yaml
            - name: MICRO_REGISTRY_ADDRESS
              value: 127.0.0.1:9233
            - name: NATS_NATS_HOST
              value: 0.0.0.0
            - name: NATS_NATS_PORT
              value: "9233"
            - name: OC_OIDC_ISSUER
              value: https://auth.base-domain.invalid
            - name: OC_OIDC_CLIENT_ID
              value: web
            - name: OC_OIDC_CLIENT_SCOPES
              value: openid,profile,email,groups,offline_access
            - name: WEB_OIDC_CLIENT_ID
              value: web
            - name: WEB_OIDC_SCOPE
              value: openid profile email groups offline_access
            - name: WEBFINGER_WEB_OIDC_CLIENT_ID
              value: web
            - name: WEBFINGER_WEB_OIDC_CLIENT_SCOPES
              value: openid,profile,email,groups,offline_access
            - name: WEBFINGER_DESKTOP_OIDC_CLIENT_ID
              value: OpenCloudDesktop
            - name: WEBFINGER_DESKTOP_OIDC_CLIENT_SCOPES
              value: openid,profile,email,groups,offline_access
            - name: WEBFINGER_ANDROID_OIDC_CLIENT_ID
              value: OpenCloudAndroid
            - name: WEBFINGER_ANDROID_OIDC_CLIENT_SCOPES
              value: openid,profile,email,groups,offline_access
            - name: WEBFINGER_IOS_OIDC_CLIENT_ID
              value: OpenCloudIOS
            - name: WEBFINGER_IOS_OIDC_CLIENT_SCOPES
              value: openid,profile,email,groups,offline_access
            - name: PROXY_OIDC_REWRITE_WELLKNOWN
              value: "true"
            - name: PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD
              value: jwt
            - name: PROXY_ROLE_ASSIGNMENT_DRIVER
              value: oidc
            - name: PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM
              value: groups
            - name: PROXY_AUTOPROVISION_ACCOUNTS
              value: "true"
            - name: PROXY_AUTOPROVISION_CLAIM_USERNAME
              value: preferred_username
            - name: PROXY_AUTOPROVISION_CLAIM_EMAIL
              value: email
            - name: PROXY_AUTOPROVISION_CLAIM_DISPLAYNAME
              value: name
            - name: PROXY_AUTOPROVISION_CLAIM_GROUPS
              value: groups
            - name: PROXY_USER_OIDC_CLAIM
              value: preferred_username
            - name: PROXY_USER_CS3_CLAIM
              value: username
            - name: GRAPH_ASSIGN_DEFAULT_USER_ROLE
              value: "false"
            - name: SETTINGS_SETUP_DEFAULT_ASSIGNMENTS
              value: "false"
            - name: COLLABORATION_APP_NAME
              value: CollaboraOnline
            - name: COLLABORATION_APP_PRODUCT
              value: Collabora
            - name: COLLABORATION_APP_ADDR
              value: https://office.base-domain.invalid
            - name: COLLABORATION_APP_INSECURE
              value: "false"
            - name: COLLABORATION_APP_PROOF_DISABLE
              value: "false"
            - name: COLLABORATION_CS3API_DATAGATEWAY_INSECURE
              value: "false"
            - name: COLLABORATION_WOPI_SRC
              value: https://cloud.base-domain.invalid
            # Blobs and metadata of every space on a POSIX filesystem: the
            # NAS share mounted at the users storage root (the default path,
            # set explicitly). The rest of /var/lib/opencloud (NATS, search
            # index, IDM, thumbnails) stays on the small Longhorn volume.
            - name: STORAGE_USERS_DRIVER
              value: decomposed
            - name: STORAGE_USERS_DECOMPOSED_ROOT
              value: /var/lib/opencloud/storage/users
            - name: STORAGE_SYSTEM_DRIVER
              value: decomposed
            - name: SEARCH_EXTRACTOR_TYPE
              value: tika
            - name: SEARCH_EXTRACTOR_TIKA_TIKA_URL
              value: http://opencloud-tika.opencloud.svc.cluster.local:9998
            - name: FRONTEND_FULL_TEXT_SEARCH_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 9200
              protocol: TCP
            - name: metrics
              containerPort: 9205
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: opencloud-config
              mountPath: /etc/opencloud
            - name: opencloud-config-files
              mountPath: /entrypoint.sh
              subPath: entrypoint.sh
              readOnly: true
            - name: opencloud-config-files
              mountPath: /etc/opencloud/proxy.yaml
              subPath: proxy.yaml
              readOnly: true
            - name: opencloud-config-files
              mountPath: /etc/opencloud/app-registry.yaml
              subPath: app-registry.yaml
              readOnly: true
            - name: opencloud-config-files
              mountPath: /etc/opencloud/apps.yaml
              subPath: apps.yaml
              readOnly: true
            - name: opencloud-config-files
              mountPath: /etc/opencloud/csp.yaml
              subPath: csp.yaml
              readOnly: true
            - name: opencloud-data
              mountPath: /var/lib/opencloud
            - name: opencloud-users
              mountPath: /var/lib/opencloud/storage/users
            - name: opencloud-apps
              mountPath: /var/lib/opencloud/web/assets/apps
        - name: yjs
          image: docker.io/opencloudeu/yjs:1.1.1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 20002
            runAsGroup: 20002
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: PORT
              value: "1234"
            - name: OPENCLOUD_URL
              value: http://127.0.0.1:9200
            - name: SHUTDOWN_GRACE_PERIOD_MS
              value: "15000"
          ports:
            - name: yjs
              containerPort: 1234
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: yjs
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz/ready
              port: yjs
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 1Gi
              ephemeral-storage: 1Gi
      volumes:
        - name: opencloud-config
          persistentVolumeClaim:
            claimName: opencloud-config
        - name: opencloud-config-files
          configMap:
            name: opencloud-config-files
        - name: opencloud-data
          persistentVolumeClaim:
            claimName: opencloud-data
        - name: opencloud-users
          persistentVolumeClaim:
            claimName: opencloud-users
        - name: opencloud-apps
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud-tika
  namespace: opencloud
  labels:
    app.kubernetes.io/name: opencloud-tika
    app.kubernetes.io/component: search
  annotations:
    ignore-check.kube-linter.io/no-read-only-root-fs: Apache Tika spools documents to the JVM temporary directory on the image filesystem while extracting text.
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opencloud-tika
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencloud-tika
        app.kubernetes.io/component: search
    spec:
      serviceAccountName: opencloud
      automountServiceAccountToken: false
      runtimeClassName: gvisor
      securityContext:
        runAsNonRoot: true
        # The apache/tika image's USER (35002:35002), pinned so admission
        # and scanners can verify the non-root UID.
        runAsUser: 35002
        runAsGroup: 35002
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tika
          image: docker.io/apache/tika:3.3.3.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 9998
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /tika
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /tika
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /tika
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
