---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: opencloud
  namespace: opencloud
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    external-dns.alpha.kubernetes.io/hostname: "cloud.${BASE_DOMAIN}"
spec:
  parentRefs:
    - name: envoy
      namespace: opencloud
      sectionName: cloud-https
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "cloud.${BASE_DOMAIN}"
  rules:
    - backendRefs:
        - name: opencloud
          port: 9200
          group: ""
          kind: Service
          weight: 1
