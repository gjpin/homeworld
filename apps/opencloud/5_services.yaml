---
apiVersion: v1
kind: Service
metadata:
  name: opencloud
  namespace: opencloud
  labels:
    app.kubernetes.io/name: opencloud
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9200
      protocol: TCP
      targetPort: http
    - name: metrics
      port: 9205
      protocol: TCP
      targetPort: metrics
  selector:
    app.kubernetes.io/name: opencloud
---
apiVersion: v1
kind: Service
metadata:
  name: opencloud-tika
  namespace: opencloud
  labels:
    app.kubernetes.io/name: opencloud-tika
    app.kubernetes.io/component: search
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 9998
      protocol: TCP
      targetPort: http
  selector:
    app.kubernetes.io/name: opencloud-tika
