---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud
  namespace: opencloud
  labels:
    app.kubernetes.io/name: opencloud
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opencloud
  template:
    metadata:
      annotations:
        checksum/proxy-config: radicale-integration-v1
      labels:
        app.kubernetes.io/name: opencloud
        app.kubernetes.io/component: server
    spec:
      nodeSelector:
        node-role.kubernetes.io/homelab: homelab
      hostUsers: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: external-sites
          image: opencloudeu/web-extensions:external-sites-2.1.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - cp -R /usr/share/nginx/html/external-sites/ /apps
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: opencloud-apps
              mountPath: /apps
        - name: json-viewer
          image: opencloudeu/web-extensions:json-viewer-2.1.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - cp -R /usr/share/nginx/html/json-viewer/ /apps
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: opencloud-apps
              mountPath: /apps
        - name: progress-bars
          image: opencloudeu/web-extensions:progress-bars-2.1.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - cp -R /usr/share/nginx/html/progress-bars/ /apps
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: opencloud-apps
              mountPath: /apps
        - name: unzip
          image: opencloudeu/web-extensions:unzip-2.1.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - cp -R /usr/share/nginx/html/unzip/ /apps
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: opencloud-apps
              mountPath: /apps
        - name: draw-io
          image: opencloudeu/web-extensions:draw-io-2.1.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - cp -R /usr/share/nginx/html/draw-io/ /apps
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: opencloud-apps
              mountPath: /apps
        - name: importer
          image: opencloudeu/web-extensions:importer-1.0.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - cp -R /usr/share/nginx/html/importer/ /apps
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: opencloud-apps
              mountPath: /apps
      containers:
        - name: opencloud
          image: opencloudeu/opencloud-rolling:7.5.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
          args:
            - opencloud init || true; opencloud server
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: OC_ADD_RUN_SERVICES
              value: collaboration
            - name: OC_URL
              value: https://cloud.${BASE_DOMAIN}
            - name: OC_LOG_LEVEL
              value: info
            - name: OC_LOG_COLOR
              value: "false"
            - name: OC_LOG_PRETTY
              value: "false"
            - name: PROXY_HTTP_ADDR
              value: 0.0.0.0:9200
            - name: PROXY_DEBUG_ADDR
              value: 0.0.0.0:9205
            - name: PROXY_TLS
              value: "false"
            - name: OC_INSECURE
              value: "false"
            - name: OC_EXCLUDE_RUN_SERVICES
              value: idp
            - name: PROXY_ENABLE_BASIC_AUTH
              value: "false"
            - name: IDM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: opencloud-credentials
                  key: IDM_ADMIN_PASSWORD
            - name: PROXY_CSP_CONFIG_FILE_LOCATION
              value: /etc/opencloud/csp.yaml
            - name: MICRO_REGISTRY_ADDRESS
              value: 127.0.0.1:9233
            - name: NATS_NATS_HOST
              value: 0.0.0.0
            - name: NATS_NATS_PORT
              value: "9233"
            - name: OC_OIDC_ISSUER
              value: https://auth.${BASE_DOMAIN}
            - name: OC_OIDC_CLIENT_ID
              value: web
            - name: OC_OIDC_CLIENT_SCOPES
              value: openid,profile,email,groups,offline_access
            - name: WEB_OIDC_CLIENT_ID
              value: web
            - name: WEB_OIDC_SCOPE
              value: openid profile email groups offline_access
            - name: WEBFINGER_WEB_OIDC_CLIENT_ID
              value: web
            - name: WEBFINGER_WEB_OIDC_CLIENT_SCOPES
              value: openid,profile,email,groups,offline_access
            - name: WEBFINGER_DESKTOP_OIDC_CLIENT_ID
              value: OpenCloudDesktop
            - name: WEBFINGER_DESKTOP_OIDC_CLIENT_SCOPES
              value: openid,profile,email,groups,offline_access
            - name: WEBFINGER_ANDROID_OIDC_CLIENT_ID
              value: OpenCloudAndroid
            - name: WEBFINGER_ANDROID_OIDC_CLIENT_SCOPES
              value: openid,profile,email,groups,offline_access
            - name: WEBFINGER_IOS_OIDC_CLIENT_ID
              value: OpenCloudIOS
            - name: WEBFINGER_IOS_OIDC_CLIENT_SCOPES
              value: openid,profile,email,groups,offline_access
            - name: PROXY_OIDC_REWRITE_WELLKNOWN
              value: "true"
            - name: PROXY_OIDC_ACCESS_TOKEN_VERIFY_METHOD
              value: jwt
            - name: PROXY_ROLE_ASSIGNMENT_DRIVER
              value: oidc
            - name: PROXY_ROLE_ASSIGNMENT_OIDC_CLAIM
              value: groups
            - name: PROXY_AUTOPROVISION_ACCOUNTS
              value: "true"
            - name: PROXY_AUTOPROVISION_CLAIM_USERNAME
              value: preferred_username
            - name: PROXY_AUTOPROVISION_CLAIM_EMAIL
              value: email
            - name: PROXY_AUTOPROVISION_CLAIM_DISPLAYNAME
              value: name
            - name: PROXY_AUTOPROVISION_CLAIM_GROUPS
              value: groups
            - name: PROXY_USER_OIDC_CLAIM
              value: preferred_username
            - name: PROXY_USER_CS3_CLAIM
              value: username
            - name: GRAPH_ASSIGN_DEFAULT_USER_ROLE
              value: "false"
            - name: SETTINGS_SETUP_DEFAULT_ASSIGNMENTS
              value: "false"
            - name: COLLABORATION_APP_NAME
              value: CollaboraOnline
            - name: COLLABORATION_APP_PRODUCT
              value: Collabora
            - name: COLLABORATION_APP_ADDR
              value: https://office.${BASE_DOMAIN}
            - name: COLLABORATION_APP_INSECURE
              value: "false"
            - name: COLLABORATION_APP_PROOF_DISABLE
              value: "false"
            - name: COLLABORATION_CS3API_DATAGATEWAY_INSECURE
              value: "false"
            - name: COLLABORATION_WOPI_SRC
              value: https://cloud.${BASE_DOMAIN}
            - name: STORAGE_USERS_DRIVER
              value: decomposeds3
            - name: STORAGE_SYSTEM_DRIVER
              value: decomposed
            - name: STORAGE_USERS_DECOMPOSEDS3_ENDPOINT
              value: http://rustfs-io.rustfs.svc.cluster.local:9000
            - name: STORAGE_USERS_DECOMPOSEDS3_REGION
              value: default
            - name: STORAGE_USERS_DECOMPOSEDS3_BUCKET
              value: opencloud
            - name: STORAGE_USERS_DECOMPOSEDS3_CREATE_BUCKET
              value: "false"
            - name: STORAGE_USERS_DECOMPOSEDS3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: opencloud-credentials
                  key: RUSTFS_ACCESS_KEY
            - name: STORAGE_USERS_DECOMPOSEDS3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: opencloud-credentials
                  key: RUSTFS_SECRET_KEY
            - name: SEARCH_EXTRACTOR_TYPE
              value: tika
            - name: SEARCH_EXTRACTOR_TIKA_TIKA_URL
              value: http://opencloud-tika.opencloud.svc.cluster.local:9998
            - name: FRONTEND_FULL_TEXT_SEARCH_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 9200
              protocol: TCP
            - name: metrics
              containerPort: 9205
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 45
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "2"
              memory: 4Gi
              ephemeral-storage: 2Gi
          volumeMounts:
            - name: opencloud-config
              mountPath: /etc/opencloud
            - name: opencloud-config-files
              mountPath: /etc/opencloud/proxy.yaml
              subPath: proxy.yaml
              readOnly: true
            - name: opencloud-config-files
              mountPath: /etc/opencloud/app-registry.yaml
              subPath: app-registry.yaml
              readOnly: true
            - name: opencloud-config-files
              mountPath: /etc/opencloud/apps.yaml
              subPath: apps.yaml
              readOnly: true
            - name: opencloud-config-files
              mountPath: /etc/opencloud/csp.yaml
              subPath: csp.yaml
              readOnly: true
            - name: opencloud-data
              mountPath: /var/lib/opencloud
            - name: opencloud-apps
              mountPath: /var/lib/opencloud/web/assets/apps
      volumes:
        - name: opencloud-config
          persistentVolumeClaim:
            claimName: opencloud-config
        - name: opencloud-config-files
          configMap:
            name: opencloud-config-files
        - name: opencloud-data
          persistentVolumeClaim:
            claimName: opencloud-data
        - name: opencloud-apps
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: opencloud-tika
  namespace: opencloud
  labels:
    app.kubernetes.io/name: opencloud-tika
    app.kubernetes.io/component: search
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opencloud-tika
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opencloud-tika
        app.kubernetes.io/component: search
    spec:
      nodeSelector:
        node-role.kubernetes.io/homelab: homelab
      hostUsers: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tika
          image: apache/tika:3.3.1.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
          ports:
            - name: http
              containerPort: 9998
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /tika
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /tika
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          startupProbe:
            httpGet:
              path: /tika
              port: http
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
              ephemeral-storage: 128Mi
            limits:
              cpu: "1"
              memory: 2Gi
              ephemeral-storage: 2Gi
