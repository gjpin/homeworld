---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: feishin
  namespace: feishin
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "feishin.base-domain.invalid"
  rules:
    - backendRefs:
        - name: feishin
          namespace: feishin
          kind: Service
          port: 9180
          group: ""
          weight: 1
