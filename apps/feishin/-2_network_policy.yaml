---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # Feishin's container only serves the static web client: the browser
  # talks to Navidrome's public hostname itself, so the pod has no egress
  # at all (not even DNS).
  name: default-deny
  namespace: feishin
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-feishin-gateway
  namespace: feishin
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: feishin
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gatewayclass: envoy-merged
      toPorts:
        - ports:
            - port: "9180"
              protocol: TCP
