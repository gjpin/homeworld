---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubelet-serving-cert-approver
  namespace: kubelet-serving-cert-approver
  labels:
    app.kubernetes.io/name: kubelet-serving-cert-approver
    app.kubernetes.io/instance: kubelet-serving-cert-approver
    app.kubernetes.io/component: controller
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: kubelet-serving-cert-approver
      app.kubernetes.io/instance: kubelet-serving-cert-approver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: kubelet-serving-cert-approver
        app.kubernetes.io/instance: kubelet-serving-cert-approver
        app.kubernetes.io/component: controller
    spec:
      serviceAccountName: kubelet-serving-cert-approver
      priorityClassName: system-cluster-critical
      runtimeClassName: gvisor
      hostUsers: false
      nodeSelector:
        node-role.kubernetes.io/homelab: homelab
      # Upstream tolerations preserved: the approver must run even while
      # control-plane taints are still present.
      tolerations:
        - effect: NoSchedule
          key: node.cloudprovider.kubernetes.io/uninitialized
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/master
          operator: Exists
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: cert-approver
          image: ghcr.io/alex1989hu/kubelet-serving-cert-approver:0.12.1
          imagePullPolicy: IfNotPresent
          args:
            - serve
          env:
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: health
              containerPort: 8080
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          startupProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 6
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
              ephemeral-storage: 64Mi
            limits:
              cpu: 250m
              memory: 32Mi
              ephemeral-storage: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
