---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: grafana-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns
  namespace: grafana-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-grafana-operator-kubernetes-api
  namespace: grafana-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/instance: grafana-operator
      k8s:app.kubernetes.io/name: grafana-operator
      k8s:app.kubernetes.io/component: operator
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-grafana-operator-metrics-ingress
  namespace: grafana-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # The chart's ServiceMonitor scrapes the metrics port; the scrape path
  # originates from the OpenTelemetry collector pod.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/instance: grafana-operator
      k8s:app.kubernetes.io/name: grafana-operator
      k8s:app.kubernetes.io/component: operator
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-collector
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # The operator reconciles GrafanaDatasource/GrafanaDashboard CRs against
  # the Grafana API (basic auth kept on deliberately — see docs/oidc.md).
  # Without this egress no datasource or dashboard ever reconciles. The
  # operator-created Service is named "{Grafana.metadata.name}-service":
  # grafana-service for the grafana CR.
  name: allow-grafana-operator-grafana-api
  namespace: grafana-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/instance: grafana-operator
      k8s:app.kubernetes.io/name: grafana-operator
      k8s:app.kubernetes.io/component: operator
  egress:
    - toServices:
        - k8sService:
            serviceName: grafana-service
            namespace: grafana
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
