---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # Discovery and metadata: TMDb (required) and TheTVDB, the IMDb ratings
  # proxy (api.radarr.video) and the Rotten Tomatoes ratings search
  # (Algolia), and the anime-lists mapping fetched during Jellyfin scans
  # (raw.githubusercontent.com). The GitHub release check is disabled in
  # the seeded settings and api.github.com is not allowed; the Plex hosts
  # are unused.
  name: allow-seerr-metadata
  namespace: seerr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: seerr
  egress:
    - toFQDNs:
        - matchName: "api.themoviedb.org"
        - matchName: "image.tmdb.org"
        - matchName: "api4.thetvdb.com"
        - matchName: "artworks.thetvdb.com"
        - matchName: "api.radarr.video"
        - matchName: "79frdp12pn-dsn.algolia.net"
        - matchName: "raw.githubusercontent.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # CloudNativePG's instance manager watches its Cluster through the API server,
  # the operator reads each instance's status port, and instances and their
  # bootstrap Jobs replicate from each other.
  name: allow-seerr-postgres-instance
  namespace: seerr
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:cnpg.io/cluster: seerr
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cloudnative-pg
            k8s:app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: seerr
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:cnpg.io/cluster: seerr
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
