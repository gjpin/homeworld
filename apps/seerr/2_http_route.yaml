---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: seerr
  namespace: seerr
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "seerr.base-domain.invalid"
  rules:
    - backendRefs:
        - name: seerr
          namespace: seerr
          kind: Service
          port: 5055
          group: ""
          weight: 1
