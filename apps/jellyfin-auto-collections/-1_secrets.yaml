---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: jellyfin-auto-collections-secrets
  namespace: jellyfin-auto-collections
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: jellyfin-auto-collections-secrets
  data:
    # A dedicated Jellyfin API key (Dashboard > API Keys) and the ID of the
    # Jellyfin user whose library the collections are matched against;
    # read by config.yaml through !ENV.
    - secretKey: JELLYFIN_API_KEY
      remoteRef:
        key: /jellyfin-auto-collections/JELLYFIN_API_KEY
        decodingStrategy: None
    - secretKey: JELLYFIN_USER_ID
      remoteRef:
        key: /jellyfin-auto-collections/JELLYFIN_USER_ID
        decodingStrategy: None
