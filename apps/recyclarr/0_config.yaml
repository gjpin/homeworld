# Recyclarr syncs the TRaSH Guides quality definitions, quality profiles
# and custom formats into Sonarr and Radarr
# (https://recyclarr.dev/reference/configuration/). Each instance syncs the
# TRaSH quality profile named in its comment; the custom-format groups TRaSH
# marks default for that profile stay on. Lidarr is not supported by Recyclarr,
# so its profiles are managed in the Lidarr UI.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: recyclarr-config
  namespace: recyclarr
  labels:
    app.kubernetes.io/name: recyclarr
data:
  recyclarr.yml: |
    # yaml-language-server: $schema=https://schemas.recyclarr.dev/v8/config-schema.json
    sonarr:
      # TRaSH WEB-2160p (Combined) for its custom-format scores, with the
      # quality list widened so every title finds a release: each resolution
      # is one group (WEB and Blu-ray encodes rank equally inside it), from
      # 2160p down to SD, with TV captures (HDTV, SDTV) below the group of
      # their resolution. Upgrades are off: the first grab is the file that
      # stays, so one download per episode. The global delay profile (kept by
      # apps/media-config) holds a fresh release back so a 2160p release
      # posted shortly after a 1080p one still wins. Remuxes,
      # Raw-HD and full discs stay out (unlisted, so disallowed).
      sonarr:
        # In-cluster Service; the hostname is in Sonarr's
        # SERVER__ALLOWEDHOSTS. No trailing slash.
        base_url: http://sonarr.sonarr.svc.cluster.local:8989
        api_key: !env_var SONARR_API_KEY
        quality_definition:
          type: series
        # Propers and repacks are not downloaded over an existing file
        # (TRaSH's setting; with upgrades off no custom format upgrades
        # either).
        media_management:
          propers_and_repacks: do_not_prefer
        quality_profiles:
          - trash_id: c4cadd6b35b95f62c3d47a408e53e2f7 # WEB-2160p (Combined)
            reset_unmatched_scores:
              enabled: true
            # until_quality is the profile's cutoff, which Sonarr and Radarr
            # require even with upgrades off; the cutoff-unmet lists treat
            # every file as meeting it then.
            upgrade:
              allowed: false
              until_quality: 2160p
            qualities:
              - name: 2160p
                qualities: [WEBDL-2160p, WEBRip-2160p, Bluray-2160p]
              - name: 1080p
                qualities: [WEBDL-1080p, WEBRip-1080p, Bluray-1080p]
              - name: HDTV-1080p
              - name: 720p
                qualities: [WEBDL-720p, WEBRip-720p, Bluray-720p]
              - name: HDTV-720p
              - name: SD
                qualities: [WEBDL-480p, WEBRip-480p, Bluray-576p, Bluray-480p, DVD]
              - name: SDTV
        custom_format_groups:
          add:
            # Penalises Dolby Vision releases without an HDR10 layer, so
            # clients without Dolby Vision direct-play the HDR10 fallback
            # instead of needing a tone-mapped transcode.
            - trash_id: d776a1ea912a117d66d83b880ff2055d # [HDR Formats] DV (w/o HDR fallback)
    radarr:
      # TRaSH WEBDL 2160p (Combined), the Radarr counterpart of Sonarr's
      # profile, widened and without upgrades the same way (films have no
      # TV captures), so older films that never had a WEB release still get
      # their Blu-ray or DVD encode.
      radarr:
        base_url: http://radarr.radarr.svc.cluster.local:7878
        api_key: !env_var RADARR_API_KEY
        quality_definition:
          type: movie
        # Propers and repacks are not downloaded over an existing file
        # (TRaSH's setting; with upgrades off no custom format upgrades
        # either).
        media_management:
          propers_and_repacks: do_not_prefer
        quality_profiles:
          - trash_id: 05fbf054ac8ad0303335026cc2632f1a # WEBDL 2160p (Combined)
            reset_unmatched_scores:
              enabled: true
            # until_quality is the profile's cutoff, which Sonarr and Radarr
            # require even with upgrades off; the cutoff-unmet lists treat
            # every file as meeting it then.
            upgrade:
              allowed: false
              until_quality: 2160p
            qualities:
              - name: 2160p
                qualities: [WEBDL-2160p, WEBRip-2160p, Bluray-2160p]
              - name: 1080p
                qualities: [WEBDL-1080p, WEBRip-1080p, Bluray-1080p]
              - name: 720p
                qualities: [WEBDL-720p, WEBRip-720p, Bluray-720p]
              - name: SD
                qualities: [WEBDL-480p, WEBRip-480p, Bluray-576p, Bluray-480p, DVD]
        custom_format_groups:
          add:
            - trash_id: 7fc2751eef7e6bdc70b74136e5e35c76 # [HDR Formats] DV (w/o HDR fallback)
