---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: recyclarr
  namespace: recyclarr
  labels:
    app.kubernetes.io/name: recyclarr
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  # Hourly, so a fresh install has the quality profiles within the hour of
  # Sonarr and Radarr starting; an unchanged sync is a git fetch and a no-op. A run that fails (an app restarting, the
  # k3s upgrade window) is retried by the next one.
  schedule: "17 * * * *"
  timeZone: UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: recyclarr
        spec:
          restartPolicy: Never
          serviceAccountName: recyclarr
          automountServiceAccountToken: false
          runtimeClassName: gvisor
          # The image's non-root user (UID/GID 1000).
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: recyclarr
              # Renovate tracks the image tag below.
              image: ghcr.io/recyclarr/recyclarr:8.8.1
              imagePullPolicy: IfNotPresent
              args:
                - sync
              env:
                - name: TZ
                  value: UTC
                # Configs, includes and state/ live under /config; the git
                # caches go to the same volume.
                - name: RECYCLARR_CONFIG_DIR
                  value: /config
                - name: RECYCLARR_DATA_DIR
                  value: /config/data
              envFrom:
                - secretRef:
                    name: recyclarr-secrets
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop:
                    - ALL
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 1000
                runAsGroup: 1000
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                  ephemeral-storage: 16Mi
                limits:
                  cpu: "1"
                  memory: 256Mi
                  ephemeral-storage: 256Mi
              volumeMounts:
                - name: data
                  mountPath: /config
                # Every *.yml in configs/ is loaded; mounted as a directory
                # so a ConfigMap change reaches the next run.
                - name: config
                  mountPath: /config/configs
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: recyclarr
            - name: config
              configMap:
                name: recyclarr-config
            - name: tmp
              emptyDir: {}
