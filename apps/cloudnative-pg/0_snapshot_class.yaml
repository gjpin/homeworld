# https://cloudnative-pg.github.io/docs/1.28/appendixes/backup_volumesnapshot/
# https://longhorn.io/docs/1.12.1/snapshots-and-backups/
#
# VolumeSnapshotClass for CNPG's database-native volume-snapshot backups
# (method: volumeSnapshot). It is deliberately separate from the Velero
# class in apps/velero/0_snapshot_class.yaml:
#
#   * deletionPolicy: Delete — the Backup CR is the retention unit: pruning
#     old Backup CRs (kubectl -n <ns> delete backup <name>) garbage-collects
#     their VolumeSnapshots and the underlying Longhorn snapshots with them.
#     Velero's class uses Delete for the same reason (transient uploads).
#   * snapshotOwnerReference is set to `backup` on every Cluster so the
#     VolumeSnapshots are owned by their Backup CR (see the Cluster specs).
#   * parameters.type: snap — Longhorn's CSI driver treats an empty type as
#     `bak` (a Longhorn backup, which needs a backup target) rather than an
#     in-cluster snapshot; "snap" is the in-cluster snapshot the CNPG flow
#     requires.
#
# No velero.io/csi-volumesnapshot-class label: Velero's CSI plugin must not
# pick this class for its transient snapshots.
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotClass
metadata:
  # Cluster-scoped: no namespace.
  name: cnpg-longhorn
  annotations:
    argocd.argoproj.io/sync-wave: "0"
driver: driver.longhorn.io
deletionPolicy: Delete
parameters:
  type: snap
