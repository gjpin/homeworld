apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
- name: cloudnative-pg
  repo: https://cloudnative-pg.github.io/charts
  version: 0.28.0
  releaseName: cloudnative-pg
  namespace: cloudnative-pg
  includeCRDs: true
  skipTests: true
  valuesFile: values.yaml
# Chart 0.28.0 does not expose hostUsers; patch the generated operator PodSpec.
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^cloudnative-pg$
    namespace: ^cloudnative-pg$
  patch: |-
    - op: add
      path: /spec/template/spec/hostUsers
      value: false
