apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: cloudnative-pg
    repo: https://cloudnative-pg.github.io/charts
    version: 0.29.1
    releaseName: cloudnative-pg
    namespace: cloudnative-pg
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^cloudnative-pg$
      namespace: ^cloudnative-pg$
    patch: |-
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^cloudnative-pg$
      namespace: ^cloudnative-pg$
    patch: |-
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: pod-probes-identical,pod-networkpolicy,deployment-replicas,container-image-pull-policy
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: Upstream UID, filesystem, probe, availability, Cilium policy, and cached-image pull constraints are accepted for this exact resource.
