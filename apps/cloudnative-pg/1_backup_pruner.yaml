# CNPG volume-snapshot backups have no retention of their own. This CronJob
# deletes the Backup objects the ScheduledBackups create once they are older
# than 7 days; their VolumeSnapshots and Longhorn snapshots are deleted with
# them (snapshotOwnerReference: backup, deletionPolicy: Delete on the
# cnpg-longhorn VolumeSnapshotClass), which keeps snapshot growth inside the
# small Postgres volumes bounded. Backups taken by hand are never touched.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backup-pruner
  namespace: cloudnative-pg
  annotations:
    argocd.argoproj.io/sync-wave: "1"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cnpg-backup-pruner
  annotations:
    argocd.argoproj.io/sync-wave: "1"
rules:
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - backups
    verbs:
      - list
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cnpg-backup-pruner
  annotations:
    argocd.argoproj.io/sync-wave: "1"
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cnpg-backup-pruner
subjects:
  - kind: ServiceAccount
    name: backup-pruner
    namespace: cloudnative-pg
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backup-pruner
  namespace: cloudnative-pg
  annotations:
    argocd.argoproj.io/sync-wave: "1"
data:
  prune.py: |
    import datetime, json, ssl, urllib.request

    KEEP_DAYS = 7
    SA = "/var/run/secrets/kubernetes.io/serviceaccount"
    API = "https://kubernetes.default.svc"
    token = open(f"{SA}/token").read()
    ctx = ssl.create_default_context(cafile=f"{SA}/ca.crt")

    def call(method, path):
        req = urllib.request.Request(API + path, method=method,
                                     headers={"Authorization": f"Bearer {token}"})
        with urllib.request.urlopen(req, context=ctx) as resp:
            return json.load(resp)

    cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(days=KEEP_DAYS)
    backups = call("GET", "/apis/postgresql.cnpg.io/v1/backups"
                          "?labelSelector=cnpg.io/scheduled-backup")["items"]
    for b in backups:
        meta = b["metadata"]
        created = datetime.datetime.fromisoformat(meta["creationTimestamp"].replace("Z", "+00:00"))
        if created < cutoff:
            call("DELETE", f"/apis/postgresql.cnpg.io/v1/namespaces/{meta['namespace']}"
                           f"/backups/{meta['name']}")
            print(f"deleted {meta['namespace']}/{meta['name']} ({meta['creationTimestamp']})")
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup-pruner
  namespace: cloudnative-pg
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  schedule: "0 12 * * *"
  timeZone: Europe/Lisbon
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup-pruner
        spec:
          serviceAccountName: backup-pruner
          restartPolicy: Never
          runtimeClassName: gvisor
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: prune
              image: docker.io/library/python:3.14-alpine3.24
              imagePullPolicy: IfNotPresent
              command:
                - python3
                - /script/prune.py
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                  ephemeral-storage: 16Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
                  ephemeral-storage: 64Mi
              volumeMounts:
                - name: script
                  mountPath: /script
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: backup-pruner
