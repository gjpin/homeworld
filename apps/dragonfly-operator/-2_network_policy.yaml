---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: dragonfly-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns
  namespace: dragonfly-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dragonfly-operator-kubernetes-api
  namespace: dragonfly-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/instance: dragonfly-operator
      k8s:app.kubernetes.io/name: dragonfly-operator
      k8s:control-plane: controller-manager
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dragonfly-operator-webhook-ingress
  namespace: dragonfly-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/instance: dragonfly-operator
      k8s:app.kubernetes.io/name: dragonfly-operator
      k8s:control-plane: controller-manager
  ingress:
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dragonfly-operator-metrics-ingress
  namespace: dragonfly-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # The chart's ServiceMonitor scrapes the manager metrics port; the
  # kube-rbac-proxy sidecar is disabled and Cilium is the port boundary.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/instance: dragonfly-operator
      k8s:control-plane: controller-manager
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-collector
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # The operator's readiness and role checks use each instance's admin port.
  # Each instance's namespace carries the matching ingress rule.
  name: allow-dragonfly-operator-instances
  namespace: dragonfly-operator
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: dragonfly-operator
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: affine
            k8s:app.kubernetes.io/name: dragonfly
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
            k8s:app.kubernetes.io/name: dragonfly
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authelia
            k8s:app.kubernetes.io/name: dragonfly
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: immich
            k8s:app.kubernetes.io/name: dragonfly
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: supernote
            k8s:app.kubernetes.io/name: dragonfly
      toPorts:
        - ports:
            - port: "9999"
              protocol: TCP
