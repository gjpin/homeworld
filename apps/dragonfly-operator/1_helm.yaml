# https://github.com/dragonflydb/dragonfly-operator
# https://www.dragonflydb.io/docs/getting-started/kubernetes-operator
# https://www.dragonflydb.io/docs/getting-started/kubernetes
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: dragonfly-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: dragonfly-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - ServerSideApply=true
  source:
    repoURL: https://github.com/gjpin/homeworld.git
    path: apps/dragonfly-operator/helm
    targetRevision: HEAD
