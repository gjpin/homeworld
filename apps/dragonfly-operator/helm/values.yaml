fullnameOverride: dragonfly-operator
replicaCount: 1

additionalLabels:
  app: dragonfly-operator

deploymentAnnotations:
  kube-score/ignore: pod-networkpolicy,container-security-context-user-group-id,container-security-context-readonlyrootfilesystem,deployment-replicas,container-image-pull-policy
  security.homeworld/exception-reason: Upstream UID, filesystem, probe, availability, Cilium policy, and cached-image pull constraints are accepted for this exact resource.

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

manager:
  nodeSelector:
    node-role.kubernetes.io/homelab: homelab
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: "1"
      memory: 2Gi
      ephemeral-storage: 2Gi

rbacProxy:
  resources:
    requests:
      cpu: 10m
      memory: 64Mi
      ephemeral-storage: 64Mi
    limits:
      cpu: 500m
      memory: 128Mi
      ephemeral-storage: 2Gi

# With the kube-rbac-proxy sidecar disabled, the manager binds its metrics
# listener to :8080 directly (the binary's default) and the ServiceMonitor
# scrapes the plain `metrics` endpoint; Cilium restricts the port to the
# OpenTelemetry collector, matching every other operator in this cluster.
# (With the proxy enabled the chart's monitor would instead use a
# bearerTokenFile endpoint, which the Target Allocator's
# denyFSAccessThroughSMs hardening rejects.)
rbacProxy:
  enabled: false
serviceMonitor:
  enabled: true
  interval: 60s
