apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: dragonfly-operator
    repo: oci://ghcr.io/dragonflydb/dragonfly-operator/helm
    version: v1.7.0
    releaseName: dragonfly-operator
    namespace: dragonfly-operator
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^dragonfly-operator$
      namespace: ^dragonfly-operator$
    patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: dragonfly-operator
        namespace: dragonfly-operator
      spec:
        template:
          spec:
            hostUsers: false
            runtimeClassName: gvisor
  # The chart's ServiceMonitor template omits metadata.namespace; AGENTS.md
  # requires namespaced resources to declare it explicitly (and the Argo
  # destination fallback is fragile for ServiceMonitors consumed by the
  # Target Allocator's namespace-qualified lookups).
  - target:
      group: monitoring.coreos.com
      version: v1
      kind: ServiceMonitor
      name: ^dragonfly-operator-controller-manager-metrics$
    patch: |-
      - op: add
        path: /metadata/namespace
        value: dragonfly-operator
