apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
- name: dragonfly-operator
  repo: oci://ghcr.io/dragonflydb/dragonfly-operator/helm
  version: v1.5.0
  releaseName: dragonfly-operator
  namespace: dragonfly-operator
  includeCRDs: true
  skipTests: true
  valuesFile: values.yaml
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^dragonfly-operator$
    namespace: ^dragonfly-operator$
  patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: dragonfly-operator
      namespace: dragonfly-operator
    spec:
      template:
        spec:
          hostUsers: false
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^dragonfly-operator$
    namespace: ^dragonfly-operator$
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
    - op: replace
      path: /spec/template/spec/containers/1/imagePullPolicy
      value: IfNotPresent
