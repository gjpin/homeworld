---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: openobserve
  namespace: otel-collector
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: openobserve
  data:
    - secretKey: OTLP_AUTHORIZATION
      remoteRef:
        key: /openobserve/OTLP_AUTHORIZATION
        decodingStrategy: Auto
