apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-otel-pod-scrape-cert-manager
  namespace: otel-collector
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # The chart's ServiceMonitor scrapes the http-metrics endpoint (9402) of
  # the controller, cainjector, and webhook pods; the matching ingress
  # policy lives in apps/cert-manager (allow-cert-manager-metrics-ingress).
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/managed-by: opentelemetry-operator
      k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
      k8s:app.kubernetes.io/component: opentelemetry-collector
  egress:
    - toEndpoints:
        - matchExpressions:
            - key: k8s:app.kubernetes.io/name
              operator: In
              values:
                - cainjector
                - cert-manager
                - webhook
            - key: k8s:app.kubernetes.io/instance
              operator: In
              values:
                - cert-manager
            - key: k8s:io.kubernetes.pod.namespace
              operator: In
              values:
                - cert-manager
      toPorts:
        - ports:
            - port: "9402"
              protocol: TCP
---
