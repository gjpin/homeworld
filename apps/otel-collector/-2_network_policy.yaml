# The collector scrapes the endpoints published by every ServiceMonitor and
# PodMonitor. Scrape egress is granted per target namespace, restricted to
# the metrics ports those monitors select; every grant has a matching
# ingress rule in the target component's own network policy.
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-otel-pod-scrape-argocd
  namespace: otel-collector
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # Argo CD ServiceMonitors: application-controller, server, repo-server,
  # applicationset-controller, and notifications-controller metrics; the
  # handwritten PodMonitor also scrapes the Dragonfly operand admin metrics
  # port (9999).
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/managed-by: opentelemetry-operator
      k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
      k8s:app.kubernetes.io/component: opentelemetry-collector
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: argocd
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
            - port: "8082"
              protocol: TCP
            - port: "8083"
              protocol: TCP
            - port: "8084"
              protocol: TCP
            - port: "9001"
              protocol: TCP
            - port: "9999"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-otel-pod-scrape-authelia
  namespace: otel-collector
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # Authelia's ServiceMonitor scrapes the app metrics port, its PodMonitor
  # scrapes the CloudNativePG instance metrics port, and the handwritten
  # PodMonitor scrapes the Dragonfly operand admin metrics port (9999).
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/managed-by: opentelemetry-operator
      k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
      k8s:app.kubernetes.io/component: opentelemetry-collector
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: authelia
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
            - port: "9959"
              protocol: TCP
            - port: "9999"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-otel-pod-scrape-cilium
  namespace: otel-collector
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # Cilium's agent, operator, envoy, and hubble-metrics ServiceMonitors
  # target host-network agents (scraped through the node identity); only the
  # hubble-relay ServiceMonitor targets regular pods.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/managed-by: opentelemetry-operator
      k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
      k8s:app.kubernetes.io/component: opentelemetry-collector
  egress:
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "9962"
              protocol: TCP
            - port: "9963"
              protocol: TCP
            - port: "9964"
              protocol: TCP
            - port: "9965"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: cilium
            k8s:k8s-app: hubble-relay
      toPorts:
        - ports:
            - port: "9966"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-otel-pod-scrape-kube-control-plane
  namespace: otel-collector
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # apps/kube-control-plane monitors: the API servers (default/kubernetes
  # endpoints on 6443), and the k3s server process's kube-scheduler (10259),
  # kube-controller-manager (10257), and etcd metrics listener (2381) on
  # every control plane node, local or remote.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/managed-by: opentelemetry-operator
      k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
      k8s:app.kubernetes.io/component: opentelemetry-collector
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "10259"
              protocol: TCP
            - port: "10257"
              protocol: TCP
            - port: "2381"
              protocol: TCP
---
