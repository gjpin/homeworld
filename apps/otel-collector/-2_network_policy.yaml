kind: CiliumNetworkPolicy
metadata:
  name: allow-otel-pod-scrape-immich
  namespace: otel-collector
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # The chart's ServiceMonitor scrapes the server's metrics-api (8081) and
  # machine-learning metrics-ms (8082) endpoints, and the handwritten
  # PodMonitors scrape the CloudNativePG instance metrics port (9187) and the
  # Dragonfly operand admin metrics port (9999).
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/managed-by: opentelemetry-operator
      k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
      k8s:app.kubernetes.io/component: opentelemetry-collector
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: immich
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
            - port: "8082"
              protocol: TCP
            - port: "9187"
              protocol: TCP
            - port: "9999"
              protocol: TCP
---
