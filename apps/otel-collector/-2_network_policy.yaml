# https://opentelemetry.io/docs/platforms/kubernetes/operator/target-allocator/
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: otel-collector
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  ingress: []
  egress: []
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns
  namespace: otel-collector
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
# The operator-managed collector scrapes its own telemetry through the
# operator-generated monitoring Service, which selects the same StatefulSet
# pods; the Target Allocator serves the static target back to the collector.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-otel-pod-self-metrics
  namespace: otel-collector
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/managed-by: opentelemetry-operator
      k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
      k8s:app.kubernetes.io/component: opentelemetry-collector
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-collector
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-collector
      toPorts:
        - ports:
            - port: "8888"
              protocol: TCP
---
# RustFS pushes its metrics via OTLP/HTTP to the collector's OTLP receiver
# (RUSTFS_OBS_ENDPOINT in apps/rustfs/0_tenant.yaml; RustFS exposes no
# Prometheus scrape endpoint). Trace and log export are disabled there, so
# only the metrics receiver port is opened.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-otel-pod-otlp-ingress-rustfs
  namespace: otel-collector
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/managed-by: opentelemetry-operator
      k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
      k8s:app.kubernetes.io/component: opentelemetry-collector
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: rustfs
            k8s:rustfs.tenant: rustfs
      toPorts:
        - ports:
            - port: "4318"
              protocol: TCP
---
# The collector's Prometheus receiver polls the Target Allocator over the
# mTLS listener (Service port 443 -> container port 8443) for its share of
# the ServiceMonitor and PodMonitor scrape targets.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-otel-pod-target-allocator
  namespace: otel-collector
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/managed-by: opentelemetry-operator
      k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
      k8s:app.kubernetes.io/component: opentelemetry-collector
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-targetallocator
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-otel-ta-target-allocation-ingress
  namespace: otel-collector
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # The collector's Prometheus receiver polls the Target Allocator's mTLS
  # listener (Service port 443 -> container port 8443) for its share of the
  # ServiceMonitor and PodMonitor scrape targets and their credentials.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/managed-by: opentelemetry-operator
      k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
      k8s:app.kubernetes.io/component: opentelemetry-targetallocator
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-collector
      toPorts:
        - ports:
            - port: "8443"
              protocol: TCP
---
# The Target Allocator watches ServiceMonitors, PodMonitors, and their
# target workloads through the Kubernetes API; it also resolves the
# credential secrets referenced by the collabora and woodpecker monitors.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-otel-ta-kubernetes-api
  namespace: otel-collector
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/managed-by: opentelemetry-operator
      k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
      k8s:app.kubernetes.io/component: opentelemetry-targetallocator
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
