apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: opentelemetry-collector
    repo: https://open-telemetry.github.io/opentelemetry-helm-charts
    version: 0.178.3
    releaseName: otel-collector-node
    namespace: otel-collector-node
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
resources:
  - network-policy.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: ^otel-collector-node-agent$
      namespace: ^otel-collector-node$
    patch: |-
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1liveness-port
        value: The upstream chart probes the collector health endpoint on undeclared port 13133 instead of a declared containerPort.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1no-read-only-root-fs
        value: The pinned upstream collector image writes to its root filesystem; overriding it would break runtime file access.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1run-as-non-root
        value: k3s writes pod logs 0640 root under /var/log/pods (0750), so the filelog receiver reads them as UID 0 with every capability dropped (docs/pod-security.md).
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1readiness-port
        value: The upstream chart probes the collector health endpoint on undeclared port 13133 instead of a declared containerPort.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1sensitive-host-mounts
        value: The node collector mounts the host /proc, /sys and /var/log/pods read-only for host metrics and log collection; the host integration is documented in docs/pod-security.md.
