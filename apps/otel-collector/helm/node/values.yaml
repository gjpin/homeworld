fullnameOverride: otel-collector-node
namespaceOverride: otel-collector-node
mode: daemonset
image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
# Documented privileged exception (docs/pod-security.md). Pod logs are
# 0640 root:root under /var/log/pods (0750), so only host root can read them:
# the agent runs as UID 0 in the host user namespace, with every capability
# dropped and read-only hostPath mounts. container_t may not read the
# container_log_t log directories under SELinux enforcing, so it runs as spc_t.
podSecurityContext:
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0
  seLinuxOptions:
    type: spc_t
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: false
  runAsUser: 0
  seccompProfile:
    type: RuntimeDefault
service:
  enabled: true
  trafficDistribution: PreferClose
# PSS baseline/privileged transition history: hostPort is forbidden by the
# baseline profile and useless here — nothing sends telemetry to node IPs
# (the pod collector Service is the OTLP entry point), so the agent does not
# claim host ports.
ports:
  otlp:
    hostPort: 0
  otlp-http:
    hostPort: 0
  jaeger-compact:
    hostPort: 0
  jaeger-thrift:
    hostPort: 0
  jaeger-grpc:
    hostPort: 0
  zipkin:
    hostPort: 0
resources:
  requests:
    cpu: 10m
    memory: 64Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: "1"
    memory: 2Gi
    ephemeral-storage: 2Gi
presets:
  # filelog receiver
  # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/filelogreceiver
  logsCollection:
    enabled: true
  # hostmetrics receiver
  # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/hostmetricsreceiver
  hostMetrics:
    enabled: true
    # Mount only the host /proc and /sys under /hostfs instead of the host
    # root; this drops the filesystem scraper (and its /proc/1/mountinfo and
    # host /etc reads), whose system.filesystem.* series nothing consumes.
    hardenedMode: true
  # kubeletstats receiver
  # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/kubeletstatsreceiver
  kubeletMetrics:
    enabled: true
  # k8s_attributes processor
  # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/k8sattributesprocessor
  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: true
    extractAllPodAnnotations: true
config:
  receivers:
    # The volume group adds the per-PVC k8s.volume.available/capacity
    # series that vmalert's PersistentVolumeFillingUp rule (and kured's
    # reboot gate) depend on.
    kubeletstats:
      metric_groups:
        - container
        - pod
        - node
        - volume
    jaeger: null
    zipkin: null
    prometheus:
      config:
        scrape_configs:
          - job_name: otel-collector-node
            scrape_interval: 10s
            static_configs:
              - targets:
                  - ${env:MY_POD_IP}:8888
  exporters:
    debug: null
    otlp_http/victoriametrics:
      compression: gzip
      encoding: proto
      metrics_endpoint: http://victoria-metrics.victoria-metrics.svc.cluster.local:8428/opentelemetry/v1/metrics
    otlp_http/victorialogs:
      compression: gzip
      encoding: proto
      logs_endpoint: http://victoria-logs.victoria-metrics.svc.cluster.local:9428/insert/opentelemetry/v1/logs
    otlp_http/victoriatraces:
      compression: gzip
      encoding: proto
      traces_endpoint: http://victoria-traces.victoria-metrics.svc.cluster.local:10428/insert/opentelemetry/v1/traces
  service:
    telemetry:
      metrics:
        readers:
          - pull:
              exporter:
                prometheus:
                  host: ${env:MY_POD_IP}
                  port: 8888
    pipelines:
      logs:
        processors:
          - memory_limiter
          - k8s_attributes
          - batch
        exporters:
          - otlp_http/victorialogs
      metrics:
        processors:
          - memory_limiter
          - k8s_attributes
          - batch
        exporters:
          - otlp_http/victoriametrics
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - k8s_attributes
          - batch
        exporters:
          - otlp_http/victoriatraces
