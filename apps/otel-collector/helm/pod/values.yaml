fullnameOverride: otel-collector-pod
namespaceOverride: otel-collector
mode: deployment
image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib
replicaCount: 1
resources:
  requests:
    cpu: 10m
    memory: 64Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: "1"
    memory: 2Gi
    ephemeral-storage: 2Gi
nodeSelector:
  node-role.kubernetes.io/homelab: homelab
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
service:
  enabled: true
  type: ClusterIP
# The Prometheus receiver's `k8s` job uses kubernetes_sd (role: pod) to
# scrape pods annotated prometheus.io/scrape=true. That discovery needs
# pod list/watch at cluster scope; without a ClusterRole the receiver
# logs "pods is forbidden" and the job never finds targets.
clusterRole:
  create: true
  rules:
    - apiGroups:
        - ""
      resources:
        - pods
      verbs:
        - get
        - list
        - watch
config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus: # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/prometheusreceiver
      config:
        scrape_configs:
          - job_name: otel-collector-pod
            scrape_interval: 10s
            static_configs:
              - targets:
                  - ${env:MY_POD_IP}:8888
          - job_name: k8s
            kubernetes_sd_configs:
              - role: pod
            relabel_configs:
              - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                regex: "true"
                action: keep
              - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                action: replace
                regex: (.+)
                target_label: __metrics_path__
              # kubernetes_sd (role: pod) yields one target per declared
              # containerPort, which scrapes databases and admin ports and
              # never the annotated port. Rewrite __address__ to the
              # prometheus.io/port annotation (canonical kubernetes-pods job).
              - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                action: replace
                regex: (.+?)(?::\d+)?;(\d+)
                replacement: $1:$2
                target_label: __address__
            # No metric name filter: the prometheus.io/scrape annotation is the
            # deliberate allowlist (envoy gateway, velero node-agent, ...), and
            # the envoy-gateway dashboards query raw envoy_* families from the
            # proxy's /stats/prometheus endpoint.
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318
  processors:
    batch: {}
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
  exporters:
    debug: null
    otlphttp/victoriametrics:
      compression: gzip
      encoding: proto
      metrics_endpoint: http://victoria-metrics.victoria-metrics.svc.cluster.local:8428/opentelemetry/v1/metrics
    otlphttp/victorialogs:
      compression: gzip
      encoding: proto
      logs_endpoint: http://victoria-logs.victoria-metrics.svc.cluster.local:9428/insert/opentelemetry/v1/logs
    otlphttp/victoriatraces:
      compression: gzip
      encoding: proto
      traces_endpoint: http://victoria-traces.victoria-metrics.svc.cluster.local:10428/insert/opentelemetry/v1/traces
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
  service:
    telemetry:
      metrics:
        readers:
          - pull:
              exporter:
                prometheus:
                  host: ${env:MY_POD_IP}
                  port: 8888
    extensions:
      - health_check
    pipelines:
      logs:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlphttp/victorialogs
      metrics:
        receivers:
          - otlp
          - prometheus
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlphttp/victoriametrics
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - batch
        exporters:
          - otlphttp/victoriatraces
