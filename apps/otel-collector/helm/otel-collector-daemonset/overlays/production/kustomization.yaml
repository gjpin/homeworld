apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
commonAnnotations:
  security.homeworld/profile: production
patches:
- target:
    group: apps
    version: v1
    kind: DaemonSet
    name: ^otel-collector-daemonset-agent$
    namespace: ^otel-collector-node$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources
      value: {"requests":{"cpu":"100m","memory":"128Mi","ephemeral-storage":"128Mi"},"limits":{"cpu":"2","memory":"4Gi","ephemeral-storage":"4Gi"}}
- target:
    group: apps
    version: v1
    kind: DaemonSet
    name: ^otel-collector-daemonset-agent$
    namespace: ^otel-collector-node$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Always
- target:
    group: apps
    version: v1
    kind: DaemonSet
    name: ^otel-collector-daemonset-agent$
    namespace: ^otel-collector-node$
  patch: |-
    - op: add
      path: /metadata/annotations/kube-score~1ignore
      value: container-security-context-user-group-id,container-security-context-readonlyrootfilesystem,pod-probes-identical,pod-networkpolicy
    - op: add
      path: /metadata/annotations/security.homeworld~1exception-reason
      value: User namespaces remain disabled pending live compatibility validation for required hostPath mounts, HostToContainer propagation, hostPorts, and host filesystem/node telemetry; upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
