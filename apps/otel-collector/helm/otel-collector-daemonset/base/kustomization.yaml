apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
- name: opentelemetry-collector
  repo: https://open-telemetry.github.io/opentelemetry-helm-charts
  version: 0.173.1
  releaseName: otel-collector-daemonset
  namespace: otel-collector-node
  includeCRDs: true
  skipTests: true
  valuesFile: values.yaml
resources:
- network-policy.yaml
patches:
- target:
    group: apps
    version: v1
    kind: DaemonSet
    name: ^otel-collector-daemonset-agent$
    namespace: ^otel-collector-node$
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
