# https://artifacthub.io/packages/helm/opentelemetry-helm/opentelemetry-collector
# https://opentelemetry.io/docs/platforms/kubernetes/getting-started/#deployment-collector
# https://github.com/open-telemetry/opentelemetry-helm-charts/tree/main/charts/opentelemetry-collector
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector-deployment
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: otel-collector
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true

  source:
    repoURL: https://github.com/gjpin/homeworld.git
    path: apps/otel-collector/helm/otel-collector-deployment/overlays/homelab
    targetRevision: HEAD
