# https://artifacthub.io/packages/helm/opentelemetry-helm/opentelemetry-collector
# https://opentelemetry.io/docs/platforms/kubernetes/getting-started/#daemonset-collector
# https://github.com/open-telemetry/opentelemetry-helm-charts/tree/main/charts/opentelemetry-collector
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: otel-collector-node
  namespace: argocd
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: otel-collector-node
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - ServerSideApply=true
    managedNamespaceMetadata:
      labels:
        pod-security.kubernetes.io/enforce: baseline
        pod-security.kubernetes.io/enforce-version: v1.36
        pod-security.kubernetes.io/audit: restricted
        pod-security.kubernetes.io/audit-version: v1.36
        pod-security.kubernetes.io/warn: restricted
        pod-security.kubernetes.io/warn-version: v1.36
      annotations:
        security.homeworld/exception-reason: OTel node collector requires hostPath volumes and host metrics/log collection.
  source:
    repoURL: https://github.com/gjpin/homeworld.git
    path: apps/otel-collector/helm/node
    targetRevision: HEAD
