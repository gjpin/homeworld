---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-otel-pod-velero-node-agent-metrics
  namespace: otel-collector
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # Velero's node-agent is the other current pod annotated for the OTel
  # Prometheus receiver (8085); no unannotated receiver port is opened.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/instance: otel-collector-pod
      k8s:app.kubernetes.io/name: opentelemetry-collector
      k8s:component: standalone-collector
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: velero
            k8s:app.kubernetes.io/instance: velero
            k8s:name: node-agent
      toPorts:
        - ports:
            - port: "8085"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-otel-pod-envoy-metrics
  namespace: otel-collector
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # The Envoy Gateway control-plane is a current in-repository pod scrape
  # target annotated for OTel.
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/instance: otel-collector-pod
      k8s:app.kubernetes.io/name: opentelemetry-collector
      k8s:component: standalone-collector
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            k8s:app.kubernetes.io/instance: envoy-gateway
            k8s:app.kubernetes.io/name: gateway-helm
            k8s:control-plane: envoy-gateway
      toPorts:
        - ports:
            - port: "19001"
              protocol: TCP
