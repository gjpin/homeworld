fullnameOverride: external-dns
# Cluster-wide watch: namespaced mode renders --namespace=external-dns, which
# scopes the Gateway-API route informers to this namespace so cross-namespace
# HTTPRoutes are never seen.
namespaced: false
replicaCount: 1

image:
  pullPolicy: IfNotPresent

# force the DNS record IP address
extraArgs:
  - --default-targets=${EXTERNAL_IP}

sources:
  - service
  - gateway-httproute
  - gateway-grpcroute
  - gateway-tlsroute
  - gateway-tcproute
  - gateway-udproute

# "sync" policy has issues:
# https://github.com/kubernetes-sigs/external-dns/issues/4059
# Trade-off of upsert-only: removed HTTPRoute/TCPRoute hostnames are never
# pruned — the DNS record (and its TXT registry entry) outlives the route
# and keeps resolving. Orphan GC runbook: with the txt registry prefix and
# owner id below, `external-dns list`-style tooling or a manual pass can
# diff live TXT records against current routes; delete orphans with
# `dig`+Cloudflare API or by flipping policy to sync for one reconciliation
# with the same txtOwnerId (see the linked issue). Do NOT flip to sync
# permanently without digesting the issue thread.
policy: upsert-only

# Scope this instance to its own zone; the txt registry only adopts records
# carrying this prefix/owner id.
domainFilters:
  - ${BASE_DOMAIN}
txtPrefix: external-dns.
txtOwnerId: external-dns

provider:
  name: cloudflare

env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-api-token
        key: api-token

serviceMonitor:
  enabled: true
  interval: 60s

resources:
  requests:
    cpu: 10m
    memory: 64Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: "1"
    memory: 2Gi
    ephemeral-storage: 2Gi
