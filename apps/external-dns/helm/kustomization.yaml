apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: external-dns
    repo: https://kubernetes-sigs.github.io/external-dns
    version: 1.22.0
    releaseName: external-dns
    namespace: external-dns
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^external-dns$
      namespace: ^external-dns$
    patch: |-
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
