apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: 1.13.0
    releaseName: longhorn
    namespace: longhorn-system
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
resources:
  - storage_class.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^(longhorn-driver-deployer|longhorn-ui)$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-driver-deployer$
      namespace: ^longhorn-system$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: add
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-ui$
      namespace: ^longhorn-system$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-ui$
      namespace: ^longhorn-system$
    patch: |-
      # The longhornio/longhorn-ui image runs as UID 499; the nginx rootfs
      # stays writable (cache/temp dirs), so readOnlyRootFilesystem is
      # deliberately not set.
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: ^longhorn-manager$
      namespace: ^longhorn-system$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: replace
        path: /spec/template/spec/containers/1/imagePullPolicy
        value: IfNotPresent
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^longhorn-post-upgrade$
      namespace: ^longhorn-system$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^longhorn-pre-upgrade$
      namespace: ^longhorn-system$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^longhorn-uninstall$
      namespace: ^longhorn-system$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^(longhorn-post-upgrade|longhorn-uninstall)$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
      # Both jobs are pure Kubernetes API callers; longhorn-pre-upgrade is
      # the privileged hostPath exception and keeps the standard runtime.
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-driver-deployer$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
  - target:
      group: apps
      version: v1
      kind: ^(Deployment|StatefulSet)$
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-driver-deployer$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
      - op: add
        path: /spec/template/spec/initContainers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-ui$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: ^longhorn-manager$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
      - op: add
        path: /spec/template/spec/containers/1/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^longhorn-post-upgrade$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^longhorn-pre-upgrade$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^longhorn-uninstall$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
  - target:
      group: null
      version: v1
      kind: Service
      name: ^longhorn-admission-webhook$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: service-targets-pod
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^longhorn-post-upgrade$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: container-security-context-user-group-id,container-security-context-readonlyrootfilesystem,pod-networkpolicy,container-image-pull-policy
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: Upstream UID, filesystem, probe, availability, Cilium policy, and cached-image pull constraints are accepted for this exact resource.
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: ^longhorn-manager$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: container-security-context-privileged,pod-probes,pod-networkpolicy,container-security-context-user-group-id,container-security-context-readonlyrootfilesystem,container-image-pull-policy
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: Upstream UID, filesystem, probe, availability, Cilium policy, and cached-image pull constraints are accepted for this exact resource.
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^longhorn-pre-upgrade$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: pod-networkpolicy,container-security-context-user-group-id,container-security-context-readonlyrootfilesystem,container-security-context-privileged,container-image-pull-policy
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: Upstream UID, filesystem, probe, availability, Cilium policy, and cached-image pull constraints are accepted for this exact resource.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-ui$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: container-security-context-readonlyrootfilesystem,pod-probes,pod-networkpolicy,container-security-context-user-group-id,deployment-has-poddisruptionbudget,deployment-replicas,container-image-pull-policy
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: Upstream UID, filesystem, probe, availability, Cilium policy, and cached-image pull constraints are accepted for this exact resource.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-driver-deployer$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: pod-networkpolicy,container-security-context-user-group-id,container-security-context-readonlyrootfilesystem,container-image-pull-policy
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: Upstream UID, filesystem, probe, availability, Cilium policy, and cached-image pull constraints are accepted for this exact resource.
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^longhorn-uninstall$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: container-security-context-readonlyrootfilesystem,pod-networkpolicy,container-security-context-user-group-id,container-image-pull-policy
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: Upstream UID, filesystem, probe, availability, Cilium policy, and cached-image pull constraints are accepted for this exact resource.
  - target:
      group: null
      version: v1
      kind: Service
      name: ^longhorn-recovery-backend$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: service-targets-pod
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
  - target:
      group: networking.k8s.io
      version: v1
      kind: NetworkPolicy
      name: ^(backing-image-data-source|backing-image-manager|instance-manager|longhorn-recovery-backend|longhorn-webhook)$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /metadata/annotations/kube-score~1ignore
        value: networkpolicy-targets-pod
      - op: add
        path: /metadata/annotations/security.homeworld~1exception-reason
        value: These chart-provided policies select the pods that longhorn-manager creates at runtime; those pods do not exist in a static render.
