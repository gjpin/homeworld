apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: 1.12.1
    releaseName: longhorn
    namespace: longhorn-system
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
resources:
  - storage_class.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^(longhorn-driver-deployer|longhorn-ui)$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-driver-deployer$
      namespace: ^longhorn-system$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: add
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-ui$
      namespace: ^longhorn-system$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-ui$
      namespace: ^longhorn-system$
    patch: |-
      # The longhornio/longhorn-ui image runs as UID 499; the nginx rootfs
      # stays writable (cache/temp dirs), so readOnlyRootFilesystem is
      # deliberately not set.
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: ^longhorn-manager$
      namespace: ^longhorn-system$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: replace
        path: /spec/template/spec/containers/1/imagePullPolicy
        value: IfNotPresent
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^longhorn-post-upgrade$
      namespace: ^longhorn-system$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^longhorn-pre-upgrade$
      namespace: ^longhorn-system$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^longhorn-uninstall$
      namespace: ^longhorn-system$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^(longhorn-post-upgrade|longhorn-uninstall)$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
      # Both jobs are pure Kubernetes API callers; longhorn-pre-upgrade is
      # the privileged hostPath exception and keeps the standard runtime.
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-driver-deployer$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
  - target:
      group: apps
      version: v1
      kind: ^(Deployment|StatefulSet)$
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-driver-deployer$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
      - op: add
        path: /spec/template/spec/initContainers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-ui$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: ^longhorn-manager$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
      - op: add
        path: /spec/template/spec/containers/1/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^longhorn-post-upgrade$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^longhorn-pre-upgrade$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^longhorn-uninstall$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
  - target:
      group: null
      version: v1
      kind: Service
      name: ^longhorn-admission-webhook$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1dangling-service
        value: The chart's webhook Service selects labels that longhorn-manager pods only carry at runtime; no matching pod exists in the offline render.
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^longhorn-post-upgrade$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1job-ttl-seconds-after-finished
        value: One-shot upgrade hook; the upstream chart leaves ttlSecondsAfterFinished unset.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1no-read-only-root-fs
        value: The pinned upstream image writes to its root filesystem; overriding it would break runtime file access.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1run-as-non-root
        value: The upstream image keeps the chart's preserved root context; overriding it would break runtime file access.
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: ^longhorn-manager$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1no-read-only-root-fs
        value: The pinned upstream manager image writes to its root filesystem; overriding it would break runtime file access.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1privileged-container
        value: The longhorn-manager requires the privileged context to manage the distributed storage datapath; the host integration is documented in docs/pod-security.md.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1privilege-escalation-container
        value: The privileged longhorn-manager requires the escalation rights of its privileged context for the storage datapath; the host integration is documented in docs/pod-security.md.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1run-as-non-root
        value: The upstream manager image keeps the chart's preserved root context for host datapath management.
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^longhorn-pre-upgrade$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1job-ttl-seconds-after-finished
        value: One-shot upgrade hook; the upstream chart leaves ttlSecondsAfterFinished unset.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1no-read-only-root-fs
        value: The pinned upstream image writes to its root filesystem; overriding it would break runtime file access.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1privileged-container
        value: The pre-upgrade hook runs with the chart's privileged context to modify node-side Longhorn state before the upgrade.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1privilege-escalation-container
        value: The privileged pre-upgrade hook requires the escalation rights of its privileged context to modify node-side Longhorn state.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1run-as-non-root
        value: The upstream image keeps the chart's preserved root context; overriding it would break runtime file access.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-ui$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1no-read-only-root-fs
        value: The pinned upstream UI image writes to its root filesystem; overriding it would break runtime file access.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-driver-deployer$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1no-read-only-root-fs
        value: The pinned upstream driver-deployer image writes to its root filesystem; overriding it would break runtime file access.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1run-as-non-root
        value: The upstream driver-deployer image keeps the chart's preserved root context for CSI driver deployment.
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^longhorn-uninstall$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1job-ttl-seconds-after-finished
        value: One-shot uninstall hook; the upstream chart leaves ttlSecondsAfterFinished unset.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1no-read-only-root-fs
        value: The pinned upstream image writes to its root filesystem; overriding it would break runtime file access.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1run-as-non-root
        value: The upstream image keeps the chart's preserved root context; overriding it would break runtime file access.
  - target:
      group: null
      version: v1
      kind: Service
      name: ^longhorn-recovery-backend$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1dangling-service
        value: The chart's recovery backend Service selects labels that longhorn-manager pods only carry at runtime; no matching pod exists in the offline render.
