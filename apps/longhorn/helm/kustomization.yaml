apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
commonAnnotations:
  security.homeworld/profile: homelab
helmCharts:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: 1.13.0
    releaseName: longhorn
    namespace: longhorn-system
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
resources:
  - storage_class.yaml
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^(longhorn-driver-deployer|longhorn-global-manager|longhorn-ui)$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-driver-deployer$
      namespace: ^longhorn-system$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: add
        path: /spec/template/spec/initContainers/0/imagePullPolicy
        value: IfNotPresent
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-ui$
      namespace: ^longhorn-system$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
      - op: add
        path: /spec/template/spec/automountServiceAccountToken
        value: false
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-ui$
      namespace: ^longhorn-system$
    patch: |-
      # The longhornio/longhorn-ui image runs as UID 499; the nginx rootfs
      # stays writable (cache/temp dirs), so readOnlyRootFilesystem is
      # deliberately not set.
      - op: add
        path: /spec/template/spec/securityContext
        value:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: ^longhorn-manager$
      namespace: ^longhorn-system$
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: replace
        path: /spec/template/spec/containers/1/imagePullPolicy
        value: IfNotPresent
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^longhorn-post-upgrade$
      namespace: ^longhorn-system$
    patch: |-
      # The chart's helm.sh/hook annotations are inert under Argo, and a
      # plain Job breaks every chart bump: spec.template is immutable, so
      # the completed Job from the first sync rejects the new image tag and
      # the sync fails. Replacing them with Argo CD sync-hook annotations
      # restores the post-upgrade cleanup in the GitOps flow: the job runs
      # as a PostSync hook after every longhorn sync (including chart
      # bumps, always with the fresh image), and hook-delete-policy
      # removes it on success so it is re-created — never updated.
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1hook
        value: PostSync
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1hook-delete-policy
        value: HookSucceeded
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
      - op: remove
        path: /metadata/annotations/helm.sh~1hook-delete-policy
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
      # Close-to-Restricted hardening: the post-upgrade cleanup is a pure
      # Kubernetes API caller and runs as root only because the chart
      # preserves that context; it still forbids privilege escalation and
      # drops all capabilities.
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: false
          seccompProfile:
            type: RuntimeDefault
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1job-ttl-seconds-after-finished
        value: Argo's HookSucceeded delete policy removes the job after each successful cleanup run; a failed run is deliberately kept for debugging.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1no-read-only-root-fs
        value: The pinned upstream manager image writes to its root filesystem; overriding it would break runtime file access.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1run-as-non-root
        value: The upstream cleanup job keeps the chart's preserved root context for its API calls; it drops all capabilities and forbids privilege escalation.
  - target:
      group: batch
      version: v1
      kind: Job
      name: ^longhorn-uninstall$
      namespace: ^longhorn-system$
    patch: |-
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: longhorn-uninstall
        namespace: longhorn-system
      $patch: delete
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-driver-deployer$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
      # Close-to-Restricted hardening: the driver-deployer is a pure
      # Kubernetes API caller and runs as root only because the chart
      # preserves that context (see the run-as-non-root exception below);
      # it still forbids privilege escalation and drops all capabilities.
      # The wait-longhorn-manager init container (the chart's only init) is
      # patched with the same context; it only loops on a local HTTP probe.
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: false
          seccompProfile:
            type: RuntimeDefault
      - op: add
        path: /spec/template/spec/initContainers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: false
          seccompProfile:
            type: RuntimeDefault
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-global-manager$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
      # Close-to-Restricted hardening: the global manager runs the
      # longhorn-manager image's leader-elected cluster-wide controllers and
      # only calls the Kubernetes API (plus a local healthz listener); it
      # keeps the image's root context like the driver-deployer (see the
      # run-as-non-root exception below) but forbids privilege escalation
      # and drops all capabilities.
      - op: add
        path: /spec/template/spec/containers/0/securityContext
        value:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: false
          seccompProfile:
            type: RuntimeDefault
  - target:
      group: apps
      version: v1
      kind: ^(Deployment|StatefulSet)$
    patch: |-
      - op: add
        path: /spec/replicas
        value: 1
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-driver-deployer$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
      - op: add
        path: /spec/template/spec/initContainers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-global-manager$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-ui$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: ^longhorn-manager$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
      - op: add
        path: /spec/template/spec/containers/1/resources
        value: {"requests":{"cpu":"10m","memory":"64Mi","ephemeral-storage":"64Mi"},"limits":{"cpu":"1","memory":"2Gi","ephemeral-storage":"2Gi"}}
  - target:
      group: null
      version: v1
      kind: Service
      name: ^longhorn-admission-webhook$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1dangling-service
        value: The chart's webhook Service selects labels that longhorn-manager pods only carry at runtime; no matching pod exists in the offline render.
  - target:
      group: apps
      version: v1
      kind: DaemonSet
      name: ^longhorn-manager$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1no-read-only-root-fs
        value: The pinned upstream manager image writes to its root filesystem; overriding it would break runtime file access.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1privileged-container
        value: The longhorn-manager requires the privileged context to manage the distributed storage datapath; the host integration is documented in docs/pod-security.md.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1privilege-escalation-container
        value: The privileged longhorn-manager requires the escalation rights of its privileged context for the storage datapath; the host integration is documented in docs/pod-security.md.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1run-as-non-root
        value: The upstream manager image keeps the chart's preserved root context for host datapath management.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-ui$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1no-read-only-root-fs
        value: The pinned upstream UI image writes to its root filesystem; overriding it would break runtime file access.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-driver-deployer$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1no-read-only-root-fs
        value: The pinned upstream driver-deployer image writes to its root filesystem; overriding it would break runtime file access.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1run-as-non-root
        value: The upstream driver-deployer image keeps the chart's preserved root context for CSI driver deployment.
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: ^longhorn-global-manager$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1no-read-only-root-fs
        value: The pinned upstream manager image writes to its root filesystem; overriding it would break runtime file access.
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1run-as-non-root
        value: The upstream manager image keeps the chart's preserved root context for the global manager's controllers.
  - target:
      group: null
      version: v1
      kind: Service
      name: ^longhorn-recovery-backend$
      namespace: ^longhorn-system$
    patch: |-
      - op: add
        path: /metadata/annotations/ignore-check.kube-linter.io~1dangling-service
        value: The chart's recovery backend Service selects labels that longhorn-manager pods only carry at runtime; no matching pod exists in the offline render.
