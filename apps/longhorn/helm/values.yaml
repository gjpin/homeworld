namespaceOverride: longhorn-system # mandatory namespace for this helm chart
persistence:
  defaultClass: false
  defaultClassReplicaCount: 1
  # The chart-generated `longhorn` StorageClass has no SELinux mountOptions
  # (the chart exposes no mountOptions knob), so its creation is disabled;
  # `longhorn-crypto` (helm/storage_class.yaml) is the only StorageClass this
  # repo provisions and every PVC references it explicitly.
  createStorageClass: false
defaultSettings:
  upgradeChecker: false
  systemManagedComponentsNodeSelector: "node-role.kubernetes.io/homelab:homelab"
  defaultReplicaCount: 1
  concurrentAutomaticEngineUpgradePerNodeLimit: 2
networkPolicies:
  enabled: false
metrics:
  serviceMonitor:
    enabled: true
    interval: 60s
global:
  nodeSelector:
    node-role.kubernetes.io/homelab: homelab
