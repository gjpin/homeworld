namespaceOverride: longhorn-system # mandatory namespace for this helm chart
persistence:
  defaultClass: false
  # Inert while createStorageClass: false (the chart's own class is never
  # created); the classes' replica counts are set in helm/storage_class.yaml.
  defaultClassReplicaCount: 3
  # The chart-generated `longhorn` StorageClass is unencrypted, so its
  # creation is disabled; `longhorn-crypto` and `longhorn-scratch`
  # (helm/storage_class.yaml) are the only StorageClasses this repo
  # provisions and every PVC references one explicitly.
  createStorageClass: false
defaultSettings:
  upgradeChecker: false
  # Anonymous usage-metrics reporting to longhorn.io is on upstream by
  # default; disabled per the AGENTS.md telemetry rule (the namespace's
  # egress policy would block it anyway).
  allowCollectingLonghornUsageMetrics: false
  # One replica per node: every volume survives the loss (or the kured
  # reboot) of any node.
  defaultReplicaCount: 3
  concurrentAutomaticEngineUpgradePerNodeLimit: 2
  # The root logical volume (grown to the whole disk by host/bootstrap.sh),
  # on a node with no data disks chosen by host/disks.sh.
  defaultDataPath: /var/lib/longhorn
  # Each node's disks come from its node.longhorn.io/default-disks-config
  # annotation (host/apply.sh): the chosen data disks, or the root volume with
  # a storageReserved that keeps room for the OS, container images and, on the
  # agents VM host, the VM's disks (host/nodes/<profile>.env).
  createDefaultDiskLabeledNodes: true
  storageOverProvisioningPercentage: 150
# Helm hook Jobs rendered through kustomize land in the Argo sync path as
# plain Jobs, where hook annotations are inert and the immutable Job spec
# breaks every chart bump (the completed Jobs from the first sync reject
# the new image tag). The pre-upgrade checker is therefore disabled — its
# online version check is the manager phone-home this repo already refuses
# via defaultSettings.upgradeChecker, and Renovate's sequential-minor rule
# plus automatic engine upgrades cover its compatibility purpose. The
# post-upgrade cleanup is kept, but converted into an Argo CD PostSync
# hook in kustomization.yaml so it actually runs in the GitOps flow; the
# uninstall Job (longhorn-manager uninstall --force) is patch-deleted —
# it must never run from a sync.
preUpgradeChecker:
  jobEnabled: false
  upgradeVersionCheck: false
networkPolicies:
  enabled: false
metrics:
  serviceMonitor:
    enabled: true
    interval: 60s
