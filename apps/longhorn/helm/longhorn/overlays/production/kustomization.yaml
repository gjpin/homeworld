apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base
commonAnnotations:
  security.homeworld/profile: production
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^longhorn-driver-deployer$
    namespace: ^longhorn-system$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources
      value: {"requests":{"cpu":"100m","memory":"128Mi","ephemeral-storage":"128Mi"},"limits":{"cpu":"2","memory":"4Gi","ephemeral-storage":"4Gi"}}
    - op: add
      path: /spec/template/spec/initContainers/0/resources
      value: {"requests":{"cpu":"100m","memory":"128Mi","ephemeral-storage":"128Mi"},"limits":{"cpu":"2","memory":"4Gi","ephemeral-storage":"4Gi"}}
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^longhorn-ui$
    namespace: ^longhorn-system$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources
      value: {"requests":{"cpu":"100m","memory":"128Mi","ephemeral-storage":"128Mi"},"limits":{"cpu":"2","memory":"4Gi","ephemeral-storage":"4Gi"}}
- target:
    group: apps
    version: v1
    kind: DaemonSet
    name: ^longhorn-manager$
    namespace: ^longhorn-system$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources
      value: {"requests":{"cpu":"100m","memory":"128Mi","ephemeral-storage":"128Mi"},"limits":{"cpu":"2","memory":"4Gi","ephemeral-storage":"4Gi"}}
    - op: add
      path: /spec/template/spec/containers/1/resources
      value: {"requests":{"cpu":"100m","memory":"128Mi","ephemeral-storage":"128Mi"},"limits":{"cpu":"2","memory":"4Gi","ephemeral-storage":"4Gi"}}
- target:
    group: batch
    version: v1
    kind: Job
    name: ^longhorn-post-upgrade$
    namespace: ^longhorn-system$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources
      value: {"requests":{"cpu":"100m","memory":"128Mi","ephemeral-storage":"128Mi"},"limits":{"cpu":"2","memory":"4Gi","ephemeral-storage":"4Gi"}}
- target:
    group: batch
    version: v1
    kind: Job
    name: ^longhorn-pre-upgrade$
    namespace: ^longhorn-system$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources
      value: {"requests":{"cpu":"100m","memory":"128Mi","ephemeral-storage":"128Mi"},"limits":{"cpu":"2","memory":"4Gi","ephemeral-storage":"4Gi"}}
- target:
    group: batch
    version: v1
    kind: Job
    name: ^longhorn-uninstall$
    namespace: ^longhorn-system$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources
      value: {"requests":{"cpu":"100m","memory":"128Mi","ephemeral-storage":"128Mi"},"limits":{"cpu":"2","memory":"4Gi","ephemeral-storage":"4Gi"}}
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^longhorn-driver-deployer$
    namespace: ^longhorn-system$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Always
    - op: add
      path: /spec/template/spec/initContainers/0/imagePullPolicy
      value: Always
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^longhorn-ui$
    namespace: ^longhorn-system$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Always
- target:
    group: apps
    version: v1
    kind: DaemonSet
    name: ^longhorn-manager$
    namespace: ^longhorn-system$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Always
    - op: add
      path: /spec/template/spec/containers/1/imagePullPolicy
      value: Always
- target:
    group: batch
    version: v1
    kind: Job
    name: ^longhorn-post-upgrade$
    namespace: ^longhorn-system$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Always
- target:
    group: batch
    version: v1
    kind: Job
    name: ^longhorn-pre-upgrade$
    namespace: ^longhorn-system$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Always
- target:
    group: batch
    version: v1
    kind: Job
    name: ^longhorn-uninstall$
    namespace: ^longhorn-system$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: Always
- target:
    group: 
    version: v1
    kind: Service
    name: ^longhorn-admission-webhook$
    namespace: ^longhorn-system$
  patch: |-
    - op: add
      path: /metadata/annotations/kube-score~1ignore
      value: service-targets-pod
    - op: add
      path: /metadata/annotations/security.homeworld~1exception-reason
      value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
- target:
    group: batch
    version: v1
    kind: Job
    name: ^longhorn-post-upgrade$
    namespace: ^longhorn-system$
  patch: |-
    - op: add
      path: /metadata/annotations/kube-score~1ignore
      value: container-security-context-user-group-id,container-security-context-readonlyrootfilesystem,pod-networkpolicy
    - op: add
      path: /metadata/annotations/security.homeworld~1exception-reason
      value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
- target:
    group: apps
    version: v1
    kind: DaemonSet
    name: ^longhorn-manager$
    namespace: ^longhorn-system$
  patch: |-
    - op: add
      path: /metadata/annotations/kube-score~1ignore
      value: container-security-context-privileged,pod-probes,pod-networkpolicy,container-security-context-user-group-id,container-security-context-readonlyrootfilesystem
    - op: add
      path: /metadata/annotations/security.homeworld~1exception-reason
      value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
- target:
    group: batch
    version: v1
    kind: Job
    name: ^longhorn-pre-upgrade$
    namespace: ^longhorn-system$
  patch: |-
    - op: add
      path: /metadata/annotations/kube-score~1ignore
      value: pod-networkpolicy,container-security-context-user-group-id,container-security-context-readonlyrootfilesystem,container-security-context-privileged
    - op: add
      path: /metadata/annotations/security.homeworld~1exception-reason
      value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^longhorn-ui$
    namespace: ^longhorn-system$
  patch: |-
    - op: add
      path: /metadata/annotations/kube-score~1ignore
      value: container-security-context-readonlyrootfilesystem,pod-probes,pod-networkpolicy,container-security-context-user-group-id,deployment-has-poddisruptionbudget
    - op: add
      path: /metadata/annotations/security.homeworld~1exception-reason
      value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^longhorn-driver-deployer$
    namespace: ^longhorn-system$
  patch: |-
    - op: add
      path: /metadata/annotations/kube-score~1ignore
      value: pod-networkpolicy,container-security-context-user-group-id,container-security-context-readonlyrootfilesystem
    - op: add
      path: /metadata/annotations/security.homeworld~1exception-reason
      value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
- target:
    group: batch
    version: v1
    kind: Job
    name: ^longhorn-uninstall$
    namespace: ^longhorn-system$
  patch: |-
    - op: add
      path: /metadata/annotations/kube-score~1ignore
      value: container-security-context-readonlyrootfilesystem,pod-networkpolicy,container-security-context-user-group-id
    - op: add
      path: /metadata/annotations/security.homeworld~1exception-reason
      value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
- target:
    group: 
    version: v1
    kind: Service
    name: ^longhorn-recovery-backend$
    namespace: ^longhorn-system$
  patch: |-
    - op: add
      path: /metadata/annotations/kube-score~1ignore
      value: service-targets-pod
    - op: add
      path: /metadata/annotations/security.homeworld~1exception-reason
      value: Upstream UID, filesystem, probe, availability, and Cilium policy constraints are accepted for this exact resource.
