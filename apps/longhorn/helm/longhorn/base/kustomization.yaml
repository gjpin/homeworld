apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
- name: longhorn
  repo: https://charts.longhorn.io
  version: 1.11.1
  releaseName: longhorn
  namespace: longhorn-system
  includeCRDs: true
  skipTests: true
  valuesFile: values.yaml
resources:
- storage_class.yaml
# Longhorn 1.11.1 does not expose hostUsers; opt in only non-node-integrated pods.
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^(longhorn-driver-deployer|longhorn-ui)$
    namespace: ^longhorn-system$
  patch: |-
    - op: add
      path: /spec/template/spec/hostUsers
      value: false
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^longhorn-driver-deployer$
    namespace: ^longhorn-system$
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
    - op: add
      path: /spec/template/spec/initContainers/0/imagePullPolicy
      value: IfNotPresent
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^longhorn-ui$
    namespace: ^longhorn-system$
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
- target:
    group: apps
    version: v1
    kind: DaemonSet
    name: ^longhorn-manager$
    namespace: ^longhorn-system$
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
    - op: replace
      path: /spec/template/spec/containers/1/imagePullPolicy
      value: IfNotPresent
- target:
    group: batch
    version: v1
    kind: Job
    name: ^longhorn-post-upgrade$
    namespace: ^longhorn-system$
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
- target:
    group: batch
    version: v1
    kind: Job
    name: ^longhorn-pre-upgrade$
    namespace: ^longhorn-system$
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
- target:
    group: batch
    version: v1
    kind: Job
    name: ^longhorn-uninstall$
    namespace: ^longhorn-system$
  patch: |-
    - op: replace
      path: /spec/template/spec/containers/0/imagePullPolicy
      value: IfNotPresent
- target:
    group: batch
    version: v1
    kind: Job
    name: ^(longhorn-post-upgrade|longhorn-uninstall)$
    namespace: ^longhorn-system$
  patch: |-
    - op: add
      path: /spec/template/spec/hostUsers
      value: false
