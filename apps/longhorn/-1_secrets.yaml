# https://longhorn.io/docs/1.12.1/advanced-resources/security/volume-encryption/
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: longhorn-crypto
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: longhorn-crypto
    template:
      type: Opaque
      data:
        CRYPTO_KEY_PROVIDER: "secret"
        CRYPTO_KEY_CIPHER: "aes-xts-plain64"
        CRYPTO_KEY_HASH: "sha256"
        CRYPTO_KEY_SIZE: "512"
        CRYPTO_PBKDF: "argon2i"
        # A templated Secret holds only the templated keys.
        CRYPTO_KEY_VALUE: "{{ .CRYPTO_KEY_VALUE }}"
  data:
    - secretKey: CRYPTO_KEY_VALUE
      remoteRef:
        key: /longhorn/CRYPTO_KEY_VALUE
        decodingStrategy: None
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: envoy-oidc-client-secret
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: Periodic
  refreshInterval: 1h0m0s
  secretStoreRef:
    name: infisical
    kind: ClusterSecretStore
  target:
    name: envoy-oidc-client-secret
  data:
    # Client secret for the shared Authelia "envoy" OIDC client; consumed by
    # the HTTPRoute-scoped SecurityPolicy (docs/oidc.md). Envoy Gateway
    # requires the "client-secret" key.
    - secretKey: client-secret
      remoteRef:
        key: /authelia/OIDC_CLIENT_SECRET_ENVOY
        decodingStrategy: None
