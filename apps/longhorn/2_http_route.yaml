---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  parentRefs:
    - name: envoy
      namespace: envoy-gateway
      group: gateway.networking.k8s.io
      kind: Gateway
  hostnames:
    - "longhorn.base-domain.invalid"
  rules:
    - backendRefs:
      - name: longhorn-frontend
        namespace: longhorn-system
        kind: Service
        port: 80
        group: ""
        weight: 1
