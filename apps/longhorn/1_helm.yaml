# https://artifacthub.io/packages/helm/longhorn/longhorn
# https://longhorn.io/docs/1.12.1/snapshots-and-backups/backup-and-restore/set-backup-target/
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
    - ServerSideApply=true
  source:
    repoURL: https://github.com/gjpin/homeworld.git
    path: apps/longhorn/helm
    targetRevision: HEAD
