# https://gateway.envoyproxy.io/docs/tasks/security/oidc/#connect-to-an-oidc-provider-with-self-signed-certificate
#
# Envoy's OIDC filter calls Authelia's token endpoint on
# auth.homeworld.internal, which resolves to the Gateway VIP and hairpins
# through the merged listener. Its certificate is signed by the private
# homeworld CA, so the authelia-oidc SecurityPolicies in this namespace
# reach Authelia through this Backend, and the BackendTLSPolicy validates
# the certificate against the homeworld-ca ConfigMap that trust-manager
# publishes in every namespace (apps/trust-manager/2_bundle.yaml).
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: authelia
  namespace: longhorn
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  endpoints:
    - fqdn:
        hostname: auth.homeworld.internal
        port: 443
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: authelia
  namespace: longhorn
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  targetRefs:
    - group: gateway.envoyproxy.io
      kind: Backend
      name: authelia
  validation:
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: homeworld-ca
    hostname: auth.homeworld.internal
