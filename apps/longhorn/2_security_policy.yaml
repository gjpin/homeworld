---
# Gateway OIDC for the Longhorn UI. Authelia is the only login: the UI has
# no built-in authentication, and the route requires the platform group
# (docs/oidc.md).
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authelia-oidc
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: longhorn
  oidc:
    provider:
      issuer: https://auth.base-domain.invalid
      authorizationEndpoint: https://auth.base-domain.invalid/api/oidc/authorization
      tokenEndpoint: https://auth.base-domain.invalid/api/oidc/token
    clientID: envoy
    clientSecret:
      name: envoy-oidc-client-secret
    scopes:
      - openid
      - offline_access
    redirectURL: https://longhorn.base-domain.invalid/oauth2/callback
    logoutPath: /logout
    cookieDomain: longhorn.base-domain.invalid
    forwardAccessToken: false
    refreshToken: true
    passThroughAuthHeader: false
