---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-dns
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  # Managers, instance managers, CSI plugins and share managers talk to each
  # other on many ports, including the engine and replica processes' dynamic
  # range. The namespace holds only Longhorn.
  name: allow-longhorn-internal
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector: {}
  ingress:
    - fromEndpoints:
        - {}
  egress:
    - toEndpoints:
        - {}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-longhorn-kubernetes-api
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # Every pod: the CSI sidecars and operator-created pods carry no instance label.
  endpointSelector: {}
  egress:
    - toEntities:
        - kube-apiserver
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-longhorn-manager-backend
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app: longhorn-manager
      k8s:app.kubernetes.io/instance: longhorn
  egress:
    - toServices:
        - k8sService:
            serviceName: longhorn-backend
            namespace: longhorn-system
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
    - toServices:
        - k8sService:
            serviceName: longhorn-recovery-backend
            namespace: longhorn-system
      toPorts:
        - ports:
            - port: "9503"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-longhorn-ui-backend
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app: longhorn-ui
      k8s:app.kubernetes.io/instance: longhorn
  egress:
    - toServices:
        - k8sService:
            serviceName: longhorn-backend
            namespace: longhorn-system
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-longhorn-admission-webhook
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app: longhorn-manager
      k8s:app.kubernetes.io/instance: longhorn
  ingress:
    - fromEntities:
        - kube-apiserver
        - remote-node
      toPorts:
        - ports:
            - port: "9502"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-longhorn-manager-ingress
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app: longhorn-manager
      k8s:app.kubernetes.io/instance: longhorn
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: longhorn-system
            k8s:app: longhorn-ui
            k8s:app.kubernetes.io/instance: longhorn
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: longhorn-system
            k8s:app: longhorn-manager
            k8s:app.kubernetes.io/instance: longhorn
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
            - port: "9503"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: longhorn-system
            k8s:app: longhorn-driver-deployer
            k8s:app.kubernetes.io/instance: longhorn
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-longhorn-driver-deployer-backend
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app: longhorn-driver-deployer
      k8s:app.kubernetes.io/instance: longhorn
  egress:
    - toServices:
        - k8sService:
            serviceName: longhorn-backend
            namespace: longhorn-system
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-longhorn-gateway
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  endpointSelector:
    matchLabels:
      k8s:app: longhorn-ui
      k8s:app.kubernetes.io/instance: longhorn
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: envoy-gateway
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gatewayclass: envoy-merged
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-longhorn-manager-host-services
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # Longhorn's node-integrated manager is the only workload that needs these
  # rendered host-facing ports; hostPath use does not grant arbitrary egress.
  endpointSelector:
    matchLabels:
      k8s:app: longhorn-manager
      k8s:app.kubernetes.io/instance: longhorn
  egress:
    - toEntities:
        - host
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
            - port: "9502"
              protocol: TCP
            - port: "9503"
              protocol: TCP
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-longhorn-manager-metrics-ingress
  namespace: longhorn-system
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  # The chart's ServiceMonitor scrapes the manager metrics port; the
  # manager pods are node-integrated but not host-networked, so the
  # scrape passes through Cilium policy.
  endpointSelector:
    matchLabels:
      k8s:app: longhorn-manager
      k8s:app.kubernetes.io/instance: longhorn
  ingress:
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: otel-collector
            k8s:app.kubernetes.io/managed-by: opentelemetry-operator
            k8s:app.kubernetes.io/instance: otel-collector.otel-collector-pod
            k8s:app.kubernetes.io/component: opentelemetry-collector
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
