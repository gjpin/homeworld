# https://github.com/InseeFrLab/s3-operator/releases
# https://github.com/InseeFrLab/s3-operator
# https://github.com/InseeFrLab/helm-charts/tree/master/charts/s3-operator
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: s3-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: s3-operator
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
    - Validate=true
    - CreateNamespace=true
    - PrunePropagationPolicy=foreground
    - PruneLast=true
  source:
    chart: s3-operator
    repoURL: https://inseefrlab.github.io/s3-operator
    targetRevision: 0.9.0
    helm:
      releaseName: s3-operator
      valuesObject:
---