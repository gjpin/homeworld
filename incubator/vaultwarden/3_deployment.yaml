apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: vaultwarden
  name: vaultwarden
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: vaultwarden
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: vaultwarden
    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: config-env
          image: docker.io/vaultwarden/server:1.34.3
          name: vaultwarden
          volumeMounts:
            - mountPath: /data
              name: vaultwarden-claim0
      restartPolicy: Always
      volumes:
        - name: vaultwarden-claim0
          persistentVolumeClaim:
            claimName: vaultwarden-claim0
