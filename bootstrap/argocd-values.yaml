# Bootstrap-only Argo CD install (host/bootstrap.sh, docs/k3s.md). The chart
# and version come from apps/argocd/helm/kustomization.yaml. On its first sync the
# wave-0 argocd-app Application adopts this release with apps/argocd/helm:
# Redis moves to the in-namespace Dragonfly instance, the ServiceMonitors
# (whose CRDs arrive with prometheus-operator-crd) are enabled, and gVisor,
# OIDC, and RBAC are applied. Never helm upgrade the release afterwards.
# bootstrap.sh merges the homeworld Config Management Plugin (configs.cmp
# and the repo-server sidecar) from apps/argocd/helm/values.yaml into these
# values: every Application renders through it (docs/argocd.md).
fullnameOverride: argocd
namespaceOverride: argocd
crds:
  install: true
  keep: true
configs:
  cm:
    # Every child Application inflates Helm charts through Kustomize.
    kustomize.buildOptions: --enable-helm
  params:
    server.insecure: true
dex:
  enabled: false
