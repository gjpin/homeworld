version: "3.8"

services:
  backend:
    container_name: e2e-infisical-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    image: docker.io/infisical/infisical:v0.167.2
    env_file: .env.e2e
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
    networks:
      - infisical

  redis:
    image: docker.io/library/redis:8.10.3-alpine
    container_name: e2e-infisical-redis
    env_file: .env.e2e
    restart: unless-stopped
    environment:
      - ALLOW_EMPTY_PASSWORD=yes
    networks:
      - infisical
    volumes:
      - redis_data:/data

  db:
    container_name: e2e-infisical-db
    image: docker.io/library/postgres:18.6-alpine
    restart: unless-stopped
    env_file: .env.e2e
    volumes:
      - pg_data:/var/lib/postgresql
    networks:
      - infisical
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$${POSTGRES_USER} && psql --username=$${POSTGRES_USER} --list"]
      interval: 5s
      timeout: 10s
      retries: 10

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local

networks:
  infisical:
