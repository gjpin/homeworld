# Self-signed stand-ins so Gateway cert-manager.io/cluster-issuer annotations
# keep working without Cloudflare ACME. Keep the tracked issuers' sync wave:
# the issuers reconcile only once the cert-manager controller runs (deployed by
# the wave-1 nested Application in 1_helm.yaml), so Argo's wave-health gate
# must apply them after it — without the annotation they default to wave 0
# and the sync deadlocks waiting for issuer health before the controller
# exists.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  selfSigned: {}
