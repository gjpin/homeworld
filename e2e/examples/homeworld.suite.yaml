apiVersion: e2e.testing.dev/v1alpha1
kind: Suite
metadata:
  name: homeworld
spec:
  # Repository root (suite file lives in e2e/examples/).
  workdir: ../..

  deps:
    dockerCompose:
      - name: infisical
        file: e2e/examples/infisical/docker-compose.yml
        envFile: e2e/examples/infisical/.env.e2e
        projectName: e2e-infisical
        wait:
          - url: http://127.0.0.1:8080/api/status
            timeout: 5m

  cluster:
    name: homeworld-e2e
    kubeVersion: v1.37.0
    kindConfig: |
      kind: Cluster
      apiVersion: kind.x-k8s.io/v1alpha4
      networking:
        # iptables-restore hits sendmsg EMSGSIZE ("Message too long") once
        # this suite's Service count is installed; kube-proxy then leaves
        # stale ClusterIP DNATs after Recreate (Grafana operator ping dies).
        kubeProxyMode: nftables
      # Keep kindnet. Rootless Docker (Lima or Desktop) cannot mount bpffs,
      # so the Cilium datapath cannot start. The 1.20 helm chart does not
      # ship CRDs; apply-cilium-crds (and kind.go) apply them from the Git
      # tag. The same engine cannot idmap overlayfs, so rewrite-staging
      # sets hostUsers: true (production stays hostUsers: false). A second
      # kind node doubles kubelet/containerd inotify usage. Raise
      # fs.inotify.max_user_instances on the Docker VM (Lima) to 1024
      # before covering Grafana/Victoria/Collabora/OpenCloud/
      # Radicale/CrowdSec/Forgejo/Immich.
      nodes:
      - role: control-plane
        kubeadmConfigPatches:
        - |
          kind: ClusterConfiguration
          apiServer:
            certSANs: ["127.0.0.1", "localhost"]
        # Docker Desktop / macOS: pods reach host services via host.docker.internal.
        # On Linux, also add extraHosts mapping to the docker bridge gateway IP
        # (see e2e/README.md "Kind → Infisical reachability").
        extraPortMappings: []
    cilium:
      chartVersion: "1.20.2"
      namespace: kube-system
      values:
        agent: "false"
        operator.enabled: "false"
        envoy.enabled: "false"
        hubble.enabled: "false"
        cni.install: "false"
        crds.install: "true"
      waitTimeout: 5m

  prepare:
    nodeLabels:
      - node-role.kubernetes.io/homelab=homelab
    hooks:
      - name: seed-infisical
        command: ["./e2e/examples/hooks/seed-infisical.sh"]
        timeout: 10m
        env:
          INFISICAL_HOST: http://host.docker.internal:8080
          INFISICAL_HOST_LOCAL: http://127.0.0.1:8080
          INFISICAL_PROJECT_SLUG: homeworld
          INFISICAL_ENVIRONMENT_SLUG: prod
      # CRDs before credentials: apply-eso-credentials also applies the
      # ClusterSecretStore, which needs the ClusterSecretStore CRD to exist.
      - name: apply-eso-crds
        command: ["./e2e/examples/hooks/apply-eso-crds.sh"]
        timeout: 2m
      - name: apply-eso-credentials
        command: ["./e2e/examples/hooks/apply-eso-credentials.sh"]
        timeout: 5m
        env:
          INFISICAL_HOST: http://host.docker.internal:8080
      - name: apply-operator-crds
        command: ["./e2e/examples/hooks/apply-operator-crds.sh"]
        timeout: 5m
      - name: apply-storageclass
        command: ["./e2e/examples/hooks/apply-storageclass.sh"]
        timeout: 1m
      - name: apply-cilium-crds
        command: ["./e2e/examples/hooks/apply-cilium-crds.sh"]
        timeout: 2m
        env:
          CILIUM_VERSION: "1.20.2"
      - name: raise-inotify-limits
        command: ["./e2e/examples/hooks/raise-inotify-limits.sh"]
        timeout: 1m
      - name: apply-envoy-gateway-crds
        command: ["./e2e/examples/hooks/apply-envoy-gateway-crds.sh"]
        timeout: 2m
      - name: clear-terminating-hooks
        command: ["./e2e/examples/hooks/clear-terminating-hooks.sh"]
        timeout: 2m
      - name: stage-local-repo
        command: ["./e2e/examples/hooks/stage-local-repo.sh"]
        timeout: 10m
        env:
          INFISICAL_HOST: http://host.docker.internal:8080
          INFISICAL_HOSTNAME: host.docker.internal
          INFISICAL_PROJECT_SLUG: homeworld
          INFISICAL_ENVIRONMENT_SLUG: prod

  deploy:
    timeout: 120m
    steps:
      - name: bootstrap-argocd
        helm:
          releaseName: argocd
          chart: argo-cd
          repoURL: https://argoproj.github.io/argo-helm
          # Matches the pinned chart in apps/argocd/helm/kustomization.yaml;
          # Renovate bumps this together with the app pin.
          version: "10.9.2"
          namespace: argocd
          createNamespace: true
          wait: true
          timeout: 10m
          skipIfPresent: true
          valuesFiles:
            - e2e/examples/argocd-bootstrap-values.yaml
      - name: apply-root
        apply:
          paths: ["e2e/examples/.generated/app-of-apps.yaml"]
      - name: refresh-argo
        hook:
          name: refresh-argo
          command: ["./e2e/examples/hooks/refresh-argo.sh"]
          timeout: 5m
      - name: copy-gateway-ca
        hook:
          name: copy-gateway-ca
          command: ["./e2e/examples/hooks/copy-gateway-ca.sh"]
          timeout: 21m
      - name: patch-coredns
        hook:
          name: patch-coredns-e2e-domain
          command: ["./e2e/examples/hooks/patch-coredns-e2e-domain.sh"]
          timeout: 16m
          env:
            BASE_DOMAIN: e2e.local

      - name: wait-argo
        wait:
          group: argoproj.io
          version: v1alpha1
          resource: applications
          namespace: argocd
          selector: "app.kubernetes.io/part-of=homeworld"
          fields:
            - path: status.sync.status
              value: Synced
            - path: status.health.status
              value: Healthy
          timeout: 90m
          interval: 15s
          # Rescue for apps that burned Argo's five sync retries on a
          # first-boot transient (after a failed sync, self-heal never
          # re-fires): re-trigger the sync on stuck OutOfSync apps.
          resyncInterval: 3m
      # The rustfs-operator records provisioning failures (a transient
      # request to the still-booting server) as status conditions and never
      # requeues its own reconcile, so the Tenant can wedge on first boot.
      # Nudge it once convergence is otherwise complete.
      - name: kick-rustfs-tenant
        hook:
          name: kick-rustfs-tenant
          command: ["./e2e/examples/hooks/kick-rustfs-tenant.sh"]
          timeout: 3m


  assert:
    timeout: 20m
    checks:
      - name: pods
        podsReady:
          excludeNamespaces:
            - kube-system
            # Still-omitted apps (Longhorn/Velero/HA/external-dns/openchamber)
            # can linger Terminating on --keep-cluster. The otel collectors
            # are deployed but excluded here: hostPath/kubelet integration on
            # kind can flap independently of the victoria data probes below,
            # which assert the collectors actually export metrics and logs.
            - longhorn-system
            - velero
            - homeassistant
            - external-dns
            - otel-collector
            - otel-collector-node
            - openchamber
            - qbittorrent
          ignoreCompletedJobs: true
      - name: workloads
        workloadsReady:
          kinds: ["Deployment", "StatefulSet", "DaemonSet"]
          namespaces:
            - argocd
            - external-secrets
            - cert-manager
            - envoy-gateway
            - cloudnative-pg
            - dragonfly-operator
            - rustfs-operator
            - rustfs
            - authelia
            - grafana-operator
            - grafana
            - victoria-metrics
            - collabora
            - opencloud
            - radicale
            - crowdsec
            - forgejo
            - immich
            - documentdb-operator
            - notesnook
            - woodpecker
            - vaultwarden
            - homepage
            - opentelemetry-operator
            # metrics-server and the kubelet-serving-cert approver run in
            # their own dedicated namespaces (apps/app-of-apps.yaml
            # destinations), not kube-system.
            - metrics-server
            - kubelet-serving-cert-approver
            # kube-system hosts the generic-device-plugin alongside kind's
            # own infra (kube-proxy/coredns/kindnet), all workload-backed.
            - kube-system
      - name: eso-store
        resourceCondition:
          apiVersion: external-secrets.io/v1
          kind: ClusterSecretStore
          name: infisical
          condition: Ready
          status: "True"
          timeout: 10m
      - name: external-secrets
        resourceCondition:
          apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          condition: Ready
          status: "True"
          timeout: 10m
      - name: cnpg-authelia
        resourceCondition:
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          name: authelia
          namespace: authelia
          condition: Ready
          status: "True"
          timeout: 10m
      - name: dragonfly-authelia
        resourceCondition:
          apiVersion: dragonflydb.io/v1alpha1
          kind: Dragonfly
          name: dragonfly
          namespace: authelia
          fields:
            - path: status.phase
              value: Ready
          timeout: 10m
      - name: cnpg-immich
        resourceCondition:
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          name: immich
          namespace: immich
          condition: Ready
          status: "True"
          timeout: 10m
      - name: dragonfly-immich
        resourceCondition:
          apiVersion: dragonflydb.io/v1alpha1
          kind: Dragonfly
          name: dragonfly
          namespace: immich
          fields:
            - path: status.phase
              value: Ready
          timeout: 10m
      - name: cnpg-forgejo
        resourceCondition:
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          name: forgejo
          namespace: forgejo
          condition: Ready
          status: "True"
          timeout: 10m
      - name: cnpg-crowdsec
        resourceCondition:
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          name: crowdsec
          namespace: crowdsec
          condition: Ready
          status: "True"
          timeout: 10m
      - name: cnpg-woodpecker
        resourceCondition:
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          name: woodpecker
          namespace: woodpecker
          condition: Ready
          status: "True"
          timeout: 10m
      - name: cnpg-vaultwarden
        resourceCondition:
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          name: vaultwarden
          namespace: vaultwarden
          condition: Ready
          status: "True"
          timeout: 10m
      - name: documentdb-notesnook
        resourceCondition:
          apiVersion: postgresql.cnpg.io/v1
          kind: Cluster
          name: notesnook
          namespace: notesnook
          condition: Ready
          status: "True"
          timeout: 10m
      # The DocumentDB CR itself must be ready (the operator layers the
      # documentdb-gateway sidecar on the CNPG cluster asserted above). The
      # operator reports readiness through status.status ("Cluster in healthy
      # state") and status.tls.ready — it publishes no metav1 conditions,
      # so assert on those fields instead of a Ready condition.
      - name: documentdb-notesnook-cr
        resourceCondition:
          apiVersion: documentdb.io/preview
          kind: DocumentDB
          name: notesnook
          namespace: notesnook
          fields:
            - path: status.status
              value: Cluster in healthy state
            - path: status.tls.ready
              value: "true"
          timeout: 10m
      # The shared RustFS Tenant store must be reconciled and serving.
      - name: rustfs-tenant
        resourceCondition:
          apiVersion: rustfs.com/v1alpha1
          kind: Tenant
          name: rustfs
          namespace: rustfs
          condition: Ready
          status: "True"
          timeout: 10m
      - name: gateway-envoy
        gatewayReady:
          name: envoy
          namespace: envoy-gateway
          timeout: 10m
      # Application HTTP health: each probe drives the real ClusterIP
      # service + port from the component's HTTPRoute backend.
      - name: forgejo-health
        serviceProbe:
          namespace: forgejo
          service: forgejo-http
          port: 3000
          path: "/api/healthz"
          bodyContains: pass
          timeout: 10m
      - name: immich-health
        serviceProbe:
          namespace: immich
          service: immich-server
          port: 80
          path: "/api/server/ping"
          bodyContains: pong
          timeout: 10m
      - name: authelia-health
        serviceProbe:
          namespace: authelia
          service: authelia
          port: 80
          path: "/api/health"
          timeout: 10m
      - name: vaultwarden-health
        serviceProbe:
          namespace: vaultwarden
          service: vaultwarden
          port: 8080
          path: "/alive"
          timeout: 10m
      # Collabora's WOPI discovery endpoint must serve its XML.
      - name: collabora-wopi-discovery
        serviceProbe:
          namespace: collabora
          service: collabora
          port: 9980
          path: "/hosting/discovery"
          bodyContains: wopi-discovery
          timeout: 10m
      - name: opencloud-status
        serviceProbe:
          namespace: opencloud
          service: opencloud
          port: 9200
          path: "/status.php"
          bodyContains: '"installed": true'
          timeout: 10m
      - name: woodpecker-health
        serviceProbe:
          namespace: woodpecker
          service: woodpecker-server
          port: 80
          path: "/healthz"
          timeout: 10m
      - name: homepage-health
        serviceProbe:
          namespace: homepage
          service: homepage
          port: 3000
          path: "/api/healthcheck"
          host: homepage.e2e.local
          timeout: 10m
      # The notesnook-sync service's own health endpoint.
      - name: notesnook-sync-health
        serviceProbe:
          namespace: notesnook
          service: notesnook-sync
          port: 5264
          path: "/health"
          timeout: 10m
      # The Authelia OIDC discovery document must be served and name its
      # issuer; every browser OIDC flow starts here.
      - name: authelia-oidc-discovery
        serviceProbe:
          namespace: authelia
          service: authelia
          port: 80
          path: "/.well-known/openid-configuration"
          host: auth.e2e.local
          headers:
            X-Forwarded-Proto: https
          bodyContains: '"issuer"'
          timeout: 10m
      # The shared RustFS Tenant must serve its S3 readiness endpoint
      # (docs.rustfs.com: /health/ready returns 200 only when storage, IAM,
      # and peers are ready).
      - name: rustfs-s3-ready
        serviceProbe:
          namespace: rustfs
          service: rustfs-io
          port: 9000
          path: "/health/ready"
          timeout: 10m
      # VictoriaMetrics must actually hold OTel-exported series, not just run.
      # The name is the collector's raw exposition name (verified live): the
      # OTel telemetry renders its counters without the Prometheus _total
      # suffix, and VictoriaMetrics stores the OTLP-exported samples
      # verbatim once -opentelemetry.usePrometheusNaming is off — that flag
      # renames the series (appends _total) to names nothing queries.
      - name: victoria-metrics-data
        serviceProbe:
          namespace: victoria-metrics
          service: victoria-metrics
          port: 8428
          path: "/api/v1/query?query=otelcol_process_uptime"
          bodyContains: '"result":[{'
          timeout: 10m
      # VictoriaLogs must actually hold OTel-exported log lines, not just run.
      - name: victoria-logs-data
        serviceProbe:
          namespace: victoria-metrics
          service: victoria-logs
          port: 9428
          path: "/select/logsql/query?query=*&limit=1"
          bodyContains: "_time"
          timeout: 10m
      # VictoriaTraces Jaeger query API must answer.
      - name: victoria-traces-api
        serviceProbe:
          namespace: victoria-metrics
          service: victoria-traces
          port: 10428
          path: "/select/jaeger/api/services"
          timeout: 10m
      # Grafana must serve its provisioned VictoriaMetrics datasource end to end.
      - name: grafana-victoria-metrics
        serviceProbe:
          namespace: grafana
          service: grafana-service
          port: 3000
          path: "/api/datasources/proxy/uid/victoriametrics/api/v1/query?query=otelcol_process_uptime"
          username: admin
          password: e2e-grafana
          bodyContains: '"result":[{'
          timeout: 10m
      # Grafana must serve its provisioned VictoriaLogs datasource end to end.
      - name: grafana-victorialogs
        serviceProbe:
          namespace: grafana
          service: grafana-service
          port: 3000
          path: "/api/datasources/proxy/uid/victorialogs/select/logsql/query?query=*&limit=1"
          username: admin
          password: e2e-grafana
          bodyContains: "_time"
          timeout: 10m
