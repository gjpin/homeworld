apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: crowdsec
  namespace: argocd
spec:
  source:
    repoURL: https://github.com/gjpin/homeworld.git
    path: apps/crowdsec/helm/crowdsec/overlays/homelab
    targetRevision: HEAD
  destination:
    server: https://kubernetes.default.svc
    namespace: crowdsec
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
