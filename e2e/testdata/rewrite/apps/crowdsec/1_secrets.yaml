---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-credentials
  namespace: crowdsec
spec:
  target:
    name: postgres-credentials
    template:
      type: kubernetes.io/basic-auth
      data:
        username: crowdsec
  data:
    - secretKey: password
      remoteRef:
        key: /crowdsec/DB_PASSWORD
        decodingStrategy: Auto
