apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
patches:
  - target:
      group: apps
      version: v1
      kind: StatefulSet
    patch: |-
      - op: add
        path: /spec/template/spec/hostUsers
        value: false
      - op: add
        path: /spec/template/spec/runtimeClassName
        value: gvisor
