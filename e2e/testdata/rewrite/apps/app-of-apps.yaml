---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: forgejo-app
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: homeworld
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  source:
    repoURL: https://github.com/gjpin/homeworld.git
    path: "apps/forgejo"
    targetRevision: HEAD
  syncPolicy:
    syncOptions:
    - Validate=true
    - CreateNamespace=true
