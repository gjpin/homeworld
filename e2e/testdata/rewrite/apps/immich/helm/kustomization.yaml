apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
patches:
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^immich-machine-learning$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources
      value: {"requests":{"cpu":"10m","memory":"64Mi"},"limits":{"cpu":"1","memory":"2Gi"}}
- target:
    group: apps
    version: v1
    kind: Deployment
    name: ^immich-server$
  patch: |-
    - op: add
      path: /spec/template/spec/containers/0/resources
      value: {"requests":{"cpu":"10m","memory":"64Mi"},"limits":{"cpu":"1","memory":"2Gi"}}
