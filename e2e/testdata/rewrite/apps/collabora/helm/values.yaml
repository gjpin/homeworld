fullnameOverride: collabora
image:
  repository: docker.io/collabora/code
  tag: 26.04.4.2.1
  pullPolicy: IfNotPresent
replicaCount: 1
# Keep one replica until WOPISrc-based routing is added for document affinity.
autoscaling:
  enabled: false
resources:
  requests:
    # coolwsd forks a kit process per open document; 10m starves the office
    # engine at startup and slows first render. 100m keeps the idle cost
    # negligible (single idle coolwsd) while letting the scheduler place it sanely.
    cpu: 100m
    memory: 64Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: "1"
    memory: 2Gi
    ephemeral-storage: 2Gi
collabora:
  aliasgroups:
    # Upstream chart examples write the WOPI allow-list host as
    # "<protocol>://<host-name>:<port>"; the explicit :443 matches the
    # rendered coolwsd allowlist entries to the HTTPS origin OpenCloud
    # uses for WOPI callbacks.
    - host: https://cloud.homeworld.internal:443
  server_name: office.homeworld.internal:443
  extra_params: >-
    --o:ssl.enable=false
    --o:ssl.termination=true
    --o:welcome.enable=false
    --o:net.frame_ancestors=https://cloud.homeworld.internal
    --o:logging.level=warning
  existingSecret:
    enabled: true
    secretName: collabora-admin
    usernameKey: username
    passwordKey: password
  proofKeysSecretRef: collabora-proof
  proofKeyGeneration:
    enabled: false
prometheus:
  servicemonitor:
    enabled: true
# The public route is hand-written in ../2_http_route.yaml (standard wave-2
# HTTPRoute file); the chart's own route generation is disabled.
route:
  enabled: false
podLabels:
  app: collabora
podSecurityContext:
  # Hardened over the chart's deliberately-empty defaults (podSecurityContext
  # and securityContext both ship as {}): UID/GID 1000, RuntimeDefault seccomp,
  # drop ALL, no privilege escalation, plus gvisor/hostUsers via the
  # kustomization patches. coolwsd runs its own internal forkit sandboxing, so
  # smoke-test document editing live after deploy; if kit-namespace failures
  # occur, scope a documented exception instead of weakening the namespace.
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
service:
  port: 9980
deployment:
  containerPort: 9980
  labels:
    app: collabora
  annotations:
    ignore-check.kube-linter.io/no-read-only-root-fs: The pinned Collabora image requires a writable root filesystem for its rendering and font caches; overriding it would break the documented function.

probes:
  liveness:
    initialDelaySeconds: 30
