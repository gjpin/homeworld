apiVersion: apps/v1
kind: Deployment
metadata:
  name: documentdb-operator
spec:
  template:
    spec:
      containers:
        - name: manager
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
