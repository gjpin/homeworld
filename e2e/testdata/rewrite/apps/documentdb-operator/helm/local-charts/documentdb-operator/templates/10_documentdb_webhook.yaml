apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: documentdb-operator-validating-webhook
webhooks:
  - name: vdbs.documentdb.io
    failurePolicy: Fail
    rules:
      - apiGroups: ["documentdb.io"]
        apiVersions: ["preview"]
        operations: ["CREATE"]
        resources: ["dbs"]
