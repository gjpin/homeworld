---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: authelia-oidc
  namespace: grafana
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: grafana
  oidc:
    provider:
      issuer: https://auth.base-domain.invalid
    clientID: envoy
    clientSecret:
      name: envoy-oidc-client-secret
    redirectURL: https://grafana.base-domain.invalid/oauth2/callback
