fullnameOverride: otel-collector-node
namespaceOverride: otel-collector-node
mode: daemonset
image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
# DaemonSet agents run only on homelab worker nodes.
nodeSelector:
  node-role.kubernetes.io/homelab: homelab
podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
service:
  enabled: true
  type: ClusterIP
  trafficDistribution: PreferClose
# PSS baseline/privileged transition history: hostPort is forbidden by the
# baseline profile and useless here — nothing sends telemetry to node IPs
# (the pod collector Service is the OTLP entry point), so the agent does not
# claim host ports.
ports:
  otlp:
    hostPort: 0
  otlp-http:
    hostPort: 0
  jaeger-compact:
    hostPort: 0
  jaeger-thrift:
    hostPort: 0
  jaeger-grpc:
    hostPort: 0
  zipkin:
    hostPort: 0
resources:
  requests:
    cpu: 10m
    memory: 64Mi
    ephemeral-storage: 64Mi
  limits:
    cpu: "1"
    memory: 2Gi
    ephemeral-storage: 2Gi
presets:
  # filelog receiver
  # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/filelogreceiver
  logsCollection:
    enabled: true
    includeCollectorLogs: false
  # hostmetrics receiver
  # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/hostmetricsreceiver
  hostMetrics:
    enabled: true
  # kubeletstats receiver
  # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/receiver/kubeletstatsreceiver
  kubeletMetrics:
    enabled: true
  # k8s_attributes processor
  # https://github.com/open-telemetry/opentelemetry-collector-contrib/tree/main/processor/k8sattributesprocessor
  kubernetesAttributes:
    enabled: true
    extractAllPodLabels: true
    extractAllPodAnnotations: true
config:
  receivers:
    jaeger: null
    zipkin: null
    prometheus:
      config:
        scrape_configs:
          - job_name: otel-collector-node
            scrape_interval: 10s
            static_configs:
              - targets:
                  - ${env:MY_POD_IP}:8888
    otlp:
      protocols:
        grpc:
          endpoint: ${env:MY_POD_IP}:4317
        http:
          endpoint: ${env:MY_POD_IP}:4318
  processors:
    batch: {}
    memory_limiter:
      check_interval: 5s
      limit_percentage: 80
      spike_limit_percentage: 25
  exporters:
    debug: null
    otlp_http/victoriametrics:
      compression: gzip
      encoding: proto
      metrics_endpoint: http://victoria-metrics.victoria-metrics.svc.cluster.local:8428/opentelemetry/v1/metrics
    otlp_http/victorialogs:
      compression: gzip
      encoding: proto
      logs_endpoint: http://victoria-logs.victoria-metrics.svc.cluster.local:9428/insert/opentelemetry/v1/logs
    otlp_http/victoriatraces:
      compression: gzip
      encoding: proto
      traces_endpoint: http://victoria-traces.victoria-metrics.svc.cluster.local:10428/insert/opentelemetry/v1/traces
  extensions:
    health_check:
      endpoint: ${env:MY_POD_IP}:13133
  service:
    telemetry:
      metrics:
        readers:
          - pull:
              exporter:
                prometheus:
                  host: ${env:MY_POD_IP}
                  port: 8888
    extensions:
      - health_check
    pipelines:
      logs:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - k8s_attributes
          - batch
        exporters:
          - otlp_http/victorialogs
      metrics:
        receivers:
          - otlp
          - prometheus
        processors:
          - memory_limiter
          - k8s_attributes
          - batch
        exporters:
          - otlp_http/victoriametrics
      traces:
        receivers:
          - otlp
        processors:
          - memory_limiter
          - k8s_attributes
          - batch
        exporters:
          - otlp_http/victoriatraces
