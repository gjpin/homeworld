apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: argocd-argocd-redis
  namespace: "argocd"
  labels:
    helm.sh/chart: argo-cd-9.5.9
    app.kubernetes.io/name: argocd-argocd-redis
    app.kubernetes.io/instance: argocd
    app.kubernetes.io/component: argocd-redis
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: argocd
    app.kubernetes.io/version: "v3.3.8"
spec:
  endpoints:
    - port: http-metrics
      interval: 60s
      path: /metrics
      honorLabels: false
  namespaceSelector:
    matchNames:
      - argocd
  selector:
    matchLabels:
      app.kubernetes.io/name: argocd-argocd-redis
      app.kubernetes.io/instance: argocd
      app.kubernetes.io/component: argocd-redis

