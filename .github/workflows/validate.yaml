name: Validate manifests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  manifests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse Kubernetes manifests
        run: |
          find apps -type f -name '*.yaml' -not -path '*/local-charts/*' -print0 |
            xargs -0 -n1 yq eval '.' >/dev/null

      - name: Check Kubernetes version pin consistency
        run: scripts/check-k8s-version.sh

  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum

      - name: Test and validate e2e suite
        working-directory: e2e
        run: |
          go test ./...
          python3 testdata/rewrite/rewrite_test.py
          go run ./cmd/e2e validate -f testdata/suite.minimal.yaml
          go run ./cmd/e2e validate -f examples/homeworld.suite.yaml

  helm-security:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile:
          - homelab
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install security toolchain
        shell: bash
        run: |
          set -euo pipefail

          curl -sSfLO https://github.com/kubescape/kubescape/releases/download/v4.0.11/kubescape_4.0.11_linux_amd64
          curl -sSfL https://github.com/kubescape/kubescape/releases/download/v4.0.11/checksums.sha256 |
            grep ' kubescape_4.0.11_linux_amd64$' | sha256sum --check
          sudo install kubescape_4.0.11_linux_amd64 /usr/local/bin/kubescape

          # kube-linter publishes no checksums asset (only sigstore bundles),
          # so unlike the other tools the pinned release is trusted over
          # GitHub TLS without a sha256 check.
          curl -sSfLO https://github.com/stackrox/kube-linter/releases/download/v0.8.3/kube-linter-linux.tar.gz
          tar -xzf kube-linter-linux.tar.gz kube-linter
          sudo install kube-linter /usr/local/bin/kube-linter

          curl -sSfLO https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz
          curl -sSfL https://get.helm.sh/helm-v4.2.3-linux-amd64.tar.gz.sha256 |
            awk '{print $1 "  helm-v4.2.3-linux-amd64.tar.gz"}' | sha256sum --check
          tar -xzf helm-v4.2.3-linux-amd64.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm

          # kubectl floats to the latest stable release (dl.k8s.io) instead of
          # being pinned: it only renders manifests client-side here, and a
          # pinned copy silently drifted a minor behind the cluster before.
          kubectl_version="$(curl -sSfL https://dl.k8s.io/release/stable.txt)"
          sudo curl -sSfL -o /usr/local/bin/kubectl \
            "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl"
          curl -sSfL "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl.sha256" |
            awk '{print $1 "  /usr/local/bin/kubectl"}' | sha256sum --check
          sudo chmod 0755 /usr/local/bin/kubectl

          curl -sSfLO https://github.com/mikefarah/yq/releases/download/v4.47.1/yq_linux_amd64
          # yq's checksums asset lists every supported hash algorithm per file
          # in one row; the checksums_hashes_order asset maps each column to
          # its algorithm, so the SHA-256 column is resolved per release.
          yq_sha256_col="$(
            curl -sSfL https://github.com/mikefarah/yq/releases/download/v4.47.1/checksums_hashes_order |
              grep -n '^SHA-256$' | cut -d: -f1
          )"
          curl -sSfL https://github.com/mikefarah/yq/releases/download/v4.47.1/checksums |
            awk -v col="$((yq_sha256_col + 1))" '$1 == "yq_linux_amd64" {print $(col) "  yq_linux_amd64"}' |
            sha256sum --check
          sudo install yq_linux_amd64 /usr/local/bin/yq

      - name: Render and enforce security policy
        run: scripts/scan-security.sh "${{ matrix.profile }}"

      - name: Upload scanner reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-${{ matrix.profile }}
          path: security-reports/${{ matrix.profile }}

  trivy-image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install Trivy
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.74.0

      - name: Scan PR-updated container images
        run: scripts/scan-images.sh
