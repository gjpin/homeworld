name: Validate manifests

# Docs-only changes skip validation; the markdown files
# scripts/check-k8s-version.sh reads stay in scope.
on:
  pull_request:
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "docs/pod-security.md"
      - "README.md"
      - "AGENTS.md"
      - "e2e/README.md"
  push:
    branches:
      - main
    paths:
      - "**"
      - "!docs/**"
      - "!**.md"
      - "docs/pod-security.md"
      - "README.md"
      - "AGENTS.md"
      - "e2e/README.md"

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # One job instead of four: Actions bills each job rounded up to the minute.
  # Every check step runs even after an earlier one fails.
  #
  # Parse-only validation: CEL admission policies and pinned-CRD custom
  # resources are only parse-checked here; cluster-side schema validation is
  # impossible without the CRDs installed (see AGENTS.md Validation section).
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse Kubernetes manifests
        if: ${{ !cancelled() }}
        run: |
          find apps -type f -name '*.yaml' -not -path '*/charts/*' -not -path '*/local-charts/*' -print0 |
            xargs -0 -n1 yq eval '.' >/dev/null

      - name: Check for duplicate YAML keys
        if: ${{ !cancelled() }}
        run: scripts/check-yaml-duplicates.sh

      - name: Check Secret key references
        if: ${{ !cancelled() }}
        run: scripts/check-secret-refs.sh

      - name: Check network policy rules
        if: ${{ !cancelled() }}
        run: scripts/check-network-policies.sh

      - name: Validate Grafana dashboards
        if: ${{ !cancelled() }}
        # jq ships preinstalled on the runner image, so no install step needed.
        run: |
          find apps/grafana/dashboards -type f -name '*.json' -print0 |
            xargs -0 -n1 jq empty

      - name: Check Grafana dashboard wiring
        if: ${{ !cancelled() }}
        run: scripts/check-dashboards.sh

      - name: Check shell script syntax
        if: ${{ !cancelled() }}
        run: |
          for f in scripts/*.sh e2e/examples/hooks/*.sh host/*.sh host/agents-vm/*.sh; do
            bash -n "$f"
          done
          for f in host/files/libexec/*; do
            sh -n "$f"
          done

      - name: Check Kubernetes version pin consistency
        if: ${{ !cancelled() }}
        run: scripts/check-k8s-version.sh

      - name: Set up Go
        if: ${{ !cancelled() }}
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: e2e/go.mod
          cache-dependency-path: e2e/go.sum

      - name: Test and validate e2e suite
        if: ${{ !cancelled() }}
        working-directory: e2e
        run: |
          go test ./...
          python3 testdata/rewrite/rewrite_test.py
          go run ./cmd/e2e validate -f testdata/suite.minimal.yaml
          go run ./cmd/e2e validate -f examples/homeworld.suite.yaml

      - name: Install security toolchain
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail

          curl -sSfLO https://github.com/kubescape/kubescape/releases/download/v4.0.17/kubescape_4.0.17_linux_amd64
          curl -sSfL https://github.com/kubescape/kubescape/releases/download/v4.0.17/checksums.sha256 |
            grep ' kubescape_4.0.17_linux_amd64$' | sha256sum --check
          sudo install kubescape_4.0.17_linux_amd64 /usr/local/bin/kubescape

          # kube-linter publishes no checksums asset (only sigstore bundles),
          # so unlike the other tools the pinned release is trusted over
          # GitHub TLS without a sha256 check.
          curl -sSfLO https://github.com/stackrox/kube-linter/releases/download/v0.8.3/kube-linter-linux.tar.gz
          tar -xzf kube-linter-linux.tar.gz kube-linter
          sudo install kube-linter /usr/local/bin/kube-linter

          curl -sSfLO https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
          curl -sSfL https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz.sha256 |
            awk '{print $1 "  helm-v4.3.1-linux-amd64.tar.gz"}' | sha256sum --check
          tar -xzf helm-v4.3.1-linux-amd64.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm

          # kubectl floats to the latest stable release (dl.k8s.io) instead of
          # being pinned: it only renders manifests client-side here, and a
          # pinned copy silently drifted a minor behind the cluster before.
          kubectl_version="$(curl -sSfL https://dl.k8s.io/release/stable.txt)"
          sudo curl -sSfL -o /usr/local/bin/kubectl \
            "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl"
          curl -sSfL "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl.sha256" |
            awk '{print $1 "  /usr/local/bin/kubectl"}' | sha256sum --check
          sudo chmod 0755 /usr/local/bin/kubectl

          curl -sSfLO https://github.com/mikefarah/yq/releases/download/v4.54.2/yq_linux_amd64
          # yq's checksums asset lists every supported hash algorithm per file
          # in one row; the checksums_hashes_order asset maps each column to
          # its algorithm, so the SHA-256 column is resolved per release.
          yq_sha256_col="$(
            curl -sSfL https://github.com/mikefarah/yq/releases/download/v4.54.2/checksums_hashes_order |
              grep -n '^SHA-256$' | cut -d: -f1
          )"
          curl -sSfL https://github.com/mikefarah/yq/releases/download/v4.54.2/checksums |
            awk -v col="$((yq_sha256_col + 1))" '$1 == "yq_linux_amd64" {print $(col) "  yq_linux_amd64"}' |
            sha256sum --check
          sudo install yq_linux_amd64 /usr/local/bin/yq

      - name: Render and enforce security policy
        if: ${{ !cancelled() }}
        run: scripts/scan-security.sh homelab

      - name: Upload scanner reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-homelab
          path: security-reports/homelab
