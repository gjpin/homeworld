name: Renovate

on:
  schedule:
    # An hour into the DeepSeek off-peak period that starts at 10:00 UTC on
    # weekdays (scripts/deepseek-off-peak.sh), so the upgrade agent reviews
    # the new PRs at half price.
    - cron: '0 11 * * *'
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Run Renovate
        uses: renovatebot/github-action@266fef21329c44765ad42f9dea1f01f5d2d91084 # v46.3.13
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.229.0
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Self-hosted-only option (cannot live in renovate.json): allow the
          # DocumentDB chart re-vendor script and the hass-oidc-auth, Navidrome
          # AudioMuse-AI plugin and Coder image sha256 refresh scripts to run as
          # postUpgradeTasks commands.
          # Regexes match the resolved command string.
          RENOVATE_ALLOWED_COMMANDS: '["^bash scripts/vendor-documentdb-operator\\.sh$", "^bash scripts/refresh-hass-oidc-auth-sha\\.sh$", "^bash scripts/refresh-navidrome-audiomuse-plugin-sha\\.sh$", "^bash scripts/refresh-coder-image-shas\\.sh$"]'
