name: Renovate

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Run Renovate
        uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.149.1
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Self-hosted-only option (cannot live in renovate.json): allow the
          # DocumentDB chart re-vendor script and the hass-oidc-auth sha256
          # refresh script to run as postUpgradeTasks commands. Regexes
          # match the resolved command string.
          RENOVATE_ALLOWED_COMMANDS: '["^bash scripts/vendor-documentdb-operator\\.sh$", "^bash scripts/refresh-hass-oidc-auth-sha\\.sh$"]'
