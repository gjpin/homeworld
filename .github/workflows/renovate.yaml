name: Renovate

on:
  schedule:
    # An hour into the DeepSeek off-peak period that starts at 10:00 UTC on
    # weekdays (scripts/deepseek-off-peak.sh), so the upgrade agent reviews
    # the new PRs at half price.
    - cron: '0 11 * * *'
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Run Renovate
        uses: renovatebot/github-action@acdd6bda8b035c99ce59d5675816af2aa65a1774 # v46.3.14
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.257.5
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Self-hosted-only option (cannot live in renovate.json): allow the
          # DocumentDB chart re-vendor script and the hass-oidc-auth and Navidrome
          # AudioMuse-AI plugin sha256 refresh scripts to run as postUpgradeTasks
          # commands.
          # Regexes match the resolved command string.
          RENOVATE_ALLOWED_COMMANDS: '["^bash scripts/vendor-documentdb-operator\\.sh$", "^bash scripts/refresh-hass-oidc-auth-sha\\.sh$", "^bash scripts/refresh-navidrome-audiomuse-plugin-sha\\.sh$"]'
