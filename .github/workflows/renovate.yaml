name: Renovate

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: renovate
  cancel-in-progress: false

permissions: {}

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Run Renovate
        uses: renovatebot/github-action@43b963bf5dd5e57f1f95c59765a018d782870211 # v46.3.11
        with:
          token: ${{ steps.app-token.outputs.token }}
          renovate-version: 44.192.0
        env:
          RENOVATE_PLATFORM: github
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          # Self-hosted-only option (cannot live in renovate.json): allow the
          # DocumentDB chart re-vendor script and the hass-oidc-auth and Coder
          # image sha256 refresh scripts to run as postUpgradeTasks commands.
          # Regexes match the resolved command string.
          RENOVATE_ALLOWED_COMMANDS: '["^bash scripts/vendor-documentdb-operator\\.sh$", "^bash scripts/refresh-hass-oidc-auth-sha\\.sh$", "^bash scripts/refresh-coder-image-shas\\.sh$"]'
