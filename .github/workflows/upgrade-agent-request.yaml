name: Upgrade agent request

# Starts upgrade-agent.yaml reviews that no pull_request_target event of the
# PR itself starts: an owner's `/upgrade <decision>` comment on a Renovate
# PR, and the merge of a Renovate PR that later PRs of the same package
# waited for (labelled upgrade-waiting; skill step 2). Kept apart from the
# review workflow so these events add no skipped checks to the PRs.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  comment:
    if: >-
      github.event_name == 'issue_comment'
      && github.event.issue.pull_request
      && github.event.comment.author_association == 'OWNER'
      && (github.event.comment.body == '/upgrade' || startsWith(github.event.comment.body, '/upgrade '))
    runs-on: ubuntu-latest
    permissions:
      # GITHUB_TOKEN may start workflow_dispatch runs.
      actions: write
    steps:
      - name: Request a review
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ github.event.issue.number }}
        run: gh workflow run upgrade-agent.yaml -R "$GITHUB_REPOSITORY" --ref main -f pr="$NUMBER"

  merged:
    if: >-
      github.event_name == 'pull_request_target'
      && github.event.pull_request.merged
      && startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Request reviews of the waiting PRs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr list -R "$GITHUB_REPOSITORY" --state open --label upgrade-waiting --json number --jq '.[].number' |
            while read -r n; do
              gh workflow run upgrade-agent.yaml -R "$GITHUB_REPOSITORY" --ref main -f pr="$n"
            done
