name: Upgrade agent

# Reviews every Renovate PR with the upgrade skill (.agents/skills/upgrade),
# run by the pi coding agent with DeepSeek V4.1 Flash through the DeepSeek API
# (thinking high). The agent's fixes are pushed to the PR and its review is
# posted as a comment. A `ready` PR is merged once every other check on its head
# passes; a `review` PR (new features worth using here, or post-merge steps
# that need the owner to act) stays open for the owner to merge (docs/upgrades.md, "Upgrade Tooling").
#
# Reviews start when Renovate opens a PR (pull_request_target) or by
# dispatch with the PR number; upgrade-agent-request.yaml dispatches them for
# an owner's `/upgrade <decision>` comment (the agent reads it as the answer
# to its blocker) and when a merge releases a waiting PR of the same package.
# The result is a check run on the PR head ("Upgrade agent review": success
# when ready or for review, failure when blocked or CI failed, neutral while
# waiting or deferred) carrying the
# review, plus the same review as a PR comment and a label.
#
# DeepSeek bills off-peak hours at half price (scripts/deepseek-off-peak.sh),
# so a review starts only an hour or more into an off-peak period and with
# enough of it left to finish. Any other PR is labelled upgrade-deferred, and
# upgrade-agent-request.yaml dispatches it again an hour after the next peak
# window ends.
#
# pull_request_target, not pull_request: the workflow always comes from
# main, never from the PR (whose stale merge ref can predate this workflow,
# and a PR could rewrite it). The jobs only accept same-repo renovate/*
# branches, and only the read-only agent job runs PR content.
#
# Three review jobs keep the agent away from write credentials. The agent
# runs with auto-approve and reads untrusted release notes, so its job holds
# only a read-only GITHUB_TOKEN and the DeepSeek key, and hands back a result
# file and its commit as patches. The other jobs never execute anything from
# the agent's runner and hold the renovate-homeworld app token, which pushes
# and comments (so CI runs on the pushed commit, like on Renovate's own).

on:
  pull_request_target:
    types: [opened, reopened]
  workflow_dispatch:
    inputs:
      pr:
        description: Renovate PR number
        required: true
        type: number

# One review per PR at a time.
concurrency:
  group: upgrade-agent-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

permissions: {}

env:
  # GitHub-hosted runners cannot reach the cluster, so the skill's live gates
  # (pre-merge Velero backup, Cilium pre-flight) cannot run here. Drop the
  # flag once the cluster is live: stateful upgrades then block, for a local
  # /upgrade run that can take the backup.
  UPGRADE_FLAGS: --no-cluster
  PI_MODEL: deepseek-flash
  # A review starts OFF_PEAK_SETTLE minutes or more into a DeepSeek off-peak
  # period, with OFF_PEAK_NEEDED minutes or more of it left (reviews take
  # about ten).
  OFF_PEAK_SETTLE: 60
  OFF_PEAK_NEEDED: 30

jobs:
  prepare:
    if: >-
      (github.event_name == 'pull_request_target'
        && startsWith(github.head_ref, 'renovate/')
        && github.event.pull_request.head.repo.full_name == github.repository)
      || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      checks: write
      contents: read
      pull-requests: read
    outputs:
      check: ${{ steps.pr.outputs.check }}
      proceed: ${{ steps.pr.outputs.proceed }}
      number: ${{ steps.pr.outputs.number }}
      branch: ${{ steps.pr.outputs.branch }}
      sha: ${{ steps.pr.outputs.sha }}
    steps:
      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Check out the off-peak script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          sparse-checkout: scripts/deepseek-off-peak.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Resolve the PR and bring it up to date
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          echo "proceed=false" >> "$GITHUB_OUTPUT"

          pr="$(gh pr view "$NUMBER" -R "$GITHUB_REPOSITORY" --json state,headRefName,headRefOid,isCrossRepository)"
          branch="$(jq -r .headRefName <<<"$pr")"
          if [ "$(jq -r .state <<<"$pr")" != OPEN ] || [ "$(jq -r .isCrossRepository <<<"$pr")" != false ] ||
            [[ "$branch" != renovate/* ]]; then
            echo "#${NUMBER} is not an open Renovate PR; nothing to do"
            exit 0
          fi
          sha="$(jq -r .headRefOid <<<"$pr")"

          # One label per call: gh rejects the whole edit when any label is
          # missing from the repository.
          for l in upgrade-blocked upgrade-waiting upgrade-ready upgrade-review upgrade-deferred; do
            GH_TOKEN="$APP_TOKEN" gh pr edit "$NUMBER" -R "$GITHUB_REPOSITORY" --remove-label "$l" >/dev/null 2>&1 || true
          done

          # Only in DeepSeek off-peak hours; upgrade-agent-request.yaml
          # dispatches deferred PRs an hour after the peak window ends.
          read -r since left < <(scripts/deepseek-off-peak.sh)
          if [ "$since" -lt "$OFF_PEAK_SETTLE" ] || [ "$left" -lt "$OFF_PEAK_NEEDED" ]; then
            echo "Off-peak for ${since} minutes, peak in ${left}; deferring"
            GH_TOKEN="$APP_TOKEN" gh label create upgrade-deferred -R "$GITHUB_REPOSITORY" --force --color c5def5 \
              --description "Upgrade agent: reviewed once DeepSeek off-peak hours start" >/dev/null
            GH_TOKEN="$APP_TOKEN" gh pr edit "$NUMBER" -R "$GITHUB_REPOSITORY" --add-label upgrade-deferred >/dev/null
            gh api "repos/${GITHUB_REPOSITORY}/check-runs" -f name="Upgrade agent review" -f head_sha="$sha" \
              -f status=completed -f conclusion=neutral -f details_url="$RUN_URL" \
              -f 'output[title]=Deferred to DeepSeek off-peak hours' \
              -f 'output[summary]=The review starts an hour into the next DeepSeek off-peak period (05:00 or 11:00 UTC on weekdays).' >/dev/null
            exit 0
          fi

          # The review must run against current main (skill step 3).
          behind="$(gh api "repos/${GITHUB_REPOSITORY}/compare/main...${sha}" --jq .behind_by)"
          if [ "$behind" -gt 0 ]; then
            if ! GH_TOKEN="$APP_TOKEN" gh pr update-branch "$NUMBER" -R "$GITHUB_REPOSITORY"; then
              GH_TOKEN="$APP_TOKEN" gh pr comment "$NUMBER" -R "$GITHUB_REPOSITORY" --body \
                "### Upgrade agent: blocked

          The branch could not be brought up to date with \`main\` (merge conflict). Resolve it, or let Renovate rebase the PR, then reply \`/upgrade\`.

          ---
          [Run](${RUN_URL})"
              exit 0
            fi
            for _ in $(seq 60); do
              new="$(gh pr view "$NUMBER" -R "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
              [ "$new" != "$sha" ] && break
              sleep 5
            done
            if [ "$new" = "$sha" ]; then
              echo "::error::update-branch did not move the PR head"
              exit 1
            fi
            sha="$new"
          fi

          check="$(gh api "repos/${GITHUB_REPOSITORY}/check-runs" -f name="Upgrade agent review" \
            -f head_sha="$sha" -f status=in_progress -f details_url="$RUN_URL" --jq .id)"

          {
            echo "check=${check}"
            echo "proceed=true"
            echo "number=${NUMBER}"
            echo "branch=${branch}"
            echo "sha=${sha}"
          } >> "$GITHUB_OUTPUT"

  review:
    needs: prepare
    if: needs.prepare.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Read-only: PR metadata and comments, check results and failed logs.
    permissions:
      actions: read
      checks: read
      contents: read
      issues: read
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ needs.prepare.outputs.number }}
      BRANCH: ${{ needs.prepare.outputs.branch }}
      SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          # The repository is private, so git needs credentials too. The
          # persisted token is this job's read-only GITHUB_TOKEN, which the
          # agent already has as GH_TOKEN.

      - name: Set up Node.js for pi
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'

      - name: Install the upgrade toolchain
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"

          curl -sSfLO https://get.helm.sh/helm-v4.3.2-linux-amd64.tar.gz
          curl -sSfL https://get.helm.sh/helm-v4.3.2-linux-amd64.tar.gz.sha256 |
            awk '{print $1 "  helm-v4.3.2-linux-amd64.tar.gz"}' | sha256sum --check
          tar -xzf helm-v4.3.2-linux-amd64.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm

          # kubectl floats to the latest stable release, as in validate.yaml:
          # it only renders manifests client-side.
          kubectl_version="$(curl -sSfL https://dl.k8s.io/release/stable.txt)"
          sudo curl -sSfL -o /usr/local/bin/kubectl \
            "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl"
          curl -sSfL "https://dl.k8s.io/release/${kubectl_version}/bin/linux/amd64/kubectl.sha256" |
            awk '{print $1 "  /usr/local/bin/kubectl"}' | sha256sum --check
          sudo chmod 0755 /usr/local/bin/kubectl

          curl -sSfLO https://github.com/mikefarah/yq/releases/download/v4.54.3/yq_linux_amd64
          yq_sha256_col="$(
            curl -sSfL https://github.com/mikefarah/yq/releases/download/v4.54.3/checksums_hashes_order |
              grep -n '^SHA-256$' | cut -d: -f1
          )"
          curl -sSfL https://github.com/mikefarah/yq/releases/download/v4.54.3/checksums |
            awk -v col="$((yq_sha256_col + 1))" '$1 == "yq_linux_amd64" {print $(col) "  yq_linux_amd64"}' |
            sha256sum --check
          sudo install yq_linux_amd64 /usr/local/bin/yq

          curl -sSfLO https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz
          curl -sSfL https://github.com/google/go-containerregistry/releases/download/v0.22.1/checksums.txt |
            grep ' go-containerregistry_Linux_x86_64.tar.gz$' | sha256sum --check
          tar -xzf go-containerregistry_Linux_x86_64.tar.gz crane
          sudo install crane /usr/local/bin/crane

          npm install -g @earendil-works/pi-coding-agent@1.5.2

      - name: Configure pi
        run: |
          set -euo pipefail
          # Telemetry, provider attribution headers, version checks and
          # model catalog refreshes off (AGENTS.md). Project trust stays off:
          # the run loads only the upgrade skill, by path, and AGENTS.md.
          mkdir -p "${RUNNER_TEMP}/pi"
          {
            echo "PI_CODING_AGENT_DIR=${RUNNER_TEMP}/pi"
            echo "PI_OFFLINE=1"
            echo "PI_SKIP_VERSION_CHECK=1"
            echo "PI_TELEMETRY=0"
          } >> "$GITHUB_ENV"
          echo '{"enableInstallTelemetry": false, "defaultProjectTrust": "never"}' > "${RUNNER_TEMP}/pi/settings.json"

      - name: Run the upgrade skill
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          set -euo pipefail
          # The prepare job's off-peak check again, then stop five minutes
          # before the next DeepSeek peak window, so no request starts in it,
          # and after 100 minutes at most. A review cut short by the peak
          # window is deferred, not blocked.
          read -r since left < <(scripts/deepseek-off-peak.sh)
          if [ "$since" -lt "$OFF_PEAK_SETTLE" ] || [ "$left" -lt "$OFF_PEAK_NEEDED" ]; then
            echo "Off-peak for ${since} minutes, peak in ${left}; deferring"
            touch "${RUNNER_TEMP}/deferred"
            exit 0
          fi
          limit=$((left - 5 < 100 ? left - 5 : 100))

          git fetch -q origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          if [ "$(git rev-parse "origin/${BRANCH}")" != "$SHA" ]; then
            echo "::error::origin/${BRANCH} moved after prepare"
            exit 1
          fi
          git config --global user.name "renovate-homeworld[bot]"
          git config --global user.email "309082045+renovate-homeworld[bot]@users.noreply.github.com"

          # The result file lives in the work directory: one path to remember,
          # so the agent cannot write it to the wrong one of two.
          work="${RUNNER_TEMP}/upgrade"
          mkdir -p "$work"
          cat > "${RUNNER_TEMP}/prompt.md" <<EOF
          Run the upgrade skill (.agents/skills/upgrade/SKILL.md) on Renovate PR
          #${NUMBER} (branch ${BRANCH}, head ${SHA}) with these arguments:

              ${NUMBER} --result ${work}/result.json ${UPGRADE_FLAGS}

          This prompt is the explicit invocation the skill requires. Read the
          skill and AGENTS.md first and follow them exactly, in result mode.
          You run unattended in GitHub Actions: nobody can answer a question,
          so a blocker is a "block" decision in the result file. A "ready" PR
          is merged without the user seeing it; useful new features, notable
          user-facing features or post-merge steps that need the user to act
          make it "review" instead.
          Write the "comment" exactly in the skill's Comment format: short,
          plain, a checks table. Use ${work} as the work directory. Always write
          the result file to exactly ${work}/result.json before you stop,
          also when something failed.
          EOF

          # pi reads stdin until it closes, so it gets /dev/null. The JSON
          # event stream stays on the runner: it holds tool output.
          mkdir -p "${RUNNER_TEMP}/pi-run"
          rc=0
          timeout "${limit}m" pi --mode json --provider deepseek --model "$PI_MODEL" --thinking high \
            --no-session --no-mcp --no-extensions --no-skills --skill .agents/skills/upgrade \
            "$(cat "${RUNNER_TEMP}/prompt.md")" \
            </dev/null > "${RUNNER_TEMP}/pi-run/events.jsonl" || rc=$?
          echo "pi exited with ${rc}"
          if [ "$rc" -eq 124 ] && [ "$limit" -lt 100 ]; then
            touch "${RUNNER_TEMP}/deferred"
          fi

      - name: Package the result
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/out"
          mkdir -p "$out/patches"
          cp "${RUNNER_TEMP}/deferred" "$out/" 2>/dev/null || true
          # usage.json: stop reason, token usage and cost (at pi's catalog
          # prices, which are DeepSeek's peak rates: off-peak bills half),
          # never the event stream (it holds tool output and is published
          # with the artifact).
          if [ -s "${RUNNER_TEMP}/pi-run/events.jsonl" ]; then
            jq -s '[.[] | select(.type == "message_end" and .message.role == "assistant") | .message] | {
                model: (last.model // null), stopReason: (last.stopReason // null),
                errorMessage: (last.errorMessage // null), turns: length,
                input: (map(.usage.input) | add), output: (map(.usage.output) | add),
                cacheRead: (map(.usage.cacheRead) | add), costAtPeakRates: (map(.usage.cost.total) | add)
              }' "${RUNNER_TEMP}/pi-run/events.jsonl" > "$out/usage.json" || true
          fi
          # Only the result leaves the work directory, which holds tool output.
          cp "${RUNNER_TEMP}/upgrade/result.json" "$out/" 2>/dev/null || true
          result="$out/result.json"
          jq -e . "$result" >/dev/null 2>&1 || exit 0
          commit="$(jq -r '.commit // empty' "$result")"
          [ -n "$commit" ] || exit 0
          if git merge-base --is-ancestor "$SHA" "$commit" 2>/dev/null; then
            git format-patch -q --binary -o "$out/patches" "${SHA}..${commit}"
          else
            jq '.decision = "block" | .commit = null |
              .comment = "The agent reported a commit that does not build on the PR head; nothing was pushed.\n\n" + (.comment // "")' \
              "$result" > "$result.tmp" && mv "$result.tmp" "$result"
          fi

      - name: Upload the result
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upgrade-result
          path: ${{ runner.temp }}/out
          if-no-files-found: ignore

  apply:
    needs: [prepare, review]
    if: ${{ always() && needs.prepare.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      # Dispatching a new review; GITHUB_TOKEN may start workflow_dispatch
      # runs.
      actions: write
      checks: write
      contents: read
      pull-requests: read
    env:
      CHECK: ${{ needs.prepare.outputs.check }}
      NUMBER: ${{ needs.prepare.outputs.number }}
      BRANCH: ${{ needs.prepare.outputs.branch }}
      SHA: ${{ needs.prepare.outputs.sha }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Download the result
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: upgrade-result
          path: ${{ runner.temp }}/result

      - name: Check out the PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Create GitHub App installation token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.RENOVATE_APP_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}

      - name: Push the fixes and post the review
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ACTIONS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="${RUNNER_TEMP}/result"
          result="${dir}/result.json"

          post() { # <title> <markdown file>
            {
              echo "### Upgrade agent: $1"
              echo
              head -c 60000 "$2"
              echo
              echo
              echo "---"
              echo "[Run](${RUN_URL}) · Reply \`/upgrade <your decision>\` to run the agent again with it."
            } > "${RUNNER_TEMP}/comment.md"
            gh pr comment "$NUMBER" -R "$GITHUB_REPOSITORY" --body-file "${RUNNER_TEMP}/comment.md"
          }
          label() { # <name> <color> <description>
            gh label create "$1" -R "$GITHUB_REPOSITORY" --force --color "$2" \
              --description "Upgrade agent: $3" >/dev/null
            gh pr edit "$NUMBER" -R "$GITHUB_REPOSITORY" --add-label "$1" >/dev/null
          }
          # The check run on the PR head; a pushed fix gets its own on the new
          # head, so the result stays visible on the PR.
          heads=()
          finish() { # <conclusion> <title> <markdown file>
            jq -n --arg c "$1" --arg t "$2" --rawfile s "$3" \
              '{status: "completed", conclusion: $c, output: {title: $t, summary: ($s | .[0:60000])}}' \
              > "${RUNNER_TEMP}/check.json"
            GH_TOKEN="$ACTIONS_TOKEN" gh api -X PATCH "repos/${GITHUB_REPOSITORY}/check-runs/${CHECK}" \
              --input "${RUNNER_TEMP}/check.json" >/dev/null
            for h in "${heads[@]}"; do
              jq --arg h "$h" --arg u "$RUN_URL" '. + {name: "Upgrade agent review", head_sha: $h, details_url: $u}' \
                "${RUNNER_TEMP}/check.json" |
                GH_TOKEN="$ACTIONS_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/check-runs" --input - >/dev/null
            done
          }
          block() { # <markdown file>
            post "blocked" "$1"
            label upgrade-blocked d93f0b "needs a decision before merging"
            finish failure "Blocked: needs a decision" "$1"
          }
          msg="${RUNNER_TEMP}/msg.md"

          if [ -f "${dir}/deferred" ]; then
            echo "The review ran outside DeepSeek's off-peak hours or reached the next peak window, so it stopped and nothing was pushed. It runs again an hour into the next off-peak period (05:00 or 11:00 UTC on weekdays)." > "$msg"
            label upgrade-deferred c5def5 "reviewed once DeepSeek off-peak hours start"
            finish neutral "Deferred to DeepSeek off-peak hours" "$msg"
            exit 0
          fi

          if ! jq -e --argjson n "$NUMBER" \
            '.pr == $n and (.decision | IN("ready", "review", "block", "wait")) and (.comment | type == "string")' \
            "$result" >/dev/null 2>&1; then
            echo "The agent finished without a valid result file (stop reason in the run's \`upgrade-result\` artifact, \`usage.json\`). Nothing was pushed." > "$msg"
            block "$msg"
            exit 0
          fi
          decision="$(jq -r .decision "$result")"
          jq -r .comment "$result" > "$msg"

          pr="$(gh pr view "$NUMBER" -R "$GITHUB_REPOSITORY" --json state,headRefOid)"
          [ "$(jq -r .state <<<"$pr")" = OPEN ] || { echo "PR is no longer open"; exit 0; }
          if [ "$(jq -r .headRefOid <<<"$pr")" != "$SHA" ]; then
            printf '%s\n\n%s\n' "The PR head moved during the review, so this result was discarded. Reply \`/upgrade\` to review the new head." "<details><summary>Discarded result (${decision})</summary>

          $(cat "$msg")
          </details>" > "${RUNNER_TEMP}/moved.md"
            post "outdated" "${RUNNER_TEMP}/moved.md"
            finish neutral "Outdated: the PR head moved" "${RUNNER_TEMP}/moved.md"
            exit 0
          fi

          case "$decision" in
            block)
              block "$msg"
              exit 0
              ;;
            wait)
              earlier="$(jq -r '.waiting_for // empty' "$result")"
              if [ -n "$earlier" ] &&
                [ "$(gh pr view "$earlier" -R "$GITHUB_REPOSITORY" --json state --jq .state)" = MERGED ]; then
                # Merged while this review ran: review again now.
                echo "#${earlier} merged during the review; reviewing again." > "${RUNNER_TEMP}/again.md"
                finish neutral "Reviewing again" "${RUNNER_TEMP}/again.md"
                GH_TOKEN="$ACTIONS_TOKEN" gh workflow run upgrade-agent.yaml -R "$GITHUB_REPOSITORY" --ref main -f pr="$NUMBER"
                exit 0
              fi
              post "waiting" "$msg"
              label upgrade-waiting fbca04 "reviewed again once an earlier PR of the same package merges"
              finish neutral "Waiting for #${earlier}" "$msg"
              exit 0
              ;;
          esac

          shopt -s nullglob
          patches=("${dir}"/patches/*.patch)
          if [ "${#patches[@]}" -gt 0 ]; then
            git config user.name "renovate-homeworld[bot]"
            git config user.email "309082045+renovate-homeworld[bot]@users.noreply.github.com"
            if ! git am -q "${patches[@]}"; then
              echo "The agent's commit did not apply to the PR head; nothing was pushed." > "$msg"
              block "$msg"
              exit 0
            fi
            # Workflow changes from the agent would run with this job's
            # credentials on the next event.
            if git diff --name-only "$SHA" HEAD | grep -q '^\.github/'; then
              printf '%s\n\n' "The agent's commit changes files under \`.github/\`, which it may not push. Review the change and apply it by hand:" > "${RUNNER_TEMP}/gh.md"
              { echo '```diff'; git diff "$SHA" HEAD | head -c 40000; echo '```'; } >> "${RUNNER_TEMP}/gh.md"
              block "${RUNNER_TEMP}/gh.md"
              exit 0
            fi
            git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
            heads+=("$(git rev-parse HEAD)")
            printf '%s\n\n' "Pushed $(git rev-parse --short HEAD) with the agent's changes." | cat - "$msg" > "$msg.tmp" && mv "$msg.tmp" "$msg"
          fi
          head="$(git rev-parse HEAD)"

          if [ "$decision" = review ]; then
            post "ready for your review" "$msg"
            label upgrade-review 1d76db "reviewed, has features or steps for the owner to see before merging"
            finish success "Ready: features to review" "$msg"
            exit 0
          fi

          # ready: merge once every other check on the head has passed. A
          # pushed commit gets a grace period for its CI to register (a
          # change validate's path filter skips registers none). The cap
          # keeps the wait inside the app token's one-hour lifetime. This run's
          # own jobs are on the head too when nothing was pushed, and this one
          # cannot complete while it waits.
          GH_TOKEN="$ACTIONS_TOKEN" gh api -X PATCH "repos/${GITHUB_REPOSITORY}/check-runs/${CHECK}" \
            -f 'output[title]=Ready: merging once CI passes' -f "output[summary]=See ${RUN_URL}" >/dev/null
          start="$(date +%s)"
          while :; do
            sleep 30
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${head}/check-runs?per_page=100" \
              --jq "[.check_runs[] | select(.name != \"Upgrade agent review\" and (.details_url | contains(\"/actions/runs/${GITHUB_RUN_ID}/\") | not))]")"
            elapsed=$(($(date +%s) - start))
            if [ "$(jq 'map(select(.status != "completed")) | length' <<<"$runs")" -eq 0 ] &&
              { [ "${#heads[@]}" -eq 0 ] || [ "$(jq length <<<"$runs")" -gt 0 ] || [ "$elapsed" -ge 120 ]; }; then
              break
            fi
            if [ "$elapsed" -ge 2400 ]; then
              printf '%s\n\n' "CI did not finish within 40 minutes, so the PR was not merged. Merge it once the checks pass, or reply \`/upgrade\` to review it again." | cat - "$msg" > "$msg.tmp" && mv "$msg.tmp" "$msg"
              post "ready, CI still running" "$msg"
              label upgrade-ready 0e8a16 "reviewed, merged once CI passes"
              finish neutral "Ready: CI still running" "$msg"
              exit 0
            fi
          done
          failed="$(jq -r 'map(select(.conclusion | IN("success", "skipped", "neutral") | not)) | .[] | "- [\(.name)](\(.html_url)): \(.conclusion)"' <<<"$runs")"
          if [ -n "$failed" ]; then
            printf '%s\n\n%s\n\n' "CI failed on $(git rev-parse --short HEAD), so the PR was not merged. Reply \`/upgrade\` to have the agent fix it:" "$failed" |
              cat - "$msg" > "$msg.tmp" && mv "$msg.tmp" "$msg"
            block "$msg"
            exit 0
          fi
          # The app's merge starts upgrade-agent-request, which releases PRs
          # waiting for this one.
          # Merges of other PRs at the same moment fail this one with "Base
          # branch was modified": try again.
          merged=false
          for attempt in 1 2 3 4 5; do
            if err="$(gh pr merge "$NUMBER" -R "$GITHUB_REPOSITORY" --merge --match-head-commit "$head" 2>&1)"; then
              merged=true
              break
            fi
            grep -q 'Base branch was modified' <<<"$err" || break
            sleep $((attempt * 10))
          done
          if [ "$merged" != true ]; then
            printf '%s\n\n%s\n\n' "The merge failed, so the PR is still open. Reply \`/upgrade\` to review it again:" "\`\`\`
          ${err}
          \`\`\`" | cat - "$msg" > "$msg.tmp" && mv "$msg.tmp" "$msg"
            block "$msg"
            exit 0
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" >/dev/null 2>&1 || true
          post "merged" "$msg"
          label upgrade-ready 0e8a16 "reviewed, merged once CI passes"
          finish success "Merged" "$msg"

      - name: Fail the check run
        if: ${{ failure() || cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/check-runs/${CHECK}" -f status=completed -f conclusion=failure \
            -f 'output[title]=The upgrade agent failed' -f "output[summary]=See ${RUN_URL}" >/dev/null
