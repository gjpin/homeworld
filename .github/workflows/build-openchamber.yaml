name: Build OpenChamber workspace image

on:
  push:
    branches:
      - main
    paths:
      - "images/openchamber/**"
      - ".github/workflows/build-openchamber.yaml"
  workflow_dispatch:

# The manifest tag update commit only touches apps/openchamber/, which is not
# in the paths filter, so this workflow never re-triggers itself.
concurrency:
  group: build-openchamber
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            cache-suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache-suffix: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/openchamber
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/openchamber,push-by-digest=true,name-canonical=true,push=true
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/openchamber:buildcache-${{ matrix.cache-suffix }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/openchamber:buildcache-${{ matrix.cache-suffix }},mode=max

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.cache-suffix }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge into a short-sha tag
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/openchamber
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          tag="main-${SHA::7}"
          sources=()
          for digest_file in "${{ runner.temp }}/digests"/*; do
            sources+=("${IMAGE}@sha256:$(basename "$digest_file")")
          done
          if [ "${#sources[@]}" -ne 2 ]; then
            echo "expected 2 platform digests, found ${#sources[@]}" >&2
            exit 1
          fi
          docker buildx imagetools create --tag "${IMAGE}:${tag}" "${sources[@]}"

  deploy:
    name: Update the deployed image tag
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Commit the new image tag
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/openchamber
          SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="main-${SHA::7}"
          manifest="apps/openchamber/1_deployment.yaml"
          grep -q "image: ${IMAGE}:" "$manifest"
          sed -i "s|image: ${IMAGE}:.*|image: ${IMAGE}:${tag}|" "$manifest"
          if git diff --quiet -- "$manifest"; then
            echo "tag ${tag} already deployed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$manifest"
          git commit -m "chore(openchamber): deploy workspace image ${tag}"
          git push
