name: Smoke build OpenChamber workspace image

# PR-side build gate for the OpenChamber workspace image. Every PR touching
# images/openchamber/** (Renovate's grouped openchamber-workspace-image update
# and the daily apt-refresh PRs) must build cleanly on linux/amd64 before the
# automerge-openchamber workflow may merge it. Nothing is pushed: the
# published multi-arch image is built only from main by
# build-openchamber.yaml. The Dockerfile itself smoke-tests every installed
# binary during the build, so a broken release fails here instead of on main.

on:
  pull_request:
    paths:
      - "images/openchamber/**"
      - ".github/workflows/smoke-openchamber.yaml"

concurrency:
  group: smoke-openchamber
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  smoke:
    name: Smoke build linux/amd64 (no push)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build without pushing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: images/openchamber
          platforms: linux/amd64
          push: false
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/openchamber:buildcache-amd64
