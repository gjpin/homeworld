name: Coder workspace image

# Builds apps/coder/image and pushes ghcr.io/gjpin/homeworld/coder-workspace
# tagged <UTC build date>.<run number>. Renovate then bumps the tag in
# apps/coder/template/main.tf, and the template is pushed to Coder by hand
# (docs/coder.md). The weekly rebuild picks up Debian security updates.
# Pull requests build without pushing.
on:
  pull_request:
    paths:
      - "apps/coder/image/**"
      - ".github/workflows/coder-workspace-image.yaml"
  push:
    branches:
      - main
    paths:
      - "apps/coder/image/**"
      - ".github/workflows/coder-workspace-image.yaml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: coder-workspace-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE: ghcr.io/gjpin/homeworld/coder-workspace

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      # The image is several GB; the runner's preinstalled SDKs leave too
      # little disk for the build and its export.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute the tag
        id: tag
        run: echo "tag=$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}" >>"$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: apps/coder/image
          platforms: linux/amd64
          pull: true
          no-cache: ${{ github.event_name == 'schedule' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Coder workspace image for the homeworld cluster
          cache-from: type=gha
          cache-to: type=gha,mode=min
